    "content": "## Overview\n\nThese notes describe the architecture and practical value of an AI-native wiki: a knowledge system where documents are ingested, chunked, embedded, indexed, and then explored through natural-language queries instead of manual navigation or keyword search. The core pattern is retrieval-augmented generation (RAG), where semantic search finds relevant source passages and an LLM uses them to generate grounded answers.\n\nThis matters for anyone building internal knowledge tools, support assistants, documentation copilots, or research workflows. The main takeaway is that systems like Pinecone Assistant productize a common architecture—ingestion, semantic retrieval, and conversational answering—so teams can focus less on infrastructure plumbing and more on content quality, permissions, freshness, and user experience.\n\n## Key Concepts\n\n- **AI-native wiki**: A knowledge interface that prioritizes semantic exploration over page trees and exact-match search.\n- **Retrieval-augmented generation (RAG)**: Combines retrieval with generation so answers are grounded in retrieved source content.\n- **Vector embeddings**: Dense representations of text that make meaning-based similarity search possible.\n- **Chunking and indexing**: Splitting documents into retrievable units improves precision and controls what context reaches the model.\n- **Grounded conversational answering**: Lets users ask follow-ups while keeping answers tied to source documents.\n- **Managed knowledge assistants**: Platforms that package ingestion, indexing, retrieval, and orchestration into higher-level services.\n\n## How It Works\n\nThe notes outline a standard AI knowledge system pipeline that shows up across many modern products.\n\nFirst, source material is ingested from documents such as markdown files, PDFs, internal docs, help-center pages, tickets, or notes. That content is normalized into text and enriched with metadata like title, source, timestamps, authorship, or permissions. This metadata becomes important later for traceability, filtering, and access control.\n\nNext, documents are split into chunks. Chunking is a crucial design choice: if chunks are too large, retrieval gets noisy; if too small, context becomes fragmented. Each chunk is then embedded into a vector using an embedding model, and those vectors are stored in a vector database such as Pinecone.\n\nAt query time, the user's question is embedded and compared against the indexed vectors to retrieve semantically similar chunks. A reranker may optionally refine the results. The top chunks are then assembled into a prompt for an LLM, which generates a response using only the retrieved context. A good implementation includes citations, source links, and excerpts so the output is auditable.\n\nA concise representation of the flow is:\n\n```text\nDocuments -> parsing -> chunking -> embeddings -> vector index\nUser query -> query embedding -> similarity search -> context assembly -> LLM answer\n```\n\nThe major shift from a traditional wiki is that users no longer need to know exactly what to search for. They can ask vague, conceptual, or cross-document questions, and semantic retrieval bridges the gap between user intent and document wording.\n\nThe notes also highlight production concerns that are easy to underestimate:\n\n- **Freshness**: updated documents must be reindexed promptly.\n- **Permissions**: retrieval must respect document-level access control.\n- **Traceability**: answers should expose supporting passages.\n- **Hallucination control**: the system should admit when evidence is weak.\n- **Cost and latency**: chunk size, top-k retrieval, reranking, and prompt length all affect performance.\n\nA practical implementation usually includes connectors, parsers, a chunking strategy, an embedding service, a vector index, optional reranking, an LLM response layer, and a UI or API for chat and citations. Managed assistants reduce the amount of custom engineering required, but the underlying architecture remains the same.\n\nThe included exercise is useful because it turns the concept into a minimal prototype. Building a small assistant over local markdown files helps validate retrieval quality, chunking choices, and prompting constraints before investing in a larger production setup.\n\n## Personal Notes\n\nBuilding Agentic Knowledge Bases with Pinecone Assistant and Semantic Retrieval\n\n\n\nSource: https://youtu.be/0TPq43Wpbz0?si=YquWLq6yC54ltbZH\n\nNotion page: https://www.notion.so/Building-Agentic-Knowledge-Bases-with-Pinecone-Assistant-and-Semantic-Retrieval-35a01bb0839a81a4ac16fa3f879d1c0c\n\n\n\nTags: llm, rag, pinecone, vector-search, agents\n\n\n\nOverview\n\n\n\nThis lesson explains the core idea behind an AI-native wiki: a knowledge system where documents are ingested, indexed semantically, and explored through natural language rather than rigid page hierarchies or keyword search. The source references a video about Pinecone shipping a product aligned with Andrej Karpathy's \"wiki\" idea, which points to a broader architectural pattern combining vector retrieval, grounded generation, and conversational interfaces.\n\n\n\nThis matters to engineers building internal knowledge tools, support assistants, documentation copilots, or research workflows. Instead of treating a wiki as static pages, the system becomes an interactive retrieval layer over organizational knowledge, enabling users to ask questions, navigate concepts, and synthesize answers from source material with citations and context.\n\n\n\nKey Concepts\n\n\n\n  *   AI-native wiki: An AI-native wiki replaces manual navigation through linked pages with semantic exploration driven by language models and retrieval systems. Users can ask questions directly, and the system finds relevant passages across documents rather than depending on exact page names or keyword matches.\n\n  *   Retrieval-augmented generation: RAG combines search with text generation so the model answers using retrieved source material. This improves factual grounding and makes it possible to answer organization-specific questions that are not in the base model's training data.\n\n  *   Vector embeddings: Embeddings convert text into dense numerical vectors that capture semantic meaning. Similar ideas end up close together in vector space, enabling search by meaning instead of literal word overlap.\n\n  *   Chunking and indexing: Large documents are typically split into smaller chunks before indexing so retrieval can return precise passages instead of entire files. Good chunking strategy strongly affects answer quality because it controls the granularity of context sent to the model.\n\n  *   Grounded conversational answering: A conversational interface on top of retrieval lets users refine queries, ask follow-ups, and explore related concepts interactively. The important engineering detail is maintaining dialogue context while still re-grounding each answer in source documents.\n\n  *   Managed knowledge assistants: Platforms like Pinecone increasingly package ingestion, indexing, retrieval, and assistant orchestration into managed services. This reduces implementation burden compared with building a custom RAG stack from scratch, especially for teams that want production reliability quickly.\n\n\n\nHow It Works\n\n\n\nThe video title suggests a productization of a long-discussed idea: turning a wiki into an interface for machine-assisted knowledge retrieval. Even without transcript detail, the architecture behind such a system is fairly standard and worth understanding because it shows up across modern AI knowledge products.\n\n\n\nAt a high level, the system has four stages:\n\n\n\n1. **Ingest content** - Source documents may include markdown, PDFs, help-center pages, internal docs, tickets, or notes. - Each document is normalized into clean text plus metadata such as title, source URL, author, team, timestamps, or access controls.\n\n\n\n2. **Split and embed** - Documents are broken into chunks, often by paragraph, heading, or token count. - Each chunk is transformed into an embedding vector using an embedding model. - The vectors and metadata are stored in a vector database such as Pinecone.\n\n\n\n3. **Retrieve relevant context** - When a user asks a question, the query is embedded using the same or compatible model. - The system searches the vector index for semantically similar chunks. - Optional reranking can improve precision by reordering candidates based on the exact question.\n\n\n\n4. **Generate an answer** - The top retrieved chunks are assembled into a prompt. - An LLM produces a response grounded in those chunks. - A well-designed system returns citations, excerpts, and links back to original documents so the answer is auditable.\n\n\n\nIn a product like a managed assistant, these mechanics are often hidden behind higher-level APIs. Instead of writing your own ingestion jobs, schema management, retrieval chain, and prompt orchestration, you configure a knowledge source and call an assistant endpoint. Under the hood, the core data flow still looks like this:\n\n\n\n```text Documents -> parsing -> chunking -> embeddings -> vector index User query -> query embedding -> similarity search -> context assembly -> LLM answer ```\n\n\n\nThe key difference between a classic wiki and an AI-native wiki is the retrieval model. Traditional wikis assume the user knows what to search for and where information likely lives. AI-native systems let users start with incomplete mental models: vague questions, conceptual queries, or cross-document synthesis requests. That is why semantic search matters more than keyword matching.\n\n\n\nThere are also important production concerns:\n\n\n\n- **Freshness:** newly added or updated documents must be reindexed quickly. - **Permissions:** retrieval must honor document-level access control. - **Traceability:** answers should expose source passages. - **Hallucination control:** if retrieval is weak or confidence is low, the assistant should say so. - **Cost and latency:** chunk size, top-k retrieval, reranking, and prompt size all affect runtime cost.\n\n\n\nA practical implementation often includes these modules, whether self-built or managed:\n\n\n\n- **Connectors** for pulling data from docs, websites, ticketing systems, or storage buckets - **Parsing pipeline** to clean and structure text - **Chunking strategy** tuned for the document type - **Embedding service** for vector generation - **Vector index** for nearest-neighbor retrieval - **Reranker** for higher-precision relevance scoring - **LLM response layer** for answer generation and summarization - **UI/API layer** for chat,"

    "content": "## Overview\n\nThese notes describe the **LLM Wiki** pattern popularized by Andrej Karpathy: a file-based, LLM-maintained knowledge base that sits between raw source material and future questions. Instead of relying on standard RAG to retrieve raw chunks at query time, the system continuously compiles source material into linked markdown pages, updates concepts and entities over time, tracks contradictions, and saves valuable answers back into the wiki.\n\nThis matters because it shifts knowledge work from one-off retrieval to **compounding synthesis**. For engineers, researchers, and technical teams working over long time horizons, the pattern offers a practical architecture built around immutable sources, a generated wiki, and a schema file that makes maintenance behavior consistent and repeatable.\n\n## Key Concepts\n\n- **Compiled knowledge vs retrieval**: Traditional RAG retrieves raw source fragments at query time and synthesizes answers on demand. The LLM Wiki compiles knowledge ahead of time into structured pages, so later queries operate on curated, cross-referenced summaries rather than rediscovering facts from scratch.\n- **Three-layer architecture**: The system is split into immutable raw sources, an LLM-written wiki, and a schema file that defines maintenance behavior. This preserves source fidelity, gives the LLM a persistent artifact to improve, and makes workflows more repeatable.\n- **Schema-driven maintenance**: A schema file such as `CLAUDE.md` or `AGENTS.md` tells the LLM how to name files, structure frontmatter, update indexes, handle contradictions, and follow ingest/query/lint workflows. Without this, the wiki tends to drift across sessions.\n- **Ingest, query, lint**: The core operating loop consists of ingesting new sources, answering questions from the compiled wiki, and linting the wiki for consistency issues such as stale claims, orphan pages, and missing links.\n- **Index-first navigation**: Queries typically begin with `wiki/index.md`, which acts as an explicit navigation layer. This keeps the system understandable and often avoids the need for full-text or vector search at moderate scales.\n- **Compounding artifact**: Each newly ingested source and each saved answer improves the wiki for future work. Over time, concept pages deepen, recurring questions become durable assets, and contradictions become visible instead of staying hidden in chat history.\n\n## How It Works\n\nAt a high level, the LLM Wiki replaces a **search-centric** workflow with a **maintenance-centric** one. In standard RAG, documents are chunked, embedded, and searched when a user asks a question. In this pattern, the LLM processes sources earlier and writes persistent syntheses into markdown files on disk. The result is a knowledge base that can evolve incrementally rather than rebuilding context from scratch every time.\n\nThe notes describe a **three-layer design**:\n\n1. **`raw/`**: immutable source documents such as articles, papers, transcripts, or images  \n2. **`wiki/`**: markdown pages generated and maintained by the LLM  \n3. **Schema file**: a control document like `CLAUDE.md` that defines conventions and workflows  \n\nA minimal layout looks like this:\n\n```text\nyour-wiki/\n├── CLAUDE.md\n├── raw/\n│   ├── articles/\n│   ├── papers/\n│   └── assets/\n└── wiki/\n    ├── index.md\n    ├── log.md\n    ├── overview/\n    ├── entities/\n    ├── concepts/\n    ├── sources/\n    └── queries/\n```\n\nThe **raw layer** should be treated as write-protected from the LLM’s perspective. That separation preserves source integrity and makes it easy to verify whether the wiki faithfully represents a claim. The **wiki layer** then becomes the working knowledge graph, containing source summaries, entity pages, concept pages, overviews, saved query answers, an index, and an append-only log.\n\nThe **schema file** is what makes the pattern operational rather than ad hoc. It usually defines:\n\n- directory semantics\n- YAML frontmatter requirements\n- file naming conventions\n- internal link syntax such as `[[page-name]]`\n- contradiction handling rules\n- criteria for when to create a new page\n- exact ingest, query, and lint workflows\n\nA representative ingest workflow is:\n\n1. Read the raw source file  \n2. Ask for emphasis or framing notes  \n3. Create a source summary page  \n4. Update relevant entity and concept pages  \n5. Update overview synthesis if needed  \n6. Update `wiki/index.md`  \n7. Append to `wiki/log.md`  \n\n### Ingest flow\n\nIngest is the main entry point for new knowledge. A source is read, summarized, and integrated into multiple existing pages. This is a key difference from RAG: the source becomes not just retrievable, but **structurally incorporated** into a growing graph of knowledge.\n\nA single paper or article may update several files at once, for example:\n\n- `wiki/sources/<paper>-summary.md`\n- `wiki/concepts/speculative-decoding.md`\n- `wiki/concepts/inference-optimization.md`\n- `wiki/entities/<author>.md`\n- `wiki/overview/synthesis.md`\n- `wiki/index.md`\n- `wiki/log.md`\n\n### Query flow\n\nQueries run against the compiled wiki, not directly against the raw corpus. The agent usually reads `wiki/index.md`, selects relevant pages, opens a small subset, and synthesizes an answer with references to internal wiki pages. If the answer is worth keeping, it is saved under `wiki/queries/`.\n\nThis makes answers reusable. A question like “When should I use RAG vs an LLM Wiki?” can become a permanent page that other concept pages link to later.\n\n### Lint flow\n\nLint is the maintenance pass that improves consistency and integrity. Instead of adding new knowledge, it checks the wiki for structural and semantic issues such as:\n\n- orphan pages with no inbound links\n- contradictions between pages or with newer source summaries\n- stale or superseded claims\n- heavily referenced topics missing dedicated pages\n- under-sourced areas needing more evidence\n\nThis makes the wiki behave more like a codebase: regular refactoring improves quality over time.\n\n### Why the pattern works\n\nThe central idea is that the LLM should act less like a search engine and more like a maintainer of a persistent artifact. Obsidian serves as the reader or IDE, the LLM behaves like the programmer, and the wiki becomes the codebase. The value comes from stable files, repeatable conventions, explicit links, version history, and incremental improvement.\n\nThe pattern works especially well when:\n\n- the domain matters over time\n- the corpus is limited enough to curate\n- cross-source synthesis matters\n- contradictions need to be tracked\n- improving future answers is more important than one-time retrieval\n\nIt is weaker when:\n\n- the corpus is extremely large and mainly lookup-oriented\n- low-latency search across thousands of documents is the priority\n- hallucination risk requires heavy review\n- the team will not maintain ingest discipline\n\nThe notes also include a practical exercise: build a small wiki on a known technical topic using three source documents, one schema file, one query, and one lint pass. This makes the “wiki as codebase” analogy concrete, especially when paired with Git commits after each ingest.\n\n## Personal Notes\n\nBuilding an LLM-Maintained Wiki for Compounding Knowledge\n\n\n\nSource: https://open.substack.com/pub/nandigamharikrishna/p/andrej-karpathys-llm-wiki-full-breakdown?r=7692ad&utm_medium=ios\n\nNotion page: https://www.notion.so/Building-an-LLM-Maintained-Wiki-for-Compounding-Knowledge-35a01bb0839a81debcaff967d9d4d2c1\n\n\n\nTags: llm, knowledge-management, rag, obsidian, markdown\n\n\n\nOverview\n\n\n\nThis lesson explains the LLM Wiki pattern popularized by Andrej Karpathy: a file-based, LLM-maintained knowledge base that sits between your raw sources and your future questions. Instead of retrieving raw chunks at query time like standard RAG systems, the LLM continuously compiles sources into linked markdown pages, updates concepts and entities over time, flags contradictions, and files useful answers back into the wiki.\n\n\n\nThe pattern matters for engineers, researchers, and technical teams who care about long-horizon learning rather than one-off document lookup. If you routinely read papers, design docs, transcripts, or internal notes and need synthesis that compounds over weeks or months, this approach gives you a practical architecture: immutable raw sources, a generated wiki, and a schema file that enforces consistent behavior across sessions.\n\n\n\nKey Concepts\n\n\n\n  *   Compiled knowledge vs retrieval: Traditional RAG retrieves raw source fragments at query time and synthesizes answers on demand. The LLM Wiki instead compiles knowledge ahead of time into structured pages, so later queries operate on curated, cross-referenced summaries rather than rediscovering facts from scratch.\n\n  *   Three-layer architecture: The system is organized into immutable raw sources, an LLM-written wiki, and a schema file that defines maintenance behavior. This separation preserves source fidelity, gives the LLM a persistent artifact to improve, and makes behavior repeatable across sessions.\n\n  *   Schema-driven maintenance: A schema file such as `CLAUDE.md` or `AGENTS.md` tells the LLM how to name files, structure frontmatter, update indexes, handle contradictions, and perform workflows. Without this, the wiki drifts and each session behaves like a fresh chat instead of a disciplined maintenance pass.\n\n  *   Ingest, query, lint: The pattern revolves around three core operations"

    "content": "## Overview\n\nThese notes cover GitHub Copilot CLI plugins and a newly announced enterprise-managed distribution model. The main idea is that organizations can define plugin configuration in a special `.github-private` location so approved plugins are automatically installed for users across the enterprise, rather than relying on each developer to install them manually.\n\nThis matters because it turns Copilot CLI from an individual productivity tool into something platform teams can manage at scale. For developer experience, platform engineering, and security teams, this enables more consistent environments, easier onboarding, tighter governance, and better control over which internal or approved extensions are available by default.\n\n## Key Concepts\n\n- **Copilot CLI plugins**: Plugins extend GitHub Copilot CLI with extra commands, workflows, or integrations. They can wrap internal tools, connect to enterprise systems, or standardize common engineering tasks in the CLI.\n- **Enterprise-managed distribution**: Instead of per-user installation, plugin distribution is controlled centrally by the organization. This improves consistency and reduces the risk of tooling drift between developer environments.\n- **`.github-private` configuration**: The announcement points to `.github-private` as the control point for enterprise-level plugin settings. Administrators can define plugin configuration there and use it as the authoritative source for rollout.\n- **Auto-installation and standardization**: Automatic installation lowers onboarding friction and makes documentation, support, and internal workflows more reliable because teams can assume a common plugin baseline.\n- **Access and governance boundaries**: Managed distribution likely depends on enterprise access to the backing repository or configuration source. That introduces governance, permission, and licensing considerations that should be understood before rollout.\n- **Developer experience at scale**: Manual setup can work for small teams, but enterprise scale benefits from policy-based distribution. Managed plugins support standardization, discoverability, and compliance across large engineering organizations.\n\n## How It Works\n\nThe operating model shifts from a manual, pull-based workflow to a centrally managed, policy-based one. Instead of asking every developer to find and install plugins on their own, the enterprise defines the approved plugin set in `.github-private`, and Copilot CLI uses that configuration to install or activate plugins automatically.\n\nThere are three main actors in this model:\n\n1. **Enterprise administrators or platform engineers** who define the approved plugin set.\n2. **A private enterprise-controlled configuration location** (`.github-private`) that stores plugin definitions.\n3. **End-user Copilot CLI clients** that authenticate in the enterprise context and apply the configured plugins.\n\nA likely flow looks like this:\n\n- An administrator publishes or updates plugin configuration in `.github-private`.\n- A user authenticates with Copilot CLI in the enterprise context.\n- The CLI detects that managed plugins are configured for the organization.\n- The CLI installs or enables those plugins automatically.\n- The user then has the enterprise-approved plugin set available locally.\n\nThis model supports several practical goals:\n\n- Consistent developer environments across teams\n- Faster onboarding for new hires and contractors\n- Safer distribution of approved internal tooling\n- Lower support burden because plugin availability can be assumed\n\nThere are also operational considerations worth tracking even though the original source is an announcement rather than full documentation:\n\n- **Permission model**: Access to `.github-private` is likely restricted and tied to enterprise administration.\n- **Change management**: Plugin additions and updates should be treated like platform changes, with review, ownership, and rollback planning.\n- **Failure handling**: Teams should define what happens if plugin installation fails or a user lacks required entitlements.\n- **Trust and provenance**: Since plugins affect developer workflows, organizations should verify ownership, maintenance, and security posture before enabling them broadly.\n\nA useful implementation pattern is to treat managed Copilot CLI plugins as part of the internal developer platform. That means defining governance, documenting lifecycle events, validating onboarding impact, and creating a rollout checklist before enabling the feature broadly.\n\n## Personal Notes\n\nEnterprise-Managed Plugins for GitHub Copilot CLI\n\n\n\nSource: https://www.linkedin.com/posts/evan-boyle-107a1445_copilot-cli-now-supports-enterprise-managed-activity-7458553867669016576-jneI?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Enterprise-Managed-Plugins-for-GitHub-Copilot-CLI-35a01bb0839a81d9be14c9fa8f7a8938\n\n\n\nTags: github, copilot, cli, enterprise, plugins\n\n\n\nOverview\n\n\n\nGitHub Copilot CLI plugins extend the CLI with organization-specific capabilities, such as internal tooling wrappers, custom commands, or integrations with enterprise systems. The source announcement highlights a new enterprise management feature: plugin configuration can be defined in a special `.github-private` location so plugins are automatically installed for users across an organization.\n\n\n\nThis matters to platform engineers, developer experience teams, and security-conscious enterprises that want a consistent Copilot CLI environment without requiring each developer to manually discover and install approved plugins. It shifts plugin distribution from an ad hoc, per-user workflow to a centrally managed model with better standardization and governance.\n\n\n\nKey Concepts\n\n\n\n  *   Copilot CLI plugins: Plugins are extension points for GitHub Copilot CLI that add commands, workflows, or integrations beyond the base product. In practice, they let teams embed organization-specific automation directly into the developer command-line experience.\n\n  *   Enterprise-managed distribution: Enterprise-managed plugins are installed automatically for users in an organization instead of being manually set up on each machine. This centralizes control and helps ensure that all engineers get the same approved tooling by default.\n\n  *   .github-private configuration: The announcement indicates that plugin configuration is defined in `.github-private`, which acts as a centralized place for enterprise-level Copilot CLI plugin settings. By storing plugin definitions there, administrators can drive automatic installation behavior for organization members.\n\n  *   Auto-installation and standardization: Auto-installation reduces onboarding friction and avoids drift between developer environments. It also creates a reliable baseline for support, documentation, and internal automation because every user starts from the same plugin set.\n\n  *   Access and governance boundaries: A comment in the source notes that this model may require enterprise access to the backing repository or configuration location. That implies governance and licensing constraints: centralized management is powerful, but only available when the enterprise controls the relevant GitHub resources.\n\n  *   Developer experience at scale: At small scale, manual plugin installation is acceptable; at enterprise scale, it becomes error-prone and expensive. Managed plugins are a developer platform feature that improves consistency, discoverability, and compliance across large engineering organizations.\n\n\n\nHow It Works\n\n\n\nThe central idea is straightforward: instead of asking each developer to install Copilot CLI plugins manually, the enterprise defines the desired plugin set in `.github-private`. GitHub Copilot CLI then uses that centrally managed configuration to determine what should be installed for users in the organization.\n\n\n\nFrom an architecture perspective, there are three actors involved:\n\n\n\n1. **Enterprise administrators or platform engineers** who define the approved plugin configuration. 2. **A private enterprise-controlled configuration location** (`.github-private`) that stores the plugin definitions. 3. **End-user Copilot CLI clients** that read organization policy and auto-install the configured plugins.\n\n\n\nThe data flow looks like this:\n\n\n\n- An administrator publishes or updates plugin configuration in `.github-private`. - A user's Copilot CLI authenticates in an enterprise context. - The CLI discovers that managed plugins are configured for the organization. - The CLI installs or activates those plugins automatically for the user. - From that point on, the user's local CLI environment includes the enterprise-approved extensions.\n\n\n\nThis changes the operational model from **pull-based** to **policy-based**:\n\n\n\n- **Before:** a developer had to know a plugin existed, find installation instructions, and install it locally. - **After:** the enterprise publishes the plugin once, and the organization receives it automatically.\n\n\n\nIn practical terms, this supports several common platform-engineering goals:\n\n\n\n- **Consistent developer environments** across teams and geographies - **Faster onboarding** for new hires and contractors - **Safer rollout of internal tooling** because only approved plugins are distributed - **Lower support burden** since docs can assume plugin availability\n\n\n\nThere are also some likely operational considerations implied by the announcement:\n\n\n\n- **Repository and permission model:** if `.github-private` is the control plane, access to it is probably restricted and tied to enterprise-level GitHub administration. - **Versioning and change management:** plugin additions or updates should be treated like platform changes, with review and staged rollout where possible. - **Fallback behavior:** organizations should define what happens when a plugin cannot be fetched or a user lacks the required entitlement. - **Trust model:** because plugins execute within a developer workflow, enterprises should validate ownership, provenance, and maintenance expectations before enabling them globally.\n\n\n\nAlthough the source is a short announcement rather than full technical documentation, the implementation pattern is clear: GitHub is introducing an enterprise-managed plugin distribution mechanism for Copilot CLI, using `.github-private` as the authoritative configuration source. For a working engineer, the takeaway is that Copilot CLI is becoming a manageable fleet tool rather than just a personal productivity utility.\n\n\n\nTraining Exercise\n\n\n\nCreate a rollout plan for enterprise-managed Copilot CLI plugins in your organization.\n\n\n\n### Goal Design a practical implementation for centrally managed Copilot CLI plugins, including governance, onboarding impact, and validation steps.\n\n\n\n### Steps 1. **Inventory candidate plugins** - Make a list of 3-5 plugins your organization would want every engineer to have. - For each plugin, record: - purpose - owner/team - source repository - required permissions - security review status\n\n\n\n2. **Draft a managed plugin policy** - Write a short policy covering: - who can add or remove"

    "content": "## Overview\n\nThese notes describe the idea of an “LLM wiki”: a persistent, curated set of text or markdown files that acts as an external memory system for an LLM or agent. Instead of relying only on vector search over raw document chunks, the system maintains readable knowledge files such as topic summaries, decision logs, indexes, and periodic updates. This makes the model’s working knowledge more explicit, inspectable, and stable over time.\n\nThe main value of this approach is better context management. Many LLM systems underperform not because the model is weak, but because the right information is not presented clearly at the right time. An LLM wiki shifts the design toward human-auditable context engineering, durable memory, and compact summaries. It is especially useful for coding agents, research assistants, and internal tools that need continuity, transparency, and controllable write-back memory.\n\n## Key Concepts\n\n- **LLM wiki**: A collection of structured text documents used as external memory for a model or agent.\n- **RAG versus explicit context files**: Traditional RAG relies on similarity-based retrieval from chunked documents, while a wiki emphasizes curated, organized, human-readable files.\n- **Persistent memory**: Useful facts, decisions, and summaries are preserved across sessions instead of being lost after a single prompt.\n- **Context engineering**: The practice of choosing what information the model sees, in what format, and in what sequence.\n- **Human-auditable knowledge**: Because the memory is stored in normal files, engineers can inspect, edit, review, and version it directly.\n- **Knowledge compression**: A wiki works best when it distills noisy source material into concise summaries, indexes, and canonical pages.\n\n## How It Works\n\nThe core idea is to treat LLM memory like a maintained documentation set rather than a passive retrieval layer. Source material such as notes, transcripts, code docs, and chat logs is ingested and then distilled into durable files. These files can include project summaries, concept pages, decision records, people or entity profiles, and periodic log summaries. When the model performs a task, the system loads a selected subset of these files into context instead of depending only on nearest-neighbor retrieval over raw chunks.\n\nA common workflow is:\n\n1. Ingest source material.\n2. Distill it into stable pages.\n3. Load the relevant subset for a task.\n4. Optionally write back new facts, summaries, or decisions after the task completes.\n\nThis differs from naive RAG in several important ways. First, the structure is explicit: a file path can carry meaning, such as a project page versus a decision log. Second, important information is curated into high-signal summaries rather than retrieved as isolated fragments. Third, memory becomes more stable because canonical pages reduce duplication and drift.\n\nA typical layout might look like this:\n\n```text\nwiki/\n  index.md\n  projects/\n    payments-service.md\n    search-migration.md\n  concepts/\n    vector-search.md\n    prompt-caching.md\n  people/\n    team-roles.md\n  decisions/\n    2026-03-auth-refactor.md\n  logs/\n    weekly-summary-2026-05-01.md\n```\n\nEach file has a different job. `index.md` provides a map of the knowledge base. Topic pages summarize systems, constraints, and risks. Decision logs preserve rationale. Periodic summaries compress long-running activity into reusable memory. This improves context quality because the model is given synthesized, structured explanations instead of arbitrary retrieved chunks.\n\nA major advantage is write-back memory. After completing a task, the model can propose updates such as:\n\n- appending a new decision record\n- refreshing a project summary\n- extracting unresolved questions\n- updating an entity page with confirmed facts\n\nBecause the memory lives in text files, this write-back loop is simple to inspect and review. Human oversight is still important, especially because summarization can be lossy or wrong.\n\nThere are trade-offs. A wiki requires maintenance and can become stale if not curated. It may not replace RAG for very large or rapidly changing corpora where broad recall is important. In practice, the strongest setup is often hybrid:\n\n- wiki for durable, high-signal memory\n- RAG for long-tail lookup into raw documents\n\nThat combination gives the model a reliable mental map while still allowing deep retrieval when needed.\n\n## Personal Notes\n\nKarpathy’s LLM Wiki: Persistent Knowledge Files as an Alternative to Basic RAG\n\n\n\nSource: https://youtu.be/aGXTV5MTqDY?si=pCQXA41R0Cpwxuh3\n\nNotion page: https://www.notion.so/Karpathy-s-LLM-Wiki-Persistent-Knowledge-Files-as-an-Alternative-to-Basic-RAG-35a01bb0839a8183a72ee8807d2191ab\n\n\n\nTags: llm, rag, context-engineering, knowledge-management, agents\n\n\n\nOverview\n\n\n\nThis lesson explains the idea behind an \"LLM wiki\": a curated, persistent set of text files that an AI system can read, update, and use as its working knowledge base. The concept is often framed as a simpler and more controllable alternative to naive retrieval-augmented generation (RAG), especially for personal knowledge, project memory, and agent workflows where the structure of information matters as much as retrieval quality.\n\n\n\nEngineers should care because many production LLM systems fail not from model weakness, but from poor context management. An LLM wiki shifts the design focus from embedding-heavy retrieval pipelines toward explicit, human-readable knowledge artifacts: markdown files, indexes, summaries, and update flows. This can improve transparency, debuggability, and long-term memory for coding agents, research assistants, and internal tools.\n\n\n\nKey Concepts\n\n\n\n  *   LLM wiki: An LLM wiki is a collection of structured text documents that acts as external memory for a model or agent. Instead of treating knowledge as opaque vectors alone, the system keeps readable files that can be searched, summarized, edited, and versioned like normal documentation.\n\n  *   RAG versus explicit context files: Traditional RAG stores chunks in a vector database and retrieves them by similarity at query time. An LLM wiki emphasizes explicit organization, curated summaries, and stable documents, which can make the model’s inputs easier to inspect and less dependent on embedding quality.\n\n  *   Persistent memory: Persistent memory means the system can retain useful information across sessions rather than relying only on the current prompt window. In practice, this is implemented as files that are updated over time with facts, decisions, summaries, and links to source material.\n\n  *   Context engineering: Context engineering is the discipline of deciding what information the model sees, in what format, and at what time. The wiki approach is a form of context engineering that prioritizes compact summaries, canonical references, and predictable document layouts.\n\n  *   Human-auditable knowledge: Because the memory lives in normal text files, engineers can inspect and correct what the model knows. This improves trust and debugging compared with systems where knowledge is buried inside retrieval pipelines, embeddings, or undocumented prompt logic.\n\n  *   Knowledge compression: A useful wiki is not just a dump of raw documents; it compresses information into summaries, indexes, and topic pages. This compression reduces token usage while preserving the most relevant facts and relationships for downstream tasks.\n\n\n\nHow It Works\n\n\n\nThe central idea is to treat knowledge for an LLM more like a maintained documentation set than like a passive search index. Instead of chunking every source document into embeddings and hoping similarity search returns the right passages, you build a small file hierarchy of markdown or text pages that summarize key topics, decisions, entities, and references. The LLM then reads from this wiki as part of its prompt context, and in some setups it can also propose updates back into the wiki.\n\n\n\nAt a high level, the workflow looks like this:\n\n\n\n1. **Ingest source material** such as notes, code docs, meeting transcripts, research papers, or chat history. 2. **Distill the material** into durable pages: - topic summaries - entity pages - timeline or decision logs - indexes that point to deeper files 3. **Load the right subset** of those pages into the model depending on the task. 4. **Optionally update the wiki** after a task completes, preserving new findings or decisions.\n\n\n\nThis differs from basic RAG in a few important ways.\n\n\n\n- **Structure is explicit.** The system knows that `projects/foo/decisions.md` contains architectural decisions, while `people/alice.md` contains background on a collaborator. - **Important information is curated.** The context is not merely nearest-neighbor retrieval over raw chunks; it is often a cleaned-up synthesis. - **The memory is stable over time.** A page can become the canonical place for a concept, reducing duplication and drift.\n\n\n\nA practical LLM wiki often has a layout like:\n\n\n\n```text wiki/ index.md projects/ payments-service.md search-migration.md concepts/ vector-search.md prompt-caching.md people/ team-roles.md decisions/ 2026-03-auth-refactor.md logs/ weekly-summary-2026-05-01.md ```\n\n\n\nEach file serves a different context purpose:\n\n\n\n- `index.md` gives the model a map of the knowledge base. - Topic pages provide concise summaries and key facts. - Decision logs preserve why something was done. - Periodic summaries compress long event streams into short, reusable memory.\n\n\n\nThe reason this can outperform naive RAG for many workflows is that retrieval quality alone does not solve context quality. If your source corpus is noisy, redundant, or overly granular, nearest-neighbor search may surface fragments without the surrounding reasoning. A wiki page can instead present the model with a synthesized explanation: what the system is, what changed"

    "content": "## Overview\n\nThese notes explain how GitHub Copilot hooks can be used as a control layer around AI-assisted development, especially to enforce quality and safety before tools are allowed to run. The main emphasis is on `PreToolUse`, a hook that can inspect intended actions and deny them when they violate policy, such as failing lint checks, touching protected files, or attempting unsafe commands.\n\nThis matters because AI coding tools increasingly do more than suggest text: they edit files, run commands, and coordinate workflow steps. Hooks make that behavior governable. Instead of relying on the model to follow team conventions voluntarily, engineers can encode rules directly into the execution path and provide feedback that pushes the assistant toward compliant behavior.\n\n## Key Concepts\n\n- **Hooks**: Programmable interception points in an AI-assisted workflow. They let you inspect, allow, modify, or deny actions before or after the assistant performs a tool call or related operation.\n- **PreToolUse**: A hook that runs before Copilot invokes a tool. Its practical value is policy enforcement: if a planned action violates constraints such as lint cleanliness, file safety, or repository rules, the hook can block the action.\n- **Tool call denial**: Denying a tool call means the assistant is not allowed to perform the requested operation. This moves quality control from post-generation cleanup to pre-execution enforcement, which is safer and usually cheaper.\n- **Quality gates for AI**: Automated rules that code or actions must satisfy before proceeding. In this context, examples include requiring a successful linter run, passing tests, or preventing writes to protected files.\n- **Feedback loop design**: When a hook blocks an action, it should return a clear reason so the AI can try again with a better approach. Effective hooks do not just reject work; they guide remediation.\n- **Workflow integration**: Hooks are most useful when integrated into tools engineers already use, such as the Copilot CLI or VS Code, so enforcement happens at the exact point where AI suggests, edits, or executes work.\n\n## How It Works\n\nThe core idea is to treat hooks like middleware around AI actions. Copilot plans an operation, a hook runs at a defined lifecycle point, the hook evaluates policy or repository state, and then returns a decision such as allow or deny. If denied, Copilot must revise its plan.\n\n`PreToolUse` is especially useful because it intercepts actions before code is written or commands are executed. That helps address a common failure mode in AI-assisted development: the model produces code that violates lint, formatting, or repository conventions, then keeps going as though nothing is wrong. By moving checks into the pre-execution path, those rules become hard constraints rather than suggestions.\n\nA practical quality-control flow might be:\n\n- Copilot proposes editing a file.\n- A `PreToolUse` hook inspects the proposed action or current repository state.\n- The hook runs a fast validation command such as `eslint`, `ruff`, `biome`, or `prettier --check`.\n- If violations exist, the hook denies the action and returns a remediation message.\n- Copilot must fix the issue before proceeding.\n\nThis approach is useful for more than linting. Teams can encode policy such as:\n\n- blocking edits to protected files\n- preventing dangerous shell commands\n- requiring tests for changes in specific directories\n- restricting modifications to the current project root\n- enforcing consistency rules like only changing `package-lock.json` alongside `package.json`\n\nThe implementation tradeoff is strictness versus usability. If hooks are too strict, the AI may get stuck in repeated denial loops. If they are too loose, they add little value. Good hooks are:\n\n- **Fast**: they keep the workflow interactive.\n- **Deterministic**: the same input should produce the same result.\n- **Actionable**: denial messages should     "content": "## Overview\n\nThese notes capture a practical architecture decision in Power Apps: whether to handle files inline as Base64 payloads or store them externally in Azure Blob Storage. The core takeaway is that Base64 can work well for small, simple, transient file transfers, while Blob Storage is usually the better fit for persistent, scalable, and secure file handling.\n\nThis matters because file strategy affects app performance, payload size, security, maintainability, and downstream integrations. A strong enterprise pattern is to store binary content in Blob Storage, keep only metadata and references in Dataverse, and use Power Apps plus Power Automate or a custom backend to orchestrate uploads and downloads.\n\n## Key Concepts\n\n- **Base64 file transport**: Base64 encodes binary files as text so they can be embedded directly in requests, variables, or records. This is convenient for lightweight workflows, but it increases payload size and becomes inefficient for larger files or frequent uploads.\n- **Azure Blob Storage**: Blob Storage is Azure’s object store for unstructured data such as documents, images, and media. It is better suited to durable, scalable file storage than embedding file content inside app data.\n- **Metadata vs binary separation**: A common pattern is to store the file itself in Blob Storage while keeping metadata like filename, content type, owner, and blob URL in Dataverse or another transactional store.\n- **Secure access patterns**: Blob access should usually be controlled through Azure AD, RBAC, managed identities, or short-lived SAS tokens rather than public URLs.\n- **Scalability tradeoffs**: Base64 is acceptable for small files and simple cases, but scales poorly due to payload inflation and memory overhead. Blob-backed designs handle larger files and higher volumes more effectively.\n- **Power Apps integration flow**: A typical implementation uses Power Apps for file selection, Power Automate or a backend API for upload, Blob Storage for persistence, and Dataverse for metadata and business records.\n\n## How It Works\n\nThe main idea is to avoid treating file content as ordinary application data when the file is large, long-lived, or shared across systems. Instead of moving binary content around as Base64 inside Power Apps and Dataverse, the app sends the file to a backend process that uploads it to Azure Blob Storage. The app then stores only the resulting path, URL, or identifier along with useful metadata.\n\nA typical flow looks like this:\n\n1. A user selects a file in Power Apps.\n2. The app sends the file to Power Automate, an Azure Function, or a custom API.\n3. That backend authenticates to Azure Blob Storage and uploads the file.\n4. The backend returns a blob path, URL, or ID.\n5. Power Apps stores metadata in Dataverse or another data store.\n6. Later access is handled through secure rules such as SAS tokens or service-mediated download.\n\nThis pattern improves performance because Base64 expands file size and makes requests heavier. It improves maintainability because business records stay focused on metadata instead of carrying large payloads. It also improves scalability because Blob Storage is built for high-volume object storage and integrates naturally with cloud workflows, processing pipelines, and APIs.\n\nThe tradeoff is that Blob Storage introduces more design decisions around security and lifecycle. A good implementation should define who can upload, who can read, whether links expire, how metadata stays in sync with blobs, and what happens when files are updated or deleted. Blob Storage is not automatically the right answer unless these operational concerns are handled well.\n\nAs a rule of thumb:\n\n- Use **Base64** when the file is small, temporary, and mainly being passed through a workflow.\n- Use **Blob Storage** when the file has a lifecycle, needs controlled access, may be downloaded later, or must integrate with other systems.\n\nA solid enterprise pattern is:\n\n- Store file binary in **Azure Blob Storage**\n- Store metadata in **Dataverse**\n- Use **Power Apps** as the upload/download interface\n- Use **Power Automate** or a backend API for orchestration\n- Use **SAS tokens or Azure AD/RBAC** for secure retrieval\n\nExample metadata fields to store separately:\n\n```text\nDocumentId\nBusinessRecordId\nOriginalFileName\nContentType\nBlobContainer\nBlobName\nBlobUrl\nUploadedBy\nUploadedAt\nRetentionCategory\n```\n\n## Personal Notes\n\nChoosing Blob Storage vs Base64 for File Handling in Power Apps\n\n\n\nSource: https://www.linkedin.com/posts/radovan-santa-7aa737134_upload-files-without-limits-using-blob-ugcPost-7455155358647599104-Icog?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY\n\nNotion page: https://www.notion.so/Choosing-Blob-Storage-vs-Base64-for-File-Handling-in-Power-Apps-35701bb0839a81749a6ce12b71594932\n\n\n\nTags: powerapps, azure, blob-storage, base64, dataverse, file-uploads\n\n\n\nOverview\n\n\n\nThis lesson explains a practical architectural choice in Power Apps: whether to handle files inline as Base64 payloads or store them externally in Azure Blob Storage. The source post is brief, but it points to an important design pattern used in real enterprise apps: upload files from a Power Apps front end, persist the binary content in Blob Storage, and keep only references or metadata in the application data layer.\n\n\n\nThis matters because file handling choices directly affect scalability, performance, security, and integration options. Engineers, Power Platform makers, and solution architects will care most, especially when building apps that accept attachments, images, documents, or media and need to support larger files, controlled access, and downstream API workflows.\n\n\n\nKey Concepts\n\n\n\n  *   Base64 file transport: Base64 encodes binary files as text so they can be embedded directly in requests, variables, or records. This is convenient for simple processing flows, but it increases payload size and can become inefficient for larger files or frequent uploads.\n\n  *   Azure Blob Storage: Azure Blob Storage is object storage designed for unstructured data such as documents, images, and exports. It is a better fit than inline application storage when you need scalable, durable file storage with URL-based access and cloud-native integration.\n\n  *   Metadata vs binary separation: A common enterprise pattern is to store the actual file in Blob Storage while keeping metadata such as filename, content type, owner, or blob URL in Dataverse or another transactional store. This keeps business data lean while allowing flexible file lifecycle management.\n\n  *   Secure access patterns: Blob data should not simply be made public by default. Access is typically controlled with Azure AD identities, managed identities, role-based access control, or time-limited SAS tokens depending on whether users, apps, or external systems need access.\n\n  *   Scalability tradeoffs: Inline Base64 handling is often acceptable for small files and simple scenarios, but it scales poorly because of larger payloads, slower processing, and memory overhead. Blob-backed storage scales better for large files, high upload volume, and integration-heavy workloads.\n\n  *   Power Apps integration flow: In a typical implementation, the app captures a file, sends it through Power Automate or a custom API, and that service writes the file to Blob Storage. The app then stores or displays the resulting URL or metadata record for later use.\n\n\n\nHow It Works\n\n\n\nThe central idea is to avoid treating file content as ordinary app data when the file is large, long-lived, or needs to be shared across systems. Instead of pushing the binary around as Base64 inside Power Apps and Dataverse, you move the file into Azure Blob Storage and keep only a reference in your app.\n\n\n\nA practical flow looks like this:\n\n\n\n1. A user selects ransient input to"

    "content": "## Overview\nThese notes explain why AI agents that can read and write Markdown may still fail when operating inside Obsidian. Obsidian uses product-specific conventions such as wikilinks, YAML frontmatter, typed properties, JSON Canvas files, and vault-specific organizational patterns. If an agent treats the vault as generic text, it can create changes that look valid but quietly break links, metadata-driven workflows, or structured views.\n\nThe key lesson is broader than Obsidian itself: structured tools often need explicit agent-facing rules or “skills” so models can act safely and correctly. For anyone building internal copilots, automation, or agent workflows around knowledge systems, this is a reminder that practical correctness depends on preserving the tool’s semantics, not just producing plausible text.\n\n## Key Concepts\n- **Tool-specific invariants**: Many tools embed assumptions that are not obvious from file extensions alone. In Obsidian, links, metadata, and visual canvases carry semantic meaning that an agent must preserve. A skill spec makes those invariants explicit so the agent can act like a knowledgeable user instead of treating everything as generic text.\n- **Wikilinks and graph structure**: Obsidian commonly uses wikilinks like `[[Note Name]]` rather than standard Markdown links. These links are part of the vault’s navigational and graph structure, and incorrect formatting can break backlinking, note discovery, and relationship mapping. Agents need to generate and edit links using Obsidian conventions.\n- **Frontmatter and typed metadata**: YAML frontmatter and typed properties in notes are not just decorative metadata; they are often used for filtering, querying, automation, and organization. If an agent writes metadata as free-form prose or omits required fields, downstream views and workflows can fail. Structured tools require structured writes.\n- **Structured formats beyond Markdown**: Obsidian also supports formats such as JSON Canvas and Bases with typed properties and views. These formats have stricter schemas than plain note files, so an agent must understand how to create or modify them without corrupting their structure. This broadens the problem from text generation to schema-aware editing.\n- **Agent skills as product interfaces**: A skill file or behavior spec acts like an interface contract between the tool and the agent. It defines acceptable syntax, data shapes, editing rules, and operational boundaries. This is similar to having an API contract, but for natural-language-driven automation.\n- **Technically valid vs practically correct**: An agent can produce output that parses successfully yet is still wrong for the tool. For example, a note may remain readable Markdown while losing backlinks, required metadata, or queryable properties. Practical correctness means preserving the semantics the product depends on, not just file validity.\n\n## How It Works\nThe central idea is that Obsidian should not be modeled as a directory of interchangeable Markdown files. It is better understood as a knowledge system with multiple data representations: note content, link semantics, metadata, structured databases or views, and visual canvases. A generic agent that only knows Markdown can create notes that look reasonable but violate hidden assumptions of the vault.\n\nThe proposed fix is a product-authored set of skills that tells AI agents how to operate inside an Obsidian vault. Instead of improvising, the agent is given explicit rules for:\n\n- Obsidian Markdown syntax\n- wikilinks and two-way linking behavior\n- frontmatter and properties\n- Bases support with typed fields, filters, and views\n- JSON Canvas editing\n- CLI-based vault operations\n- web-to-Markdown cleanup via Defuddle\n\nThis shifts the workflow from “guess how the tool works” to “follow the official operating model.” That matters because many failures in document systems come from format drift: a model inserts a regular Markdown link where a wikilink is expected, flattens metadata into prose, or edits a JSON Canvas file without respecting schema constraints.\n\nA useful mental model is a layered interaction process:\n\n1. **Read using Obsidian semantics**\n   - Treat `[[Page]]` and `[[Page|Alias]]` as first-class links.\n   - Parse frontmatter as structured metadata, not plain text.\n   - Detect specialized files such as canvases and database-like structures.\n\n2. **Plan edits with schema awareness**\n   - Include expected metadata when creating notes.\n   - Use wikilinks consistently for internal references.\n   - Preserve typed fields and JSON structure when editing Bases or canvases.\n\n3. **Write conservatively**\n   - Avoid rewriting unrelated content.\n   - Preserve vault formatting conventions.\n   - Maintain stable identifiers, names, and references.\n\n4. **Prefer tool-native operations**\n   - Use explicit file operations and validated transforms where possible.\n   - Use cleanup and ingestion tools such as Defuddle for web content before inserting into the vault.\n\nThe broader architectural takeaway is that agent integration with structured systems should be treated as a contract-design problem. If the system has hidden semantics, the agent needs explicit behavioral guidance. Otherwise, the system may slowly degrade through “almost correct” edits that are hard to notice until links, views, queries, or automations stop working.\n\n## Personal Notes\nTeaching AI Agents to Use Obsidian Safely with Product-Specific Skills\n\n\n\nSource: https://www.linkedin.com/posts/stasbel_obsidian-ceo-personally-wrote-a-set-of-skills-activity-7457097428387905537-NRIq?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Teaching-AI-Agents-to-Use-Obsidian-Safely-with-Product-Specific-Skills-35701bb0839a81758393fe83e0f11260\n\n\n\nTags: obsidian, ai-agents, markdown, knowledge-manage dle\n\n\n\nThis changes the agent workflow from \"infer how this tool probably works\" to \"follow the official operating model of the tool.\" That is important because many agent failures in document systems come from format drift. A model may insert a regular Markdown link"

    "content": "## Overview\nThese notes cover a new Power Platform capability: Power Apps Code Apps can now invoke Power Automate flows directly, instead of relying on indirect patterns like HTTP-triggered flows, Dataverse event triggers, or custom proxy layers. This is a meaningful improvement for developers building more code-centric apps on the Microsoft Power Platform because it reduces architectural overhead and makes automation feel like a native part of app logic.\n\nThe main practical takeaways are that this integration depends on the correct prerequisites, requires updating the relevant npm package(s), and can fail unexpectedly if connection references are not configured correctly. For future projects, this is worth remembering as a cleaner, more maintainable pattern for app-to-automation orchestration.\n\n## Key Concepts\n- **Direct flow invocation**: Code Apps can call Power Automate flows directly from app code, removing the need for workaround trigger mechanisms.\n- **Code Apps model**: Power Apps Code Apps support a more traditional development workflow with packages, source control, and programmatic integration points.\n- **NPM package dependency**: The feature is surfaced through an SDK or client library update, so older package versions may hide or break the capability.\n- **Connection references**: Even if the app and flow are wired together, runtime failures can occur if connector bindings are unresolved in the environment.\n- **Replacing workaround architectures**: Older approaches like HTTP triggers or Dataverse-driven triggers worked, but added complexity, security exposure, and maintenance cost.\n- **App + automation separation**: A useful mental model is Code App = UI/business interaction, Flow = orchestration/side effects.\n\n## How It Works\nThe core change is in how a Code App starts automation. Previously, developers often had to treat a flow like an external service or create an intermediate trigger mechanism. Common patterns included calling an HTTP-triggered flow, writing to Dataverse so a flow could react, or bridging through a custom connector or API.\n\nWith this integration, the flow becomes a more direct part of the app’s execution path. That simplifies architecture and reduces the number of moving pieces involved in a user action.\n\nA practical setup sequence from these notes is:\n\n1. **Meet prerequisites**  \n   Make sure the environment supports both Code Apps and Power Automate integration, the necessary features are enabled, and the developer has permission to create flows and connections.\n\n2. **Update dependencies**  \n   Because the capability is delivered through an npm package update, the local Code App project must use a current SDK/client library version.\n\n   ```bash\n   npm install <updated-power-platform-package>@latest\n   npm update\n   ```\n\n3. **Bind the flow correctly**  \n   Add the flow integration using the supported tooling/configuration method for Code Apps.\n\n4. **Validate connection references**  \n   This is the most likely source of setup issues. A flow may exist and be callable in principle, but still fail if its connectors are not mapped to valid authenticated connections in the environment.\n\nA common failure pattern is:\n- the app code invokes the flow correctly\n- the flow exists and looks valid\n- one or more connector references inside the flow are unresolved\n- runtime execution fails with authorization or binding errors\n\nThe simplified runtime model is:\n\n- user performs an action in the Code App\n- app code invokes a Power Automate flow directly\n- the flow performs its automation steps using configured connectors\n- the app receives a result, or downstream systems reflect the side effects\n\nThis matters because it improves:\n- **Maintainability**: fewer workaround components\n- **Security**: less need for externally callable endpoints\n- **Developer experience**: clearer app logic\n- **Operational simplicity**: fewer things to troubleshoot\n\nA representative use case is an asset register app. The UI handles interaction and validation, while Power Automate handles approvals, notifications, syncing, or ticket/task creation. Direct invocation makes that boundary cleaner.\n\n## Personal Notes\nUsing Power Automate Directly from Power Apps Code Apps\n\n\n\nSource: https://www.linkedin.com/posts/charlie-sexton_the-long-awaited-power-automate-integration-activity-7457383644672831488-Xctm?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Using-Power-Automate-Directly-from-Power-Apps-Code-Apps-35701bb0839a81c2baa0f3e7df95fe57\n\n\n\nTags: powerapps, powerautomate, code-apps, microsoft-power-platform, integration\n\n\n\nOverview\n\n\n\nThis lesson explains the newly available integration that lets Power Apps Code Apps invoke Power Automate flows directly, without relying on older workarounds such as HTTP-triggered flows or Dataverse-based trigger patterns. For engineers building custom apps on the Microsoft Power Platform, this simplifies architecture, reduces glue code, and makes flow invocation feel like a native app capability.\n\n\n\nThe announcement is especially relevant to developers who are already using Code Apps and wanted a cleaner way to orchestrate backend automation from app code. The source highlights three practical concerns: prerequisites, an npm package update, and a connection-reference issue that can break the setup the first time if you are not expecting it.\n\n\n\nKey Concepts\n\n\n\n  *   Direct flow invocation: The main capability is the ability for a Code App to call a Power Automate flow directly. This removes the need to expose a custom HTTP endpoint or to create indirect triggers through Dataverse just to start automation from the app.\n\n  *   Code Apps in Power Apps: Code Apps are a more code-centric app model in the Power Apps ecosystem. Instead of relying only on low-code wiring, engineers can work with packages, source control, and programmatic integration points more familiar to traditional software development.\n\n  *   NPM package dependency: The integration requires updating an npm package, which implies that support is delivered through the app's development SDK or client library. If your local project uses an older package version, the new flow-calling capability may not appear or may fail at build/runtime.\n\n  *   Connection references: Power Platform uses connection references to map app and flow components to actual authenticated service connections in an environment. A common setup failure is having the flow wired correctly in development but not resolving the expected connection reference when deployed or first executed.\n\n  *   Replacing workaround architectures: Before this integration, teams often used HTTP triggers, custom APIs, or Dataverse actions/tables as intermediaries. These approaches worked but added complexity, security surface area, and operational overhead that direct integration now avoids.\n\n  *   AI-assisted app wiring: The source mentions using AI to wire the integration into a real app quickly. In practice, this means developers may be able to scaffold the invocation code and configuration faster, but they still need to understand the underlying environment setup and references to troubleshoot reliably.\n\n\n\nHow It Works\n\n\n\nAt a high level, the new capability changes the invocation path between a Power Apps Code App and a Power Automate flow. Previously, if a developer wanted app code to kick off automation, they usually had to create one of several indirect patterns:\n\n\n\n- An HTTP-triggered flow that the app called like an external web service - A Dataverse-driven pattern where the app created or updated a record and a flow reacted to that event - A custom connector or other proxy layer to bridge the app and flow\n\n\n\nThe announced integration removes that indirection. A Code App can now call a flow more directly through the supported app-development surface, making the flow part of the app's execution model rather than an external workaround.\n\n\n\nFrom the source, the setup appears to involve three important stages:\n\n\n\n1. **Meet the prerequisites** You need the right environment support and project setup for Code Apps and Power Automate integration. In Power Platform, this usually means: - Using an environment where both the app and flow can coexist - Having permissions to create/use flows and connections - Ensuring the relevant preview or newly released features are enabled if required\n\n\n\n2. **Update the npm package** Because the post explicitly mentions an npm package update, the integration is likely surfaced through the Code App's development SDK. This means your local project must reference a version that knows how to declare, bind, and invoke flows. If you skip this step, your code may compile against an older API surface that has no concept of direct flow invocation.\n\n\n\nTypical dependency maintenance would look like this:\n\n\n\n```bash npm install <updated-power-platform-package>@latest npm update ```\n\n\n\nThe exact package name is not provided in the source, but the operational idea is clear: refresh the project dependencies before attempting to add flow calls.\n\n\n\n3. **Resolve connection references correctly** This is the setup issue most likely to surprise engineers. In Power Platform, a flow may depend on connectors such as Outlook, SharePoint, Dataverse, Teams, or others. The app-to-flow linkage is not enough by itself; the environment also has to know which authenticated connection instance each reference should use.\n\n\n\nA common failure mode looks like this: - The app includes code to call the flow - The flow exists and appears valid - The flow's internal connectors are not bound to the correct connection references in the target environment - Invocation fails at runtime with an authorization, missing reference, or unresolved binding error\n\n\n\nIn practical terms, the data flow is now simpler:\n\n\n\n- User performs an action in the Code App - App code invokes a Power Automate flow directly - The flow executes its automation steps using configured connectors - The result or side effect becomes visible back in the app or in downstream systems\n\n\n\nThat direct path matters because it improves several engineering concerns:\n\n\n\n- **Maintainability**: fewer moving parts than HTTP endpoints or fake trigger tables - **Security**: less need to expose callable endpoints outside the app/flow boundary"
