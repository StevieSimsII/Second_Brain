  /* ── Layout ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

  .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 0.3px; }
  .sidebar-header .count { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-wrap input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 7px 12px; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  .tags-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; max-height: 90px; overflow-y: auto; }
  .tag-pill {
    background: var(--tag-bg); color: var(--muted); border: 1px solid var(--border);

    transition: all .15s; user-select: none; white-space: nowrap;
  }
  .tag-pill:hover { border-color: var(--accent); color: var(--accent); }
  .tag-pill.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }

  .article-list::-webkit-scrollbar-track { background: transparent; }
  .article-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .article-card {
    padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .article-card:hover { background: var(--card-hover); }
  .article-card.active { border-left-color: var(--accent); background: var(--card-hover); }
  .article-card .card-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
  .article-card .card-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .article-card .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }

  .md-body a { color: var(--accent); text-decoration: none; }

  .md-body li { margin: .3em 0; }
  .md-body strong { color: var(--text); font-weight: 600; }
  .md-body em { color: var(--muted); font-style: italic; }
  .md-body code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 13px; font-family: "SFMono-Regular", Consolas, monospace; color: #f0883e; }

  .md-body pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 13px; }
  .md-body blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 4px 16px; color: var(--muted); background: var(--code-bg); border-radius: 0 6px 6px 0; }
  .md-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 8px 12px; }
  .md-body th { background: var(--code-bg); font-weight: 600; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  /* ── Sidebar footer ── */
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

  .sidebar-footer a:hover { color: var(--accent); }
  .sidebar-footer-row { display: flex; gap: 12px; }

  /* ── Mobile back button ── */
  .mobile-back { display: none; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .app { flex-direction: column; height: 100dvh; }

    /* Default mobile: show sidebar full-screen, hide main */
    .sidebar {
      width: 100%; min-width: unset; height: 100%;
      border-right: none; border-bottom: none;
      display: flex;
    }

    /* When an article is open: hide sidebar, show main full-screen */
    .app.article-open .sidebar { display: none; }
    .app.article-open .main { display: flex; flex-direction: column; height: 100%; overflow-y: auto; }

      background: var(--sidebar); color: var(--accent);

    }
    .mobile-back:hover { color: var(--text); }

    .article-view { padding: 20px 16px; }
    .article-view .art-title { font-size: 20px; }

  {
    "id": "2026-05-14-editing-long-github-copilot-cli-prompts-in-your-preferred-editor",
    "title": "Editing Long GitHub Copilot CLI Prompts in Your Preferred Editor",
    "date": "2026-05-14",
    "tags": [
      "copilot",
      "cli",
      "terminal",
      "editor",
      "shell"
    ],
    "source": "https://www.linkedin.com/posts/burkeholland_editing-prompts-in-terminals-is-the-ick-ugcPost-7460480525078654976-4WvP?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\nThese notes capture a practical workflow improvement for GitHub Copilot CLI: editing long prompts in a real text editor instead of fighting with a cramped terminal input. The key idea is that Copilot CLI can open the current prompt in your configured editor, making it much easier to write, restructure, and refine multi-line requests.\n\nThis matters because CLI-based AI workflows are becoming common, and prompt quality often depends on being able to iterate comfortably. Understanding how the `EDITOR` environment variable works—and why some editors need blocking behavior like `--wait`—helps make terminal AI tools significantly more usable across bash, zsh, and PowerShell environments.\n\n## Key Concepts\n- **External editor workflow**: Many CLI tools support handing text entry off to a full editor instead of requiring inline terminal editing. This is especially useful for long prompts that need multiline structure, revision, and cleanup.\n- **GitHub Copilot CLI prompt editing**: The notes describe using `Ctrl+G` to open the current Copilot CLI prompt in the configured editor. After editing, saving, and closing, the updated prompt returns to the terminal session.\n- **`EDITOR` environment variable**: CLI tools commonly use `EDITOR`—and sometimes `VISUAL`—to determine which editor to launch. Setting this correctly defines the default editing experience across compatible command-line tools.\n- **Editor wait semantics**: GUI editors may return control immediately unless told to block. For VS Code, `code --wait` is necessary so the CLI pauses until editing is complete.\n- **Shell-specific setup**: Bash, zsh, and PowerShell all support editor configuration, but each uses different syntax and startup files. Persistent setup is usually done in shell config files or PowerShell profiles.\n- **Editor choice tradeoffs**: VS Code offers a rich GUI experience, while tools like Nano are lightweight and terminal-native. The best choice depends on environment, speed, and whether a desktop session is available.\n\n## How It Works\nThe workflow is straightforward: instead of composing a long Copilot CLI prompt directly in the terminal, you trigger an edit action, make changes in a full editor, then return to the CLI with the revised prompt loaded. This improves navigation, formatting, and overall prompt clarity.\n\nGitHub Copilot CLI reportedly supports this through `Ctrl+G`:\n\n1. Start or prepare a prompt in the terminal.\n2. Press `Ctrl+G`.\n3. Copilot CLI opens the prompt in the editor specified by `EDITOR`.\n4. Edit the prompt normally.\n5. Save and close the editor.\n6. Copilot CLI resumes with the updated prompt content.\n\nThis works by delegating prompt editing to an external process. The shell provides the editor command, and the CLI waits for that process to finish before reading back the modified content.\n\nExample configurations:\n\n```bash\nexport EDITOR=\"code --wait\"\n```\n\nUse this when you want Visual Studio Code. The `--wait` flag is critical because otherwise Code launches and immediately returns, causing the CLI to continue before editing is finished.\n\n```bash\nexport EDITOR=\"nano\"\n```\n\nNano is simpler because it blocks by default until you exit, which matches the expectation most CLI tools have for editor-based workflows.\n\nIn PowerShell:\n\n```powershell\n$env:EDITOR = \"code --wait\"\n```\n\nFor persistence, place the setting in your PowerShell profile rather than only setting it in the current session.\n\nA useful mental model:\n\n- Copilot CLI manages the prompt lifecycle.\n- Your shell determines which editor gets launched.\n- The editor modifies a temporary text buffer.\n- Saving and closing hands control—and the final text—back to the CLI.\n\nThis pattern also appears in other tools like Git commit editing and `crontab -e`, so learning it improves general command-line ergonomics beyond Copilot CLI."
  },

    "id": "2026-05-14-generative-ui-in-microsoft-365-copilot-with-mcp-and-langgraph",
    "title": "Generative UI in Microsoft 365 Copilot with MCP and LangGraph",
    "date": "2026-05-14",
    "tags": [
      "mcp",
      "copilot",
      "generative-ui",
      "langgraph",
      "agents"
    ],
    "source": "https://www.linkedin.com/posts/andreasadner_microsoftcopilot-agui-copilotkit-ugcPost-7460401668283854850-wqmW?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\nThese notes describe an architecture for generating interactive UI inside Microsoft 365 Copilot at runtime, using a combination of MCP, AG-UI, LangGraph, and CopilotKit’s OpenGenerativeUI ideas. The central pattern is that a user submits a prompt in Copilot, an external MCP app/server handles the request, and an agent produces a structured UI definition that Copilot can render safely in chat.\n\nThis matters because it shifts AI experiences from plain text output to dynamic, task-specific interfaces such as forms, cards, and workflows. The key takeaway is the separation between generation and rendering: the model or agent proposes structured UI intent, while a trusted renderer decides what can actually be shown.\n\n## Key Concepts\n- **Generative UI**: UI is created dynamically from user intent instead of choosing only from prebuilt screens. The AI outputs a structured representation of components rather than arbitrary frontend code.\n- **MCP server**: A custom MCP server exposes app capabilities to Microsoft 365 Copilot via the Model Context Protocol. It acts as the integration boundary between Copilot and downstream services.\n- **Microsoft 365 Copilot app rendering**: Copilot can host app experiences directly in chat. The important distinction is that it renders supported app responses rather than executing arbitrary UI code invented by the model.\n- **AG-UI bridge**: AG-UI serves as an interchange layer for transporting AI-generated interface structures between the MCP side and the agent side.\n- **LangGraph deep agent**: LangGraph orchestrates multi-step reasoning, planning, and stateful execution. It can interpret prompts, decide on tool usage, and emit a structured UI schema.\n- **OpenGenerativeUI**: CopilotKit’s approach separates UI generation from UI rendering. This improves safety, composability, and portability across hosts.\n\n## How It Works\nThe end-to-end flow looks like this:\n\n1. A user enters a natural-language prompt in Microsoft 365 Copilot.\n2. Copilot invokes an MCP app exposed by a custom MCP server.\n3. The MCP server forwards or translates the request into an AG-UI-compatible interaction.\n4. A LangGraph-based agent interprets the request and generates a structured UI description using OpenGenerativeUI-style concepts.\n5. The UI definition travels back through the bridge and is rendered inside the Copilot chat experience.\n\nA useful way to think about the system is as a layered contract:\n\n- **Copilot** handles the chat surface and app hosting.\n- **MCP server** exposes the capability boundary.\n- **AG-UI** carries the generated UI representation.\n- **LangGraph agent** reasons about the request and produces structured output.\n- **Renderer** turns the approved schema into visible, interactive controls.\n\nThe practical design principle is that the agent should emit constrained, machine-readable output instead of raw React or HTML. Typical fields in this contract include:\n\n- component type\n- props\n- layout structure\n- allowed actions\n- validation rules\n- optional data bindings\n\nExample structured UI schema:\n\n```json\n{\n  \"type\": \"form\",\n  \"title\": \"Project Intake\",\n  \"fields\": [\n    { \"type\": \"text\", \"name\": \"project_name\", \"label\": \"Project name\" },\n    { \"type\": \"select\", \"name\": \"priority\", \"label\": \"Priority\", \"options\": [\"Low\", \"Medium\", \"High\"] },\n    { \"type\": \"date\", \"name\": \"due_date\", \"label\": \"Due date\" },\n    { \"type\": \"text\", \"name\": \"owner\", \"label\": \"Owner\" }\n  ],\n  \"actions\": [\n    { \"type\": \"submit\", \"label\": \"Create\" }\n  ]\n}\n```\n\nThis pattern is valuable because it improves:\n\n- **Safety**: only approved components are renderable.\n- **Determinism**: outputs can be validated against a schema.\n- **Portability**: the same UI definition can be rendered in multiple environments.\n- **Composability**: the agent can add planning, retrieval, or tools before producing UI.\n\n### Minimal prototype exercise\nA practical exercise from the notes is to build a local prototype that turns prompts into structured UI.\n\n**Goal**: create a small service that accepts a prompt and returns a JSON UI schema for a simple renderer.\n\n**Step 1: Define a tiny UI schema**\n\n```json\n{\n  \"allowedComponents\": [\"text\", \"form\", \"input\", \"select\", \"button\", \"card\"]\n}\n```\n\n**Step 2: Implement a mock agent service**\nCreate a small Node.js or Python server that:\n\n1. accepts a POST request with `prompt`\n2. maps the prompt to a UI JSON spec\n3. returns the JSON spec\n\nExample Express handler:\n\n```js\napp.post('/generate-ui', (req, res) => {\n  const prompt = req.body.prompt || '';\n\n  if (prompt.toLowerCase().includes('project intake')) {\n    return res.json({\n      type: 'form',\n      title: 'Project Intake',\n      fields: [\n        { type: 'input', inputType: 'text', name: 'project_name', label: 'Project name' },\n        { type: 'select', name: 'priority', label: 'Priority', options: ['Low', 'Medium', 'High'] },\n        { type: 'input', inputType: 'date', name: 'due_date', label: 'Due date' }\n      ],\n      actions: [\n        { type: 'button', action: 'submit', label: 'Create' }\n      ]\n    });\n  }\n\n  return res.json({\n    type: 'card',\n    title: 'Fallback UI',\n    body: 'No matching template found for prompt: ' + prompt\n  });\n});\n```\n\n**Step 3: Build a tiny renderer**\nRender based on the returned `type`:\n\n- `card` → title and text block\n- `form` → loop through fields and create native inputs/selects\n- `button` → render action buttons\n\n**Step 4: Add validation**\nValidate that the response contains only supported component types before rendering.\n\n**Step 5: Simulate the architecture**\nMap the prototype to the larger design:\n\n- frontend form = Copilot host surface\n- `/generate-ui` endpoint = MCP server + AG-UI bridge\n- prompt-to-schema logic = LangGraph/OpenGenerativeUI generation layer\n\n**Step 6: Extend it**\nPossible next steps:\n\n- add another prompt type such as an expense approval form\n- support conditional fields\n- add schema versioning\n- post submitted form data back to the server\n\n**Success criteria**\nPrompts like these should render different UIs without manually creating each page:\n\n- `Create a project intake form`\n- `Show me an expense approval card`"
  },

    "id": "2026-05-14-structured-outputs-with-claude-json-schemas-and-tool-contracts",
    "title": "Structured Outputs with Claude: JSON Schemas and Tool Contracts",
    "date": "2026-05-14",
    "tags": [

    "source": "https://claude.com/blog/structured-outputs-on-the-claude-developer-platform/?utm_campaign=B2C_ADIR_US_CODE_SOC_CODR_BA_STATIC&utm_source=linkedin&utm_medium=paid&hsa_acc=515731155&hsa_cam=780502254&hsa_grp=454823704&hsa_ad=1228202364&hsa_net=linkedin&hsa_ver=3",
    "content": "## Overview\n\nThese notes cover Claude’s structured outputs feature, which enforces response shape at the API level using either JSON Schema or tool definitions. The main idea is to stop relying on prompts like “return valid JSON” and instead define output structure as part of the request contract, making responses far more reliable for programmatic use.\n\nThis matters for production AI systems where model output feeds automation, workflows, external APIs, or multi-agent communication. By turning schema adherence into a platform guarantee, engineers can reduce parsing failures, retries, repair logic, and downstream errors, and focus more on semantic correctness than formatting recovery.\n\n## Key Concepts\n\n- **Structured outputs**: API-level guarantees that Claude returns data matching a developer-defined structure, either through JSON Schema or tool input definitions.\n- **JSON schema enforcement**: A schema is included in the request and the response is constrained to match it, reducing fragile parsing and type-coercion code.\n- **Tool definition conformance**: When tools are defined with structured inputs, Claude emits arguments that conform to those contracts, which is especially useful for agents and workflow systems.\n- **Production reliability**: Strict output shape reduces runtime failures when downstream systems require exact fields, types, or patterns.\n- **Agent communication contracts**: Multi-agent systems benefit from reliable machine-readable handoffs for plans, task state, and action parameters.\n- **Reduced defensive code**: Validation can shift away from formatting repair toward actual business rules and semantic checks.\n\n## How It Works\n\nThe core mechanism is simple: instead of asking the model to produce structured text and then trying to parse it afterward, you provide the expected structure in the API call itself. Claude then generates output that conforms to that declared structure.\n\nThere are two main modes:\n\n1. **JSON-structured response mode**\n   - You send a JSON Schema in the request.\n   - Claude returns a response that matches that schema.\n   - Best suited for extraction, classification, and converting unstructured input into typed records.\n\n2. **Tool-based structured mode**\n   - You define tools with structured input schemas.\n   - Claude emits tool calls with arguments matching those definitions.\n   - Best suited for assistants, agent systems, workflow engines, and API orchestration.\n\nThe practical engineering shift is important. In a non-structured setup, the application often has to:\n\n- Prompt for JSON\n- Parse raw text\n- Validate keys and types\n- Retry or repair malformed output\n- Handle downstream failures caused by bad arguments\n\nWith structured outputs, the flow becomes:\n\n- Define the schema or tool contract\n- Send request\n- Receive conformant structured data\n- Apply business validation\n- Pass output to downstream systems\n\nThis narrows the failure surface. Formatting problems become less central, while semantic correctness becomes the main concern: whether the extracted value is correct, whether selected filters make sense, or whether the chosen tool/action is appropriate.\n\nHigh-value scenarios called out in the notes include:\n\n- **Data extraction**: OCR, invoices, support tickets, and documents where exact fields and types matter.\n- **Multi-agent systems**: Reliable exchange of plans, observations, task states, and structured actions.\n- **Complex search and workflow tools**: Calls with typed parameters, optional filters, allowed values, and downstream constraints.\n\nA useful architectural takeaway is that structured outputs improve interface guarantees without requiring prompt-heavy formatting tricks. This can simplify integration design and reduce operational complexity in production systems."
  },

    "id": "2026-05-14-using-github-copilot-cli-byok-with-custom-openai-compatible-models",
    "title": "Using GitHub Copilot CLI BYOK with Custom OpenAI-Compatible Models",
    "date": "2026-05-14",
    "tags": [
      "github-copilot",
      "cli",
      "byok",

    "source": "https://www.linkedin.com/posts/burkeholland_the-github-copilot-cli-now-supports-byok-ugcPost-7454977496137072640-qEYz?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes explain how to use GitHub Copilot CLI's BYOK (Bring Your Own Key) support with custom models exposed through an OpenAI-compatible API. The main idea is that Copilot CLI does not have to be limited to the default models included in a Copilot subscription; instead, it can be pointed at third-party providers such as OpenRouter and used with alternative models like Qwen, Kimi, or MiniMax.\n\nThis matters because it gives engineers more flexibility over model selection, cost, and experimentation while preserving the familiar Copilot CLI workflow in the terminal. The notes also highlight a helper utility called `cpm` that simplifies switching between providers and models by managing the required environment variables interactively.\n\n## Key Concepts\n\n- **BYOK in Copilot CLI**: BYOK means Copilot CLI can authenticate against a model provider using your own API key rather than only using models included with your Copilot plan. In practice, this lets you route Copilot CLI requests to third-party model backends while keeping the same command-line workflow.\n- **OpenAI-compatible providers**: Copilot CLI expects providers that speak an OpenAI-compatible API. Many model gateways and hosting platforms expose this interface, which makes them usable without a provider-specific client implementation.\n- **Provider configuration**: A provider definition typically includes a base URL, provider type, API key reference, and one or more model definitions. For each model, you also need metadata such as the model ID and token limits so the CLI can correctly format and constrain requests.\n- **Model IDs and token limits**: The model ID is the exact string the backend expects when you request inference, such as a specific Qwen or MiniMax variant. Token limits matter because the client needs to know the maximum context window and output size it can safely request.\n- **OpenRouter as a model gateway**: OpenRouter provides a single API surface for many different models and vendors. That makes it a practical choice for BYOK because one account and key can give you access to multiple models while also offering straightforward spend control through prepaid credits.\n- **Model switching utility**: The `cpm` utility described in the source wraps the tedious parts of configuring environment variables and selecting providers/models. Instead of manually exporting settings each time, you can add providers once and switch interactively.\n\n## How It Works\n\nAt a high level, the process is straightforward: get an API key from an OpenAI-compatible provider, tell Copilot CLI where that provider lives, specify the model and its limits, and launch the CLI with that configuration active.\n\nThe notes use **OpenRouter** as the example because it exposes many models behind one OpenAI-compatible endpoint. This is useful operationally because you can try different models without changing tools. OpenRouter also acts as a billing and routing layer, which can help with cost control through prepaid usage.\n\nTo make this work, Copilot CLI needs a small set of configuration values:\n\n- a friendly **provider name**\n- the provider **base URL**\n- a **type**, typically `openai`\n- an **API key**\n- the exact **model ID**\n- the **prompt/context token limit**\n- the **output token limit**\n\nThese details matter more than they may first appear. The model ID must exactly match the provider’s expected identifier or requests will fail. Token limits are also important because the client needs to know how much input it can send and how much output it can request without exceeding the model’s constraints.\n\nThe `cpm` helper utility makes this less error-prone by wrapping configuration and switching in a dedicated workflow. Instead of manually exporting environment variables every time, you can register providers and models once, then select them interactively.\n\nTypical flow:\n\n```text\ncpm add\n```\n\nThen provide values such as:\n\n- provider name: `openrouter`\n- base URL: OpenRouter's OpenAI-compatible endpoint\n- provider type: `openai`\n- API key label: any friendly name\n- API key value: your OpenRouter key\n- model ID: for example, a Qwen model ID\n- prompt/context token limit\n- output token limit\n\nAfter that, you can list and activate configured entries with:\n\n```text\ncpm\n```\n\nSelecting one activates the relevant provider/model settings and opens Copilot CLI with the correct environment variables in place. In the demonstration described by the notes, the active model indicator in Copilot CLI updates to show the selected custom model, confirming that requests are being routed away from the default Copilot model.\n\nConceptually, the data flow is:\n\n- user enters a prompt in Copilot CLI\n- Copilot CLI reads the active provider/model configuration\n- the request is formatted as an OpenAI-compatible API call\n- the third-party backend runs inference\n- the response is returned to Copilot CLI and shown in the terminal\n\nA useful practical detail is that the experience still feels like Copilot CLI even when custom models are used. That means teams can keep the same terminal-first interface while gaining more control over where inference happens.\n\nThe main tradeoffs noted are:\n\n- **Flexibility**: access models outside the bundled Copilot catalog\n- **Cost control**: use gateways such as OpenRouter with prepaid credits\n- **Compatibility constraints**: only providers with OpenAI-compatible APIs work cleanly\n- **Manual metadata**: model IDs and token limits must be known and entered correctly\n- **Security**: API keys now live in local config or environment variables, so secret hygiene matters\n\nIf doing this without `cpm`, the real challenge is reproducible environment management. You need to ensure the correct base URL, auth token, model name, and token settings are exported in the shell session before launching Copilot CLI. A wrapper script or shell profile can help, but `cpm` turns that into a simpler, more repeatable workflow."
  },

    "id": "2026-05-14-using-github-copilot-cli-effectively-from-the-terminal",
    "title": "Using GitHub Copilot CLI Effectively from the Terminal",
    "date": "2026-05-14",
    "tags": [

    "source": "https://www.linkedin.com/posts/github-copilot-cli-cheat-sheet-ugcPost-7460479811807911936-8hcU?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes cover how GitHub Copilot CLI can be used as a terminal-native assistant for generating shell commands, explaining unfamiliar commands, and reducing context switching during command-line work. The source material points to a cheat sheet and official documentation, but the main practical takeaway is how to use Copilot CLI as a fast interface for common terminal tasks rather than as a replacement for shell knowledge.\n\nThis matters because terminal productivity often depends on recalling syntax, flags, and command composition under time pressure. Copilot CLI is most useful when treated as a draft generator and explainer: describe intent in plain language, inspect the result carefully, then refine or run it. The notes also emphasize safety, especially around destructive commands, privilege escalation, and commands that may behave differently across shells or operating systems.\n\n## Key Concepts\n\n- **Natural-language command generation**: Copilot CLI can translate plain-English requests into shell commands.\n- **Command explanation**: It can break down existing commands and clarify flags, pipelines, and intent.\n- **Terminal-native workflow**: Keeping assistance inside the shell reduces context switching to browsers or docs.\n- **Human review before execution**: Generated commands should always be inspected before running, especially if destructive.\n- **Cheat-sheet driven productivity**: Memorizing a handful of useful prompt patterns delivers most of the value.\n\n## How It Works\n\nGitHub Copilot CLI acts as a shell-oriented assistant that accepts natural-language input and returns either a proposed command or an explanation of an existing one. In practice, the workflow is simple:\n\n1. State your task in plain language.\n2. Review the generated command or explanation.\n3. Validate flags, paths, quoting, and safety.\n4. Run it or refine the request.\n\nThe notes suggest a helpful mental model: Copilot CLI is not “automatic shell execution,” but an interactive drafting tool for terminal tasks. It is especially useful for:\n\n- Recalling rarely used flags\n- Building first-draft commands\n- Explaining copied one-liners\n- Speeding up Git, filesystem, and process tasks\n- Assisting with Unix pipelines involving tools like `find`, `grep`, `sed`, `awk`, and `xargs`\n\nA practical split is:\n\n- **Generate mode**: ask how to do something\n- **Explain mode**: ask what an existing command does\n\nPrompt quality matters. Better results usually come from adding constraints such as:\n\n- Operating system or shell (`Linux`, `macOS`, `PowerShell`, `Git Bash`)\n- Safety requirements (`dry-run`, `preview only`, `ask before delete`)\n- Scope (`current directory only`, `recursive`)\n- Output preferences (`JSON`, `filenames only`, `sorted descending`)\n\nThe notes also stress good shell discipline alongside Copilot CLI use:\n\n- Prefer preview commands before destructive ones\n- Confirm edge cases with `man` pages or official docs\n- Test on a small sample first\n- Be extra cautious with `sudo`, `rm`, `chmod`, networking, installs, or credentials\n\nA useful training approach is to practice both generation and explanation in a safe sandbox directory. The included exercise reinforces three habits: generate commands from intent, verify explanations by decomposing pipelines manually, and refine prompts for safer behavior before running anything destructive."
  },

    "id": "2026-05-13-computer-use-in-codex-browser-controlled-agent-workflows",
    "title": "Computer Use in Codex: Browser-Controlled Agent Workflows",
    "date": "2026-05-13",
    "tags": [
      "ai-agents",
      "browser-automation",
      "codex",
      "tool-use",
      "human-in-the-loop"
    ],
    "source": "https://youtu.be/D_FCYsshMI4?si=3gj1Lyj8DPCpRYRz",
    "content": "## Overview\nThese notes cover the concept of **computer use** in Codex-style AI systems: agents that interact with a live graphical environment, especially a browser, by observing state, choosing actions, and executing UI operations like clicking, typing, scrolling, and navigating. The focus is less on traditional API integrations and more on multimodal, environment-aware workflows that let an agent operate software through the same interface a human would use.\n\nThis matters because browser-controlled agents unlock automation for systems that lack clean APIs, including legacy enterprise software, web apps, QA flows, and repetitive operational tasks. The main value is flexibility, but the tradeoff is fragility and risk: UI automation can break on layout changes, timing issues, or unexpected dialogs, so practical implementations need verification, retries, safety gates, and human approval for sensitive steps.\n\n## Key Concepts\n- **Computer use**: the ability of an AI model to control software through its user interface instead of relying only on text prompts or structured APIs.\n- **Perception-action loop**: the agent repeatedly observes the environment, decides what to do next, executes an action, and checks the result.\n- **Browser as execution surface**: browsers are a common and sandboxable environment for demonstrating agent behavior across search, forms, dashboards, and web apps.\n- **Tool grounding**: the model’s reasoning must map to concrete environment actions such as DOM selection, coordinate clicks, keyboard input, or hybrid control.\n- **Human-in-the-loop approval**: risky or irreversible actions should pause for explicit user confirmation.\n- **Reliability and brittleness**: robust browser agents need state checks, retries, timeouts, and fallback behavior because UI-driven workflows are inherently fragile.\n\n## How It Works\nA browser-controlled agent is best understood as a layered workflow rather than a single model invocation. The user provides a goal, such as exporting a report or comparing documentation pages, and the system decomposes that goal into smaller actions tied to the current browser state.\n\nA practical implementation often includes:\n- a **planner** to break a goal into steps\n- a **perception layer** to read browser state from screenshots, DOM snapshots, accessibility trees, or metadata\n- an **action layer** to click, type, scroll, navigate, and switch tabs\n- a **verifier** to confirm whether an action had the intended effect\n- a **safety layer** to block or escalate dangerous actions\n\nThe core loop is:\n\n1. Observe current browser state.\n2. Ask the model to choose the next action given the goal and current state.\n3. Execute the action.\n4. Re-observe and verify progress.\n5. Continue until the task completes, fails, or requires escalation.\n\nA simplified pseudocode version:\n\n```text\nstate = observe_browser()\nwhile not done:\n    action = model.plan(goal, state, history)\n    if requires_approval(action):\n        wait_for_user_confirmation()\n    result = execute(action)\n    state = observe_browser()\n    done = check_completion(goal, state, result)\n```\n\nThere are two main control styles:\n- **Visual control**: screenshot-based reasoning with coordinate interactions; highly general but brittle.\n- **Structured control**: DOM, accessibility labels, or browser automation hooks; more reliable when available.\n\nIn practice, the strongest systems combine both. For example, the model may use screenshots to understand layout while the runtime uses deterministic selectors to execute the click. This hybrid approach gives broader reasoning while improving reliability.\n\nThe notes also highlight an important design decision: **how much autonomy to allow**. Low-autonomy systems may require approval before every step. Higher-autonomy systems may run continuously but still gate actions like:\n- entering secrets\n- sending emails or messages\n- submitting forms\n- making purchases\n- changing production data\n\nFailure recovery is another core requirement. Real browser sessions involve redirects, stale pages, login expiry, modal dialogs, and missing elements. A production-ready agent should track state history, verify expected transitions, retry safe actions, and stop when it is likely stuck.\n\nCompared with API-based automation:\n- **API automation** is faster, cleaner, and more deterministic.\n- **Computer use** is more flexible when no suitable API exists or when reproducing exact end-user behavior matters.\n\nThe included exercise outlines a minimal prototype using Playwright in Node.js. The aim is to build the agent skeleton: observe page state, choose one action, execute it, verify the result, and optionally insert a manual approval gate. This is a useful practical starting point for understanding browser-agent mechanics."
  },

    "id": "2026-05-12-branching-workflows-with-github-copilot-cli-sessions",
    "title": "Branching Workflows with GitHub Copilot CLI Sessions",
    "date": "2026-05-12",
    "tags": [
      "github-copilot",
      "cli",
      "ai-workflows",
      "sessions",
      "prompt-engineering"
    ],
    "source": "https://www.linkedin.com/posts/burkeholland_you-can-now-fork-conversations-in-the-github-ugcPost-7460074801844383746-VexF?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\nThese notes describe a new GitHub Copilot CLI capability: forking conversations into separate branches and navigating them with session commands. The core idea is to treat AI-assisted work more like version control for reasoning, where one shared context can split into multiple paths for experimentation without losing the original thread.\n\nThis matters because engineering work is rarely linear. Tasks like refactoring, debugging, architecture evaluation, and implementation planning often benefit from comparing several approaches in parallel. Conversation branching supports that style directly by preserving context, reducing repetition, and making tradeoff analysis easier.\n\n## Key Concepts\n- **Conversation forking**: Forking creates a new conversation branch from the current state of a Copilot CLI session. The new branch inherits prior context, allowing you to explore an alternative path without overwriting or polluting the original discussion.\n- **Session switching**: The `/session` command lets you move between active conversation branches. This is useful when comparing outputs from multiple approaches, such as different implementation plans or debugging strategies.\n- **Named branches for human tracking**: The `/rename` command helps assign meaningful names to session branches. Clear naming is important because once you start branching heavily, identifiers alone are not enough to remember which session represents which idea.\n- **Exploratory AI workflows**: AI-assisted development is often non-linear. Engineers frequently want to test multiple plans, prompts, or constraints, and branching sessions supports this iterative style more naturally than restarting a chat from scratch.\n- **Context preservation**: A forked session retains the accumulated context of the original conversation up to the fork point. That means you can keep prior requirements, code snippets, and design constraints while asking the model to pursue a different strategy.\n- **Comparative decision-making**: Branching enables side-by-side evaluation of alternatives instead of relying on memory or manual copy-paste. This improves decision quality when choosing among plans for refactors, tests, tooling, or architecture.\n\n## How It Works\nThe feature behaves like branching in Git, but applied to AI conversation state instead of source code. You start with a base session, establish requirements and constraints, and then fork once there are multiple reasonable directions to explore. Each branch continues independently from the same checkpoint.\n\nA practical workflow is:\n\n1. Start a base Copilot CLI conversation for a concrete task.\n2. Clarify constraints, risks, and goals.\n3. Use `/fork` when you want to test different strategies.\n4. In each branch, prompt Copilot toward a specific tradeoff or hypothesis.\n5. Use `/session` to switch among branches.\n6. Use `/rename` to label branches clearly.\n7. Compare outputs and continue with the most promising path.\n\nThe main benefit is separating exploration from commitment. In a normal linear chat, changing direction can create confusion, introduce contradictory assumptions, or force you to restate context. Forking avoids that by keeping a clean shared starting point while letting each branch diverge intentionally.\n\nThis is especially useful for:\n- refactor planning with multiple strategies\n- debugging with competing root-cause hypotheses\n- testing alternate prompt styles\n- comparing implementation tradeoffs\n- drafting competing architecture proposals\n\nA simple example from the notes is a migration from REST to GraphQL:\n- Base session: plan the migration\n- Fork A: optimize for minimal risk and incremental rollout\n- Fork B: optimize for speed of implementation\n- Fork C: optimize for long-term schema clarity\n\nBecause all branches share the same starting context, comparisons are more reliable and require less repetition. Naming branches like `graphql-low-risk`, `graphql-fastest`, and `graphql-clean-schema` makes the workflow easier to manage once several branches exist.\n\nThe training exercise extends this into a repeatable decision workflow. For example, when adding caching to a slow Node.js endpoint, you can branch into plans optimized for speed, safety, and scalability, then compare architecture impact, rollout complexity, operational risk, and monitoring needs before selecting one branch to refine into an implementation checklist."
  },

    "id": "2026-05-12-building-multi-model-ai-workflows-with-github-copilot-cli",
    "title": "Building Multi-Model AI Workflows with GitHub Copilot CLI",
    "date": "2026-05-12",
    "tags": [

    "source": "https://youtu.be/rJSsbHwkYAY?si=KWmq4S2HT9rkJAMY",
    "content": "## Overview\n\nThese notes cover how to use GitHub Copilot CLI as part of terminal-native, multi-step AI workflows for software engineering tasks. The core idea is to move beyond treating an LLM like a single chat interface and instead break work into stages such as context gathering, planning, code generation, review, summarization, and verification.\n\nThis matters because many engineering workflows already happen in the terminal: inspecting diffs, running tests, reading logs, and automating repetitive tasks. Using AI through the CLI makes those workflows easier to compose, script, repeat, and verify, while keeping humans in control of repository state and execution.\n\n## Key Concepts\n\n- **Copilot CLI**: GitHub Copilot CLI brings AI assistance directly into the terminal.\n- **Multi-model workflow**: Different models or model configurations can be used for different stages of a task.\n- **Prompt chaining**: Output from one AI step becomes input to the next step.\n- **Terminal-native automation**: CLI access makes AI usable in shell scripts, pipelines, and development loops.\n- **Context scoping**: Passing focused artifacts like diffs, stack traces, and test failures improves output quality.\n- **Human-in-the-loop verification**: Tests, linters, code review, and runtime checks remain essential safeguards.\n\n## How It Works\n\nA useful mental model is to treat Copilot CLI as one component in a larger shell-based workflow. Instead of asking one broad prompt to solve everything, split the task into smaller stages:\n\n1. Collect relevant context such as `git diff`, failing test output, logs, stack traces, or selected files.\n2. Ask for analysis or a plan.\n3. Ask for code generation, refactoring, or a specific transformation.\n4. Ask for a second-pass review, summary, or edge-case check.\n5. Verify the result locally with tests, linting, formatting, and manual inspection.\n\nThis staged approach improves reliability because each prompt has a narrow purpose. It also makes it easier to swap AI behavior per step. One model may be stronger at planning, another at concise edits, and another at review or summarization.\n\nA strong pattern is failure-driven prompting: feed concrete artifacts like compiler errors or test failures into the model rather than describing the problem abstractly. This keeps the AI grounded in actual repository state. The shell remains the source of truth, and AI acts as a helper layered onto existing engineering controls.\n\nExample shell composition pattern:\n\n```bash\ngit diff -- src/auth.py | copilot explain\npytest -q 2>&1 | copilot suggest-fix\ncat failing_test_output.txt | copilot summarize\n```\n\nEven if exact commands vary by CLI version, the pattern is stable: shell output becomes model input, and model output informs the next action.\n\nAnother useful practice is separating planning from execution. For example:\n\n- First ask for a concise diagnosis and 2–3 possible fixes.\n- Then ask for a minimal code change.\n- Then ask for tests to validate the change.\n- Finally ask for a summary suitable for a commit message.\n\nThis reduces hallucination, encourages small iterative loops, and makes verification explicit. A practical workflow mindset is:\n\n- keep prompts specific\n- pass concrete artifacts rather than vague descriptions\n- separate ideation from generation\n- verify every generated change\n- prefer small loops over one-shot prompts"

    "id": "2026-05-12-choosing-the-right-github-copilot-plan",
    "title": "Choosing the Right GitHub Copilot Plan",
    "date": "2026-05-12",
    "tags": [

    "source": "https://docs.github.com/en/copilot/get-started/plans?utm_source=chatgpt.com",
    "content": "## Overview\n\nThese notes compare GitHub Copilot plans across individual, team, and enterprise use cases, focusing on what actually changes between tiers: model access, completion limits, premium request quotas, agent features, and governance controls. The core takeaway is that plan choice is not just about price; it directly shapes developer workflow, available AI features, and how much administrative control an organization has.\n\nThis matters because the “best” plan depends on the problem being solved. An individual may care most about unlimited completions and access to stronger models, while an engineering organization may prioritize policy enforcement, auditability, seat management, and rollout at scale. The notes are especially useful as a practical evaluation guide for matching personas and operational requirements to the minimum viable Copilot plan.\n\n## Key Concepts\n\n- **Plan segmentation**: GitHub splits Copilot into individual plans (Free, Student, Pro, Pro+) and managed plans (Business, Enterprise). This reflects a shift from personal productivity needs to organizational governance and deployment.\n- **Premium requests**: Advanced capabilities are governed by monthly premium request quotas. These differ sharply by plan, so request budget can become a meaningful constraint for heavy users or AI-assisted workflows.\n- **Included models vs premium models**: Model availability is tier-dependent. Higher plans generally offer broader model choice and better access to premium models, while lower plans may limit access or message volume.\n- **Agent capabilities**: Features like cloud agent, agent mode, code review, MCP, and third-party agents are not evenly available across plans. Teams interested in agentic workflows need to verify support before rollout.\n- **Governance and policy control**: Business and Enterprise plans introduce organization-wide controls such as policy management, audit logs, content exclusion, and blocking suggestions matching public code.\n- **IDE and platform availability**: Copilot capabilities vary by tool and client. Support can differ across VS Code, Visual Studio, JetBrains IDEs, Xcode, Eclipse, GitHub Mobile, and Windows Terminal.\n\n## How It Works\n\nGitHub Copilot uses a shared feature surface—chat, inline completions, agents, customization, and admin controls—but packages access differently by subscription tier.\n\nFor individual use, the plans form a capability ladder:\n\n- **Copilot Free** is the low-commitment entry point, with limited chat, capped completions, and a small premium request allowance.\n- **Copilot Student** removes major productivity limits for verified students and adds stronger feature access at no cost.\n- **Copilot Pro** is the baseline paid plan for professionals who need unlimited completions and premium model access.\n- **Copilot Pro+** is for power users who need more premium requests and the broadest model access.\n\nFor managed environments, the emphasis shifts from individual productivity to rollout and control:\n\n- **Copilot Business** adds centralized management and policy controls for organizations.\n- **Copilot Enterprise** builds on Business with more enterprise-grade administration and higher premium request allowances.\n\nA useful way to evaluate plans is by capability area:\n\n**Chat and conversational workflows**  \nChat exists across plans, but message limits and model availability vary. Lower tiers constrain usage, while paid and managed plans generally support sustained daily use. This affects whether Copilot works as an occasional assistant or a full-time development companion.\n\n**Code completion and inline suggestions**  \nThis is the clearest dividing line between casual and professional use. Free caps completions, while Student, Pro, Pro+, Business, and Enterprise allow unlimited completions.\n\n**Agent features**  \nGitHub’s newer agent-oriented features—cloud agent, agent mode, code review, MCP, and third-party agents—are unevenly distributed across plans. If autonomous or multi-step AI workflows matter, this should be checked explicitly rather than assumed.\n\n**Customization and context control**  \nIndividuals get personal or repository-level customization, while managed plans extend control to the organization layer. That is important for standardizing prompts, exclusions, and behavior across teams.\n\n**Admin and compliance operations**  \nBusiness and Enterprise introduce policy management, audit logs, content exclusion, and seat administration. These features are essential when legal, security, and platform teams need oversight.\n\nThe notes also highlight several operational caveats:\n\n- GitHub is shifting from request-based billing to usage-based billing starting **June 1, 2026**.\n- Some plan sign-ups were temporarily paused beginning in **April 2026**, depending on the plan.\n- Copilot enterprise offerings apply to **GitHub Enterprise Cloud**, not **GitHub Enterprise Server**.\n- Feature availability can be platform-specific depending on IDE, review workflow, and model support.\n\nA practical selection rule emerges:\n\n- Choose **Free** for experimentation.\n- Choose **Student** if eligible.\n- Choose **Pro** for daily professional use.\n- Choose **Pro+** for maximum model choice and larger premium request volume.\n- Choose **Business** for centralized team rollout and policy control.\n- Choose **Enterprise** for enterprise-scale administration and governance."
  },

      "github-copilot",
      "token-billing",

      "enterprise"
    ],
    "source": "https://www.linkedin.com/posts/silvia-rodenas-vaquero_githubcopilot-github-ai-share-7457823224064745472-dhEu?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes cover how GitHub Copilot’s move to token-based billing changes day-to-day usage strategy for developers and engineering teams. Instead of evaluating Copilot only on usefulness, the focus shifts to efficiency: selecting the right model, limiting unnecessary context, compacting long sessions, and requesting tightly scoped outputs.\n\nThis matters because token spend is directly affected by prompt size, attached context, session history, and response length. For individual developers, better prompt and context discipline improves value per session. For teams and enterprises, usage observability and governance become necessary to keep adoption productive without letting costs scale faster than value.\n\n## Key Concepts\n\n- **Token-based billing**: Cost depends on how much text is sent to and generated by the model. Prompts, attached code, logs, history, and output length all contribute to spend.\n- **Model-task fit**: Simpler tasks usually do not need the most capable or expensive model. Save premium models for deeper reasoning, broader refactors, or multi-file work.\n- **Automatic model selection**: Auto selection can choose a model based on task type, policy, and availability, helping avoid overuse of premium models.\n- **Context window management**: The context window includes instructions, code, logs, history, and tool output. Keeping it minimal but sufficient reduces waste and improves relevance.\n- **Session compaction**: Long-running sessions accumulate history and become more expensive over time. Compaction preserves useful state in a shorter summary.\n- **Constrained outputs**: Asking for exact output shapes like “only show the diff” or “3 bullets” reduces token usage and makes responses easier to apply.\n- **Usage observability and governance**: Tracking token consumption by workflow, model, or team enables budgeting, guardrails, and better policy decisions.\n\n## How It Works\n\nThe main idea is to treat Copilot usage as an optimization problem across three variables: **model choice**, **context size**, and **response size**. In a token-billed environment, every interaction has a cost profile, so efficiency comes from improving the signal-to-token ratio rather than simply reducing usage.\n\nA practical workflow starts with **choosing the least expensive model that can reliably do the job**. For small edits, explanations, formatting, or narrow test generation, a mid-tier or auto-selected model is often enough. Premium models should be reserved for tasks with broader scope or deeper reasoning needs, such as architectural tradeoffs or coordinated changes across multiple files.\n\nThe next major lever is **context control**. In Copilot and Copilot CLI, context may include system instructions, past chat turns, attached files, pasted snippets, logs, stack traces, and command output. The notes highlight `/context` as a way to inspect how that window is being used. The important practice is to include only what the current task needs: the relevant function, diff, stack trace, or requirement. Sending a whole file or repository for a local issue is usually wasteful.\n\nLong sessions create a second-order cost problem because earlier turns may be repeatedly carried forward. That is where **session compaction** helps. If supported, Copilot CLI can compact automatically near token limits, and `/compact` can be run manually. This keeps the assistant useful while replacing a long transcript with a concise summary of the important state.\n\nAnother effective tactic is **output constraint**. Broad prompts tend to produce long explanations, which increases generation cost and review effort. Tight instructions such as the following improve both efficiency and workflow:\n\n```text\nOnly show the diff.\nNo explanation.\nReturn only the changed function.\nSummarize in 5 bullets.\nGive me a one-paragraph root cause.\n```\n\nThe notes also emphasize **measurement**. Commands like `/usage` make it possible to compare workflows and identify costly patterns, such as broad prompts, oversized attachments, overuse of premium models, or long sessions without compaction. At team scale, that data supports governance decisions such as default model policies, budget allocation, quota design, and training.\n\nA practical operating model from the notes:\n\n1. Default to Auto model selection or a mid-cost model.\n2. Escalate to premium models only when deeper reasoning is clearly needed.\n3. Scope prompts to the smallest relevant code unit.\n4. Use `/context` to inspect context bloat.\n5. Use `/compact` during long sessions.\n6. Ask for tightly constrained output.\n7. Review `/usage` regularly to identify expensive workflows."
  },

    "id": "2026-05-11-power-apps-code-apps-internal-order-supply-portal-workflow",
    "title": "Power Apps Code Apps: Internal Order Supply Portal Workflow",
    "date": "2026-05-11",
    "tags": [
      "powerapps",

    "source": "https://www.linkedin.com/posts/rezadorrani_powerapps-powerplatform-codeapps-activity-7459573229859319808-7erg?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes cover a lesson on building a **Power Apps Code App** through the example of an **Internal Order Supply Portal**, from initial setup through deployment. The material frames Code Apps as a hybrid approach that blends low-code Power Platform capabilities with more traditional developer workflows such as VS Code-based authoring, source-oriented development, AI-assisted generation, and solution packaging.\n\nThis matters because it points to a practical evolution in enterprise app development: teams can use Power Platform as the governed runtime and data layer while adopting more explicit engineering practices for structure, security, and release management. The example is especially useful for understanding how role-based access, Dataverse-backed data modeling, and deployable solution artifacts fit together in a code-centric Power Apps workflow.\n\n## Key Concepts\n\n- **Power Apps Code Apps**: Code Apps extend Power Apps beyond purely visual app design into a more code-first or code-friendly workflow. They aim to combine Power Platform services with developer tooling, source control habits, and reusable implementation patterns.\n- **Hybrid low-code and pro-code development**: The approach is relevant to both advanced makers and professional developers. It supports rapid delivery while still allowing stronger control over architecture, logic, and deployment.\n- **VS Code-based authoring**: Visual Studio Code is positioned as a key part of the development experience. This suggests better local editing, extension support, automation, and compatibility with software engineering practices.\n- **AI-assisted app generation**: A coding agent can help scaffold screens, logic, and app behavior from prompts. The developer’s role shifts toward directing, validating, refining, and securing generated output.\n- **Role-based access control (RBAC)**: The example includes separate `Admin` and `User` roles. RBAC affects data visibility, permitted actions, navigation, and business rule enforcement.\n- **Solution packaging and deployment**: Packaging the app as a Power Platform solution is essential for moving from prototype to managed enterprise application. It supports environment promotion, versioning, governance, and operational maintenance.\n\n## How It Works\n\nThe lesson describes an end-to-end lifecycle for a Code App using an internal ordering scenario. While the original source is more of a tutorial announcement than a full technical implementation, the notes provide enough structure to infer the intended architecture and workflow.\n\nAt a high level, the app supports internal supply ordering with:\n- a data model for items, orders, order lines, and user roles\n- a Power Apps frontend built with a code-oriented workflow\n- organizational identity and role resolution\n- admin and user-specific experiences\n- packaging into a deployable Power Platform solution\n\nA likely minimal domain model includes:\n\n```text\nUser\nRole\nCatalogItem\nOrder\nOrderLine\nApprovalState\n```\n\nA practical flow looks like this:\n1. A user signs in with organizational credentials.\n2. The app determines whether the user is an `Admin` or standard `User`.\n3. Users browse catalog items and submit order requests.\n4. Admins review requests, manage inventory or catalog data, and update fulfillment state.\n5. Data is stored in Dataverse or another supported backend.\n6. The whole app and supporting components are packaged as a solution for deployment.\n\n### Development flow\n\nThe workflow begins with **environment setup**. That typically includes preparing the Power Platform environment, confirming permissions and licensing, and configuring local tooling such as VS Code. In a code-oriented model, VS Code becomes the primary workspace for editing app-related source and configuration artifacts, while Power Platform provides runtime, identity, governance, and integration capabilities.\n\nThe next stage is **application design**, where the internal ordering scenario is translated into screens, entities, and role-aware logic. For this example, a sensible screen model would include:\n- `Home / Catalog`\n- `My Orders`\n- `Admin Dashboard`\n\nEach screen should define:\n- who can access it\n- which data is shown\n- which actions are allowed\n\n### AI-assisted implementation\n\nA key feature in the lesson is **“vibe coding” with a coding agent**. Instead of manually writing every detail, the developer provides intent using prompts such as:\n- create an order request screen with item search and quantity entry\n- add an admin dashboard for reviewing pending requests\n- restrict approval status updates to admins only\n\nThis introduces a different engineering loop:\n- describe desired behavior\n- let the agent generate code or artifacts\n- review structure and correctness\n- refine prompts\n- validate security and business logic\n\nThe speed benefit is real, but so is the need for careful verification. AI can accelerate scaffolding and repetitive implementation, but role enforcement, data integrity, and deployment readiness still require deliberate review.\n\n### Access control model\n\nRBAC is one of the most important concerns in this app. An `Admin/User` split is simple conceptually, but it must be enforced in more than just the interface.\n\nA practical rules matrix:\n\n| Action | User | Admin |\n|---|---|---|\n| View catalog | Yes | Yes |\n| Create order | Yes | Yes |\n| View all orders | No | Yes |\n| Change order status | No | Yes |\n| Manage catalog items | No | Yes |\n\nExample pseudocode:\n\n```text\nif currentUser.role == 'Admin'\n  show Admin Dashboard\nelse\n  hide Admin Dashboard\n\nif currentUser.role != 'Admin' and action == 'UpdateOrderStatus'\n  deny action\n```\n\nThe important principle is that **UI hiding is not sufficient**. Even if admin buttons are invisible to standard users, the app and backend logic must still reject unauthorized operations.\n\n### Packaging for deployment\n\nThe final phase is **solution packaging**, which turns the app into an environment-ready artifact. A deployment package would likely include:\n- app\n- tables/entities\n- role definitions\n- connection references\n- environment variables\n- security roles\n- automation flows, if used\n\nThis is what makes the app fit enterprise ALM practices. It enables promotion across dev, test, and production environments while preserving governance, dependency tracking, and maintainability.\n\n### Training exercise captured in the notes\n\nThe notes also outline a practical exercise for internalizing the workflow:\n1. Define a simple ordering scenario such as office supplies or accessories.\n2. Write user stories for browsing items, submitting requests, and admin review.\n3. Design a data model with `CatalogItem`, `Order`, `OrderLine`, and `UserRole`.\n4. Sketch the main screens and their role-based actions.\n5. Draft prompts for a coding agent to generate app features.\n6. Define an access rules matrix and pseudocode checks.\n7. Create a solution packaging checklist.\n8. Reflect on what AI should generate versus what engineers must validate.\n\nThis exercise is a useful template for experimenting with Code Apps even without the original tutorial."
  },

    "id": "2026-05-10-building-a-date-range-picker-in-a-power-apps-canvas-app",
    "title": "Building a Date Range Picker in a Power Apps Canvas App",
    "date": "2026-05-10",
    "tags": [
      "powerapps",
      "canvas-apps",
      "date-picker",
      "power-fx",
      "ui"
    ],
    "source": "https://powerappstools.com/snippet-details/221",
    "content": "## Overview\nThese notes cover how to build a practical date range picker in a Power Apps canvas app using standard controls and Power Fx formulas. Because canvas apps do not provide a single built-in desktop-style date range picker, the pattern is typically composed from two Date Picker controls, validation logic, optional preset buttons, and filter expressions that drive galleries, reports, or other data-bound controls.\n\nThis matters because date-based filtering is a common requirement in business apps, from reporting and dashboards to operational workflows. Treating the date range picker as a small reusable stateful component makes it easier to maintain, validate, and reuse across screens while handling real-world concerns such as datetime fields, delegation, and time zone behavior.\n\n## Key Concepts\n- **Canvas app composition**: Power Apps canvas apps are assembled from standard controls such as screens, containers, galleries, labels, buttons, icons, and inputs. A date range picker is usually built from two Date Picker controls plus supporting UI elements rather than a custom all-in-one widget.\n- **Date range state**: The pattern requires at least two values: a start date and an end date. These can be stored directly in control values or in context/global variables for more explicit state management.\n- **Validation and constraints**: A valid date range usually means the start date is less than or equal to the end date. Additional rules may include min/max dates, blocking future dates, or correcting invalid selections.\n- **Power Fx date logic**: Functions like `Today`, `DateAdd`, `DateDiff`, and comparison operators enable default date ranges, quick presets such as Last 7 Days, and filter logic against data sources.\n- **Filter integration**: The selected range becomes useful when passed into `Filter` expressions against SharePoint, Dataverse, SQL, or local collections to constrain records by date.\n- **Reusable UX patterns**: Encapsulating the behavior in a component or a consistent variable/formula pattern improves reuse across screens, dashboards, and reporting views.\n\n## How It Works\nA typical implementation includes two date inputs, optional preset buttons, validation messaging, and a filter formula consumed by a gallery, chart, or table. In Power Apps, the mechanics are declarative: users change one or both dates, formulas evaluate validity, and downstream controls automatically recalculate based on the selected range.\n\nA common basic setup uses two Date Picker controls such as `dpStart` and `dpEnd` with sensible defaults:\n\n```powerfx\ndpStart.DefaultDate = DateAdd(Today(), -7, Days)\ndpEnd.DefaultDate = Today()\n```\n\nValidation can be expressed simply:\n\n```powerfx\nIf( dpStart.SelectedDate <= dpEnd.SelectedDate, true, false )\n```\n\nA label can show an error when the range is invalid:\n\n```powerfx\nIf( dpStart.SelectedDate > dpEnd.SelectedDate, \"Start date must be before or equal to end date\", \"\" )\n```\n\nAn Apply button can be disabled until the range is valid:\n\n```powerfx\nDisplayMode = If( dpStart.SelectedDate > dpEnd.SelectedDate, DisplayMode.Disabled, DisplayMode.Edit )\n```\n\nFor stronger control over state, initialize screen-level variables instead of referencing controls directly:\n\n```powerfx\nUpdateContext({ ctxStartDate: DateAdd(Today(), -7, Days), ctxEndDate: Today() })\n```\n\nThen update them from each picker’s `OnChange`:\n\n```powerfx\nUpdateContext({ ctxStartDate: dpStart.SelectedDate })\n```\n\n```powerfx\nUpdateContext({ ctxEndDate: dpEnd.SelectedDate })\n```\n\nThis is especially useful for popup-style pickers or cases where users should make temporary selections before applying them.\n\nTo connect the range to data, a gallery bound to a source with a datetime column such as `Created` can use:\n\n```powerfx\nFilter( MyDataSource, Created >= dpStart.SelectedDate && Created < DateAdd(dpEnd.SelectedDate, 1, Days) )\n```\n\nUsing `< DateAdd(endDate, 1, Days)` is often safer than `<= endDate` when the source contains time values, because it includes the entire end date instead of only midnight values.\n\nPreset buttons improve usability. For example, a Last 30 Days button can set both dates at once:\n\n```powerfx\nUpdateContext({ ctxStartDate: DateAdd(Today(), -30, Days), ctxEndDate: Today() })\n```\n\nIf controls are bound to variables, reset them after applying presets:\n\n```powerfx\nReset(dpStart); Reset(dpEnd)\n```\n\nFor reuse, place the controls inside a container or custom component and expose output properties such as `StartDate`, `EndDate`, and `IsValid`. This turns the pattern into a reusable date filtering building block.\n\nImportant edge cases to consider:\n- Empty or null selections\n- Users selecting the end date before the start date\n- UTC versus local time handling when backends store datetimes\n- Delegation limits when filtering large remote datasets\n\nA training exercise in the notes walks through creating a screen with two date pickers, validation, a preset button, and a gallery bound either to sample data or a real source. The resulting pattern is a solid reusable foundation for date-based filtering in canvas apps."
  },

    "id": "2026-05-10-choosing-a-terminal-environment-for-ai-coding-agents",
    "title": "Choosing a Terminal Environment for AI Coding Agents",
    "date": "2026-05-10",
    "tags": [
      "terminal",
      "ai-agents",
      "cli",
      "automation",
      "developer-tools"
    ],
    "source": "https://youtube.com/shorts/YTVwRu_uPxY?si=owjqhKojzk8aLC3z",
    "content": "## Overview\n\nThese notes cover how to evaluate a terminal environment for AI coding agents, focusing on the practical engineering properties that affect reliability and safety. The key point is that the “best terminal” is usually not about the visual terminal app itself, but about the surrounding execution environment: shell behavior, installed tools, filesystem access, reproducibility, and logging.\n\nThis matters because coding agents operate through the terminal as their execution surface. They inspect repositories, run tests, edit files, invoke build tools, and recover from failures there. A well-chosen environment improves determinism, reduces brittle behavior, limits risk, and makes agent actions auditable and repeatable across machines or teams.\n\n## Key Concepts\n\n- **Terminal as an execution substrate**: For coding agents, the terminal is not just a human UI; it is the programmable environment where file operations, commands, and tool invocations happen. Its quality directly affects how reliably the agent can execute tasks and recover from errors.\n- **Deterministic environments**: Agents perform better when shell behavior, PATH, runtimes, and dependencies are predictable. Reproducibility reduces failures caused by aliases, missing binaries, inconsistent prompts, or machine-specific configuration.\n- **Sandboxing and safety**: Shell access can expose files, packages, and secrets. Isolated workspaces, scoped permissions, and disposable environments such as containers reduce blast radius while still enabling useful work.\n- **Observability and transcripts**: Good terminal setups preserve command history, stdout/stderr, exit codes, and diffs. This supports auditing, debugging, replaying sessions, and understanding what the agent actually changed.\n- **Toolchain compatibility**: The terminal environment must support the project’s real tools, including version control, package managers, test runners, linters, compilers, and deployment CLIs. Missing tools push agents into fragile workarounds.\n- **Non-interactive automation**: Agent-friendly workflows avoid prompts and fullscreen interfaces. Commands should run unattended and ideally produce clean, machine-readable output.\n\n## How It Works\n\nWhen evaluating a terminal for AI coding agents, it helps to separate the terminal emulator from the terminal environment. The emulator matters less than whether the environment is predictable, isolated, and capable of running the repository’s actual workflows.\n\nA coding agent often follows a loop like this: inspect the repo, read relevant files, search with tools like `rg` or `git grep`, run tests or builds, modify files, rerun checks, and summarize results. For that loop to work consistently, the environment should provide stable shell semantics, a known working directory, core CLI tools, and clean command output.\n\nThe notes suggest several properties to optimize for:\n\n- Predictable shell behavior, ideally with minimal personalization.\n- Stable repository-root handling so commands run in the right place.\n- Full access to the project toolchain.\n- Output that is parseable and useful for automation.\n- Strong logging of commands, outputs, exit codes, and file changes.\n- Guardrails for risky operations through approvals or restricted permissions.\n\nIn practice, there are three common setup patterns:\n\n- **Local developer terminal**: convenient and fast, but often polluted by personal aliases, secrets, and machine-specific config.\n- **Containerized terminal**: more reproducible and safer; often the best default for serious agent workflows.\n- **Remote or devcontainer workspace**: useful for team consistency and fast onboarding.\n\nA strong default architecture is to mount the repository into an isolated workspace, start a shell with minimal profile logic, preinstall or lock dependencies, run commands non-interactively, and capture logs and diffs. This enables a coding agent to operate with fewer hidden assumptions and makes failures easier to diagnose.\n\nThe example shell script in the notes shows a practical pattern:\n\n- use `set -euo pipefail` to fail fast,\n- anchor execution at the git repo root,\n- run status and checks in a repeatable order,\n- avoid interactive flags,\n- and preserve a clean transcript.\n\nThe included exercise reinforces the main lesson: evaluate whether the environment is reproducible, non-interactive, explicit about dependencies, and easy to reset after failure. For most teams, the best answer is a reproducible, sandboxed CLI environment with project-specific tooling preinstalled and strong logging."
  },

    "id": "2026-05-09-using-plain-html-for-ai-assisted-engineering-work",
    "title": "Using Plain HTML for AI-Assisted Engineering Work",
    "date": "2026-05-09",
    "tags": [
      "html",
      "prototyping",
      "engineering-workflows",
      "visualization",
      "ux"
    ],
    "source": "https://thariqs.github.io/html-effectiveness/",
    "content": "## Overview\nThese notes capture a practical lesson: plain HTML can be a much better medium than markdown or prose for many AI-assisted engineering tasks. The core argument is that HTML preserves spatial layout, visual hierarchy, and lightweight interactivity, making plans, reviews, diagrams, reports, and prototypes easier to scan and act on.\n\nThis matters because a lot of engineering work is not fundamentally linear. Comparing alternatives, reviewing diffs, understanding architecture, triaging tickets, or tuning prompts often benefits from side-by-side structure, callouts, controls, and diagrams. A self-contained HTML file can serve as both a communication artifact and a disposable task-specific interface that improves clarity and speeds iteration.\n\n## Key Concepts\n- **HTML as a working artifact**: Treat HTML as a fast, flexible medium for thinking and collaboration, not just final publishing.\n- **Spatial information beats linear text**: Layout, grouping, and side-by-side comparison reduce cognitive load for inherently visual or relational tasks.\n- **Multiple concrete options**: HTML makes it easy to present alternatives in parallel so teams can compare trade-offs directly.\n- **Low-friction interactivity**: Tabs, collapsibles, sliders, and clickable flows can turn a static answer into a usable tool.\n- **Artifacts that feed the next prompt**: HTML outputs can be copied, exported, edited, and reused as inputs in iterative AI workflows.\n- **Throwaway interfaces for narrow tasks**: A temporary UI tailored to a specific task can be more effective than forcing everything through chat.\n\n## How It Works\nThe notes describe HTML as a high-leverage output format when asking AI to generate something more structured than prose. Instead of producing another text document, the AI creates a single-file HTML artifact with inline CSS and light JavaScript. That artifact can encode summaries, comparisons, diagrams, timelines, tables, and controls in a way that matches how engineers actually inspect and make decisions.\n\nA useful pattern is to start with a task that is difficult to understand in plain text, then ask for a self-contained HTML page optimized for scanning. The structure should fit the task: tables for trade-offs, SVG for diagrams, tabs for alternatives, timelines for incidents, and collapsibles for secondary detail. Keeping everything in one file makes the artifact cheap to generate, easy to open locally, and easy to share.\n\nThe examples in the notes span several engineering workflows:\n\n- **Exploration and planning**: implementation plans, visual alternatives, milestone timelines, architecture diagrams, and risk tables.\n- **Code review and understanding**: annotated PRs, reviewer-focused summaries, module maps, and highlighted hot paths.\n- **Design and prototyping**: design token viewers, component variant matrices, animation sandboxes, and clickable flows.\n- **Diagrams and explainers**: SVG-based figures, flowcharts, mini slide decks, glossary-driven explainers, and tabbed concept pages.\n- **Reports and custom editors**: incident timelines, status reports, triage boards, feature flag editors, and prompt tuning tools.\n\nA recurring theme is the **export path**. The HTML artifact should not just look good; it should help the next step happen. That might mean a copyable summary, markdown export, or editable output that can be moved into a PR, source control, or another AI prompt. This turns HTML into both a thinking surface and a bridge between decision-making and execution.\n\nThe notes also include a concrete prompt pattern: ask for a single self-contained HTML file for a task, include a clear summary, optimize the layout for scanning, include the key comparisons or controls, keep CSS and JS inline, and provide an export or copy mechanism if decisions need to be reused.\n\nThe training exercise reinforces the idea with two practical options:\n- Build an **implementation plan page** with a summary, timeline, architecture or data-flow diagram, risks table, and open questions.\n- Build a **PR review page** with summary, file-by-file changes, highlighted risky areas, reviewer focus points, and anchors for navigation.\n\nThe success criteria are simple and useful: another engineer should quickly understand what the artifact is for, what the main moving parts are, where the risks are, and what should happen next."
  },

    "id": "2026-05-08-ai-in-sharepoint-interactive-html-from-lists-excel-and-metadata",
    "title": "AI in SharePoint: Interactive HTML from Lists, Excel, and Metadata",
    "date": "2026-05-08",
    "tags": [
      "sharepoint",
      "microsoft365",
      "ai",
      "html",
