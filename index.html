    "id": "2026-04-17-cb365-safe-microsoft-365-cli-on-microsoft-graph",
    "title": "cb365: Safe Microsoft 365 CLI on Microsoft Graph",
    "date": "2026-04-17",
    "tags": [
      "golang",
      "cli",
      "microsoft-graph",
      "microsoft-365",
      "automation"
    ],
    "source": "https://github.com/nz365guy/cb365",
    "content": "## Overview\n\nThese notes cover **cb365**, a Go-based CLI that wraps Microsoft Graph to provide a consistent, scriptable interface to Microsoft 365 services such as To Do, Mail, Calendar, Contacts, Planner, Teams, SharePoint, OneDrive, and Loop. The project is notable not only for its workload coverage, but for its practical engineering choices: Cobra-based command structure, a shared Graph client layer, secure credential storage, and explicit safety guardrails for high-impact actions.\n\nThis matters because Microsoft 365 automation often becomes fragmented across one-off scripts, custom OAuth handling, and inconsistent API calls. cb365 presents a reusable pattern for building operational tooling that is secure, automation-friendly, and predictable for both humans and AI agents.\n\n## Key Concepts\n\n- **Workload-oriented CLI design**: The CLI is grouped by Microsoft 365 workload, with command families like `todo`, `mail`, `calendar`, `teams`, and `sharepoint`. This keeps commands discoverable and aligns the surface area with Microsoft Graph domains.\n- **Profile-based authentication**: cb365 supports delegated device-code auth and app-only auth via client secrets or certificates. Profiles allow multiple tenants or auth modes to coexist and be selected globally or per command.\n- **Shared Graph client layer**: Graph access is centralized under `internal/graph` rather than being implemented ad hoc in each command. This keeps authentication, transport behavior, and HTTP customization consistent.\n- **Secure token and secret handling**: The tool prefers OS-native keychains and falls back to AES-256-GCM encrypted file storage on headless systems. This is especially useful for unattended automation.\n- **Machine-readable output contracts**: Commands support `--json` and `--plain`, with structured output sent to stdout and human-readable status sent to stderr. This follows a strong Unix-style scripting pattern.\n- **Hardcoded safety enforcement**: Safety is built into write and destructive operations with flags like `--dry-run`, `--confirm`, and `--force`, creating explicit intent boundaries for operators and automation.\n\n## How It Works\n\nThe repository appears to follow a layered CLI architecture.\n\nAt the top, `cmd/cb365` contains the Cobra entrypoints. Files such as `main.go` and `root.go` define the executable, global flags, and base command wiring. Workload-specific files like `todo.go`, `mail.go`, `calendar.go`, `teams.go`, `sharepoint.go`, and `loop.go` register subcommands and bind flags. This makes the command tree easy to inspect in code and keeps workload behavior localized.\n\nAuthentication is encapsulated in `internal/auth`. Based on the repo structure, files such as `auth.go` and `credential.go` likely handle profile resolution and login flows, while `keyring.go` manages native secret storage and `store_file.go` supports encrypted fallback storage. This separation prevents command handlers from needing to know whether credentials came from device code, client secret, or certificate auth.\n\nGraph access is centralized in `internal/graph`. A file like `client.go` likely constructs the Microsoft Graph SDK client using Kiota and Azure Identity components, while `transport.go` may define shared HTTP behavior or request policies. Centralizing this logic reduces duplication and helps ensure all workloads behave consistently.\n\nOutput handling is isolated in `internal/output/output.go`. That is a practical choice for a CLI intended for scripting: commands can return normalized data and let a shared renderer decide whether to emit JSON, plain text, or human-readable output. The documented stdout/stderr split is especially important for composing cb365 in shell pipelines.\n\nA likely execution path is:\n\n1. User runs a command such as `cb365 todo tasks list --list \"My Tasks\" --json`\n2. Cobra routes the request to the handler in `cmd/cb365/todo.go`\n3. The handler resolves the active or explicitly selected auth profile\n4. `internal/auth` loads or refreshes credentials\n5. `internal/graph` constructs an authenticated Graph client\n6. The command performs the workload-specific Graph operation\n7. Results are normalized and passed to `internal/output`\n8. Structured data is written to stdout; status and informational text go to stderr\n\nThe project also reflects strong operational concerns: zero runtime dependencies, signed releases, CI scanning, and reliance on Microsoft-supported libraries such as `azidentity` and `msgraph-sdk-go`. That suggests the repo intentionally minimizes custom security-sensitive code while still providing custom CLI, storage, and safety logic.\n\nTesting seems to be a first-class concern as well. The presence of matching `*_test.go` files for commands and an integration suite under `test/integration/integration_test.go` suggests both command-layer behavior and end-to-end flows are validated. For a CLI wrapper around external APIs, this is especially valuable because many failures occur at integration boundaries.\n\nFinally, cb365 surfaces Microsoft Graph product constraints directly in the CLI:\n\n- To Do is delegated-only because Graph does not support app permissions for it\n- Loop uses app-only auth and depends on SharePoint Embedded setup\n- OneDrive uploads are currently limited to small files in documented behavior\n\nThat is a useful design trait: constraints are made visible early so automation fails predictably instead of hiding API limits until runtime."
  },

    "id": "2026-04-17-claude-code-routines-for-scheduled-api-and-github-automation",
    "title": "Claude Code Routines for Scheduled, API, and GitHub Automation",
    "date": "2026-04-17",
    "tags": [
      "claude-code",
      "automation",
      "github",
      "api",
      "devops"
    ],
    "source": "https://claude.com/blog/introducing-routines-in-claude-code",
    "content": "## Overview\n\nThese notes cover Claude Code routines, a hosted automation feature that turns prompts, repository access, and connectors into repeatable workflows. Instead of depending on a developer’s local machine, routines run in Claude Code’s managed environment and can be triggered on a schedule, via API calls, or from GitHub events.\n\nThis matters because it shifts AI-assisted engineering work from ad hoc chat sessions into operational workflows. Teams can use routines for recurring tasks like issue triage, PR review, deploy verification, incident response, and cross-repo maintenance, with clearer triggers, shared context, and more reliable execution.\n\n## Key Concepts\n\n- **Routine**: A reusable Claude Code automation configuration that bundles prompt, repository access, and connectors into a repeatable workflow.\n- **Hosted execution**: Runs on Claude Code infrastructure instead of a laptop or self-managed cron host, making workflows always-on and easier to operate.\n- **Scheduled routines**: Time-based automations for recurring tasks such as nightly triage, maintenance, or docs checks.\n- **API-triggered routines**: Routines expose an endpoint and auth token so external systems can start a run with an HTTP POST payload.\n- **GitHub webhook routines**: Event-driven automations tied to repository activity, especially useful for PR review and lifecycle-aware updates.\n- **Connectors and repository context**: Routines rely on repo access plus external systems like Slack, logs, issue trackers, or deployment metadata to take meaningful actions.\n- **Usage and daily limits**: Runs consume Claude Code usage and are subject to plan-based routine limits, so teams should focus on high-value workflows.\n\n## How It Works\n\nClaude Code routines package three things into a managed workflow: instructions, execution context, and a trigger. The instructions define what Claude should do, the context includes repositories and connectors, and the trigger decides when the workflow starts. Once configured, Claude Code creates a hosted session whenever that trigger fires.\n\nThe notes describe three trigger models:\n\n1. **Scheduled routines**  \n   These run on a fixed cadence such as hourly, nightly, or weekly. They are best for periodic jobs where timing matters more than an external event. An example is a nightly routine that pulls the highest-priority bug from Linear, attempts a fix, and opens a draft PR.\n\n2. **API routines**  \n   Each routine gets a dedicated endpoint and authentication token. An external system sends a POST request with a message or structured payload, and Claude Code starts a session in response. This is a good fit for deployment hooks, observability alerts, or internal tooling.\n\n3. **GitHub webhook routines**  \n   These subscribe to repository events and create sessions when matching events occur. For pull requests, Claude can keep a session tied to the PR and continue processing updates like comments, code pushes, or CI failures over time.\n\nA simple mental model is:\n\n- **Input context**: prompt, repo, connectors, payload\n- **Trigger**: schedule, API call, or webhook\n- **Execution**: Claude Code creates a hosted session\n- **Output/actions**: comments, summaries, Slack posts, issues, draft PRs, or recommendations\n\nThis model is useful because it turns manual AI usage into event-driven automation. A team no longer has to remember to ask Claude to review a PR or investigate an alert. Instead, they define the workflow once and let the system invoke it consistently when the right conditions occur.\n\nThe article’s examples span much of the software lifecycle:\n\n- Backlog triage and issue labeling\n- Documentation drift detection\n- Deploy verification and release recommendations\n- Alert triage before on-call intervention\n- Feedback-to-code workflows\n- Cross-SDK or cross-repo change porting\n- Team-specific PR review checks for security or performance\n\nThe notes also connect routines to prior Claude Code CLI behavior: users who previously used `/schedule` are effectively moving into a more centralized, hosted automation model. That indicates routines are not just a convenience feature, but a step toward managed agent orchestration for engineering work.\n\nOperationally, routines come with some constraints: the feature is in research preview, requires Claude Code on the web, and depends on supported plan tiers. There are also daily limits and usage implications, which means teams should be selective and measure whether a routine genuinely saves time or improves reliability."
  },

    "content": "## Overview\n\nThese notes explain how Flask works beneath its simple public API by tracing the framework’s internal architecture and request lifecycle. They focus on how Flask composes Werkzeug, Jinja, Click, ItsDangerous, and related pieces into a lightweight but capable web framework, with special attention to routing, request and application contexts, blueprint registration, sessions, JSON handling, templating, CLI support, and testing.\n\nThis matters because understanding Flask internals makes it easier to debug tricky behavior, design cleaner extensions and app structure, reason about request-scoped state, and confidently trace how a request moves from the WSGI server to a final response. The notes also include a hands-on exercise for mapping common Flask features directly to the underlying source code.\n\n## Key Concepts\n\n- **WSGI application object**: The `Flask` class is itself a WSGI app and acts as the main entry point for every request.\n- **Context locals**: `request`, `session`, `g`, and `current_app` are proxies backed by request/app context machinery, not true globals.\n- **Routing and dispatch**: Flask uses Werkzeug’s URL routing to match incoming paths to endpoints and invoke the correct view function.\n- **Blueprint deferred registration**: Blueprints collect setup operations first, then replay them onto an app during registration.\n- **Response conversion**: Flask accepts many view return types and normalizes them into a proper response object.\n- **Signed-cookie sessions**: Default sessions are stored client-side with signing for integrity, but not encryption for secrecy.\n\n## How It Works\n\nFlask’s runtime is centered around a few core modules:\n\n- `src/flask/app.py` for the main application object and request lifecycle\n- `src/flask/ctx.py` and `src/flask/globals.py` for app/request context handling and proxy globals\n- `src/flask/blueprints.py` and `src/flask/sansio/blueprints.py` for modular registration\n- `src/flask/wrappers.py` for Flask-specific request and response wrappers\n- `src/flask/templating.py` for Jinja environment setup and rendering\n- `src/flask/sessions.py` for session loading and saving\n- `src/flask/cli.py` for app discovery and CLI command support\n- `src/flask/views.py` for class-based views such as `MethodView`\n\nA notable design choice is the `src/flask/sansio/` package, which separates declarative registration and configuration behavior from actual WSGI I/O. That split helps Flask keep parts of the framework easier to test and evolve independently from live request handling.\n\nAt request time, the WSGI server calls the Flask application object, which routes execution through `Flask.wsgi_app(...)`. That method builds a request context from the WSGI environment, pushes the relevant contexts, runs hooks, dispatches the matched view, converts the return value to a response, saves session state if needed, runs teardown logic, and finally pops the contexts. In practical terms, the request lifecycle can be read as:\n\n`WSGI server -> Flask.wsgi_app -> request context push -> before_request hooks -> route match -> view call -> response conversion -> session save / after_request hooks -> teardown -> context pop`\n\nThe context system is what makes Flask feel ergonomic. Imports like `from flask import request, current_app, g, session` resolve through proxy objects tied to the active context, so each request sees its own state without explicitly threading those objects through every function call. This is a key reason Flask code stays compact while still being safe for concurrent request handling.\n\nRouting is delegated to Werkzeug’s URL map. Decorators such as `@app.route('/users/<int:id>')` register a rule and associate it with an endpoint name. During request dispatch, Flask matches the request path, extracts path variables, resolves the endpoint to a callable from the app’s view function registry, and invokes it. Errors like 404 and 405 naturally arise from this stage and can be customized with error handlers.\n\nBlueprints are often misunderstood as sub-applications, but internally they act more like recorders of future setup work. When routes, hooks, or handlers are attached to a blueprint, Flask stores deferred operations. Later, `register_blueprint` replays those operations against a concrete app using app-specific URL prefixes, endpoint namespaces, and registration options. That design enables modular composition, repeated registration, and namespaced endpoints such as `api.ping`.\n\nFlask’s response handling is similarly flexible. A view can return a string, bytes, dict, tuple, generator, or an actual response object. Flask then normalizes that value into a proper response instance. This conversion logic is one of the reasons Flask’s API remains concise without forcing developers to manually instantiate response objects for every route.\n\nTemplate rendering uses Jinja through `src/flask/templating.py`. Flask constructs a Jinja environment for the app, merges template loaders from the app and any registered blueprints, and injects globals plus context processor output into the template context. This lets `render_template()` access request-aware values in a predictable way while keeping rendering logic centralized.\n\nSession handling is pluggable, but Flask’s default implementation stores session data in a signed cookie using ItsDangerous. On each request, Flask loads and verifies the cookie, exposes the decoded data through the `session` proxy, tracks whether the session changed, and writes back a newly signed cookie before the response is sent if necessary. This provides integrity, but clients can still read the data unless another encryption layer is added.\n\nThe JSON subsystem is more abstract than many users expect. The JSON provider interface in `src/flask/json/provider.py` allows custom serialization behavior to be configured at the app level, while helper code such as `jsonify` uses the active provider rather than hard-coding one serializer path. Tagged JSON support is also used for some internal serialization cases.\n\nFlask CLI support comes from `src/flask/cli.py` and is built on Click. The `flask` command handles application discovery, optional environment loading through `python-dotenv`, development server startup, shell access, and app-defined custom commands. This is part of Flask’s overall philosophy: keep the public interface small, but make the extension points practical and discoverable.\n\nTesting support in `src/flask/testing.py` wraps Werkzeug’s test client and works closely with Flask’s explicit context model. That makes it straightforward to test routes without a live server and to manually push app or request contexts when you want to exercise code that depends on `current_app`, `request`, or `g`.\n\nThe included training exercise is a strong way to internalize these ideas. By building a small app with an application factory, blueprint, request hooks, session use, and a `MethodView`, then inspecting endpoint registration and writing a test with `test_client()`, you can directly observe the behavior implemented in `Flask.wsgi_app`, `full_dispatch_request`, blueprint registration, view dispatch, and session save/load logic."
  },

    "content": "## Overview\n\nThese notes cover **MarkItDown**, a Python framework for converting many file and media formats into structured Markdown for downstream use in LLM pipelines, search, retrieval, and text analysis. The key idea is that Markdown is a practical intermediate format: it preserves useful structure like headings, lists, tables, and links without aiming for pixel-perfect rendering.\n\nThe repository is especially relevant for engineers building document ingestion systems. Beyond basic conversion, it demonstrates a solid architecture for stream-based processing, converter dispatch, optional dependency loading, plugin-based extension, and selective AI-assisted enrichment such as OCR, image captioning, and audio transcription.\n\n## Key Concepts\n\n- **Markdown-first ingestion**: MarkItDown uses Markdown as the canonical output because it keeps structural information while remaining lightweight and easy to process in chunking, indexing, and prompt pipelines.\n- **Stream-based converter architecture**: Converters operate on binary file-like streams instead of file paths, which avoids temp files and makes the system easier to embed in services and in-memory workflows.\n- **Converter dispatch by format**: The core library selects specialized converters based on stream metadata, content type, URI handling, and installed capabilities.\n- **Optional feature groups**: Support for formats like PDF, DOCX, PPTX, XLSX, and audio transcription is gated by extras, keeping default installs smaller and more modular.\n- **LLM-assisted enrichment**: Some workflows can use OpenAI-compatible models or Azure Document Intelligence for image descriptions, OCR, or transcription when conventional parsing is not enough.\n- **Plugin extensibility**: Plugins are packaged separately and explicitly enabled, allowing third parties to add or override converters without modifying the core library.\n\n## How It Works\n\nMarkItDown is organized like a small monorepo with several packages:\n\n- `packages/markitdown`: core library and CLI\n- `packages/markitdown-ocr`: OCR-oriented plugin\n- `packages/markitdown-sample-plugin`: reference plugin implementation\n- `packages/markitdown-mcp`: MCP server wrapper\n\nThe central API is the `MarkItDown` class in `src/markitdown/_markitdown.py`, which powers both the CLI and Python usage. Supporting modules handle shared converter abstractions, stream metadata detection, URI normalization, and conversion-specific exceptions. Actual format logic lives in `src/markitdown/converters/`, with dedicated modules for PDFs, Office formats, HTML, images, audio, notebooks, archives, and more.\n\nThe processing flow is straightforward:\n\n1. Input is provided as a path, URL, stdin, or stream.\n2. The orchestration layer opens it as a binary stream and inspects metadata.\n3. A matching converter is selected.\n4. The converter extracts text and structure using format-specific tooling.\n5. Output is normalized into Markdown and returned as a result object, typically accessed via `text_content`.\n\nA few implementation choices are particularly useful for production systems. The library avoids temp files by default, expects binary streams for stream conversion, and activates some capabilities only when corresponding extras are installed. This keeps the base system lean while still supporting richer conversion stacks where needed.\n\nThe repository structure also reveals design intent. Office formats have dedicated handlers rather than generic fallback parsing, suggesting attention to preserving semantics like equations and formatting. PDF support appears mature, with tests aimed at tables, numbering, scanned reports, and memory-sensitive processing. ZIP archives are recursively unpacked and converted, which is helpful for bulk ingestion workflows. Media support relies on external tools such as `ffmpeg` and `exiftool`, reflecting a practical approach instead of forcing everything through pure Python.\n\nLLM integration is optional and layered on top of deterministic conversion. In the core package, image captioning can be enabled with an OpenAI-compatible client. The OCR plugin extends this pattern by wrapping built-in converters and inserting OCR extraction for embedded or scanned content. This is an important architectural decision: the base package stays dependency-light and predictable, while plugins add heavier or AI-dependent behavior only when explicitly enabled.\n\nThe sample plugin is also worth studying because it shows the intended extension model for external developers. Combined with broad fixture-based tests across many real document types, the project serves not just as a useful tool but as a reference architecture for building heterogeneous document ingestion pipelines.\n\nOperationally, the Dockerfile shows how the maintainers expect the system to run in containers: install core package extras, add plugin packages, include tools like `ffmpeg` and `exiftool`, and expose the CLI as the entrypoint. That makes it well suited for batch conversion jobs or service-side ingestion stages."

    "content": "## Overview\n\nThese notes describe a practical workflow for extracting trustworthy technical understanding from an incomplete web source, especially when the source is a social-media URL with little or no captured content. The core lesson is that a missing or partially retrieved source should be treated as a pointer to evidence, not as evidence itself.\n\nThis matters because engineers and researchers frequently encounter login walls, deleted posts, broken scrapers, and dynamically rendered pages. A reliable workflow helps avoid hallucinating details, preserves evidence boundaries, and turns weak signals into verified technical notes grounded in primary sources.\n\n## Key Concepts\n\n- **Source fidelity**: the degree to which the captured material reflects the original content. A URL with no post body or media has very low fidelity, so detailed interpretation would be speculative.\n- **Evidence boundaries**: define which claims are actually supported by the available material. If only the URL is visible, then only minimal facts are confirmed.\n- **Graceful degradation**: a good research process does not fail silently when source quality drops. It documents the gap, preserves traceability, and shifts toward verification-first methods.\n- **Context recovery**: reconstructing missing information from adjacent artifacts such as reposts, archives, replies, linked blog posts, docs, or release notes.\n- **Claim verification**: each technical statement should be checked against primary sources or highly credible secondary sources before reuse in engineering documentation.\n- **Transparent uncertainty**: explicitly stating what is unknown, why it is unknown, and what evidence is needed next.\n\n## How It Works\n\nWhen the supplied source contains only a title and URL, the correct approach is to classify it as a discovery artifact rather than content to summarize. In this case, the confirmed evidence is limited: the URL points to a post on X from the Claude AI account, but the extracted material does not include the post text, media, linked resources, or thread context.\n\nA reliable workflow starts by inventorying what is known versus missing. This makes the evidence boundary explicit and prevents accidental overreach. Once the gap is documented, the next step is recovery: open the URL directly, search by post ID, inspect search-engine results, look for archives, and search the publisher's official site for related announcements from the same timeframe. If the post references a product update, the durable technical details are usually found in official docs, blog posts, repositories, model cards, or release notes.\n\nAfter recovery, separate the technical payload into stable categories: what changed, what system or product area it affects, what evidence supports it, and what practical impact it has on developers. Then verify each claim individually and label it by confidence level, such as `primary-confirmed`, `secondary-confirmed`, or `unverified`. This makes downstream notes safer to reuse.\n\nA good heuristic is: **never let a weak source become a strong claim**. Social posts are often useful entry points, but durable engineering knowledge should be based on verifiable artifacts. If uncertainty remains, record it directly rather than smoothing it over.\n\nThis workflow also scales well into lightweight automation. Even a simple script can track the source URL, source type, whether text was captured, extracted claims, and current verification status. The goal is not just to recover missing content, but to produce notes that distinguish observed facts from inferred context and preserve trust for future use."

const README_MD = "# 🧠 Stevie's Second Brain\n\n---\n\n## How It Works\n\n```\nYou (phone or desktop)\n       ↓\n  Send URL to your private Telegram bot\n       ↓\n  LinkToNotionLessons bot fetches the article\n       ↓\n  OpenAI gpt-4o generates a structured lesson\n       ↓\n  Notion page created\n       ↓\n  Gmail sends a lesson email → your Outlook inbox\n       ↓\n  Outlook rule moves it to your Learnings folder (automatic)\n       ↓\n  GitHub Actions (daily 8am CT)\n       ↓\n  Microsoft Graph reads Learnings folder\n       ↓\n  wiki/pages/*.md rebuilt + Notion page updated\n       ↓\n  index.html committed → GitHub Pages site updated\n```\n\n---\n\n## What You'll Need\n\n**Two repos:**\n- **This repo** (`Second_Brain`) — the GitHub Actions pipeline that reads your email and builds the site\n- **[LinkToNotionLessons](https://github.com/StevieSimsII/LinkToNotionLessons)** — the Telegram bot that processes URLs and sends the emails\n\n**Accounts and keys:**\n- GitHub account\n- Microsoft 365 / Outlook account\n- Azure account (free tier) — for Microsoft Graph API\n- OpenAI API key\n- Telegram account\n- Gmail account (used only to send lesson emails to yourself)\n- Notion account (optional)\n\n---\n\n## Setup Guide\n\n### Part 1 — Telegram Bot (LinkToNotionLessons)\n\nThis is the front door. You'll set this up first so you can start capturing articles immediately.\n\n---\n\n#### Step 1 — Clone LinkToNotionLessons\n\n```bash\ngit clone https://github.com/StevieSimsII/LinkToNotionLessons.git\ncd LinkToNotionLessons\npip install -r requirements.txt\n```\n\n---\n\n#### Step 2 — Create Your Telegram Bot\n\n1. Open Telegram → search for **@BotFather**\n2. Send `/newbot`\n3. Enter a display name (e.g. `My Second Brain`)\n4. Enter a username ending in `bot` (e.g. `my_secondbrain_bot`)\n5. BotFather replies with your **bot token** — looks like `123456789:ABCdef...`\n6. Copy it — you'll need it in Step 6\n\n---\n\n#### Step 3 — Get Your Telegram User ID\n\nThe bot only responds to you — this is how it knows who you are.\n\n1. In Telegram, search for **@userinfobot**\n2. Send `/start`\n3. It replies with your numeric user ID — e.g. `123456789`\n4. Copy it\n\n---\n\n#### Step 4 — Create a Gmail App Password\n\nThe bot sends lesson emails via Gmail SMTP. You need an App Password, not your regular Gmail password.\n\n1. Go to your Google Account → [myaccount.google.com/security](https://myaccount.google.com/security)\n2. Make sure **2-Step Verification** is turned on (required)\n3. Search for **App passwords** → [myaccount.google.com/apppasswords](https://myaccount.google.com/apppasswords)\n4. App: **Mail**, Device: **Other** → type `Second Brain Bot` → **Generate**\n5. Copy the 16-character password — it won't be shown again\n\n---\n\n#### Step 5 — Get an OpenAI API Key\n\n1. Go to [platform.openai.com/api-keys](https://platform.openai.com/api-keys)\n2. Create a new secret key and copy it\n\n---\n\n#### Step 6 — Configure LinkToNotionLessons\n\nCreate `LinkToNotionLessons/.env.local` (never commit this file):\n\n```env\n# Telegram\nTELEGRAM_BOT_TOKEN=123456789:ABCdef...\nALLOWED_TELEGRAM_USER_ID=123456789\n\n# OpenAI\nOPENAI_API_KEY=sk-...\nOPENAI_MODEL=gpt-4o\n\n# Gmail — sends lesson emails to your Outlook\nGMAIL_USER=yourname@gmail.com\nGMAIL_APP_PASSWORD=abcd efgh ijkl mnop\nEMAIL_TO=you@outlook.com\n\n# Notion (optional — skip if not using)\nNOTION_API_KEY=secret_...\nNOTION_PARENT_PAGE_ID=abc123...\n\n# GitHub token (optional — richer summaries for GitHub repo URLs)\nGITHUB_TOKEN=ghp_...\n```\n\n> **`EMAIL_TO`** must be your Microsoft 365 / Outlook address — this is where lesson emails land so the Second Brain pipeline can pick them up.\n\n---\n\n#### Step 7 — Start the Bot and Test It\n\n```bash\npython main.py\n```\n\nYou should see:\n```\nStarting LinkToNotionLessons bot...\nBot ready. Press Ctrl+C to stop.\n```\n\nOpen Telegram, find your bot by its username, send `/start` to confirm it responds, then send any URL:\n\n```\nhttps://some-article.com/interesting-read\n```\n\nWithin ~30 seconds you'll get back:\n\n```\nDone.\n\n*Your Article Title*\nNotion: https://notion.so/...\nEmail sent to you@outlook.com\n```\n\nCheck your Outlook inbox — a formatted lesson email will be there with a markdown attachment.\n\n---\n\n#### Step 8 — Set Up the Outlook Rule (Closes the Loop)\n\nThis rule automatically moves every bot-generated email into your Learnings folder so the pipeline picks it up without any manual steps.\n\n1. In Outlook → **Settings** → **Rules** → **Add new rule**\n2. **Condition:** Subject contains `[Lesson]`\n3. **Action:** Move to folder → `Learnings` (create this folder if it doesn't exist yet)\n4. Save\n\nFrom now on: send URL on phone → lesson email lands in Learnings → wiki page appears on your site the next morning.\n\n---\n\n#### Keeping the Bot Running\n\nThe bot needs to be running to receive messages. Options:\n\n| Option | How |\n|--------|-----|\n| **Windows Task Scheduler** | Trigger at startup → run `python main.py` in the LinkToNotionLessons directory |\n| **Cheap VPS** (e.g. DigitalOcean $4/mo) | `python main.py` in a `tmux` session or as a `systemd` service |\n| **Railway / Render** | Free tier works — point the start command at `python main.py` |\n\n---\n\n### Part 2 — Second Brain Pipeline (This Repo)\n\nThis is what reads your Learnings folder each morning, generates wiki pages, and updates the site.\n\n---\n\n#### Step 9 — Fork or Clone This Repo\n\n```bash\ngit clone https://github.com/StevieSimsII/Second_Brain.git\ncd Second_Brain\npip install -r requirements.txt\n```\n\nOr click **Fork** at the top of this page to create your own copy.\n\n---\n\n#### Step 10 — Register an Azure App (Microsoft Graph API)\n\nThis lets the pipeline read your Outlook emails without storing your password.\n\n1. Go to [portal.azure.com](https://portal.azure.com) → **Azure Active Directory** → **App registrations**\n2. Click **New registration**\n   - Name: `Second Brain`\n   - Supported account types: **Accounts in this organizational directory only**\n   - Redirect URI: leave blank\n3. Click **Register** — copy the **Application (client) ID** and **Directory (tenant) ID**\n\n**Add delegated permission (for local dev):**\n1. **API permissions** → **Add a permission** → **Microsoft Graph** → **Delegated permissions**\n2. Search for `Mail.Read` → add it → **Grant admin consent**\n\n**Add application permission (for GitHub Actions CI):**\n1. **API permissions** → **Add a permission** → **Microsoft Graph** → **Application permissions**\n2. Search for `Mail.Read` → add it → **Grant admin consent** — confirm the green checkmark\n\n**Enable public client flow (for local device code auth):**\n1. **Authentication** → scroll to **Advanced settings**\n2. Set **Allow public client flows** → **Yes** → **Save**\n\n**Create a client secret (for GitHub Actions):**\n1. **Certificates & secrets** → **Client secrets** → **New client secret**\n2. Description: `second-brain-ci`, Expiry: 24 months → **Add**\n3. **Copy the Value immediately** — it disappears after you navigate away\n\n---\n\n#### Step 11 — (Optional) Set Up Notion\n\nIf you want Notion pages created in parallel with wiki pages:\n\n1. Go to [notion.so/my-integrations](https://www.notion.so/my-integrations) → **New integration**\n2. Name it, select your workspace → **Submit** → copy the **Internal Integration Token**\n3. Open the Notion page where new entries should live\n4. Click **...** → **Add connections** → select your integration\n5. Copy the page ID from the URL — the last 32 characters after the final `-`\n\n---\n\n#### Step 12 — Configure Local Environment\n\nCreate `Second_Brain/.env.local`:\n\n```env\nOPENAI_API_KEY=sk-...\nOPENAI_MODEL=gpt-4o\n\n# Microsoft Graph\nGRAPH_CLIENT_ID=your-azure-app-client-id\nGRAPH_TENANT_ID=your-azure-tenant-id\n\n# Outlook folder to watch\nOUTLOOK_FOLDER=Learnings\n\n# Notion (optional)\nNOTION_API_KEY=secret_...\nNOTION_PARENT_PAGE_ID=abc123...\n\n# GitHub token (optional)\nGITHUB_TOKEN=ghp_...\n```\n\n---\n\n#### Step 13 — Authenticate with Microsoft (First Time Only)\n\n```bash\npython process.py --dry-run\n```\n\nA URL and code will be printed in your terminal. Open the URL in your browser, enter the code, and sign in with your Microsoft account. A token cache is saved locally — you won't need to do this again for ~90 days.\n\n---\n\n#### Step 14 — Add GitHub Repository Secrets\n\n**Repo → Settings → Secrets and variables → Actions → New repository secret**\n\n| Secret Name | Value |\n|-------------|-------|\n| `OPENAI_API_KEY` | Your OpenAI API key |\n| `GRAPH_CLIENT_ID` | Azure app client ID |\n| `GRAPH_TENANT_ID` | Azure tenant ID |\n| `GRAPH_CLIENT_SECRET` | Azure client secret value (from Step 10) |\n| `GRAPH_USER_EMAIL` | Your Microsoft 365 email address |\n| `NOTION_API_KEY` | Your Notion integration token (optional) |\n| `NOTION_PARENT_PAGE_ID` | Your Notion parent page ID (optional) |\n\n---\n\n#### Step 15 — Enable GitHub Pages\n\n1. Go to your repo on GitHub → **Settings** → **Pages**\n2. Source: **Deploy from a branch**\n3. Branch: `main`, Folder: `/ (root)`\n4. Click **Save**\n\nYour site will be live at `https://yourusername.github.io/Second_Brain` within a minute.\n\n---\n\n#### Step 16 — Push and Trigger Your First Run\n\n```bash\ngit add .\ngit commit -m \"init: my second brain\"\ngit push\n```\n\nThen trigger the pipeline manually to verify everything works:\n\n**Repo → Actions → Sync Second Brain → Run workflow**\n\nAfter it completes, your site will reflect any emails already in your Learnings folder.\n\nThe workflow runs automatically every day at 8am CT. You can also trigger it manually any time from the Actions tab.\n\n---\n\n## Project Structure\n\n```\nSecond_Brain/\n├── .github/\n│   └── workflows/\n│       └── sync.yml          # GitHub Actions workflow (daily cron)\n├── wiki/\n│   └── pages/                # Generated wiki pages (markdown)\n├── ingest/\n│   └── outlook.py            # Microsoft Graph API email reader\n├── llm/\n│   └── gpt.py                # OpenAI page generation\n├── fetchers/\n│   ├── web.py                # Article fetcher (BeautifulSoup)\n│   └── github.py             # GitHub repo fetcher\n├── notionapi/\n│   └── client.py             # Notion page creator\n├── process.py                # Main pipeline entry point\n├── build_site.py             # Static site generator\n├── wiki_manager.py           # Wiki file writer / index updater\n├── config.py                 # Environment config loader\n├── requirements.txt\n├── .env.example              # Template — copy to .env.local and fill in\n├── .processed.json           # Tracks processed email IDs (committed to repo)\n└── index.html                # Generated site (served by GitHub Pages)\n```\n\n---\n\n## Useful CLI Flags\n\n```bash\npython process.py               # Normal run — fetch URLs and generate wiki pages\npython process.py --dry-run     # Preview without writing files or calling APIs\npython process.py --body-only   # Use email body directly, skip URL fetching\npython process.py --reprocess   # Re-run all emails, ignore processed history\npython build_site.py            # Rebuild index.html from wiki/pages/*.md\n```\n\n---\n\n## Customization\n\n**Change the Outlook folder name:** Set `OUTLOOK_FOLDER=YourFolderName` in `.env.local` and as a GitHub secret.\n\n**Change the cron schedule:** Edit `.github/workflows/sync.yml`. The `cron` value uses UTC — `0 13 * * *` = 8am CT.\n\n**Change the OpenAI model:** Set `OPENAI_MODEL=gpt-4-turbo` (or any chat model) in `.env.local`.\n\n---\n\n## License\n\nMIT — fork it, customize it, make it yours.\n";

// ── State ─────────────────────────────────────────────────────────────────────
let activeId     = null;
let activeTag    = null;
let searchQuery  = "";

// ── Tag index ─────────────────────────────────────────────────────────────────
const tagCounts = {};
ARTICLES.forEach(a => (a.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
const allTags = Object.entries(tagCounts)
  .filter(([, n]) => n >= 4)
  .sort((a, b) => b[1] - a[1])
  .map(e => e[0]);

// ── Render tags ───────────────────────────────────────────────────────────────
function renderTags() {
  const wrap = document.getElementById("tags");
  wrap.innerHTML = allTags.map(t =>
    `<span class="tag-pill${activeTag === t ? " active" : ""}" data-tag="${t}">${t}</span>`
  ).join("");
  wrap.querySelectorAll(".tag-pill").forEach(el => el.addEventListener("click", () => {
    activeTag = activeTag === el.dataset.tag ? null : el.dataset.tag;
    renderTags(); renderList();
  }));
}

// ── Filter articles ───────────────────────────────────────────────────────────
function filtered() {
  const q = searchQuery.toLowerCase();
  return ARTICLES.filter(a => {
    if (activeTag && !(a.tags || []).includes(activeTag)) return false;
    if (q && !a.title.toLowerCase().includes(q) && !a.content.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById("list");
  const items = filtered();
  document.getElementById("count").textContent = `${items.length} of ${ARTICLES.length} articles`;
  if (!items.length) { list.innerHTML = `<div class="no-results">No articles found</div>`; return; }
  list.innerHTML = items.map(a => `
    <div class="article-card${a.id === activeId ? " active" : ""}" data-id="${a.id}">
      <div class="card-title">${escHtml(a.title)}</div>
      <div class="card-meta">
        <span>${fmtDate(a.date)}</span>
        ${a.source && a.source !== "personal notes" ? `<span>· ${escHtml(friendlySource(a.source))}</span>` : ""}
      </div>
      ${a.tags && a.tags.length ? `<div class="card-tags">${a.tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div>` : ""}
    </div>`).join("");
  list.querySelectorAll(".article-card").forEach(el => el.addEventListener("click", () => openArticle(el.dataset.id)));
}

// ── Mobile helpers ────────────────────────────────────────────────────────────
function isMobile() { return window.innerWidth <= 768; }

function showList() {
  activeId = null;
  document.querySelector(".app").classList.remove("article-open");
  window.location.hash = "";
  renderList();
}

// ── Open article ──────────────────────────────────────────────────────────────
function openArticle(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  activeId = id;
  renderList();

  const sourceHtml = a.source && a.source !== "personal notes"
    ? `<div class="art-source"><a href="${escHtml(a.source)}" target="_blank" rel="noopener">↗ Link to Source</a></div>`
    : "";

  const tagsHtml = (a.tags || []).map(t =>
    `<span class="art-tag" data-tag="${t}">${t}</span>`
  ).join("");

  const bodyHtml = marked.parse(a.content || "");

  const backBtn = isMobile()
    ? `<div class="mobile-back" id="back-btn">&#8592; All Articles</div>`
    : "";

  document.getElementById("main").innerHTML = `
    ${backBtn}
    <div class="article-view">
      <div class="art-header">
        <div class="art-title">${escHtml(a.title)}</div>
        ${sourceHtml}
        <div class="art-meta">
          <span>${fmtDate(a.date)}</span>
        </div>
        ${tagsHtml ? `<div class="art-tags">${tagsHtml}</div>` : ""}
      </div>
      <div class="md-body">${bodyHtml}</div>
    </div>`;

  if (isMobile()) {
    document.querySelector(".app").classList.add("article-open");
    document.getElementById("back-btn").addEventListener("click", showList);
  }

  document.getElementById("main").querySelectorAll(".art-tag").forEach(el =>
    el.addEventListener("click", () => {
      activeTag = activeTag === el.dataset.tag ? null : el.dataset.tag;
      renderTags(); renderList();
    })
  );

  window.location.hash = id;
  document.getElementById("main").scrollTop = 0;
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderList();
});

// ── Helpers ───────────────────────────────────────────────────────────────────
const SOURCE_NAMES = {
  "github.com":          "GitHub",
  "gist.github.com":     "GitHub Gist",
  "docs.github.com":     "GitHub Docs",
  "youtu.be":            "YouTube",
  "youtube.com":         "YouTube",
  "linkedin.com":        "LinkedIn",
  "open.substack.com":   "Substack",
  "substack.com":        "Substack",
  "x.com":               "X / Twitter",
  "twitter.com":         "X / Twitter",
  "hbr.org":             "Harvard Business Review",
  "claude.ai":           "Claude",
  "claude.com":          "Claude / Anthropic",
  "anthropic.com":       "Anthropic",
  "docs.anthropic.com":  "Anthropic Docs",
  "notion.so":           "Notion",
  "medium.com":          "Medium",
  "dev.to":              "DEV Community",
  "stackoverflow.com":   "Stack Overflow",
  "microsoft.com":       "Microsoft",
  "learn.microsoft.com": "Microsoft Learn",
  "docs.microsoft.com":  "Microsoft Docs",
  "techcommunity.microsoft.com": "Microsoft Tech Community",
  "powerappstools.com":  "Power Apps Tools",
  "tabulareditor.com":   "Tabular Editor",
  "npmjs.com":           "npm",
  "pypi.org":            "PyPI",
};

function friendlySource(url) {
  try {
    const host = new URL(url).hostname.replace(/^www\./, "");
    // Check exact match first, then check if host ends with a known domain
    if (SOURCE_NAMES[host]) return SOURCE_NAMES[host];
    for (const [domain, name] of Object.entries(SOURCE_NAMES)) {
      if (host.endsWith("." + domain) || host === domain) return name;
    }
    // Fallback: capitalise the root domain (e.g. "vercel.com" → "Vercel")
    const root = host.split(".").slice(-2, -1)[0] || host;
    return root.charAt(0).toUpperCase() + root.slice(1);
  } catch {
    return url;
  }
}

function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${m}-${day}-${y}`;
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Welcome (README) ──────────────────────────────────────────────────────────
function showWelcome() {
  // On mobile, stay on the list view — README is desktop-only landing
  if (isMobile()) return;
  document.getElementById("main").innerHTML =
    `<div class="welcome md-body" id="welcome-content">${marked.parse(README_MD)}</div>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderTags();
renderList();

// Open article from URL hash on load, otherwise show README
const hash = window.location.hash.slice(1);
if (hash && ARTICLES.find(a => a.id === hash)) {
  openArticle(hash);
} else {
  showWelcome();
}
</script>
</body>
