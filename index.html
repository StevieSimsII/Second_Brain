    ],
    "source": "https://www.linkedin.com/posts/zrosenfield_sharepoint-sharepoint-microsoft365-ugcPost-7448217661211164672-s3jy?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes describe a SharePoint AI capability that can transform structured content already stored in SharePoint—such as lists, document libraries, Excel files, and even site metadata—into interactive HTML experiences without hand-coding. The examples include dashboards, org charts, conference schedules, restaurant menus, pricing pages, site maps, and usage-style reports generated from natural-language prompts and optionally standardized using reusable \"skills.\"\n\nThis matters because it positions SharePoint as more than a content repository: it becomes a lightweight application-generation surface. For Microsoft 365 engineers, architects, and power users, the key implication is that existing business data models can be turned into fit-for-purpose interfaces directly where the data already lives, potentially reducing the need for custom SPFx web parts, external apps, or manual report-building workflows.\n\n## Key Concepts\n\n- **Prompt-driven HTML generation**: AI can interpret a natural-language request and produce a complete HTML experience from SharePoint-hosted data.\n- **Structured data as application input**: Lists and Excel files provide schema and records that help the AI infer useful UI patterns.\n- **Skills as reusable templates**: Skills act as repeatable formatting and instruction layers for branding, layout, and output consistency.\n- **Interactive reporting over static exports**: The generated result behaves more like a mini web app than a static document.\n- **Metadata-driven site analysis**: SharePoint site structure itself can be analyzed and turned into explorable outputs.\n- **No-code generation with technical implications**: Even if the user experience is no-code, the output still raises questions about HTML/CSS/JS execution, permissions, and governance.\n\n## How It Works\n\nAt a high level, the workflow in the notes is:\n\n1. Select a SharePoint data source such as a list, Excel file, or site metadata.\n2. Provide a natural-language prompt describing the desired experience.\n3. Let SharePoint AI interpret both the prompt and the source schema.\n4. Generate an HTML artifact, potentially including JavaScript and CSS.\n5. Open the result as an interactive experience.\n6. Optionally apply reusable skills to enforce branding and formatting conventions.\n\nA useful mental model is:\n\n```text\nSharePoint data source -> schema + records inferred by AI -> prompt intent interpreted -> UI pattern selected -> HTML/CSS/JS generated -> saved as interactive output\n```\n\nThe examples in the notes show how different data shapes map to different UI patterns:\n\n- A SharePoint list can become a dashboard.\n- An Excel employee file can become a searchable org chart.\n- Event-style records can become an interactive conference schedule.\n- Product or menu data can become a browsable catalog.\n- Plan/package data can become a pricing comparison page.\n- SharePoint lists, libraries, columns, and views can become a site map or usage-style metadata report.\n\nThe most reusable idea here is the separation of concerns:\n\n- **Content/data input**: the list, spreadsheet, or metadata source\n- **Prompt intent**: the type of experience to generate\n- **Presentation policy**: branding and layout rules captured as skills\n\nThat separation suggests a practical operating model: define strong skills once, then reuse them across multiple sources to get more consistent outputs.\n\nThere are also important engineering questions to validate before production use:\n\n- **Static vs live data**: confirm whether generated HTML is a snapshot or remains connected to source data.\n- **Permission model**: ensure generated outputs do not broaden visibility beyond intended access boundaries.\n- **Custom code governance**: verify how generated HTML/JS/CSS is hosted and whether tenant settings restrict it.\n- **Repeatability and drift**: use stronger prompts and skills when you need consistent artifacts across runs.\n- **Schema resilience**: expect issues if columns are renamed, records are inconsistent, or data quality is weak.\n\nThe notes also include a practical training exercise: choose a real or mock SharePoint dataset, define a target UI, write a generation prompt, define a reusable skill, map fields to UI elements, and document production concerns. This is a useful way to test whether the AI feature can be applied reliably in a real tenant and whether a proposed template is truly reusable across different datasets."
  },

    "content": "## Overview\n\nThese notes describe the architecture and practical value of an AI-native wiki: a knowledge system where documents are ingested, chunked, embedded, indexed, and then explored through natural-language queries instead of manual navigation or keyword search. The core pattern is retrieval-augmented generation (RAG), where semantic search finds relevant source passages and an LLM uses them to generate grounded answers.\n\nThis matters for anyone building internal knowledge tools, support assistants, documentation copilots, or research workflows. The main takeaway is that systems like Pinecone Assistant productize a common architecture—ingestion, semantic retrieval, and conversational answering—so teams can focus less on infrastructure plumbing and more on content quality, permissions, freshness, and user experience.\n\n## Key Concepts\n\n- **AI-native wiki**: A knowledge interface that prioritizes semantic exploration over page trees and exact-match search.\n- **Retrieval-augmented generation (RAG)**: Combines retrieval with generation so answers are grounded in retrieved source content.\n- **Vector embeddings**: Dense representations of text that make meaning-based similarity search possible.\n- **Chunking and indexing**: Splitting documents into retrievable units improves precision and controls what context reaches the model.\n- **Grounded conversational answering**: Lets users ask follow-ups while keeping answers tied to source documents.\n- **Managed knowledge assistants**: Platforms that package ingestion, indexing, retrieval, and orchestration into higher-level services.\n\n## How It Works\n\nThe notes outline a standard AI knowledge system pipeline that shows up across many modern products.\n\nFirst, source material is ingested from documents such as markdown files, PDFs, internal docs, help-center pages, tickets, or notes. That content is normalized into text and enriched with metadata like title, source, timestamps, authorship, or permissions. This metadata becomes important later for traceability, filtering, and access control.\n\nNext, documents are split into chunks. Chunking is a crucial design choice: if chunks are too large, retrieval gets noisy; if too small, context becomes fragmented. Each chunk is then embedded into a vector using an embedding model, and those vectors are stored in a vector database such as Pinecone.\n\nAt query time, the user's question is embedded and compared against the indexed vectors to retrieve semantically similar chunks. A reranker may optionally refine the results. The top chunks are then assembled into a prompt for an LLM, which generates a response using only the retrieved context. A good implementation includes citations, source links, and excerpts so the output is auditable.\n\nA concise representation of the flow is:\n\n```text\nDocuments -> parsing -> chunking -> embeddings -> vector index\nUser query -> query embedding -> similarity search -> context assembly -> LLM answer\n```\n\nThe major shift from a traditional wiki is that users no longer need to know exactly what to search for. They can ask vague, conceptual, or cross-document questions, and semantic retrieval bridges the gap between user intent and document wording.\n\nThe notes also highlight production concerns that are easy to underestimate:\n\n- **Freshness**: updated documents must be reindexed promptly.\n- **Permissions**: retrieval must respect document-level access control.\n- **Traceability**: answers should expose supporting passages.\n- **Hallucination control**: the system should admit when evidence is weak.\n- **Cost and latency**: chunk size, top-k retrieval, reranking, and prompt length all affect performance.\n\nA practical implementation usually includes connectors, parsers, a chunking strategy, an embedding service, a vector index, optional reranking, an LLM response layer, and a UI or API for chat and citations. Managed assistants reduce the amount of custom engineering required, but the underlying architecture remains the same.\n\nThe included exercise is useful because it turns the concept into a minimal prototype. Building a small assistant over local markdown files helps validate retrieval quality, chunking choices, and prompting constraints before investing in a larger production setup."
  },
  {
    "id": "2026-05-08-building-an-llm-maintained-wiki-for-compounding-knowledge",
    "title": "Building an LLM-Maintained Wiki for Compounding Knowledge",
    "date": "2026-05-08",
    "tags": [
      "llm",
      "knowledge-management",
      "rag",
      "obsidian",
      "markdown"
    ],
    "source": "https://open.substack.com/pub/nandigamharikrishna/p/andrej-karpathys-llm-wiki-full-breakdown?r=7692ad&utm_medium=ios",
    "content": "## Overview\n\nThese notes describe the **LLM Wiki** pattern popularized by Andrej Karpathy: a file-based, LLM-maintained knowledge base that sits between raw source material and future questions. Instead of relying on standard RAG to retrieve raw chunks at query time, the system continuously compiles source material into linked markdown pages, updates concepts and entities over time, tracks contradictions, and saves valuable answers back into the wiki.\n\nThis matters because it shifts knowledge work from one-off retrieval to **compounding synthesis**. For engineers, researchers, and technical teams working over long time horizons, the pattern offers a practical architecture built around immutable sources, a generated wiki, and a schema file that makes maintenance behavior consistent and repeatable.\n\n## Key Concepts\n\n- **Compiled knowledge vs retrieval**: Traditional RAG retrieves raw source fragments at query time and synthesizes answers on demand. The LLM Wiki compiles knowledge ahead of time into structured pages, so later queries operate on curated, cross-referenced summaries rather than rediscovering facts from scratch.\n- **Three-layer architecture**: The system is split into immutable raw sources, an LLM-written wiki, and a schema file that defines maintenance behavior. This preserves source fidelity, gives the LLM a persistent artifact to improve, and makes workflows more repeatable.\n- **Schema-driven maintenance**: A schema file such as `CLAUDE.md` or `AGENTS.md` tells the LLM how to name files, structure frontmatter, update indexes, handle contradictions, and follow ingest/query/lint workflows. Without this, the wiki tends to drift across sessions.\n- **Ingest, query, lint**: The core operating loop consists of ingesting new sources, answering questions from the compiled wiki, and linting the wiki for consistency issues such as stale claims, orphan pages, and missing links.\n- **Index-first navigation**: Queries typically begin with `wiki/index.md`, which acts as an explicit navigation layer. This keeps the system understandable and often avoids the need for full-text or vector search at moderate scales.\n- **Compounding artifact**: Each newly ingested source and each saved answer improves the wiki for future work. Over time, concept pages deepen, recurring questions become durable assets, and contradictions become visible instead of staying hidden in chat history.\n\n## How It Works\n\nAt a high level, the LLM Wiki replaces a **search-centric** workflow with a **maintenance-centric** one. In standard RAG, documents are chunked, embedded, and searched when a user asks a question. In this pattern, the LLM processes sources earlier and writes persistent syntheses into markdown files on disk. The result is a knowledge base that can evolve incrementally rather than rebuilding context from scratch every time.\n\nThe notes describe a **three-layer design**:\n\n1. **`raw/`**: immutable source documents such as articles, papers, transcripts, or images  \n2. **`wiki/`**: markdown pages generated and maintained by the LLM  \n3. **Schema file**: a control document like `CLAUDE.md` that defines conventions and workflows  \n\nA minimal layout looks like this:\n\n```text\nyour-wiki/\n├── CLAUDE.md\n├── raw/\n│   ├── articles/\n│   ├── papers/\n│   └── assets/\n└── wiki/\n    ├── index.md\n    ├── log.md\n    ├── overview/\n    ├── entities/\n    ├── concepts/\n    ├── sources/\n    └── queries/\n```\n\nThe **raw layer** should be treated as write-protected from the LLM’s perspective. That separation preserves source integrity and makes it easy to verify whether the wiki faithfully represents a claim. The **wiki layer** then becomes the working knowledge graph, containing source summaries, entity pages, concept pages, overviews, saved query answers, an index, and an append-only log.\n\nThe **schema file** is what makes the pattern operational rather than ad hoc. It usually defines:\n\n- directory semantics\n- YAML frontmatter requirements\n- file naming conventions\n- internal link syntax such as `[[page-name]]`\n- contradiction handling rules\n- criteria for when to create a new page\n- exact ingest, query, and lint workflows\n\nA representative ingest workflow is:\n\n1. Read the raw source file  \n2. Ask for emphasis or framing notes  \n3. Create a source summary page  \n4. Update relevant entity and concept pages  \n5. Update overview synthesis if needed  \n6. Update `wiki/index.md`  \n7. Append to `wiki/log.md`  \n\n### Ingest flow\n\nIngest is the main entry point for new knowledge. A source is read, summarized, and integrated into multiple existing pages. This is a key difference from RAG: the source becomes not just retrievable, but **structurally incorporated** into a growing graph of knowledge.\n\nA single paper or article may update several files at once, for example:\n\n- `wiki/sources/<paper>-summary.md`\n- `wiki/concepts/speculative-decoding.md`\n- `wiki/concepts/inference-optimization.md`\n- `wiki/entities/<author>.md`\n- `wiki/overview/synthesis.md`\n- `wiki/index.md`\n- `wiki/log.md`\n\n### Query flow\n\nQueries run against the compiled wiki, not directly against the raw corpus. The agent usually reads `wiki/index.md`, selects relevant pages, opens a small subset, and synthesizes an answer with references to internal wiki pages. If the answer is worth keeping, it is saved under `wiki/queries/`.\n\nThis makes answers reusable. A question like “When should I use RAG vs an LLM Wiki?” can become a permanent page that other concept pages link to later.\n\n### Lint flow\n\nLint is the maintenance pass that improves consistency and integrity. Instead of adding new knowledge, it checks the wiki for structural and semantic issues such as:\n\n- orphan pages with no inbound links\n- contradictions between pages or with newer source summaries\n- stale or superseded claims\n- heavily referenced topics missing dedicated pages\n- under-sourced areas needing more evidence\n\nThis makes the wiki behave more like a codebase: regular refactoring improves quality over time.\n\n### Why the pattern works\n\nThe central idea is that the LLM should act less like a search engine and more like a maintainer of a persistent artifact. Obsidian serves as the reader or IDE, the LLM behaves like the programmer, and the wiki becomes the codebase. The value comes from stable files, repeatable conventions, explicit links, version history, and incremental improvement.\n\nThe pattern works especially well when:\n\n- the domain matters over time\n- the corpus is limited enough to curate\n- cross-source synthesis matters\n- contradictions need to be tracked\n- improving future answers is more important than one-time retrieval\n\nIt is weaker when:\n\n- the corpus is extremely large and mainly lookup-oriented\n- low-latency search across thousands of documents is the priority\n- hallucination risk requires heavy review\n- the team will not maintain ingest discipline\n\nThe notes also include a practical exercise: build a small wiki on a known technical topic using three source documents, one schema file, one query, and one lint pass. This makes the “wiki as codebase” analogy concrete, especially when paired with Git commits after each ingest."
  },

    "id": "2026-05-08-enterprise-managed-plugins-for-github-copilot-cli",
    "title": "Enterprise-Managed Plugins for GitHub Copilot CLI",
    "date": "2026-05-08",
    "tags": [
      "github",
      "copilot",
      "cli",
      "enterprise",
      "plugins"
    ],
    "source": "https://www.linkedin.com/posts/evan-boyle-107a1445_copilot-cli-now-supports-enterprise-managed-activity-7458553867669016576-jneI?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes cover GitHub Copilot CLI plugins and a newly announced enterprise-managed distribution model. The main idea is that organizations can define plugin configuration in a special `.github-private` location so approved plugins are automatically installed for users across the enterprise, rather than relying on each developer to install them manually.\n\nThis matters because it turns Copilot CLI from an individual productivity tool into something platform teams can manage at scale. For developer experience, platform engineering, and security teams, this enables more consistent environments, easier onboarding, tighter governance, and better control over which internal or approved extensions are available by default.\n\n## Key Concepts\n\n- **Copilot CLI plugins**: Plugins extend GitHub Copilot CLI with extra commands, workflows, or integrations. They can wrap internal tools, connect to enterprise systems, or standardize common engineering tasks in the CLI.\n- **Enterprise-managed distribution**: Instead of per-user installation, plugin distribution is controlled centrally by the organization. This improves consistency and reduces the risk of tooling drift between developer environments.\n- **`.github-private` configuration**: The announcement points to `.github-private` as the control point for enterprise-level plugin settings. Administrators can define plugin configuration there and use it as the authoritative source for rollout.\n- **Auto-installation and standardization**: Automatic installation lowers onboarding friction and makes documentation, support, and internal workflows more reliable because teams can assume a common plugin baseline.\n- **Access and governance boundaries**: Managed distribution likely depends on enterprise access to the backing repository or configuration source. That introduces governance, permission, and licensing considerations that should be understood before rollout.\n- **Developer experience at scale**: Manual setup can work for small teams, but enterprise scale benefits from policy-based distribution. Managed plugins support standardization, discoverability, and compliance across large engineering organizations.\n\n## How It Works\n\nThe operating model shifts from a manual, pull-based workflow to a centrally managed, policy-based one. Instead of asking every developer to find and install plugins on their own, the enterprise defines the approved plugin set in `.github-private`, and Copilot CLI uses that configuration to install or activate plugins automatically.\n\nThere are three main actors in this model:\n\n1. **Enterprise administrators or platform engineers** who define the approved plugin set.\n2. **A private enterprise-controlled configuration location** (`.github-private`) that stores plugin definitions.\n3. **End-user Copilot CLI clients** that authenticate in the enterprise context and apply the configured plugins.\n\nA likely flow looks like this:\n\n- An administrator publishes or updates plugin configuration in `.github-private`.\n- A user authenticates with Copilot CLI in the enterprise context.\n- The CLI detects that managed plugins are configured for the organization.\n- The CLI installs or enables those plugins automatically.\n- The user then has the enterprise-approved plugin set available locally.\n\nThis model supports several practical goals:\n\n- Consistent developer environments across teams\n- Faster onboarding for new hires and contractors\n- Safer distribution of approved internal tooling\n- Lower support burden because plugin availability can be assumed\n\nThere are also operational considerations worth tracking even though the original source is an announcement rather than full documentation:\n\n- **Permission model**: Access to `.github-private` is likely restricted and tied to enterprise administration.\n- **Change management**: Plugin additions and updates should be treated like platform changes, with review, ownership, and rollback planning.\n- **Failure handling**: Teams should define what happens if plugin installation fails or a user lacks required entitlements.\n- **Trust and provenance**: Since plugins affect developer workflows, organizations should verify ownership, maintenance, and security posture before enabling them broadly.\n\nA useful implementation pattern is to treat managed Copilot CLI plugins as part of the internal developer platform. That means defining governance, documenting lifecycle events, validating onboarding impact, and creating a rollout checklist before enabling the feature broadly."
  },
  {
    "id": "2026-05-08-karpathys-llm-wiki-persistent-knowledge-files-vs-basic-rag",
    "title": "Karpathy’s LLM Wiki: Persistent Knowledge Files vs Basic RAG",
    "date": "2026-05-08",
    "tags": [
      "llm",
      "rag",
      "context-engineering",
      "knowledge-management",
      "agents"
    ],
    "source": "https://youtu.be/aGXTV5MTqDY?si=pCQXA41R0Cpwxuh3",
    "content": "## Overview\n\nThese notes describe the idea of an “LLM wiki”: a persistent, curated set of text or markdown files that acts as an external memory system for an LLM or agent. Instead of relying only on vector search over raw document chunks, the system maintains readable knowledge files such as topic summaries, decision logs, indexes, and periodic updates. This makes the model’s working knowledge more explicit, inspectable, and stable over time.\n\nThe main value of this approach is better context management. Many LLM systems underperform not because the model is weak, but because the right information is not presented clearly at the right time. An LLM wiki shifts the design toward human-auditable context engineering, durable memory, and compact summaries. It is especially useful for coding agents, research assistants, and internal tools that need continuity, transparency, and controllable write-back memory.\n\n## Key Concepts\n\n- **LLM wiki**: A collection of structured text documents used as external memory for a model or agent.\n- **RAG versus explicit context files**: Traditional RAG relies on similarity-based retrieval from chunked documents, while a wiki emphasizes curated, organized, human-readable files.\n- **Persistent memory**: Useful facts, decisions, and summaries are preserved across sessions instead of being lost after a single prompt.\n- **Context engineering**: The practice of choosing what information the model sees, in what format, and in what sequence.\n- **Human-auditable knowledge**: Because the memory is stored in normal files, engineers can inspect, edit, review, and version it directly.\n- **Knowledge compression**: A wiki works best when it distills noisy source material into concise summaries, indexes, and canonical pages.\n\n## How It Works\n\nThe core idea is to treat LLM memory like a maintained documentation set rather than a passive retrieval layer. Source material such as notes, transcripts, code docs, and chat logs is ingested and then distilled into durable files. These files can include project summaries, concept pages, decision records, people or entity profiles, and periodic log summaries. When the model performs a task, the system loads a selected subset of these files into context instead of depending only on nearest-neighbor retrieval over raw chunks.\n\nA common workflow is:\n\n1. Ingest source material.\n2. Distill it into stable pages.\n3. Load the relevant subset for a task.\n4. Optionally write back new facts, summaries, or decisions after the task completes.\n\nThis differs from naive RAG in several important ways. First, the structure is explicit: a file path can carry meaning, such as a project page versus a decision log. Second, important information is curated into high-signal summaries rather than retrieved as isolated fragments. Third, memory becomes more stable because canonical pages reduce duplication and drift.\n\nA typical layout might look like this:\n\n```text\nwiki/\n  index.md\n  projects/\n    payments-service.md\n    search-migration.md\n  concepts/\n    vector-search.md\n    prompt-caching.md\n  people/\n    team-roles.md\n  decisions/\n    2026-03-auth-refactor.md\n  logs/\n    weekly-summary-2026-05-01.md\n```\n\nEach file has a different job. `index.md` provides a map of the knowledge base. Topic pages summarize systems, constraints, and risks. Decision logs preserve rationale. Periodic summaries compress long-running activity into reusable memory. This improves context quality because the model is given synthesized, structured explanations instead of arbitrary retrieved chunks.\n\nA major advantage is write-back memory. After completing a task, the model can propose updates such as:\n\n- appending a new decision record\n- refreshing a project summary\n- extracting unresolved questions\n- updating an entity page with confirmed facts\n\nBecause the memory lives in text files, this write-back loop is simple to inspect and review. Human oversight is still important, especially because summarization can be lossy or wrong.\n\nThere are trade-offs. A wiki requires maintenance and can become stale if not curated. It may not replace RAG for very large or rapidly changing corpora where broad recall is important. In practice, the strongest setup is often hybrid:\n\n- wiki for durable, high-signal memory\n- RAG for long-tail lookup into raw documents\n\nThat combination gives the model a reliable mental map while still allowing deep retrieval when needed."
  },
  {
    "id": "2026-05-06-github-copilot-hooks-for-code-quality-and-safe-tool-use",
    "title": "GitHub Copilot Hooks for Code Quality and Safe Tool Use",
    "date": "2026-05-06",
    "tags": [
      "github-copilot",
      "hooks",
      "code-quality",
      "linting",
      "developer-workflow"
    ],
    "source": "https://www.linkedin.com/posts/burkeholland_completely-understand-hooks-in-less-than-activity-7451064088840908800-ZYas?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes explain how GitHub Copilot hooks can be used as a control layer around AI-assisted development, especially to enforce quality and safety before tools are allowed to run. The main emphasis is on `PreToolUse`, a hook that can inspect intended actions and deny them when they violate policy, such as failing lint checks, touching protected files, or attempting unsafe commands.\n\nThis matters because AI coding tools increasingly do more than suggest text: they edit files, run commands, and coordinate workflow steps. Hooks make that behavior governable. Instead of relying on the model to follow team conventions voluntarily, engineers can encode rules directly into the execution path and provide feedback that pushes the assistant toward compliant behavior.\n\n## Key Concepts\n\n- **Hooks**: Programmable interception points in an AI-assisted workflow. They let you inspect, allow, modify, or deny actions before or after the assistant performs a tool call or related operation.\n- **PreToolUse**: A hook that runs before Copilot invokes a tool. Its practical value is policy enforcement: if a planned action violates constraints such as lint cleanliness, file safety, or repository rules, the hook can block the action.\n- **Tool call denial**: Denying a tool call means the assistant is not allowed to perform the requested operation. This moves quality control from post-generation cleanup to pre-execution enforcement, which is safer and usually cheaper.\n- **Quality gates for AI**: Automated rules that code or actions must satisfy before proceeding. In this context, examples include requiring a successful linter run, passing tests, or preventing writes to protected files.\n- **Feedback loop design**: When a hook blocks an action, it should return a clear reason so the AI can try again with a better approach. Effective hooks do not just reject work; they guide remediation.\n- **Workflow integration**: Hooks are most useful when integrated into tools engineers already use, such as the Copilot CLI or VS Code, so enforcement happens at the exact point where AI suggests, edits, or executes work.\n\n## How It Works\n\nThe core idea is to treat hooks like middleware around AI actions. Copilot plans an operation, a hook runs at a defined lifecycle point, the hook evaluates policy or repository state, and then returns a decision such as allow or deny. If denied, Copilot must revise its plan.\n\n`PreToolUse` is especially useful because it intercepts actions before code is written or commands are executed. That helps address a common failure mode in AI-assisted development: the model produces code that violates lint, formatting, or repository conventions, then keeps going as though nothing is wrong. By moving checks into the pre-execution path, those rules become hard constraints rather than suggestions.\n\nA practical quality-control flow might be:\n\n- Copilot proposes editing a file.\n- A `PreToolUse` hook inspects the proposed action or current repository state.\n- The hook runs a fast validation command such as `eslint`, `ruff`, `biome`, or `prettier --check`.\n- If violations exist, the hook denies the action and returns a remediation message.\n- Copilot must fix the issue before proceeding.\n\nThis approach is useful for more than linting. Teams can encode policy such as:\n\n- blocking edits to protected files\n- preventing dangerous shell commands\n- requiring tests for changes in specific directories\n- restricting modifications to the current project root\n- enforcing consistency rules like only changing `package-lock.json` alongside `package.json`\n\nThe implementation tradeoff is strictness versus usability. If hooks are too strict, the AI may get stuck in repeated denial loops. If they are too loose, they add little value. Good hooks are:\n\n- **Fast**: they keep the workflow interactive.\n- **Deterministic**: the same input should produce the same result.\n- **Actionable**: denial messages should clearly explain how to fix the issue.\n\nA strong setup usually uses layered enforcement:\n\n1. `PreToolUse` for fast, high-signal checks and safety rules.\n2. Local lint/test commands for repository-specific correctness.\n3. CI as the final enforcement layer for slower or broader validation.\n\nThe broader architectural takeaway is that hooks act as a control plane for AI-assisted development. They shift the question from “Will the model behave correctly?” to “What actions are permitted, under what conditions, and how are those conditions enforced automatically?”"
  },
  {
    "id": "2026-05-05-choosing-blob-storage-vs-base64-for-file-handling-in-power-apps",
    "title": "Choosing Blob Storage vs Base64 for File Handling in Power Apps",
    "date": "2026-05-05",
    "tags": [
      "powerapps",
      "azure",
      "blob-storage",
      "base64",
      "dataverse"
    ],
    "source": "https://www.linkedin.com/posts/radovan-santa-7aa737134_upload-files-without-limits-using-blob-ugcPost-7455155358647599104-Icog?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\n\nThese notes capture a practical architecture decision in Power Apps: whether to handle files inline as Base64 payloads or store them externally in Azure Blob Storage. The core takeaway is that Base64 can work well for small, simple, transient file transfers, while Blob Storage is usually the better fit for persistent, scalable, and secure file handling.\n\nThis matters because file strategy affects app performance, payload size, security, maintainability, and downstream integrations. A strong enterprise pattern is to store binary content in Blob Storage, keep only metadata and references in Dataverse, and use Power Apps plus Power Automate or a custom backend to orchestrate uploads and downloads.\n\n## Key Concepts\n\n- **Base64 file transport**: Base64 encodes binary files as text so they can be embedded directly in requests, variables, or records. This is convenient for lightweight workflows, but it increases payload size and becomes inefficient for larger files or frequent uploads.\n- **Azure Blob Storage**: Blob Storage is Azure’s object store for unstructured data such as documents, images, and media. It is better suited to durable, scalable file storage than embedding file content inside app data.\n- **Metadata vs binary separation**: A common pattern is to store the file itself in Blob Storage while keeping metadata like filename, content type, owner, and blob URL in Dataverse or another transactional store.\n- **Secure access patterns**: Blob access should usually be controlled through Azure AD, RBAC, managed identities, or short-lived SAS tokens rather than public URLs.\n- **Scalability tradeoffs**: Base64 is acceptable for small files and simple cases, but scales poorly due to payload inflation and memory overhead. Blob-backed designs handle larger files and higher volumes more effectively.\n- **Power Apps integration flow**: A typical implementation uses Power Apps for file selection, Power Automate or a backend API for upload, Blob Storage for persistence, and Dataverse for metadata and business records.\n\n## How It Works\n\nThe main idea is to avoid treating file content as ordinary application data when the file is large, long-lived, or shared across systems. Instead of moving binary content around as Base64 inside Power Apps and Dataverse, the app sends the file to a backend process that uploads it to Azure Blob Storage. The app then stores only the resulting path, URL, or identifier along with useful metadata.\n\nA typical flow looks like this:\n\n1. A user selects a file in Power Apps.\n2. The app sends the file to Power Automate, an Azure Function, or a custom API.\n3. That backend authenticates to Azure Blob Storage and uploads the file.\n4. The backend returns a blob path, URL, or ID.\n5. Power Apps stores metadata in Dataverse or another data store.\n6. Later access is handled through secure rules such as SAS tokens or service-mediated download.\n\nThis pattern improves performance because Base64 expands file size and makes requests heavier. It improves maintainability because business records stay focused on metadata instead of carrying large payloads. It also improves scalability because Blob Storage is built for high-volume object storage and integrates naturally with cloud workflows, processing pipelines, and APIs.\n\nThe tradeoff is that Blob Storage introduces more design decisions around security and lifecycle. A good implementation should define who can upload, who can read, whether links expire, how metadata stays in sync with blobs, and what happens when files are updated or deleted. Blob Storage is not automatically the right answer unless these operational concerns are handled well.\n\nAs a rule of thumb:\n\n- Use **Base64** when the file is small, temporary, and mainly being passed through a workflow.\n- Use **Blob Storage** when the file has a lifecycle, needs controlled access, may be downloaded later, or must integrate with other systems.\n\nA solid enterprise pattern is:\n\n- Store file binary in **Azure Blob Storage**\n- Store metadata in **Dataverse**\n- Use **Power Apps** as the upload/download interface\n- Use **Power Automate** or a backend API for orchestration\n- Use **SAS tokens or Azure AD/RBAC** for secure retrieval\n\nExample metadata fields to store separately:\n\n```text\nDocumentId\nBusinessRecordId\nOriginalFileName\nContentType\nBlobContainer\nBlobName\nBlobUrl\nUploadedBy\nUploadedAt\nRetentionCategory\n```"
  },

    "id": "2026-05-05-teaching-ai-agents-to-use-obsidian-safely",
    "title": "Teaching AI Agents to Use Obsidian Safely",
    "date": "2026-05-05",
    "tags": [

    ],
    "source": "https://www.linkedin.com/posts/stasbel_obsidian-ceo-personally-wrote-a-set-of-skills-activity-7457097428387905537-NRIq?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\nThese notes explain why AI agents that can read and write Markdown may still fail when operating inside Obsidian. Obsidian uses product-specific conventions such as wikilinks, YAML frontmatter, typed properties, JSON Canvas files, and vault-specific organizational patterns. If an agent treats the vault as generic text, it can create changes that look valid but quietly break links, metadata-driven workflows, or structured views.\n\nThe key lesson is broader than Obsidian itself: structured tools often need explicit agent-facing rules or “skills” so models can act safely and correctly. For anyone building internal copilots, automation, or agent workflows around knowledge systems, this is a reminder that practical correctness depends on preserving the tool’s semantics, not just producing plausible text.\n\n## Key Concepts\n- **Tool-specific invariants**: Many tools embed assumptions that are not obvious from file extensions alone. In Obsidian, links, metadata, and visual canvases carry semantic meaning that an agent must preserve. A skill spec makes those invariants explicit so the agent can act like a knowledgeable user instead of treating everything as generic text.\n- **Wikilinks and graph structure**: Obsidian commonly uses wikilinks like `[[Note Name]]` rather than standard Markdown links. These links are part of the vault’s navigational and graph structure, and incorrect formatting can break backlinking, note discovery, and relationship mapping. Agents need to generate and edit links using Obsidian conventions.\n- **Frontmatter and typed metadata**: YAML frontmatter and typed properties in notes are not just decorative metadata; they are often used for filtering, querying, automation, and organization. If an agent writes metadata as free-form prose or omits required fields, downstream views and workflows can fail. Structured tools require structured writes.\n- **Structured formats beyond Markdown**: Obsidian also supports formats such as JSON Canvas and Bases with typed properties and views. These formats have stricter schemas than plain note files, so an agent must understand how to create or modify them without corrupting their structure. This broadens the problem from text generation to schema-aware editing.\n- **Agent skills as product interfaces**: A skill file or behavior spec acts like an interface contract between the tool and the agent. It defines acceptable syntax, data shapes, editing rules, and operational boundaries. This is similar to having an API contract, but for natural-language-driven automation.\n- **Technically valid vs practically correct**: An agent can produce output that parses successfully yet is still wrong for the tool. For example, a note may remain readable Markdown while losing backlinks, required metadata, or queryable properties. Practical correctness means preserving the semantics the product depends on, not just file validity.\n\n## How It Works\nThe central idea is that Obsidian should not be modeled as a directory of interchangeable Markdown files. It is better understood as a knowledge system with multiple data representations: note content, link semantics, metadata, structured databases or views, and visual canvases. A generic agent that only knows Markdown can create notes that look reasonable but violate hidden assumptions of the vault.\n\nThe proposed fix is a product-authored set of skills that tells AI agents how to operate inside an Obsidian vault. Instead of improvising, the agent is given explicit rules for:\n\n- Obsidian Markdown syntax\n- wikilinks and two-way linking behavior\n- frontmatter and properties\n- Bases support with typed fields, filters, and views\n- JSON Canvas editing\n- CLI-based vault operations\n- web-to-Markdown cleanup via Defuddle\n\nThis shifts the workflow from “guess how the tool works” to “follow the official operating model.” That matters because many failures in document systems come from format drift: a model inserts a regular Markdown link where a wikilink is expected, flattens metadata into prose, or edits a JSON Canvas file without respecting schema constraints.\n\nA useful mental model is a layered interaction process:\n\n1. **Read using Obsidian semantics**\n   - Treat `[[Page]]` and `[[Page|Alias]]` as first-class links.\n   - Parse frontmatter as structured metadata, not plain text.\n   - Detect specialized files such as canvases and database-like structures.\n\n2. **Plan edits with schema awareness**\n   - Include expected metadata when creating notes.\n   - Use wikilinks consistently for internal references.\n   - Preserve typed fields and JSON structure when editing Bases or canvases.\n\n3. **Write conservatively**\n   - Avoid rewriting unrelated content.\n   - Preserve vault formatting conventions.\n   - Maintain stable identifiers, names, and references.\n\n4. **Prefer tool-native operations**\n   - Use explicit file operations and validated transforms where possible.\n   - Use cleanup and ingestion tools such as Defuddle for web content before inserting into the vault.\n\nThe broader architectural takeaway is that agent integration with structured systems should be treated as a contract-design problem. If the system has hidden semantics, the agent needs explicit behavioral guidance. Otherwise, the system may slowly degrade through “almost correct” edits that are hard to notice until links, views, queries, or automations stop working."
  },

    "id": "2026-05-05-using-power-automate-directly-from-power-apps-code-apps",
    "title": "Using Power Automate Directly from Power Apps Code Apps",
    "date": "2026-05-05",
    "tags": [
      "powerapps",

    ],
    "source": "https://www.linkedin.com/posts/charlie-sexton_the-long-awaited-power-automate-integration-activity-7457383644672831488-Xctm?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\nThese notes cover a new Power Platform capability: Power Apps Code Apps can now invoke Power Automate flows directly, instead of relying on indirect patterns like HTTP-triggered flows, Dataverse event triggers, or custom proxy layers. This is a meaningful improvement for developers building more code-centric apps on the Microsoft Power Platform because it reduces architectural overhead and makes automation feel like a native part of app logic.\n\nThe main practical takeaways are that this integration depends on the correct prerequisites, requires updating the relevant npm package(s), and can fail unexpectedly if connection references are not configured correctly. For future projects, this is worth remembering as a cleaner, more maintainable pattern for app-to-automation orchestration.\n\n## Key Concepts\n- **Direct flow invocation**: Code Apps can call Power Automate flows directly from app code, removing the need for workaround trigger mechanisms.\n- **Code Apps model**: Power Apps Code Apps support a more traditional development workflow with packages, source control, and programmatic integration points.\n- **NPM package dependency**: The feature is surfaced through an SDK or client library update, so older package versions may hide or break the capability.\n- **Connection references**: Even if the app and flow are wired together, runtime failures can occur if connector bindings are unresolved in the environment.\n- **Replacing workaround architectures**: Older approaches like HTTP triggers or Dataverse-driven triggers worked, but added complexity, security exposure, and maintenance cost.\n- **App + automation separation**: A useful mental model is Code App = UI/business interaction, Flow = orchestration/side effects.\n\n## How It Works\nThe core change is in how a Code App starts automation. Previously, developers often had to treat a flow like an external service or create an intermediate trigger mechanism. Common patterns included calling an HTTP-triggered flow, writing to Dataverse so a flow could react, or bridging through a custom connector or API.\n\nWith this integration, the flow becomes a more direct part of the app’s execution path. That simplifies architecture and reduces the number of moving pieces involved in a user action.\n\nA practical setup sequence from these notes is:\n\n1. **Meet prerequisites**  \n   Make sure the environment supports both Code Apps and Power Automate integration, the necessary features are enabled, and the developer has permission to create flows and connections.\n\n2. **Update dependencies**  \n   Because the capability is delivered through an npm package update, the local Code App project must use a current SDK/client library version.\n\n   ```bash\n   npm install <updated-power-platform-package>@latest\n   npm update\n   ```\n\n3. **Bind the flow correctly**  \n   Add the flow integration using the supported tooling/configuration method for Code Apps.\n\n4. **Validate connection references**  \n   This is the most likely source of setup issues. A flow may exist and be callable in principle, but still fail if its connectors are not mapped to valid authenticated connections in the environment.\n\nA common failure pattern is:\n- the app code invokes the flow correctly\n- the flow exists and looks valid\n- one or more connector references inside the flow are unresolved\n- runtime execution fails with authorization or binding errors\n\nThe simplified runtime model is:\n\n- user performs an action in the Code App\n- app code invokes a Power Automate flow directly\n- the flow performs its automation steps using configured connectors\n- the app receives a result, or downstream systems reflect the side effects\n\nThis matters because it improves:\n- **Maintainability**: fewer workaround components\n- **Security**: less need for externally callable endpoints\n- **Developer experience**: clearer app logic\n- **Operational simplicity**: fewer things to troubleshoot\n\nA representative use case is an asset register app. The UI handles interaction and validation, while Power Automate handles approvals, notifications, syncing, or ticket/task creation. Direct invocation makes that boundary cleaner."
  },

    "id": "2026-05-05-using-the-new-data-grid-control-in-power-apps-canvas-apps",
    "title": "Using the New Data Grid Control in Power Apps Canvas Apps",
    "date": "2026-05-05",
    "tags": [
      "powerapps",
      "canvasapps",
      "datagrid",
      "lowcode",
      "microsoft"
    ],
    "source": "https://www.linkedin.com/posts/deepika-jain-a9498977_powerapps-microsoft-lowcode-activity-7457386539799642113-nBOZ?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes cover the newer **Data Grid control** in **Power Apps Canvas Apps**, focusing on when it is a better fit than older patterns such as **Galleries** or the legacy **Data Table**. The main theme is that the Data Grid is designed for structured, tabular, high-volume record management where users need to review and edit many records quickly.\n\nThis matters because many internal business apps revolve around operational data in systems like **SharePoint**, **Dataverse**, or **SQL**. When the app experience is mostly about scanning rows, sorting/filtering records, and making quick inline updates, the Data Grid can reduce UI complexity, speed up CRUD workflows, and lower the amount of custom formula and layout work needed.\n\n## Key Concepts\n\n- **Structured data editing**: The Data Grid is intended for row-and-column scenarios where users work with standard fields across many records. It is less about rich visual layout and more about efficient management of tabular data.\n- **Inline editing**: Users can update values directly in the grid without opening a separate form or detail screen. This is especially useful for repetitive operational changes such as status updates, assignment changes, or priority adjustments.\n- **Grid vs Gallery vs Data Table**: Galleries are best when record layout needs to be highly customized. The Data Grid is better for standardized editable tables. The older Data Table overlaps somewhat, but the Data Grid offers a more modern interaction model.\n- **Built-in sorting and filtering**: Common list-management behaviors are handled more naturally in the grid, reducing the need to manually recreate these capabilities with formulas and custom controls.\n- **Connector-backed sources**: The control works well with common enterprise data stores such as SharePoint, Dataverse, and SQL, making it a practical front end for line-of-business apps.\n- **Preview trade-offs**: Because the control may still vary by environment or release stage, teams should validate support for editing, delegation, customization, and behavior before using it broadly in production.\n\n## How It Works\n\nAt a high level, the Data Grid shifts the screen design pattern from **“open a record to edit it”** toward **“edit records directly in place.”** Instead of building a screen from a Gallery template plus labels, text inputs, icons, and patch logic for every row, you bind the Data Grid to a tabular source and let the control provide the interaction surface.\n\nThis makes the control especially strong for operational throughput. In many business apps, users are not looking for a highly branded or card-based experience. They need to scan a queue, identify the right records, sort by urgency or date, and make small changes quickly while keeping surrounding context visible.\n\nA typical setup looks like this:\n\n- **Data source**: SharePoint list, Dataverse table, or SQL table\n- **Main screen**: Data Grid bound to the data source\n- **Support controls**: search box, filters, refresh button, record count, or action buttons\n- **Editing model**: quick changes happen inline; more advanced edits can still open a form or separate detail screen\n\nA common workflow:\n\n1. Connect the app to a table such as `HelpdeskTickets`.\n2. Configure the Data Grid to show key fields like `Ticket ID`, `Title`, `Status`, `Priority`, `Assigned To`, and `Created On`.\n3. Let users sort and filter the records they care about.\n4. Allow inline editing on permitted fields.\n5. Save changes back to the underlying data source without forcing navigation away from the list.\n\nThis pattern is well suited to a helpdesk queue. An operator can scan the list and update fields like:\n\n- `Status`: `New` → `In Progress`\n- `Priority`: `Medium` → `High`\n- `AssignedTo`: assign to a technician\n\nThe advantage is continuity: users keep their place in the list and can compare nearby records while making decisions.\n\nA practical decision rule:\n\n- Use **Data Grid** for high-volume tabular review and inline editing.\n- Use **Gallery** for custom layouts, branding, or record-specific visuals/interactions.\n- Use **Form controls** when editing requires heavy validation, guided workflows, or more complex business logic.\n\nThe main trade-off is flexibility. Because the grid is more opinionated than a Gallery, it may not support every custom interaction or visual pattern you want. In those cases, a hybrid design works well: use the grid for quick edits and a detail form for advanced updates."
  },

    "id": "2026-05-05-work-iq-microsoft-graph-and-dataverse-mcp-in-microsoft-365-ai-agents",
    "title": "Work IQ, Microsoft Graph, and Dataverse MCP in Microsoft 365 AI Agents",
    "date": "2026-05-05",
    "tags": [
      "microsoft365",
      "mcp",
      "dataverse",
      "microsoft-graph",
      "ai-agents"
    ],
    "source": "https://www.linkedin.com/posts/sean-astrakhan_workiq-microsoft365-mcp-share-7457292115677736960-3LiN?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\n\nThese notes describe a practical architecture pattern for Microsoft 365 AI agents: Microsoft 365 content is not typically exposed as separate MCP servers for each workload like SharePoint, Outlook, or Teams. Instead, a unified intelligence layer called **Work IQ** interprets natural-language intent, determines where the requested information lives, and routes retrieval accordingly. For collaboration content across the tenant, that usually means **Microsoft Graph**; for structured business records, it means **Dataverse**, which is treated as a separate access path.\n\nThis distinction matters when designing agents, Copilot Studio solutions, or Power Platform integrations. The key mental model is a **two-lane system**: Graph-backed retrieval for Microsoft 365 collaboration data, and Dataverse MCP-oriented access for business entities. That helps avoid overcomplicating agent design with one connector per app and instead encourages intentional routing based on the type of user question.\n\n## Key Concepts\n\n- **Work IQ as a unified intelligence layer**: Work IQ acts as a broker for Microsoft 365 tenant data access.\n- It lets users ask for information in natural language without needing to know the underlying app.\n- It interprets intent and selects the most relevant backend.\n- It reduces the need to think in terms of separate app-specific entry points.\n- For agent design, it becomes the orchestration layer between question and data source.\n\n- **Microsoft Graph for M365 content**: Microsoft Graph is the common API surface for Microsoft 365 collaboration data.\n- It covers artifacts such as email, files, meetings, calendars, chats, and documents.\n- Graph-backed retrieval is the right model for tenant-wide M365 content access.\n- This explains why engineers may not find dedicated MCP servers for each Microsoft 365 app.\n- Outlook, SharePoint, Teams, and OneDrive can all sit behind the same Graph-based access plane.\n\n- **Dataverse as a separate business-data plane**: Dataverse is treated differently from general M365 collaboration content.\n- It stores structured business data such as accounts, opportunities, custom tables, and relationships.\n- In this framing, Dataverse has its own MCP server or direct structured tool path.\n- It is the appropriate backend for CRM-like or operational business records.\n- Agent architectures should model Dataverse separately from Graph-backed content retrieval.\n\n- **Natural-language query routing**: Users begin with a request, not an API choice.\n- The system must infer whether the request targets collaboration content or business records.\n- Correct classification determines whether to use Graph or Dataverse.\n- Ambiguous prompts may require clarification or multi-source retrieval.\n- Routing quality directly affects agent usefulness and trust.\n\n- **MCP as a tool integration pattern**: MCP is useful as a standard way for agents to access tools and data sources.\n- In these notes, MCP is especially relevant for Dataverse integration.\n- MCP should not be assumed to be the transport model for every Microsoft 365 workload.\n- The pattern is more about interoperable tool access than mirroring every M365 app with its own server.\n- This helps separate protocol concerns from Microsoft’s platform abstractions.\n\n- **Agent design implications**: The main architectural takeaway is to avoid one-tool-per-app thinking unless the platform explicitly requires it.\n- Instead, model M365 collaboration access as a unified Graph-backed retrieval layer.\n- Model Dataverse as a separate connector/tool path for structured records.\n- Build routing, permissions, and answer synthesis into the agent layer.\n- Treat the complexity as centralized orchestration rather than distributed app-by-app integration.\n\n## How It Works\n\nThe notes outline a **two-lane retrieval architecture** for Microsoft-centric AI agents.\n\nIn the first lane, a user asks for collaboration content such as emails, files, chats, meetings, or calendars. Work IQ interprets the request and determines that the answer likely lives in Microsoft 365. It then routes retrieval through **Microsoft Graph**, which serves as the consolidated API layer over services such as Outlook, SharePoint, Teams, OneDrive, and Calendar.\n\nIn the second lane, the user asks for structured business information such as customer records, account ownership, opportunities, tables, or relationships. In that case, the request is treated as a **Dataverse** query. The notes emphasize that Dataverse is a distinct business-data substrate with its own MCP-oriented access path, making it a more direct tool-style integration target.\n\nA simple request flow looks like this:\n\n1. User submits a natural-language question.\n2. Work IQ interprets the intent and predicts the likely source.\n3. If the question is about Microsoft 365 collaboration content, route to **Graph**.\n4. If the question is about structured business records, route to **Dataverse**.\n5. Normalize the results so the agent can return one coherent answer.\n\nA useful design implication is that agents need at least three core responsibilities:\n\n- **Intent classification** to distinguish collaboration content from business data\n- **Source routing** to choose Graph vs Dataverse\n- **Response shaping** to present unified answers even when the underlying systems differ\n\nThe notes also suggest starting with a simple rules-based router before introducing more advanced intent models. For example:\n\n- “Find the latest email from Contoso” → likely **Graph**\n- “What file did Sarah share in Teams yesterday?” → likely **Graph**\n- “Show the account owner and open opportunities for Fabrikam” → likely **Dataverse**\n\nSome prompts will be ambiguous and may require a clarifying question or retrieval from both systems. For instance, “Show me customer meeting notes” could refer to Teams meeting artifacts in Graph, CRM notes in Dataverse, or both. That makes ambiguity handling an important part of agent design.\n\nThe broader architectural lesson is that the platform complexity is not removed but **centralized**. Work IQ handles orchestration and source selection, Graph remains the access plane for Microsoft 365 collaboration workloads, and Dataverse keeps its own structured integration model. This is why searching for separate “SharePoint MCP” or “Outlook MCP” servers may be the wrong design approach in this context."
  },

    "id": "2026-05-03-from-ai-pilots-to-enterprise-transformation",
    "title": "From AI Pilots to Enterprise Transformation",
    "date": "2026-05-03",
    "tags": [
      "generative-ai",
      "digital-transformation",
      "corporate-strategy",
      "process-management",
      "ai-adoption"
    ],
    "source": "https://hbr.org/2026/04/how-to-move-from-ai-experimentation-to-ai-transformation",
    "content": "## Overview\n\nThese notes cover the shift from isolated generative AI pilots to true enterprise transformation. The central idea is that many organizations can launch AI experiments quickly, but far fewer redesign workflows, governance, ownership, and measurement systems well enough to produce durable business value.\n\nThis matters because successful AI adoption is not defined by the number of demos, copilots, or prototype launches. It is defined by measurable improvements in revenue, cost, speed, quality, or risk. For engineers, product managers, and technical leaders, the lesson is to treat AI as part of a business system redesign rather than as a standalone feature.\n\n## Key Concepts\n\n- **Experimentation vs. transformation**: Experimentation proves that an AI capability works in a narrow context; transformation changes core processes and operating models to create lasting value.\n- **Bottom-line impact**: AI success should be tied to business outcomes such as revenue lift, cost reduction, speed, quality, or risk mitigation.\n- **Workflow redesign**: The biggest gains come from redesigning workflows around AI rather than layering AI onto unchanged processes.\n- **Strategic prioritization**: Enterprise investment should focus on use cases with strong value, feasible implementation, sufficient data readiness, and manageable change effort.\n- **Operating model alignment**: Scaled AI requires ownership across business, technology, risk, and leadership functions, not just a central AI team.\n- **Stage-appropriate measurement**: Early pilots may focus on technical quality and adoption, but transformation must be judged by business KPIs.\n\n## How It Works\n\nThe notes describe a maturity progression from discovery to experimentation, operationalization, and finally transformation. The major failure point is the gap between proving that AI can help and integrating it into real operations. Many firms get stuck with useful pilots that never change cost structure, service quality, throughput, or decision-making.\n\nA practical way to interpret this is that AI transformation requires both a technical system and an organizational system. The model itself is only one layer. To create enterprise value, teams need a clearly defined process, baseline metrics, good access to enterprise data, workflow integration in existing tools, human review controls where needed, production monitoring, and long-term ownership.\n\nA key mechanism is workflow redesign. For example, adding a drafting assistant to customer support may save some time, but true transformation requires rethinking the full workflow: intake, classification, retrieval, drafting, escalation, quality review, analytics, and staffing. Without that broader redesign, AI remains a local optimization.\n\nThe notes also emphasize portfolio thinking. Not all AI ideas deserve the same attention. Teams should score use cases across business value, technical feasibility, data readiness, process fit, and change burden. This helps identify which opportunities are likely to produce transformative value rather than incremental convenience. The takeaway is that a few deeply integrated, high-value workflows usually matter more than many disconnected pilots.\n\nLeadership and operating model alignment are also critical. AI transformation is not purely a technology initiative; it spans strategy, operations, finance, legal, compliance, and frontline teams. Strong pilots often fail because no one owns the end-to-end process change. In practice, technical teams should ask which KPI matters, who must change behavior, what approvals are required, and what downstream system the AI output affects.\n\nMeasurement should also be layered. Technical metrics such as latency, error rate, hallucination rate, and cost per task matter early. Adoption metrics such as active users, completion rate, and override rate show whether the workflow is actually being used. But transformation is only real when business metrics improve, such as cycle time, throughput, conversion, support cost, margin, quality, or compliance outcomes.\n\nThe notes propose a useful operating loop:\n\n1. Pick a strategically important workflow.\n2. Measure the current state.\n3. Build a narrowly scoped AI-enabled intervention.\n4. Validate quality and safety.\n5. Redesign the surrounding workflow, roles, and controls.\n6. Roll out with training and governance.\n7. Measure business impact.\n8. Reinvest in adjacent workflows or deeper process layers.\n\nThis reframes the problem from “Where can we apply AI?” to “Which business system should we redesign with AI at the center?” That distinction is what separates widespread AI activity from real enterprise transformation."
  },

    "id": "2026-05-02-claude-code-session-receipts-with-a-typescript-cli-and-thermal-printer-output",
    "title": "Claude Code session receipts with a TypeScript CLI and thermal printer output",
    "date": "2026-05-02",
    "tags": [
      "typescript",
      "cli",
      "claude-code",
      "escpos",
      "receipts"
    ],
    "source": "https://github.com/chrishutchinson/claude-receipts",
    "content": "## Overview\nThese notes cover **Claude Receipts**, a TypeScript CLI that converts Claude Code sessions into receipt-style summaries showing token usage, model-level breakdowns, session metadata, and total cost. The tool integrates with Claude Code’s `SessionEnd` hook, uses `ccusage` as the source of truth for pricing and token accounting, parses local transcript artifacts for context, and renders output as HTML, terminal text, or ESC/POS thermal printer output.\n\nThis is a useful reference for building polished developer tooling around an existing CLI ecosystem. It demonstrates a clean architecture for command parsing, local configuration, event-hook integration, data fetching via another CLI, transcript parsing, and multi-backend rendering. It is especially relevant if I want to add new output formats, extend receipt fields, or study how modern Node/TypeScript code can interface with older hardware like receipt printers.\n\n## Key Concepts\n- **SessionEnd hook integration**: The tool installs itself into Claude Code by updating `~/.claude/settings.json` and registering a `SessionEnd` hook. That hook runs `claude-receipts generate` automatically at the end of a coding session, making receipt creation feel native and event-driven.\n- **Authoritative usage via `ccusage`**: The project does not estimate costs from transcript text. Instead it shells out to `ccusage session --id <session-id>` to retrieve accurate token and pricing data, reducing duplication and pricing drift.\n- **Transcript metadata parsing**: Session usage comes from `ccusage`, but session context comes from Claude transcript JSONL files. Parsing those files fills in details like session name, timestamps, project path, and message counts.\n- **Multi-target rendering**: A single receipt model is rendered into multiple formats: HTML, terminal-friendly ASCII, and ESC/POS-compatible printer output. This keeps business logic separate from presentation logic.\n- **Config-driven behavior**: Persistent settings live in `~/.claude-receipts.config.json`. CLI flags can override config values at runtime, allowing both automation and ad hoc usage.\n- **Hardware-aware printer support**: Thermal printing targets ESC/POS-compatible devices such as Epson TM-T88V-style printers over USB or raw TCP, requiring low-level formatting and device-aware output handling.\n\n## How It Works\nThe CLI entrypoint is in `src/cli.ts`, exposed through `bin/claude-receipts.js`, with command parsing handled by `commander`. The main subcommands are organized under `src/commands/`:\n\n- `generate.ts` for receipt generation\n- `setup.ts` for installing or removing the Claude Code hook\n- `config.ts` for reading, setting, or resetting persistent configuration\n\nThe `generate` flow is roughly:\n\n1. Resolve runtime options from CLI flags and config via `src/core/config-manager.ts`\n2. Determine which Claude session to process\n3. Fetch authoritative usage and cost data through `src/core/data-fetcher.ts`\n4. Parse the local transcript with `src/core/transcript-parser.ts`\n5. Build a normalized receipt model in `src/core/receipt-generator.ts`\n6. Render the receipt through one or more backends:\n   - HTML via `src/core/html-renderer.ts`\n   - Console output via helpers like `src/utils/ascii-art.ts` and `src/utils/formatting.ts`\n   - Printer output via `src/core/thermal-printer.ts`\n\nA key design decision is that accounting logic stays outside the project. `data-fetcher.ts` calls `ccusage` using `execa`, which avoids re-implementing token pricing rules inside this codebase. Transcript parsing then adds the metadata `ccusage` does not provide, such as human-readable names and local project context. The result is a receipt that is both accurate and informative.\n\nConfiguration is intentionally simple and lives in `~/.claude-receipts.config.json`. Settings include values such as `location`, `timezone`, and `printer`. Resolution follows a clear precedence order: CLI flag first, then config file, then `geoip-lite`, and finally the fallback string `The Cloud`. This is a good CLI UX pattern because behavior is deterministic and easy to reason about.\n\nThe `setup` command modifies Claude’s global settings to register the `SessionEnd` hook. In hook mode, Claude sends session information over stdin, which the tool uses to identify the completed session. The README notes that generated HTML receipts may be auto-opened in the browser, tightening the feedback loop and making the tool feel integrated rather than bolted on.\n\nRendering is where the project becomes a product rather than a raw report generator. HTML receipts are saved under `~/.claude-receipts/projects/`, console rendering provides a lightweight text view, and thermal printing produces narrow-paper layouts for ESC/POS printers. The receipt includes branding touches such as a Claude ASCII logo and a QR code pointing to the repository.\n\nThe repository also includes a separate `worker/` directory, which appears to be an adjacent deployment target rather than part of the local CLI path. Its structure suggests a Cloudflare Worker-style service with routes, validation helpers, rate limiting, and page/API separation. That likely supports hosted rendering or sharing workflows.\n\nA practical mental model for the pipeline is:\n\n```text\nClaude Code SessionEnd\n-> claude-receipts generate\n-> read config\n-> resolve session id\n-> ccusage fetch for costs/tokens\n-> transcript parse for metadata\n-> compose receipt view-model\n-> render: html | console | printer\n```\n\nImplementation details worth remembering:\n\n- Node 22+ is required\n- `fs-extra` is used for filesystem ergonomics\n- `ora`, `chalk`, and `boxen` improve CLI UX\n- `usb` is present for direct printer interaction on supported systems\n\nOverall, this is a strong example of a thin orchestration layer connecting external CLI integration, local file parsing, configuration management, and multiple output adapters."
  },

    "source": "https://www.linkedin.com/posts/akshay-pachaar_microsoft-graphrag-just-got-dethroned-ugcPost-7455594957853085696-8AU1?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via",
    "content": "## Overview\nThese notes summarize the core idea behind FalkorDB’s GraphRAG-SDK: instead of retrieving only semantically similar text chunks, the system converts documents into a knowledge graph and answers questions by traversing relationships between entities, concepts, and evidence. The source claims this approach outperforms both standard vector RAG and Microsoft GraphRAG on GraphRAG-Bench, especially for questions that require connecting multiple facts across documents.\n\nThis is particularly relevant for retrieval-augmented generation systems used in enterprise search, analytics, and QA over complex corpora. When vector RAG struggles with multi-hop reasoning, global questions, or explainable source attribution, graph-based retrieval can provide a more structured and auditable alternative.\n\n## Key Concepts\n- **GraphRAG**: A retrieval-augmented generation pattern where documents are transformed into entities, relationships, and evidence stored as a graph. Retrieval is based on traversing linked facts rather than only embedding similarity.\n- **Knowledge graph extraction**: Raw documents are parsed into nodes and edges representing entities, concepts, and relationships. This creates a structured representation of how facts connect across a corpus.\n- **Multi-hop reasoning**: Some questions require chaining together facts that are never stated in one chunk. Graph traversal is better suited than plain vector retrieval for these reasoning-heavy queries.\n- **Parallel path search**: The source describes GraphRAG-SDK as exploring four graph paths in parallel and merging results. This improves recall by testing multiple relational routes at once.\n- **Two-stage extraction and verification**: A smaller model performs initial extraction, and a stronger LLM verifies or refines results. This reduces cost while preserving quality.\n- **Traceability to source documents**: Answers can be linked back to the graph path and original source text, improving trust, debugging, and compliance.\n\n## How It Works\nAt a high level, the pipeline has four stages: ingest documents, extract a graph, retrieve by graph traversal, and generate an answer with citations.\n\nFirst, documents are parsed into structured facts. In the resulting knowledge graph:\n- nodes represent entities, concepts, or document sections\n- edges represent relationships between them\n- evidence links point back to the source text that justified each fact\n\nThis differs from standard vector RAG, which typically splits documents into chunks, embeds them, and retrieves the top-k nearest chunks. Vector search is good for local semantic similarity, but it can miss answers that require combining facts from multiple distant chunks or documents.\n\nSecond, GraphRAG-SDK appears to use a staged extraction setup for cost control. A smaller model handles initial graph extraction, while a larger model is reserved for verification and answer synthesis. This is a practical production pattern: keep preprocessing cheap, and spend more only where higher confidence matters.\n\nThird, retrieval happens through graph traversal rather than pure similarity ranking. The source highlights a design where four paths are explored in parallel and then merged. Conceptually, the query flow is:\n\n1. Identify entities or concepts mentioned in the user query.\n2. Expand outward through related nodes and edges.\n3. Explore multiple candidate paths in parallel instead of committing to one path early.\n4. Merge overlapping evidence and rank the support set.\n5. Pass retrieved facts and source references to the answering model.\n\nThis is especially useful for multi-hop questions. For example:\n\n```text\nbiomarker -> associated condition -> recommended treatment\n```\n\nA vector retriever may return chunks about each topic separately, but a graph retriever can explicitly follow the reasoning chain. That gives the answering model a more structured basis for synthesis.\n\nFourth, the system returns answers with a trail back to the source documents. In practice, this means generated answers can be grounded in both the extracted graph and the original text spans that produced the graph edges. Benefits include:\n- explainability\n- auditability\n- easier debugging of extraction errors\n- stronger user trust in enterprise settings\n\nThe notes also emphasize modularity. A practical implementation can often swap components independently:\n- document loaders and chunkers\n- extraction model and prompts\n- graph database backend\n- traversal strategy\n- answer generation model\n- citation and verification logic\n\nAn important operational caveat from the LinkedIn comments: although the graph database may run locally, the default extraction and answering path may still rely on hosted LLMs. LiteLLM compatibility suggests model calls can be redirected to OpenAI-compatible self-hosted or private endpoints, which matters for privacy-sensitive deployments.\n\nThe benchmark takeaway is that graph retrieval can outperform both standard vector RAG and other graph-based approaches when the retrieval algorithm effectively exploits relationship structure. The key advantage is not merely storing a graph, but using traversal methods—especially parallel path exploration and evidence merging—that better support complex reasoning."
  },

    "id": "2026-05-01-ai-assisted-markdown-presentations-with-obsidian-and-slidev",
    "title": "AI-Assisted Markdown Presentations with Obsidian and Slidev",
    "date": "2026-05-01",
    "tags": [
      "markdown",
      "slidev",
      "obsidian",
      "ai-tools",
