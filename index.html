    ],
    "source": "https://www.linkedin.com/posts/jukkaniiranen_people-often-ask-me-how-i-build-my-presentations-share-7456019772883820545-bWY0?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\n\nThese notes describe a Markdown-first workflow for building presentations using local text files, Obsidian for editing, Slidev for rendering slides, and AI coding tools for research summarization and file transformation. Instead of treating slide creation as a separate activity in PowerPoint or another GUI tool, the process keeps research notes and final presentation content in the same file-based system.\n\nThis matters because it creates a tighter loop between knowledge capture, synthesis, and output. For people who already work comfortably with Markdown and local files, the approach makes presentations feel more like software artifacts: searchable, reusable, versionable, and easier for AI tools to manipulate with precision.\n\n## Key Concepts\n\n- **Local Markdown knowledge base**: Research, summaries, references, and drafts are stored as local `.md` files instead of being spread across browser tabs, chat logs, and presentation tools. This improves portability, searchability, version control, and reuse.\n- **AI-assisted research**: CLI-oriented AI tools such as Claude Code or Codex can help gather information, summarize documentation, and reshape notes into usable Markdown. Human verification remains necessary for important claims and source fidelity.\n- **Markdown-native slide authoring**: Slidev turns Markdown into presentation decks using frontmatter, slide separators, layout directives, and themes. The deck becomes a structured text file rather than a binary presentation artifact.\n- **Obsidian as a unified workspace**: Obsidian serves as the main interface for reading, linking, editing, and refining both research notes and the final deck. This reduces context switching and supports iterative writing.\n- **AI as a transformation tool**: Instead of asking AI to invent an entire presentation from scratch, the workflow uses AI to edit and improve existing source-grounded files, such as rewriting paragraphs into bullets or adding Slidev syntax.\n- **Integrated research-to-deck pipeline**: Because research and slides are both text, content can move directly from notes into the presentation. This improves traceability and reduces the need to repeatedly repackage context for prompts.\n\n## How It Works\n\nThe workflow begins with research captured as local Markdown files. Notes include facts, summaries, references, and links, all stored in a directory structure that AI tools can inspect directly. This keeps the source material close to the final output and avoids burying key context in transient chat sessions or disconnected apps.\n\nFrom there, the presentation is authored as another Markdown file, usually a Slidev deck with frontmatter and slide delimiters. This keeps the authoring model consistent: research and presentation are just different representations of the same underlying knowledge. Obsidian acts as the workspace for browsing, cross-referencing, and editing both.\n\nA practical benefit of this approach is that AI can operate on explicit files rather than vague prompts. That makes tasks like converting a rough outline into slides, adding a comparison table, rewriting dense text into concise bullets, or applying Slidev-compatible formatting much easier and more controllable. The AI is acting like a copilot for structured text transformation, not a black-box deck generator.\n\nThis setup is especially well suited to technical users, independent consultants, developer advocates, and anyone who prefers text-first workflows. It is less ideal when the environment depends heavily on enterprise coauthoring, formal review workflows, or strict PowerPoint-native compatibility. In those cases, Markdown may still be useful upstream, but extra export or collaboration steps will likely be needed.\n\nThe central idea is simple: if both research and slides live as text, then AI can assist across the full pipeline without repeated copy-paste or prompt reconstruction. The deck becomes a direct transformation of the knowledge base."
  },

    "id": "2026-04-28-beginner-setup-guide-for-karpathys-llm-wiki-and-local-llm-environment",
    "title": "Beginner Setup Guide for Karpathy’s LLM Wiki and Local LLM Environment",
    "date": "2026-04-28",
    "tags": [
      "llm",
      "python",
      "environment-setup",
      "machine-learning",
      "developer-tools"
    ],
    "source": "https://youtu.be/iXd0t60YmMw?si=vy6ERZsADKCK217R",
    "content": "## Overview\n\nThese notes describe a practical beginner setup for studying Karpathy-style LLM material locally. The emphasis is on building a dependable environment for reading, running scripts and notebooks, downloading small models, and experimenting without getting blocked by package conflicts, device issues, or broken installs.\n\nThis matters because LLM workflows are especially sensitive to environment problems: Python version mismatches, CUDA or Apple Silicon compatibility, dependency conflicts, notebook setup, cache management, and hardware limits. A good setup is part of the learning process itself. The goal is not just to install tools once, but to create a reproducible workspace that supports repeated experimentation and gradual progress from tiny models to larger ones.\n\n## Key Concepts\n\n- **Reproducible Python environments**: Use a dedicated virtual environment to isolate dependencies from system Python and other projects. This helps avoid version conflicts between packages like PyTorch, Jupyter, tokenizers, and transformers.\n- **CPU vs GPU execution**: Most beginner experiments can run on CPU, but GPU support changes installation choices and performance expectations. Knowing whether you need CPU-only, CUDA-enabled, or Apple Silicon builds prevents wasted setup effort.\n- **Dependency compatibility**: LLM tooling often depends on tightly coupled versions of PyTorch, CUDA, and tokenizer libraries. Prefer known-good combinations over always installing the newest packages.\n- **Notebook and script workflow**: Notebooks are useful for exploration, while scripts are better for repeatable checks and experiments. A solid setup should support both from the beginning.\n- **Model artifacts and caching**: LLM work requires downloading tokenizers, weights, and datasets that are cached locally. Understanding cache behavior helps with storage, portability, and debugging.\n- **Small-first experimentation**: Start with tiny checkpoints and lightweight tasks to validate the environment quickly. This separates setup issues from model or algorithm issues.\n\n## How It Works\n\nA good beginner setup has four layers:\n\n1. **System tooling**: Python, terminal, package manager, and optionally Git.\n2. **Project isolation**: a virtual environment dedicated to LLM work.\n3. **Core libraries**: PyTorch plus common NLP/ML packages.\n4. **Interactive workflow**: Jupyter, scripts, and model download support.\n\nA reliable process starts with checking the machine:\n\n- Confirm Python version.\n- Determine whether a GPU is available.\n- Choose the correct package path: CPU-only, CUDA, or Apple Silicon.\n- Verify there is enough disk space for environments and cached models.\n\nNext, create an isolated environment. This makes installs safer and lets you recreate or roll back the setup if dependencies break. A minimal package set typically includes:\n\n- `torch`\n- `jupyter` or `ipykernel`\n- `transformers`\n- `tokenizers`\n- `datasets`\n- `numpy`\n- plotting tools such as `matplotlib`\n\nAfter installation, run a **sanity-check loop** rather than jumping straight into a larger model:\n\n- Verify Python runs.\n- Verify imports succeed.\n- Check whether PyTorch sees the expected device.\n- Load a tokenizer.\n- Run a tiny model for one inference pass.\n\nThis staged validation makes failures easier to diagnose. Import errors usually mean dependency issues. Missing GPU detection points to backend or driver problems. Model loading failures often indicate network, cache, or compatibility issues.\n\nA minimal validation script can test the entire chain:\n\n```python\nimport torch\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nprint('torch:', torch.__version__)\nprint('cuda available:', torch.cuda.is_available())\n\nmodel_name = 'sshleifer/tiny-gpt2'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForCausalLM.from_pretrained(model_name)\n\ninputs = tokenizer('Large language models are', return_tensors='pt')\noutputs = model.generate(**inputs, max_new_tokens=20)\nprint(tokenizer.decode(outputs[0], skip_special_tokens=True))\n```\n\nThis verifies package installation, model and tokenizer download, inference, and decoding while keeping memory and runtime requirements low.\n\nThe notes also frame this environment as part of a personal technical wiki. That means the workspace should support both study and execution. A practical directory layout is:\n\n```text\nllm-wiki/\n  notes/\n  notebooks/\n  scripts/\n  env/\n  requirements.txt\n  README.md\n```\n\nThis keeps durable knowledge separate from experiments:\n\n- `notes/` for summaries and explanations\n- `notebooks/` for exploration\n- `scripts/` for repeatable checks\n- `requirements.txt` or `pyproject.toml` for dependency tracking\n\nHardware limitations should shape expectations. On CPU, focus on small models and concepts like tokenization, prompt formatting, and forward-pass mechanics. On GPU, confirm that the GPU is actually being used before trying larger checkpoints. Many beginners install GPU-capable packages but accidentally run on CPU due to mismatched CUDA libraries.\n\nFinally, the setup is only truly useful if it is reproducible. Record exact commands, save dependency versions, and keep a tiny validation script in the repo. That script becomes a known-good baseline whenever you update packages or move to a new machine."
  },

    "id": "2026-04-27-building-a-personal-assistant-with-github-copilot-sdk-and-cli",
    "title": "Building a Personal Assistant with GitHub Copilot SDK and CLI",
    "date": "2026-04-27",
    "tags": [
      "github-copilot",
      "cli",
      "sdk",
      "ai-agents",
      "developer-tools"
    ],
    "source": "https://youtu.be/5TN6l7JGWvs?si=NjdhRQXb45iSfg2s",
    "content": "## Overview\n\nThese notes describe how to build a practical personal engineering assistant using GitHub Copilot CLI and the Copilot SDK. The emphasis is on moving from passive AI assistance toward an orchestrated workflow where a user states intent, the assistant gathers context, optionally uses tools, and returns a reviewable result such as a command suggestion, summary, or next action.\n\nThis approach matters because many software and DevOps workflows already happen in the terminal and around repositories, logs, and build systems. A useful assistant is therefore not just a chatbot; it is a system shaped by prompts, context injection, tool access, and safety guardrails. Understanding that structure helps when designing automations that are more reliable, transparent, and controllable than ad hoc scripts or unconstrained chat interactions.\n\n## Key Concepts\n\n- **Copilot CLI**: Brings AI-assisted interactions into the terminal.\n- **Copilot CLI**: Useful for generating commands, explaining shell usage, and translating natural-language requests into terminal actions.\n- **Copilot CLI**: Fits naturally into workflows like Git operations, diagnostics, test runs, and deployment checks.\n\n- **Copilot SDK**: Provides the programmable layer for custom assistant behavior.\n- **Copilot SDK**: Lets you define prompts, pass context, expose tools, and shape responses.\n- **Copilot SDK**: Enables building specialized assistants instead of relying on a fixed product interface.\n\n- **Personal assistant workflow**: More than chat; it accepts a goal, collects context, uses tools when needed, and returns an actionable output.\n- **Personal assistant workflow**: In engineering, this often combines repository state, docs, logs, shell commands, and user preferences.\n- **Personal assistant workflow**: A good workflow is iterative and grounded in the current environment.\n\n- **Tool-augmented AI**: Extends an LLM with external capabilities like shell commands, file access, Git inspection, APIs, or search.\n- **Tool-augmented AI**: This is what makes the assistant operational rather than purely conversational.\n- **Tool-augmented AI**: Tool access should be constrained and intentionally designed.\n\n- **Context management**: Assistant quality depends heavily on supplied context.\n- **Context management**: Relevant context includes current directory, repository contents, task history, logs, conventions, and branch status.\n- **Context management**: Better context reduces hallucinations and improves relevance.\n\n- **Human-in-the-loop safety**: Users should remain in control of execution.\n- **Human-in-the-loop safety**: Command previews, confirmations, and scoped permissions are key safeguards.\n- **Human-in-the-loop safety**: Especially important when an assistant suggests shell commands or file changes.\n\n## How It Works\n\nThe lesson frames a personal assistant as a three-layer system:\n\n1. **User interaction layer**: the developer expresses intent in natural language from the editor or terminal.\n2. **Assistant orchestration layer**: SDK-backed logic interprets the request, builds prompts, gathers context, and decides whether tools should be used.\n3. **Execution/tool layer**: shell commands, filesystem reads, repository inspection, or API calls produce concrete outputs the assistant can summarize or transform.\n\nA useful mental model is an assistant loop:\n\n- accept a request\n- collect relevant context\n- reason over the request plus context\n- optionally propose actions or commands\n- return a result for user review or execution\n\nIn the Copilot CLI scenario, the terminal is the main control surface. This is powerful because many engineering tasks already live there: Git, builds, tests, setup, diagnostics, and deployment checks. The SDK adds customization so the assistant can be specialized to a repository, workflow, or team convention instead of acting like a generic helper.\n\nA typical request path might look like this:\n\n- user asks: “Create a changelog from commits since the last tag.”\n- assistant applies a role instruction such as “You are a release engineering assistant.”\n- context providers gather Git history, latest tag, branch, and version files\n- tool adapters call Git or read files\n- assistant returns a draft changelog and a safe command suggestion\n\nThe key implementation lesson is separation of concerns. Even a small prototype benefits from splitting responsibilities into modules such as:\n\n- **command interface** for parsing CLI input\n- **assistant service** for prompt building and model interaction\n- **context providers** for Git state, logs, config, docs, and shell state\n- **tool adapters** for shell, Git, file operations, or APIs\n- **output formatter** for plain text, markdown, or command previews\n\nThis structure improves testability and safety. For example, tool adapters can be mocked so tests do not run real commands. It also makes guardrails easier to enforce, such as explicit approval before execution.\n\nThe prototype exercise in the notes follows that philosophy. It asks for a terminal-based assistant that:\n\n- accepts a natural-language task\n- collects local Git context\n- sends the request plus context to an assistant layer\n- prints a command suggestion and explanation\n- requires manual approval before execution\n\nThe example implementation uses:\n- an `assistant_spec.md` file to define system behavior\n- a `context.sh` script to collect working directory, Git status, and recent commits\n- a Python driver script to assemble the prompt and display the next step\n- a manual approval step before any command is executed\n\nThe main design takeaway is that usefulness comes from the surrounding system, not from the model alone. Prompt design, context quality, available tools, and safety boundaries determine whether the assistant is genuinely helpful in day-to-day engineering work."
  },

    "id": "2026-04-27-microsoft-agent-platform-landscape-copilot-foundry-studio-and-agent-365",
    "title": "Microsoft Agent Platform Landscape: Copilot, Foundry, Studio, and Agent 365",
    "date": "2026-04-27",
    "tags": [
      "microsoft",
      "ai-agents",
      "copilot",
      "governance",
      "architecture"
    ],
    "source": "https://microsoft.github.io/agent-resources/",
    "content": "## Overview\n\nThese notes summarize a top-level map of Microsoft’s AI agent ecosystem, focusing on how different product areas fit distinct parts of the agent lifecycle. Rather than presenting one unified platform, Microsoft separates concerns across Microsoft 365 Copilot, Copilot Studio, Microsoft Foundry, code-first agent development paths, and Agent 365 governance.\n\nThis matters because platform selection is itself an architectural decision. For teams moving from experimentation to production, the key question is not just how to build an agent, but where it should live, who should own it, how much technical control is needed, and how governance will be handled at scale.\n\n## Key Concepts\n\n- **Platform segmentation**: Microsoft positions agent development as a set of connected but specialized platforms. Each targets a different lifecycle stage or builder persona, such as business users, low-code builders, pro developers, ML engineers, and IT or governance teams.\n- **Microsoft 365 Copilot as adoption surface**: Best suited when the agent experience is embedded in Microsoft 365 and tied to employee productivity, enterprise content, and existing workplace workflows.\n- **Copilot Studio for low-code agent creation**: A faster path for creating and launching business-facing agents with a more packaged builder experience and less need for custom code.\n- **Microsoft Foundry for model and agent engineering**: A stronger fit when teams need deeper control over model choice, evaluation, deployment, and AI engineering practices.\n- **Code-first agent development**: The path for teams that need direct programmability, SDK-level control, custom integrations, orchestration, and support for open protocols or broader ecosystem tooling.\n- **Enterprise agent governance with Agent 365**: Once many agents exist, governance becomes its own discipline, covering visibility, policy, lifecycle management, oversight, and centralized control.\n\n## How It Works\n\nThe source acts as a navigation hub for Microsoft’s agent ecosystem. Its value is in helping teams choose the right platform based on four practical dimensions:\n\n- who is building the solution\n- what kind of agent is being built\n- where the experience will run\n- how the agent will be governed\n\nA useful interpretation is to map each platform to a different layer of enterprise agent delivery:\n\n- **Experience layer**: Microsoft 365 Copilot, where users consume AI assistance in familiar productivity tools.\n- **Builder layer**: Copilot Studio, where teams assemble and customize agents with a low-code experience.\n- **Model/runtime layer**: Microsoft Foundry, where models and AI systems are evaluated, deployed, and engineered more formally.\n- **Code/integration layer**: Agent Development paths using SDKs, frameworks, and protocols for custom implementations.\n- **Governance layer**: Agent 365, where organizations manage an agent fleet with policy, inventory, lifecycle, and operational oversight.\n\nFrom a decision-making perspective, each platform aligns with a different project shape:\n\n1. **Microsoft 365 Copilot**  \n   Start here when the main goal is productivity inside Microsoft 365. Typical owners include IT admins, workplace platform owners, and architects focused on organizational adoption.\n\n2. **Copilot Studio**  \n   Use this when a business team needs to create or customize an agent quickly in a structured environment, often without building everything in code.\n\n3. **Microsoft Foundry**  \n   Use this when the work requires model evaluation, deployment workflows, deeper technical control, and production-style AI engineering practices.\n\n4. **Agent Development**  \n   Choose this when you need full programmability, external tool integration, protocol-level interoperability, or custom orchestration.\n\n5. **Agent 365**  \n   Use this when the organization already has multiple agents and now needs enterprise-wide governance, control, and visibility.\n\n6. **Agent Platform Advisor**  \n   Use this as a decision aid when requirements are still ambiguous and the right platform is unclear.\n\nThe broader lesson is architectural: Microsoft is separating the agent lifecycle into distinct domains so teams can choose tooling that matches their delivery model and maturity level. Not every project should begin in the same product, and many real solutions may span more than one layer."
  },

    "id": "2026-04-26-power-apps-code-apps-plugin-for-ai-assisted-development",
    "title": "Power Apps Code Apps Plugin for AI-Assisted Development",
    "date": "2026-04-26",
    "tags": [
      "powerapps",

    "source": "https://www.linkedin.com/posts/joshgiles94_code-apps-plugin-ugcPost-7452313816698195970-NWvp?utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_source=social_share_send&utm_campaign=share_via",
    "content": "## Overview\n\nThese notes explain the idea behind the Power Apps code apps plugin as a structured interface for AI-assisted app development. The central theme is that AI becomes more reliable when it works through explicit tools and commands instead of vague prompts alone. In this model, the plugin packages the logic, commands, and project context needed to create or manage Power Apps code apps with less ambiguity.\n\nThis matters for engineers, architects, and advanced Power Platform builders because it suggests a practical pattern for operationalizing AI in app delivery. Rather than treating the assistant like a generic chatbot, the plugin gives the agent a bounded capability surface, improving repeatability, reducing setup friction, and making governance, documentation, and team adoption easier.\n\n## Key Concepts\n\n- **Code apps**: App-building workflows in Power Apps that are more developer-oriented than pure drag-and-drop authoring. The focus is on code, structured artifacts, and tooling for more precise and automatable app changes.\n- **Plugin as agent interface**: A plugin gives the AI a defined way to interact with Power Apps. This reduces guessing and makes app creation or modification more predictable.\n- **Packaged app logic**: The plugin acts as the “brains” for the AI agent by bundling instructions, commands, and project context into a reusable integration surface.\n- **Command-driven workflows**: A bounded command set, such as the referenced “13 commands,” constrains the agent to supported actions and makes the workflow easier to document, test, and debug.\n- **Reducing prompt ambiguity**: Explicit operations, expected inputs, and known defaults help the user reach working outputs with fewer prompt iterations.\n- **General availability vs experimental tooling**: The notes suggest movement from experimental AI app-building experiences toward more stable, production-usable tooling suitable for enterprise workflows.\n\n## How It Works\n\nThe source material is a social post, so the mechanics are partly inferred. The likely pattern is that the Power Apps code apps plugin provides a structured capability layer between an AI agent and the Power Apps code app environment. Instead of the user manually describing every setup step, file structure, and operation, the plugin exposes supported actions that the agent can call.\n\nA likely workflow looks like this:\n\n1. A developer uses an AI environment that supports plugins, tools, or skills.\n2. The Power Apps code apps plugin is connected to that environment.\n3. The plugin exposes specific operations for creating, inspecting, modifying, validating, packaging, or publishing app assets.\n4. The user provides a high-level request, such as creating an app from requirements or updating a screen’s data experience.\n5. The AI maps that request to the plugin’s supported commands.\n6. The plugin performs those operations against the Power Apps code app environment and returns structured results.\n\nThis is important because tool-using agents are generally more dependable than text-only agents for engineering tasks. In a prompt-only workflow, the AI has to improvise many implementation details, including file layout, supported operations, platform conventions, and validation steps. A plugin moves that knowledge into the tool boundary, where it can be standardized and reused.\n\nA useful mental model is:\n\n- The **agent** handles reasoning, planning, and intent interpretation.\n- The **plugin** exposes approved capabilities and translates requests into platform operations.\n- The **code app platform** is the execution target where assets are created or updated.\n\nThe notes also highlight a distinction between broad agent instructions and reusable skills/plugins. Instructions shape behavior at a high level, while plugins represent concrete, repeatable capabilities tied to real operations. For engineering workflows, this separation is useful because it keeps the “what” with the agent and the “how” in the tool.\n\nThe mention of “all 13 commands” strongly implies a bounded command surface. That is a strong design choice because it:\n\n- improves discoverability\n- reduces accidental misuse\n- makes the system easier to document\n- gives the AI clear affordances\n- supports testing and governance\n\nA hypothetical command set might include operations such as:\n\n```text\ncreate-app\nopen-project\nlist-screens\nadd-component\nbind-datasource\ngenerate-form\nupdate-theme\nvalidate-app\npackage-app\npublish-app\n```\n\nEven if those exact commands are only illustrative, the pattern is the key takeaway: AI reliability improves when app work is routed through explicit operations rather than free-form generation.\n\nFrom an enterprise Power Platform perspective, this plugin model also better supports governance. Teams can standardize on one capability surface, train users on approved commands, and potentially audit how AI interacted with the platform. That makes AI-assisted low-code development feel more like disciplined engineering and less like informal experimentation.\n\nThe training exercise in the notes reinforces this practical framing. A good evaluation approach is to define user intents, map them to required plugin actions, identify failure modes in prompt-only workflows, and decide when plugin-based assistance is the right choice. This is a useful adoption checklist for assessing whether a plugin reduces enough ambiguity to enable safe, consistent use."
  },

    "source": "https://www.linkedin.com/posts/powerappstools_pick-a-date-range-in-power-apps-without-activity-7450635629643759621-RK6Y?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\n\nThese notes describe how to build a custom date range picker in a Power Apps Canvas App using standard UI building blocks like galleries, labels, icons, variables, and conditional formatting. The design focuses on a better user experience than separate start/end date inputs by showing two months side by side, visually highlighting the selected range, and supporting navigation across day, month, and year views.\n\nThis pattern matters for business apps where users frequently filter data, choose booking windows, submit leave requests, or work with reporting periods. A well-implemented range picker reduces user mistakes, keeps date selections valid through auto-swap logic, and makes the interaction feel closer to a modern app component even within low-code constraints.\n\n## Key Concepts\n\n- **Dual-calendar range selection**: Two visible month panels let users pick ranges that span adjacent months without repeated navigation. This is especially useful for common business scenarios like monthly reporting and scheduling.\n- **Range highlighting**: Dates between the selected start and end values are visually filled so users can quickly confirm the intended interval.\n- **Auto-swap date logic**: If a second selected date is earlier than the first, the component swaps them automatically to preserve a valid chronological range.\n- **Multi-level calendar views**: Day, month, and year views allow faster navigation across large time spans before returning to exact date selection.\n- **Explicit confirmation and reset actions**: Okay preserves the current selection and closes the picker; Cancel clears dates, resets the view mode, and closes the popup.\n- **Composable Canvas App UX**: The picker demonstrates how richer controls can be assembled from native Canvas App primitives rather than relying on a single built-in control.\n\n## How It Works\n\nA custom date range picker in Canvas Apps is best treated as a small state machine. Instead of one native control, the experience is driven by a set of variables that track selected dates, the currently displayed months, the active view level, and whether the popup is open.\n\nTypical state variables include:\n\n- `varStartDate`\n- `varEndDate`\n- `varLeftMonth`\n- derived right month as `DateAdd(varLeftMonth, 1, Months)`\n- `varViewMode`\n- `varIsOpen`\n\nThe day-selection flow usually works like this:\n\n1. If no start date exists, the clicked date becomes the start.\n2. If a start date exists but no end date exists, the clicked date becomes the end.\n3. If the second clicked date is earlier than the start, the two are swapped automatically.\n4. If both dates already exist, a new click restarts the selection by setting a fresh start date and clearing the end date.\n\nThis creates a forgiving interaction model: users can explore dates without having to manually correct invalid ordering.\n\nVisual feedback is handled through conditional formatting. Each day cell checks whether it is:\n- the start date,\n- the end date, or\n- inside the interval.\n\nStart/end dates usually get a stronger accent color, while dates between them get a lighter fill. This makes the selected range immediately legible, which is a major improvement over two disconnected date fields.\n\nThe dual-calendar layout improves usability because users can view adjacent months at once. Navigation buttons only need to shift the left anchor month, while the right calendar is calculated from it. This keeps both calendars synchronized and simplifies implementation.\n\nThe month and year views act as acceleration layers. Instead of clicking previous/next month repeatedly, users can switch to a higher-level gallery, jump to a target month or year, and then return to day view. In practice, this is usually implemented by showing and hiding different galleries depending on `varViewMode`.\n\nThe action buttons define the UX contract clearly:\n- **Okay** closes the picker and keeps the current dates.\n- **Cancel** clears `varStartDate`, `varEndDate`, resets `varViewMode` to `\"Day\"`, and closes the control.\n\nThis approach is a strong example of how Power Fx formulas and Canvas App controls can be combined to build reusable, polished components for filtering, scheduling, booking, and date-driven workflows."
  },

    "id": "2026-04-23-beginner-setup-guide-for-karpathys-llm-wiki-learning-environment",
    "title": "Beginner Setup Guide for Karpathy's LLM Wiki Learning Environment",
    "date": "2026-04-23",
    "tags": [
      "llm",
      "python",
      "pytorch",
      "setup",
      "environment"
    ],
    "source": "https://youtu.be/iXd0t60YmMw?si=MLJtmH9k5GAFAiE5",
    "content": "## Overview\n\nThese notes outline a practical beginner setup for studying large language models through Karpathy-style educational material. The focus is not just on installing tools, but on creating a clean, repeatable environment for running notebooks, experimenting with PyTorch code, organizing datasets, and verifying that CPU or GPU execution works correctly from the start.\n\nThis matters because many beginners get stuck on environment issues before they ever reach core LLM concepts like tokenization, next-token prediction, or transformer blocks. A simple but well-structured local setup makes it easier to follow tutorials, reproduce examples, debug problems, and gradually move from toy neural networks to small language models.\n\n## Key Concepts\n\n- **Isolated Python environments**: Use `venv` or conda to avoid package conflicts and keep experiments reproducible. This makes it safe to install and upgrade LLM-related packages without affecting other projects.\n- **PyTorch as the core framework**: Most Karpathy-style LLM tutorials use PyTorch for tensors, autograd, and neural network layers. A working install is the main prerequisite for running examples.\n- **CPU vs GPU execution**: Small experiments can run on CPU, but GPU support dramatically improves training speed. Early device checks help confirm whether CUDA or MPS acceleration is available.\n- **Tokenizer and dataset plumbing**: Language models train on token IDs, not raw text. Even simple projects need a pipeline for reading text, building vocabularies or tokenizers, and converting data into tensors.\n- **Notebook-first, script-backed workflow**: Notebooks are useful for exploration and debugging, while scripts are better for repeatable training runs. A good learning setup supports both.\n- **Verification and reproducibility**: Installation is only the first step. You should verify imports, package versions, hardware access, and a minimal forward/backward pass to ensure the environment actually works.\n\n## How It Works\n\nA practical LLM study environment is usually built in layers.\n\nFirst, prepare the base system with a recent Python version, `git`, and a package manager such as `pip`. If using an NVIDIA GPU, confirm drivers are installed before dealing with Python dependencies. Then create an isolated environment so the setup is disposable and project-specific:\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate   # macOS/Linux\n# .venv\\Scripts\\activate    # Windows PowerShell\npython -m pip install --upgrade pip\n```\n\nNext, install the core packages. For a beginner workflow, this usually means PyTorch plus notebook and utility packages:\n\n```bash\npip install torch torchvision torchaudio\npip install jupyter matplotlib tqdm numpy\n```\n\nAfter installation, verify the runtime before doing anything more complicated. This confirms imports work and that hardware is visible:\n\n```bash\npython -c \"import torch; print(torch.__version__); print(torch.cuda.is_available())\"\n```\n\nOn Apple Silicon, check MPS support instead:\n\n```bash\npython -c \"import torch; print(torch.backends.mps.is_available())\"\n```\n\nOnce the runtime is healthy, organize the project directory so learning materials stay manageable. A simple structure such as the following supports both experiments and reusable code:\n\n```text\nllm-wiki-lab/\n├── .venv/\n├── data/\n├── notebooks/\n├── outputs/\n├── src/\n└── requirements.txt\n```\n\nThe most important validation step is a minimal end-to-end training loop. A tiny neural network trained on random data proves that tensors, autograd, optimizers, and device placement all work together:\n\n```python\nimport torch\nimport torch.nn as nn\n\ndevice = \"cuda\" if torch.cuda.is_available() else \"cpu\"\nx = torch.randn(64, 32).to(device)\ny = torch.randint(0, 10, (64,)).to(device)\n\nmodel = nn.Sequential(\n    nn.Linear(32, 64),\n    nn.ReLU(),\n    nn.Linear(64, 10)\n).to(device)\n\nopt = torch.optim.AdamW(model.parameters(), lr=1e-3)\nloss_fn = nn.CrossEntropyLoss()\n\nfor step in range(10):\n    logits = model(x)\n    loss = loss_fn(logits, y)\n    opt.zero_grad()\n    loss.backward()\n    opt.step()\n    print(step, float(loss))\n```\n\nFrom there, the workflow shifts toward language-model-specific tasks: loading text files, tokenizing them into integer IDs, building fixed-length context windows, training a small next-token model, and sampling outputs. This progression is useful because it keeps the setup grounded in fundamentals rather than hiding everything behind large pretrained-model APIs.\n\nGood reproducibility habits should be part of the environment from the beginning. Freeze dependencies with `pip freeze > requirements.txt`, keep data paths relative to the project root, separate exploratory notebooks by topic, and save checkpoints or generated text to `outputs/`. It is also helpful to record whether an experiment ran on CPU, CUDA, or MPS so performance expectations stay realistic.\n\nThe notes also include a concrete exercise: create a workspace, install tools, add an environment check script, run a tiny training script, then extend the lab into a text-based mini language model project. That sequence is a strong beginner path because it proves the environment works before introducing tokenization and model-building complexity."
  },

    "id": "2026-04-23-getting-started-with-github-copilot-cli-for-terminal-workflows",
    "title": "Getting Started with GitHub Copilot CLI for Terminal Workflows",
    "date": "2026-04-23",
    "tags": [
      "github-copilot",
      "cli",
      "terminal",
      "shell",
      "developer-tools"
    ],
    "source": "https://youtu.be/fgHk28xljYw?si=D4JI59L025adroyr",
    "content": "## Overview\n\nThese notes cover how GitHub Copilot CLI brings AI-assisted help directly into terminal workflows. The focus is on using natural language to generate shell commands, explain existing commands, and reduce context switching for engineers who spend much of their day in the command line.\n\nThis matters because terminal work often includes high-impact tasks such as Git operations, file manipulation, search, build tooling, and environment management. Copilot CLI can speed up command discovery and learning, but it must be used with careful review since generated commands may be risky, incorrect, or environment-specific.\n\n## Key Concepts\n\n- **Terminal-native AI assistance**: Copilot CLI is meant to work inside the shell rather than pulling you into a separate chat or IDE workflow. This helps reduce context switching during command-line tasks.\n- **Prompt-to-command generation**: You can describe a task in plain English and receive a shell command or pipeline suggestion. This is useful for remembering syntax, flags, or command combinations.\n- **Command explanation**: Copilot CLI can break down existing commands and explain flags, arguments, and pipeline behavior. This helps with learning and understanding unfamiliar shell usage.\n- **Human-in-the-loop execution**: Generated commands should be treated as drafts, not trusted automation. The engineer is responsible for reviewing, editing, and deciding whether to run them.\n- **Shell integration**: Good shell integration makes AI suggestions easier to insert, modify, and rerun within normal terminal workflows. The tool is most useful when it feels like an extension of the shell.\n- **Safety and verification**: Terminal commands can delete files, change repositories, or affect infrastructure. Always verify paths, flags, assumptions, permissions, and platform compatibility before execution.\n\n## How It Works\n\nGitHub Copilot CLI acts as an interface between natural-language intent and shell-oriented output. You describe what you want to do, and it returns either a candidate command or an explanation of an existing one. The value is not full automation, but faster iteration and better in-context learning.\n\nA typical workflow looks like this:\n\n1. You express an intent in natural language.\n   - Example: “Find all large files in this repo”\n   - Example: “Explain this grep command”\n   - Example: “Create a tar archive excluding node_modules”\n\n2. Copilot CLI interprets the request.\n   - For action-oriented prompts, it usually returns a shell command or short pipeline.\n   - For explanation-oriented prompts, it describes the command structure, flags, and behavior.\n\n3. You review the output before running anything.\n   - Check whether paths are correct.\n   - Confirm recursive behavior and scope.\n   - Look for quoting issues, destructive actions, and platform-specific syntax.\n   - Make sure required tools exist in the current environment.\n\n4. You run, inspect, and refine.\n   - If the suggestion is close but imperfect, edit it directly in the shell.\n   - This is where Copilot CLI is most useful: it accelerates the first draft, while human judgment improves correctness and safety.\n\nA helpful mental model is that Copilot CLI supports two primary modes:\n\n- **Do mode**: turn intent into a command.\n- **Explain mode**: turn a command back into human understanding.\n\nThis dual use makes it useful for both experienced and newer engineers. Experienced users gain speed on rarely used syntax and flags, while newer users gain contextual shell learning without leaving the terminal.\n\nCommon high-value use cases include:\n\n- Git operations\n- File and directory management\n- Search and text processing\n- Archive and compression tasks\n- Environment inspection\n- Build and test command recall\n\nExample generated command:\n\n```bash\n# Natural language intent\n\"show me the 10 largest files under the current directory\"\n\n# Candidate output you might receive\nfind . -type f -exec du -h {} + | sort -hr | head -n 10\n```\n\nThis should still be validated. Questions to ask include:\n\n- Does `du` behave the same way on this platform?\n- Is the current directory the intended scope?\n- Will hidden folders, generated files, or mounted volumes affect the output?\n\nFor explanation mode, consider:\n\n```bash\ngrep -Rin --exclude-dir=node_modules \"TODO\" .\n```\n\nA useful explanation would include:\n\n- `grep` searches text\n- `-R` searches recursively\n- `-i` ignores case\n- `-n` shows line numbers\n- `--exclude-dir=node_modules` skips that directory\n- `\"TODO\"` is the search pattern\n- `.` means start searching in the current directory\n\nThe main practical takeaway is that Copilot CLI improves terminal productivity, but it does not replace shell knowledge. Understanding quoting, pipes, redirection, command semantics, and platform differences remains essential for safe and effective use.\n\nThe training exercise in these notes is especially useful because it encourages hands-on practice in a safe workspace. It reinforces a strong habit: use Copilot CLI to accelerate thinking and command discovery, but always validate output manually before execution."
  },

    "id": "2026-04-22-building-a-personal-developer-assistant-with-copilot-sdk-and-cli",
    "title": "Building a Personal Developer Assistant with Copilot SDK and CLI",
    "date": "2026-04-22",
    "tags": [
      "github-copilot",
      "cli",
      "sdk",
      "ai-assistants",
      "developer-tools"
    ],
    "source": "https://youtu.be/5TN6l7JGWvs?si=dIIKtCcZOyQeMb8I",
    "content": "## Overview\n\nThese notes cover how to think about building a personal developer assistant using GitHub Copilot’s SDK and command-line tooling. The central idea is to move beyond passive inline suggestions and create a programmable assistant that can help with concrete engineering tasks such as explaining diffs, drafting commit messages, suggesting shell commands, and interpreting logs.\n\nThis matters because the most useful AI tooling in development is often not generic chat, but workflow-specific assistance tied to your terminal, repository state, scripts, and safety rules. A well-designed assistant can translate natural language into structured, actionable help while preserving developer control through confirmation steps, constrained prompts, and explicit risk handling.\n\n## Key Concepts\n\n- **Copilot as a programmable assistant**: GitHub Copilot can be treated as an API-driven capability, not just an editor autocomplete tool. With the SDK model, you can define reusable behaviors for recurring tasks. This makes the assistant more consistent and aligned with your workflow.\n- **CLI-first workflows**: The terminal is a natural interface for developers because it already hosts git, build tools, test runners, and deployment commands. A Copilot-enabled CLI keeps AI assistance in the same environment where work happens. This reduces context switching and makes outputs easier to integrate into scripts.\n- **Task specialization**: A personal assistant is most valuable when scoped to a few reliable jobs. Examples include commit-message drafting, repo explanation, shell command generation, and failure analysis. Narrow, repeatable tasks usually outperform broad chatbot behavior.\n- **Prompt and context design**: Assistant quality depends on the context gathered and the instructions used. Useful context can include working directory, staged diffs, logs, file contents, or project metadata. Prompts should specify role, task, output format, and safety constraints.\n- **Human-in-the-loop safety**: Any assistant that proposes commands must clearly separate suggestion from execution. Destructive actions should require warnings and explicit confirmation. The user should always see what the assistant plans to do before anything runs.\n- **Composable automation**: The best pattern is to combine AI with existing scripts and tools rather than replacing them. The assistant interprets intent, selects likely commands or workflows, and returns structured output that downstream tooling can validate or execute. This keeps the system practical and inspectable.\n\n## How It Works\n\nA personal assistant built around Copilot SDK ideas and a CLI interface usually has three layers:\n\n1. **Input layer**: the user enters a natural-language request from the terminal.\n2. **Reasoning layer**: the assistant combines the request with local context and generates a response, plan, or command suggestion.\n3. **Execution layer**: the result is displayed, optionally serialized as JSON, and only executed after confirmation if needed.\n\nIn practice, the CLI wrapper is often simple. It maps commands like `explain-diff`, `draft-commit`, or `suggest-command` to context-gathering logic. For example:\n\n- `explain-diff` can collect `git diff --staged`\n- `draft-commit` can collect `git diff --staged --stat`\n- `suggest-command` can collect the current working directory and the user’s request\n\nThat context is then inserted into a prompt template that defines the assistant’s role and output contract. A strong prompt for terminal use should include:\n\n- the assistant role\n- the requested task\n- relevant repository or file context\n- required output structure\n- safety rules and risk classification\n\nA key design pattern is to require **structured output**, such as JSON with fields like `summary`, `suggested_command`, `risk_level`, and `safety_notes`. Structured responses are easier to validate, log, and feed into scripts. They also make the assistant more predictable than free-form prose.\n\nSafety is especially important for shell-oriented assistants. Commands involving deletion, force-pushes, resets, installs, or system changes should never run automatically. A safe interaction flow is:\n\n1. Generate the command.\n2. Explain what it does.\n3. Classify risk.\n4. Ask `Run it? [y/N]`\n5. Execute only after explicit approval.\n\nThe notes also emphasize that the assistant should be **repo-aware** where possible. Pulling in `README.md`, `package.json`, `Makefile`, test logs, build output, and git metadata makes the assistant much more useful than a generic model call. The goal is not universal intelligence, but dependable help in your actual environment.\n\nA practical implementation path is to start with a minimal script in Python or Node.js that gathers shell context, builds a prompt, sends it to a Copilot-compatible or other LLM backend, and prints a safe, structured response. From there, iterate by testing against real tasks and improving task-specific prompts."
  },
  {
    "id": "2026-04-22-making-semantic-models-ai-ready-for-copilot-and-llm-analytics",
    "title": "Making Semantic Models AI-Ready for Copilot and LLM Analytics",
    "date": "2026-04-22",
    "tags": [
      "semantic-models",
      "power-bi",
      "llm",
      "dax",
      "copilot",
      "fabric"
    ],
    "source": "https://tabulareditor.com/blog/ai-readiness-and-best-practices-for-semantic-models-a-comprehensive-guide",
    "content": "## Overview\n\nThese notes summarize how to prepare a Power BI or Fabric semantic model so LLM-powered tools such as Copilot, data agents, and coding assistants can query it accurately. The main idea is that good AI output depends not just on prompts, but on the quality of the underlying model: its structure, naming, metadata, examples, and explicit business logic.\n\nThis matters because AI systems magnify both good and bad modeling practices. A clean star schema, explicit measures, concise descriptions, and carefully chosen instructions help both humans and machines reason correctly. Ambiguous names, hidden business definitions, noisy schemas, and implicit calculations increase the risk of hallucinations, wrong metric selection, and wasted context.\n\n## Key Concepts\n\n- **AI readiness as context engineering**: LLM performance depends on the prompt plus all visible schema, metadata, instructions, and examples. Preparing a semantic model for AI means making the right information explicit while minimizing noise.\n- **Structural foundation first**: AI cannot fix broken relationships, incorrect DAX, poor data quality, or weak security. Classic BI discipline remains the prerequisite for trustworthy AI-assisted analytics.\n- **Star schema and explicit modeling**: Star schemas are easier for both humans and LLMs to interpret. Important metrics should be defined as explicit semantic model measures rather than relying on implicit or report-scoped logic.\n- **Finite context budget**: More documentation is not always better. Concise, targeted metadata usually works better than verbose or redundant descriptions that create “context rot.”\n- **Annotations as behavior guidance**: Descriptions, synonyms, AI instructions, inline comments, and external links can encode business meaning, edge cases, and preferred behaviors that structure alone cannot express.\n- **Grounding anchors and examples**: Known-correct values, business rules, and canonical examples help agents validate outputs and follow approved modeling patterns instead of inventing logic.\n\n## How It Works\n\nThe lesson frames AI readiness as a progression from standard semantic-model quality to AI-specific context design.\n\nStart with actual user needs before enabling Copilot or data agents. Identify who will use natural-language access, what questions they ask, and whether the semantic model already contains the approved measures needed to answer those questions. Without this step, AI may generate plausible but nonstandard DAX for concepts that should have been explicitly modeled.\n\nNext, confirm the model is fundamentally sound. Trustworthy source data, correct relationships, strong DAX, acceptable performance, and correct security are non-negotiable. If business logic exists only in analysts’ heads or report-specific workarounds, AI has no dependable basis for reasoning.\n\nThen reduce schema noise. Every unnecessary table, column, duplicated attribute, and legacy measure increases the chance an LLM chooses the wrong object. Useful cleanup actions include hiding or removing foreign keys in fact tables, avoiding duplicated descriptive fields, trimming unused history, disabling Auto Date/Time, using proper date tables, storing numerics as numeric types, and limiting unnecessary MDX exposure. This improves both model efficiency and AI navigation.\n\nAfter the basics, add AI-specific context through four levers:\n\n1. **Structure**  \n   Use clear business naming, expose explicit measures, hide fields users should never reference directly, and prefer star-schema layouts. Explicit semantic-model measures are especially important because implicit measures and report-scoped measures are unreliable for many AI consumers.\n\n2. **Annotations and documentation**  \n   Add concise descriptions where ambiguity exists, not everywhere. Use AI instructions for organization-specific rules such as defaulting “margin” to a specific approved metric or requiring agents to prefer existing measures over ad hoc DAX. Synonyms should reflect actual business language, and external links may be better than copying long documentation into the model. Avoid low-value autogenerated descriptions that add no new meaning.\n\n3. **Grounding anchors**  \n   Give agents checkpoints: known totals, directional constraints, edge-case rules, and verified answers for fragile query types. These act as truth references that help detect drift before an incorrect intermediate result compounds into a worse answer.\n\n4. **Examples**  \n   Provide canonical measures, approved prompt-to-query pairs, and standard DAX patterns. Examples teach both syntax and conventions, such as the required `EVALUATE` structure in DAX queries or the preferred `VAR/RETURN` style for time intelligence.\n\nA practical takeaway is that AI readiness is mostly strong semantic-model hygiene plus careful context design. Humans can often compensate for ambiguity with experience; LLMs generally cannot. The more institutional knowledge is encoded clearly in the model, the more reliable AI-assisted analysis becomes.\n\nThe training exercise in the notes turns this into a repeatable review process: inventory objects, remove noise, convert one metric to an explicit measure, improve naming and descriptions, add a short AI instruction block, define grounding anchors, and test with natural-language prompts. This is a useful checklist before exposing any semantic model to Copilot or agent-driven querying."
  },

    "id": "2026-04-19-using-github-copilot-cli-with-ollama-via-openai-compatible-api",
    "title": "Using GitHub Copilot CLI with Ollama via OpenAI-Compatible API",
    "date": "2026-04-19",
    "tags": [
      "ollama",
      "copilot-cli",
      "openai-api",
      "terminal-ai",
      "developer-tools"
    ],
    "source": "https://docs.ollama.com/integrations/copilot-cli",
    "content": "## Overview\n\nThese notes explain how to configure GitHub Copilot CLI to use Ollama as the model backend through Ollama’s OpenAI-compatible API. The key idea is that Copilot CLI can send requests to a provider exposing an OpenAI-style interface, and Ollama serves that interface locally at `http://localhost:11434/v1`. This makes it possible to keep the Copilot CLI workflow while choosing local or Ollama-hosted models.\n\nThis setup is useful for developers who want more control over model selection, prefer local-first workflows, or need repeatable terminal-based AI behavior in scripts, Docker, or CI/CD. It is especially relevant for repository-level reasoning tasks, where larger context windows and coding-capable models matter.\n\n## Key Concepts\n\n- **Copilot CLI**: GitHub Copilot CLI is a terminal coding agent that can inspect repositories, answer codebase questions, suggest edits, and run commands. It supports both interactive shell use and non-interactive automation.\n- **Ollama as a provider**: Ollama acts as the backend model server, exposing local and some cloud models through a single interface that Copilot CLI can call.\n- **OpenAI-compatible API**: The integration depends on Ollama exposing an OpenAI-style endpoint at `http://localhost:11434/v1`, which matches the request format Copilot CLI expects.\n- **Wire API selection**: `COPILOT_PROVIDER_WIRE_API=responses` tells Copilot CLI which API semantics to use when talking to Ollama.\n- **Headless mode**: Headless execution lets Copilot CLI run without interactive prompts, which is helpful for scripts and CI. In this mode, `--yes` skips selection prompts and `--model` must be set explicitly.\n- **Context window requirements**: Copilot CLI often needs to read large portions of a repository and prior conversation history, so models with at least a 64k token context window are recommended.\n\n## How It Works\n\nAt a high level, Copilot CLI remains the terminal interface while Ollama becomes the LLM serving layer. Instead of talking to a default hosted provider, Copilot CLI is redirected to Ollama’s local OpenAI-compatible API.\n\nThere are two main ways to launch it:\n\n1. **Quick launcher via Ollama**\n   ```bash\n   ollama launch copilot\n   ```\n\n   Or with an explicit model:\n\n   ```bash\n   ollama launch copilot --model kimi-k2.5:cloud\n   ```\n\n   This is the simplest approach because Ollama handles the provider configuration automatically.\n\n2. **Manual configuration via environment variables**\n   ```bash\n   export COPILOT_PROVIDER_BASE_URL=http://localhost:11434/v1\n   export COPILOT_PROVIDER_API_KEY=\n   export COPILOT_PROVIDER_WIRE_API=responses\n   export COPILOT_MODEL=qwen3.5\n   copilot\n   ```\n\n   You can also run this inline for one-off commands:\n\n   ```bash\n   COPILOT_PROVIDER_BASE_URL=http://localhost:11434/v1 \\\n   COPILOT_PROVIDER_API_KEY= \\\n   COPILOT_PROVIDER_WIRE_API=responses \\\n   COPILOT_MODEL=glm-5:cloud \\\n   copilot\n   ```\n\nThe environment variables do the following:\n\n- `COPILOT_PROVIDER_BASE_URL`: points Copilot CLI to the Ollama API endpoint.\n- `COPILOT_PROVIDER_API_KEY`: typically left empty for a local Ollama instance.\n- `COPILOT_PROVIDER_WIRE_API=responses`: ensures compatible request/response behavior.\n- `COPILOT_MODEL`: selects the model, such as `qwen3.5` or `glm-5:cloud`.\n\nFor automation, headless mode is the important pattern:\n\n```bash\nollama launch copilot --model kimi-k2.5:cloud --yes -- -p \"how does this repository work?\"\n```\n\nHow that command is interpreted:\n\n1. `ollama launch copilot` starts the Copilot CLI integration.\n2. `--model kimi-k2.5:cloud` selects the backend model.\n3. `--yes` disables interactive confirmation and allows model pull behavior.\n4. `--` separates Ollama launcher arguments from native Copilot CLI arguments.\n5. `-p \"...\"` passes a prompt directly to Copilot CLI.\n\nThis makes the integration practical for repository summaries, diff explanations, scripted architecture questions, and CI-based documentation tasks.\n\nModel choice matters because Copilot CLI is usually operating on more than a short prompt. It may need to reason across multiple files and previous turns, so larger-context models generally perform better. Recommended examples from the notes include:\n\n- `kimi-k2.5:cloud`\n- `glm-5:cloud`\n- `minimax-m2.7:cloud`\n- `qwen3.5:cloud`\n- `glm-4.7-flash`\n- `qwen3.5`\n\nA practical workflow is:\n\n- Use **interactive mode** during local development to explore a repository and ask architecture questions.\n- Use **headless mode** in scripts or CI to generate summaries, notes, or implementation guidance.\n\nThe integration is lightweight: there is no custom plugin layer involved. Copilot CLI simply talks to a compatible API, and Ollama provides that API."
  },

    "source": "https://www.linkedin.com/posts/burkeholland_completely-understand-hooks-in-less-than-share-7451064088069210112-80hr?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\nThese notes explain how hooks work in AI-assisted developer tools like GitHub Copilot CLI and VS Code integrations. Hooks act as programmable interception points before or after AI-driven actions, giving you a way to inspect, modify, allow, or deny operations such as file writes, shell commands, and other tool calls.\n\nThe main value of hooks is control. Rather than relying on prompts alone, hooks provide an enforceable policy layer for safety, code quality, and workflow consistency. This makes them especially useful for blocking risky commands, enforcing lint or formatting rules, and adding observability to AI-assisted coding workflows.\n\n## Key Concepts\n- **Hooks**: Programmable interception points around events in a tool workflow. In AI-assisted development, they let you run custom logic before or after a tool call so the AI's actions can be governed instead of blindly trusted.\n- **PreToolUse**: A hook that runs before an AI agent invokes a tool or command. It is especially useful for enforcing policy before execution happens.\n- **Tool call denial**: Hooks can reject tool invocations that violate rules. This creates fail-closed behavior rather than depending on the model to follow warnings.\n- **Workflow guardrails**: Hooks are a practical mechanism for implementing guardrails around AI behavior, helping align tool use with security, quality, and team standards.\n- **Lint and quality enforcement**: Hooks can require formatting, lint, or test conditions before a write or execution step is allowed.\n- **Debugging and observability**: Since hooks sit in the decision path, they are a good place to log requested actions, policy checks, and allow/deny outcomes.\n\n## How It Works\nAt a high level, hooks wrap AI-initiated actions. When the model decides it wants to do something—edit a file, run a shell command, or call a tool—the platform emits a hook event. A hook such as `PreToolUse` can inspect the request and return a decision to allow, modify, or deny the action.\n\nA typical flow looks like this:\n\n1. The model plans an action.\n2. The platform emits a hook event.\n3. Hook logic evaluates the request against policy.\n4. The action is executed or blocked.\n5. Optional post-action hooks record results or trigger follow-up steps.\n\nThis matters because LLMs are not reliable policy engines. Prompt instructions like “always lint before writing code” are soft constraints. Hooks move those rules into code, where they become enforceable. That makes them more like middleware, admission control, or policy enforcement than simple customization.\n\nA common `PreToolUse` pattern is protecting file writes and shell commands. Policies can require that:\n- paths stay within an approved workspace\n- commands come from an allowlist\n- code passes lint or formatting checks\n- dangerous operations require manual approval\n\nExample pseudocode from the notes shows the pattern clearly:\n\n```js\nfunction preToolUse(event) {\n  const { toolName, args, targetFiles } = event;\n\n  if (toolName === 'writeFile' && targetFiles.some(f => f.endsWith('.js'))) {\n    const lintOk = runLintCheck(targetFiles);\n    if (!lintOk) {\n      return { allow: false, reason: 'Refusing file write because lint rules fail.' };\n    }\n  }\n\n  if (toolName === 'runCommand' && args.command.includes('rm -rf')) {\n    return { allow: false, reason: 'Dangerous command blocked by policy.' };\n  }\n\n  return { allow: true };\n}\n```\n\nThis approach shifts AI tooling from “best effort” compliance to hard constraints. Instead of asking the model to behave, you define conditions that must be true before the system proceeds.\n\nObservability is also important. Good hook debugging usually logs:\n- event type\n- requested tool\n- relevant arguments or file paths\n- checks performed\n- final decision\n- any error output\n\nThat visibility helps separate different classes of problems: unsafe model requests, overly strict policy logic, or downstream tool failures. In practice, hooks are best treated as a governance layer for AI-assisted development, not just a convenience feature."
  },

    "id": "2026-04-17-agentic-power-bi-development-with-skills-hooks-and-validation-plugins",
    "title": "Agentic Power BI Development with Skills, Hooks, and Validation Plugins",
    "date": "2026-04-17",
    "tags": [
      "power-bi",
      "microsoft-fabric",
      "agentic",
      "pbip",
      "automation"
    ],
    "source": "https://github.com/data-goblin/power-bi-agentic-development/",
    "content": "## Overview\nThese notes describe a GitHub repository that acts as a plugin marketplace for coding agents working on Power BI and Microsoft Fabric tasks. Rather than being a standalone application, the repository packages reusable instructions, validation logic, review agents, helper scripts, and operational tooling into installable plugins for domains like PBIP, semantic models, report assets, Tabular Editor, Power BI Desktop, and Fabric administration.\n\nThis matters because it turns loosely guided AI assistance into a more structured workflow: skills provide domain knowledge, agents perform specialized review, and hooks/scripts enforce deterministic validation. For BI engineering teams treating reports and semantic models as code, this creates a safer and more repeatable pattern for automation, source control, and governance.\n\n## Key Concepts\n- **Plugin marketplace**: The repository is organized as a set of installable plugins rather than one monolithic tool. Each plugin targets a Power BI or Fabric area such as PBIP, reports, Tabular Editor, Desktop interaction, or Fabric operations.\n- **Skills**: Markdown-based instruction packs that teach the agent domain knowledge and repeatable workflows. They live under plugin-specific `skills/.../SKILL.md` paths and may be auto-invoked or called explicitly.\n- **Agents**: Specialized helpers for review, debugging, or audit tasks. In this repository they are generally markdown-defined reviewers or validators for assets like Deneb specs, SVG DAX, BPA expressions, and semantic models.\n- **Hooks**: Deterministic validations triggered by tool actions rather than model judgment. They are implemented with shell/PowerShell scripts and config files to validate PBIR, TMDL, bindings, metadata, and referential integrity.\n- **PBIP and semantic model as code**: A major theme is working directly with source-controlled Power BI artifacts such as PBIP, TMDL, and PBIR files, allowing validation before opening changes in the UI.\n- **Operational automation**: The repository also supports remote and admin workflows through Fabric CLI and admin-oriented plugins, including scripts for workspace download, DAX execution, lineage analysis, and tenant auditing.\n\n## How It Works\nAt the top level, the repository is structured like a Claude-style plugin marketplace. Marketplace metadata is defined in `.claude-plugin/marketplace.json` and `.claude-plugin/plugin.json`, while each plugin under `plugins/` has its own `.claude-plugin/plugin.json`. This allows selective installation of only the relevant domains, such as `pbip`, `pbi-desktop`, or `tabular-editor`.\n\nCore plugin areas include:\n\n- `plugins/tabular-editor/`\n- `plugins/pbi-desktop/`\n- `plugins/pbip/`\n- `plugins/reports/`\n- `plugins/semantic-models/`\n- `plugins/fabric-cli/`\n- `plugins/fabric-admin/`\n\nWithin a plugin, the folder structure tends to follow a consistent pattern:\n\n- `skills/`: instruction packs and workflows in `SKILL.md`\n- `agents/`: specialized review or validation assistants\n- `commands/`: explicit user-invoked workflows such as `/suggest-rule`\n- `hooks/`: executable validation logic and hook registration/configuration\n- `scripts/` or `references/`: helper utilities and supporting documentation\n\nA useful workflow model is:\n\n`user request -> skill selection -> agent/tool execution -> hook validation -> feedback loop`\n\nFor PBIP development, the `pbip` plugin provides skills that explain PBIP, TMDL, and PBIR structure. After an engineer edits files, hooks like `validate-pbir.sh`, `validate-tmdl.sh`, and `validate-report-binding.sh` can run automatically using settings from `plugins/pbip/hooks/config.yaml` and registrations in `plugins/pbip/hooks/hooks.json`. This makes the plugin executable and enforceable, not just descriptive.\n\nThe `pbi-desktop` plugin focuses on live interaction with a running Power BI Desktop model. Its `connect-pbid` skill and helper scripts support model-aware workflows, while PowerShell hooks such as `snapshot-model.ps1` and `check-referential-integrity.ps1` perform runtime checks. This distinguishes static project validation from validation against an actively loaded model.\n\nThe `tabular-editor` plugin combines instructional content with automation. It includes skills for BPA rule authoring, CLI usage, C# scripting, and docs lookup, plus script-based auditing through `plugins/tabular-editor/scripts/bpa_rules_audit.py`. On top of that, agents like `bpa-expression-helper` and commands like `/suggest-rule` help generate or review quality rules.\n\nThe `reports` plugin covers report-level artifacts including Deneb, SVG-in-DAX, R visuals, Python visuals, theme JSON, and PBIR automation. Reviewer agents such as `deneb-reviewer.md`, `svg-reviewer.md`, `r-reviewer.md`, and `python-reviewer.md` act as specialized quality gates tailored to each visual technology.\n\nThe `semantic-models` plugin packages authoring and audit knowledge for DAX, Power Query, naming conventions, refresh troubleshooting, lineage, and model audits. Its `semantic-model-auditor.md` complements the `pbip` and `pbi-desktop` plugins by focusing on model quality rather than file format or live session state.\n\nThe `fabric-cli` and `fabric-admin` plugins extend the system into remote operations and governance. The `fabric-cli` plugin includes scripts such as:\n\n- `create_direct_lake_model.py`\n- `download_workspace.py`\n- `execute_dax.py`\n- `export_semantic_model_as_pbip.py`\n- `get-downstream-reports.py`\n- `query_lakehouse_duckdb.py`\n- `query_sql_endpoint.py`\n\nThese support remote Fabric and Power BI workflows. The `fabric-admin` plugin goes further into governance with scripts like `audit-tenant-settings.py` and `generate_audit_pdf.py`, along with references for delegated overrides and security groups.\n\nThe repository also includes a `useful-stuff/` area with safety-oriented hooks to block destructive commands, package manager misuse, or secrets exposure. That shows the architecture is concerned not only with BI semantics but also with safe agent execution.\n\nFrom a maintenance perspective, the repository treats agent instructions and plugin packaging as versioned, validated assets. Release notes track frequent iteration, and CI assets such as `.github/workflows/validate-plugins.yml` and `scripts/validate-plugins.sh` help enforce packaging quality.\n\nA concise mental model is:\n\n```text\nMarketplace -> Plugin -> Skills teach the agent what to do -> Agents review or handle specialized tasks -> Commands expose common workflows directly -> Hooks enforce deterministic checks -> Scripts/references provide executable and factual support\n```\n\nTraining exercise summary from the notes:\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/data-goblin/power-bi-agentic-development.git\n   cd power-bi-agentic-development\n   ```\n\n2. Inspect the plugin layout and identify:\n   - content layer: `skills/`\n   - review layer: `agents/`\n   - enforcement layer: `hooks/` or `scripts/`\n\n3. Trace PBIP validation through:\n   - `plugins/pbip/skills/pbip/SKILL.md`\n   - `plugins/pbip/agents/pbip-validator.md`\n   - `plugins/pbip/hooks/hooks.json`\n   - `plugins/pbip/hooks/config.yaml`\n   - `validate-pbir.sh`\n   - `validate-report-binding.sh`\n   - `validate-tmdl.sh`\n\n4. Compare that with the live-model path in `pbi-desktop`:\n   - `plugins/pbi-desktop/skills/connect-pbid/SKILL.md`\n   - `plugins/pbi-desktop/hooks/config.yaml`\n   - `snapshot-model.ps1`\n   - `check-referential-integrity.ps1`\n\n5. Inspect operational automation in `fabric-cli`:\n   - `plugins/fabric-cli/skills/fabric-cli/SKILL.md`\n   - pick two scripts and summarize the remote operations they enable\n\n6. Create a personal architecture note template:\n   ```text\n   Plugin:\n   Primary use case:\n   Main skills:\n   Main agent(s):\n   Validation/enforcement assets:\n   External tools or APIs involved:\n   Typical engineer workflow:\n   ```\n\n7. Optional Claude Code installation:\n   ```bash\n   claude plugin marketplace add data-goblin/power-bi-agentic-development\n   claude plugin install pbip@power-bi-agentic-development\n   ```\n\nSuccess criteria captured in the notes:\n- Explain the difference between a skill, an agent, and a hook\n- Identify the files implementing PBIP validation\n- Describe at least one Fabric automation workflow from the codebase"
  },

    "id": "2026-04-17-ai-assisted-editing-for-power-apps-canvas-apps",
    "title": "AI-assisted editing for Power Apps Canvas Apps",
    "date": "2026-04-17",
    "tags": [
      "powerapps",
      "canvas-apps",
      "ai-coding",
      "copilot",
      "governance"
    ],
    "source": "https://www.linkedin.com/posts/wariowario_i-tried-the-new-create-and-edit-canvas-apps-activity-7450805322119757824-adNF?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY",
    "content": "## Overview\n\nThese notes cover an emerging workflow for using AI coding tools to create and edit **Power Apps canvas apps** through a source-driven process instead of relying only on the visual designer. The core idea is that tools such as GitHub Copilot CLI or Claude Code can connect to an existing canvas app, inspect its source representation, generate changes, and sync validated updates back into Power Apps Studio.\n\nThis matters because it could significantly speed up routine app changes like adding screens, updating controls, or modifying Power Fx formulas. At the same time, the workflow introduces important concerns around **validation, governance, security, and enterprise readiness**, especially since the capability is described as preview and depends on supported coauthoring and platform-side validation.\n\n## Key Concepts\n\n- **Canvas app coauthoring**: Coauthoring allows multiple participants and services to edit a canvas app through a supported collaborative model. In this workflow, it is required so the AI-assisted toolchain can push validated changes back into the app live.\n- **MCP-based tool integration**: The `/configure-canvas-mcp` command suggests a Model Context Protocol-style bridge between the AI tool and the Power Apps environment. This gives the assistant access to app context and a way to submit changes through a validated channel.\n- **`.pa.yaml` as source representation**: The workflow references generating or editing `.pa.yaml` files, which appear to be the structured source form of a canvas app. This makes AI-assisted editing more like code generation against serialized app definitions.\n- **Power Platform Skills and Canvas Apps extensions**: These extensions provide the domain-specific capabilities needed for the AI tool to understand Power Platform artifacts, inspect app structure, validate changes, and sync correctly.\n- **Validation before sync**: Proposed changes are checked by a Canvas App MCP server before being applied back into Power Apps Studio. This is a critical safeguard because generated edits still need structural and semantic validation.\n- **Governance and compliance responsibility**: Even if the platform validates changes, teams remain responsible for review, approval, policy compliance, and safe operational controls, especially in regulated environments.\n\n## How It Works\n\nThe workflow starts with an **existing Power Apps canvas app** in a Power Apps environment. That app must have **coauthoring enabled** in Power Apps Studio. Rather than behaving like a simple export/import mechanism, the AI tool participates in a collaborative editing flow where changes can be reflected directly in the studio session.\n\nThe required toolchain includes:\n\n- **.NET SDK 10.0 or later**\n- An AI coding client such as **GitHub Copilot CLI** or **Claude Code**\n- The **Power Platform Skills** extension\n- The **Canvas Apps** extension\n\nTogether, these components connect a general-purpose coding assistant to a Power Apps-aware source model. The implied architecture is:\n\n1. **Power Apps Studio** hosts the live app.\n2. **Coauthoring** provides the supported editing channel.\n3. The **AI coding tool** receives user prompts.\n4. **Power Platform Skills / Canvas Apps extensions** translate prompts into app-aware operations.\n5. A **Canvas App MCP server** validates the proposed edits.\n6. Valid changes are synchronized back into **Power Apps Studio**.\n\nTypical setup sequence:\n\n1. Open the app in **Power Apps Studio**.\n2. Enable **coauthoring** in app settings.\n3. Install the **Power Platform Skills** plugin/extension.\n4. Install the **Canvas Apps** plugin/extension.\n5. Run:\n\n```bash\n/configure-canvas-mcp\n```\n\n6. Paste the **app URL** when prompted.\n\nOnce connected, the AI tool can inspect the app and operate on its source representation. The notes indicate this happens through `.pa.yaml`, meaning the assistant edits a serialized app definition instead of manipulating the UI directly. The practical loop looks like this:\n\n- The AI reads the current app structure.\n- It generates new elements or updates existing ones.\n- It writes or modifies `.pa.yaml`.\n- The MCP validation layer checks the change.\n- If valid, the update syncs back into Power Apps Studio.\n\nThis is significant because it shifts canvas app development toward a **source-driven workflow**. Instead of only dragging controls in the designer, makers can describe desired changes in natural language and let the AI produce app-definition updates. Likely use cases include:\n\n- Adding a new screen\n- Updating control properties\n- Changing formulas\n- Rearranging layout or navigation\n- Refactoring repeated patterns\n\nBecause the capability is still described as **preview**, it should be treated cautiously. Validation helps, but it does not replace enterprise controls such as:\n\n- Code or maker review\n- Environment separation\n- Connector and DLP policy checks\n- Audit logging\n- Prompt and artifact retention rules\n- Approval workflows for production changes\n\nA useful mental model is that the AI acts like a **fast junior collaborator with privileged access to app source**. It can accelerate development, but humans still need to verify correctness, protect data boundaries, and define safe operating procedures.\n\nThe notes also include a practical training exercise for evaluating the workflow safely in a non-production environment:\n\n- Start with a copied or sandbox app, not production.\n- Enable coauthoring.\n- Connect the AI tool with `/configure-canvas-mcp`.\n- Ask the assistant to summarize the app structure.\n- Request one minimal change, such as adding a label or changing a button caption.\n- Observe whether `.pa.yaml` changes are generated and whether validation occurs before sync.\n- Test manually in app preview.\n- Document permissions required, automated changes made, validation observed, and what human review is still needed.\n\nA useful stretch test is a **formula-level change**, such as disabling a submit button when an input is blank. This helps assess whether the AI produces the expected **Power Fx** formula and whether the output is inspectable enough for real governance requirements."
  },
