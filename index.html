    "id": "2026-05-14-editing-long-github-copilot-cli-prompts-in-your-preferred-editor",
    "title": "Editing Long GitHub Copilot CLI Prompts in Your Preferred Editor",
    "date": "2026-05-14",
    "tags": [

    "source": "personal notes",
    "content": "## Overview\nThese notes capture a practical workflow improvement for GitHub Copilot CLI: editing long prompts in a real text editor instead of fighting with a cramped terminal input. The key idea is that Copilot CLI can open the current prompt in your configured editor, making it much easier to write, restructure, and refine multi-line requests.\n\nThis matters because CLI-based AI workflows are becoming common, and prompt quality often depends on being able to iterate comfortably. Understanding how the `EDITOR` environment variable works—and why some editors need blocking behavior like `--wait`—helps make terminal AI tools significantly more usable across bash, zsh, and PowerShell environments.\n\n## Key Concepts\n- **External editor workflow**: Many CLI tools support handing text entry off to a full editor instead of requiring inline terminal editing. This is especially useful for long prompts that need multiline structure, revision, and cleanup.\n- **GitHub Copilot CLI prompt editing**: The notes describe using `Ctrl+G` to open the current Copilot CLI prompt in the configured editor. After editing, saving, and closing, the updated prompt returns to the terminal session.\n- **`EDITOR` environment variable**: CLI tools commonly use `EDITOR`—and sometimes `VISUAL`—to determine which editor to launch. Setting this correctly defines the default editing experience across compatible command-line tools.\n- **Editor wait semantics**: GUI editors may return control immediately unless told to block. For VS Code, `code --wait` is necessary so the CLI pauses until editing is complete.\n- **Shell-specific setup**: Bash, zsh, and PowerShell all support editor configuration, but each uses different syntax and startup files. Persistent setup is usually done in shell config files or PowerShell profiles.\n- **Editor choice tradeoffs**: VS Code offers a rich GUI experience, while tools like Nano are lightweight and terminal-native. The best choice depends on environment, speed, and whether a desktop session is available.\n\n## How It Works\nThe workflow is straightforward: instead of composing a long Copilot CLI prompt directly in the terminal, you trigger an edit action, make changes in a full editor, then return to the CLI with the revised prompt loaded. This improves navigation, formatting, and overall prompt clarity.\n\nGitHub Copilot CLI reportedly supports this through `Ctrl+G`:\n\n1. Start or prepare a prompt in the terminal.\n2. Press `Ctrl+G`.\n3. Copilot CLI opens the prompt in the editor specified by `EDITOR`.\n4. Edit the prompt normally.\n5. Save and close the editor.\n6. Copilot CLI resumes with the updated prompt content.\n\nThis works by delegating prompt editing to an external process. The shell provides the editor command, and the CLI waits for that process to finish before reading back the modified content.\n\nExample configurations:\n\n```bash\nexport EDITOR=\"code --wait\"\n```\n\nUse this when you want Visual Studio Code. The `--wait` flag is critical because otherwise Code launches and immediately returns, causing the CLI to continue before editing is finished.\n\n```bash\nexport EDITOR=\"nano\"\n```\n\nNano is simpler because it blocks by default until you exit, which matches the expectation most CLI tools have for editor-based workflows.\n\nIn PowerShell:\n\n```powershell\n$env:EDITOR = \"code --wait\"\n```\n\nFor persistence, place the setting in your PowerShell profile rather than only setting it in the current session.\n\nA useful mental model:\n\n- Copilot CLI manages the prompt lifecycle.\n- Your shell determines which editor gets launched.\n- The editor modifies a temporary text buffer.\n- Saving and closing hands control—and the final text—back to the CLI.\n\nThis pattern also appears in other tools like Git commit editing and `crontab -e`, so learning it improves general command-line ergonomics beyond Copilot CLI.\n\n## Personal Notes\nEditing Long GitHub Copilot CLI Prompts with Your Preferred Editor\n\n\n\nSource: https://www.linkedin.com/posts/burkeholland_editing-prompts-in-terminals-is-the-ick-ugcPost-7460480525078654976-4WvP?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Editing-Long-GitHub-Copilot-CLI-Prompts-with-Your-Preferred-Editor-36001bb0839a81fbb1d9e64e4ad9308f\n\n\n\nTags: copilot, cli, terminal, editor, shell\n\n\n\nOverview\n\n\n\nThis lesson explains a small but high-leverage terminal workflow improvement: editing long GitHub Copilot CLI prompts in a real text editor instead of struggling inside a one-line terminal input. The source highlights that Copilot CLI supports opening the current prompt in your configured editor with a keyboard shortcut, making prompt authoring much easier for complex requests.\n\n\n\nThis matters to engineers who increasingly use AI tools from the command line and need to write, revise, and debug multi-line prompts efficiently. If you work in bash, PowerShell, or similar shells, understanding how the `EDITOR` environment variable and editor wait behavior work will make your CLI-based AI workflow much more usable.\n\n\n\nKey Concepts\n\n\n\n  *   External editor workflow: Many CLI tools can hand off text entry to an external editor instead of forcing you to type directly in the terminal. This is especially useful for long prompts, where navigation, correction, and restructuring are awkward in a compact prompt box.\n\n  *   GitHub Copilot CLI prompt editing: According to the source, GitHub Copilot CLI lets you press `Ctrl+G` to open the current prompt in your configured editor. After you edit, save, and close the editor, the updated prompt is brought back into the terminal session.\n\n  *   EDITOR environment variable: CLI tools commonly discover which editor to launch from environment variables such as `EDITOR` or sometimes `VISUAL`. Setting this variable tells the tool what program to invoke when it needs a full-screen editing experience.\n\n  *   Editor wait semantics: GUI editors often return control immediately unless explicitly told to block until the file is closed. For Visual Studio Code, the `--wait` flag is required so the CLI tool pauses while you edit and only resumes when the editor window or file session is closed.\n\n  *   Shell-specific configuration: The way you set editor-related environment variables depends on your shell and operating system. Bash and PowerShell use different syntax and different startup files, but both support persistent configuration for default editor behavior.\n\n  *   Choosing the right editor: The source mentions Visual Studio Code and Nano, and a comment also suggests Microsoft Edit as another option. The best choice depends on whether you prefer a graphical editor, a terminal-native editor, or a lightweight default tool available across environments.\n\n\n\nHow It Works\n\n\n\nAt a high level, the workflow is simple: instead of editing a long Copilot CLI prompt inline in the terminal, you trigger an edit action that opens the prompt content in a proper text editor. You then use normal editing capabilities—cursor movement, search, multiline formatting, deletion, and revision—save the file, close the editor, and return to the CLI with the modified prompt loaded.\n\n\n\nThe source specifically describes this interaction for GitHub Copilot CLI:\n\n\n\n1. Start writing or preparing a prompt in the terminal. 2. Press `Ctrl+G`. 3. Copilot CLI opens the prompt in your configured editor. 4. Edit the text using your preferred tool. 5. Save and close the editor. 6. The terminal prompt updates to reflect your edited content.\n\n\n\nThis works because the CLI delegates editing to an external process. In most Unix-style and cross-platform CLI ecosystems, that process is determined by the `EDITOR` environment variable. When Copilot CLI needs a richer editing experience, it launches whatever command `EDITOR` points to.\n\n\n\nFor example, if you want to use Visual Studio Code, your editor command must include the `--wait` flag:\n\n\n\n```bash export EDITOR=\"code --wait\" ```\n\n\n\nWithout `--wait`, Code launches and immediately returns control to the terminal process. From the CLI tool's perspective, editing is already \"done,\" even though you're still typing in the GUI window. That breaks the handoff model because the tool resumes before you've saved final changes.\n\n\n\nFor a terminal-native editor like Nano, configuration is simpler:\n\n\n\n```bash export EDITOR=\"nano\" ```\n\n\n\nNano blocks by default until you exit, which aligns naturally with how CLI tools expect editors to behave. This makes it a good fallback option on remote machines, containers, or environments without a desktop session.\n\n\n\nIn PowerShell, the same idea applies, but the syntax differs:\n\n\n\n```powershell $env:EDITOR = \"code --wait\" ```\n\n\n\nTo make the setting persistent, you'd typically add it to your PowerShell profile instead of setting it only for the current session.\n\n\n\nA practical mental model is:\n\n\n\n- **Copilot CLI owns the prompt lifecycle**. - **Your shell provides the editor configuration**. - **The editor modifies a temporary prompt buffer**. - **Saving and closing hands the final text back to the CLI**.\n\n\n\nThis pattern is not unique to Copilot CLI. It is a common design in command-line tools such as Git commit message editors, crontab editors, and interactive CLI applications that need richer text entry. Learning it once improves your ergonomics across many tools.\n\n\n\nFrom an engineering workflow standpoint, the main benefit is reduced friction for iterative prompting. Long prompts often include:\n\n\n\n- multi-part instructions - code snippets - file paths - formatting constraints - error details - follow-up clarifications\n\n\n\nTrying to maintain these inline in a small terminal input increases mistakes and discourages refinement."

    "id": "2026-05-14-generative-ui-in-microsoft-365-copilot-with-mcp-and-langgraph",
    "title": "Generative UI in Microsoft 365 Copilot with MCP and LangGraph",
    "date": "2026-05-14",
    "tags": [
      "mcp",
      "copilot",
      "generative-ui",
      "langgraph",
      "agents"

    "source": "personal notes",
    "content": "## Overview\nThese notes describe an architecture for generating interactive UI inside Microsoft 365 Copilot at runtime, using a combination of MCP, AG-UI, LangGraph, and CopilotKit’s OpenGenerativeUI ideas. The central pattern is that a user submits a prompt in Copilot, an external MCP app/server handles the request, and an agent produces a structured UI definition that Copilot can render safely in chat.\n\nThis matters because it shifts AI experiences from plain text output to dynamic, task-specific interfaces such as forms, cards, and workflows. The key takeaway is the separation between generation and rendering: the model or agent proposes structured UI intent, while a trusted renderer decides what can actually be shown.\n\n## Key Concepts\n- **Generative UI**: UI is created dynamically from user intent instead of choosing only from prebuilt screens. The AI outputs a structured representation of components rather than arbitrary frontend code.\n- **MCP server**: A custom MCP server exposes app capabilities to Microsoft 365 Copilot via the Model Context Protocol. It acts as the integration boundary between Copilot and downstream services.\n- **Microsoft 365 Copilot app rendering**: Copilot can host app experiences directly in chat. The important distinction is that it renders supported app responses rather than executing arbitrary UI code invented by the model.\n- **AG-UI bridge**: AG-UI serves as an interchange layer for transporting AI-generated interface structures between the MCP side and the agent side.\n- **LangGraph deep agent**: LangGraph orchestrates multi-step reasoning, planning, and stateful execution. It can interpret prompts, decide on tool usage, and emit a structured UI schema.\n- **OpenGenerativeUI**: CopilotKit’s approach separates UI generation from UI rendering. This improves safety, composability, and portability across hosts.\n\n## How It Works\nThe end-to-end flow looks like this:\n\n1. A user enters a natural-language prompt in Microsoft 365 Copilot.\n2. Copilot invokes an MCP app exposed by a custom MCP server.\n3. The MCP server forwards or translates the request into an AG-UI-compatible interaction.\n4. A LangGraph-based agent interprets the request and generates a structured UI description using OpenGenerativeUI-style concepts.\n5. The UI definition travels back through the bridge and is rendered inside the Copilot chat experience.\n\nA useful way to think about the system is as a layered contract:\n\n- **Copilot** handles the chat surface and app hosting.\n- **MCP server** exposes the capability boundary.\n- **AG-UI** carries the generated UI representation.\n- **LangGraph agent** reasons about the request and produces structured output.\n- **Renderer** turns the approved schema into visible, interactive controls.\n\nThe practical design principle is that the agent should emit constrained, machine-readable output instead of raw React or HTML. Typical fields in this contract include:\n\n- component type\n- props\n- layout structure\n- allowed actions\n- validation rules\n- optional data bindings\n\nExample structured UI schema:\n\n```json\n{\n  \"type\": \"form\",\n  \"title\": \"Project Intake\",\n  \"fields\": [\n    { \"type\": \"text\", \"name\": \"project_name\", \"label\": \"Project name\" },\n    { \"type\": \"select\", \"name\": \"priority\", \"label\": \"Priority\", \"options\": [\"Low\", \"Medium\", \"High\"] },\n    { \"type\": \"date\", \"name\": \"due_date\", \"label\": \"Due date\" },\n    { \"type\": \"text\", \"name\": \"owner\", \"label\": \"Owner\" }\n  ],\n  \"actions\": [\n    { \"type\": \"submit\", \"label\": \"Create\" }\n  ]\n}\n```\n\nThis pattern is valuable because it improves:\n\n- **Safety**: only approved components are renderable.\n- **Determinism**: outputs can be validated against a schema.\n- **Portability**: the same UI definition can be rendered in multiple environments.\n- **Composability**: the agent can add planning, retrieval, or tools before producing UI.\n\n### Minimal prototype exercise\nA practical exercise from the notes is to build a local prototype that turns prompts into structured UI.\n\n**Goal**: create a small service that accepts a prompt and returns a JSON UI schema for a simple renderer.\n\n**Step 1: Define a tiny UI schema**\n\n```json\n{\n  \"allowedComponents\": [\"text\", \"form\", \"input\", \"select\", \"button\", \"card\"]\n}\n```\n\n**Step 2: Implement a mock agent service**\nCreate a small Node.js or Python server that:\n\n1. accepts a POST request with `prompt`\n2. maps the prompt to a UI JSON spec\n3. returns the JSON spec\n\nExample Express handler:\n\n```js\napp.post('/generate-ui', (req, res) => {\n  const prompt = req.body.prompt || '';\n\n  if (prompt.toLowerCase().includes('project intake')) {\n    return res.json({\n      type: 'form',\n      title: 'Project Intake',\n      fields: [\n        { type: 'input', inputType: 'text', name: 'project_name', label: 'Project name' },\n        { type: 'select', name: 'priority', label: 'Priority', options: ['Low', 'Medium', 'High'] },\n        { type: 'input', inputType: 'date', name: 'due_date', label: 'Due date' }\n      ],\n      actions: [\n        { type: 'button', action: 'submit', label: 'Create' }\n      ]\n    });\n  }\n\n  return res.json({\n    type: 'card',\n    title: 'Fallback UI',\n    body: 'No matching template found for prompt: ' + prompt\n  });\n});\n```\n\n**Step 3: Build a tiny renderer**\nRender based on the returned `type`:\n\n- `card` → title and text block\n- `form` → loop through fields and create native inputs/selects\n- `button` → render action buttons\n\n**Step 4: Add validation**\nValidate that the response contains only supported component types before rendering.\n\n**Step 5: Simulate the architecture**\nMap the prototype to the larger design:\n\n- frontend form = Copilot host surface\n- `/generate-ui` endpoint = MCP server + AG-UI bridge\n- prompt-to-schema logic = LangGraph/OpenGenerativeUI generation layer\n\n**Step 6: Extend it**\nPossible next steps:\n\n- add another prompt type such as an expense approval form\n- support conditional fields\n- add schema versioning\n- post submitted form data back to the server\n\n**Success criteria**\nPrompts like these should render different UIs without manually creating each page:\n\n- `Create a project intake form`\n- `Show me an expense approval card`\n\n## Personal Notes\nGenerative UI in Microsoft 365 Copilot with MCP, AG-UI, LangGraph, and OpenGenerativeUI\n\n\n\nSource: https://www.linkedin.com/posts/andreasadner_microsoftcopilot-agui-copilotkit-ugcPost-7460401668283854850-wqmW?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Generative-UI-in-Microsoft-365-Copilot-with-MCP-AG-UI-LangGraph-and-OpenGenerativeUI-36001bb0839a81bf98aad7ffac34e235\n\n\n\nTags: mcp, copilot, generative-ui, langgraph, agents, ag-ui\n\n\n\nOverview\n\n\n\nThis lesson explains the architecture behind a generative UI demo for Microsoft 365 Copilot where a user types a prompt and receives an interactive UI component rendered directly in chat. The source post describes a pipeline in which Microsoft 365 Copilot invokes an MCP app served by a custom MCP server, which then bridges to AG-UI and a LangGraph-based agent using CopilotKit's OpenGenerativeUI approach to synthesize UI dynamically.\n\n\n\nThis matters to engineers building agentic applications because it moves beyond text responses into runtime-generated interfaces. Instead of hardcoding every form, card, or workflow screen in advance, the system can interpret user intent and produce fit-for-purpose UI on demand, opening up new patterns for enterprise copilots, workflow automation, and adaptive frontends.\n\n\n\nKey Concepts\n\n\n\n  *   Generative UI: Generative UI is the idea that an AI system can create interface components dynamically based on user intent rather than selecting from a fixed set of predefined screens. In practice, this means the model or agent outputs a structured UI description that a renderer can safely display as interactive components.\n\n  *   MCP server: An MCP server exposes tools, apps, or capabilities to a host AI system using the Model Context Protocol. In this scenario, the MCP server acts as the integration point that Microsoft 365 Copilot can call to obtain an app payload or UI-producing capability.\n\n  *   Microsoft 365 Copilot app rendering: Microsoft 365 Copilot can host and render app experiences inside its chat surface. The important architectural point is that Copilot is not directly inventing arbitrary UI markup on its own; instead, it calls into an external app/service that returns a supported renderable experience.\n\n  *   AG-UI bridge: AG-UI provides a way to represent or transport AI-generated interface structures between systems. In this architecture it serves as the bridge layer between the MCP app/server boundary and the downstream agent that decides what UI should be produced.\n\n  *   LangGraph deep agent: Lang"

    "content": "## Overview\n\nThese notes cover Claude’s structured outputs feature, which enforces response shape at the API level using either JSON Schema or tool definitions. The main idea is to stop relying on prompts like “return valid JSON” and instead define output structure as part of the request contract, making responses far more reliable for programmatic use.\n\nThis matters for production AI systems where model output feeds automation, workflows, external APIs, or multi-agent communication. By turning schema adherence into a platform guarantee, engineers can reduce parsing failures, retries, repair logic, and downstream errors, and focus more on semantic correctness than formatting recovery.\n\n## Key Concepts\n\n- **Structured outputs**: API-level guarantees that Claude returns data matching a developer-defined structure, either through JSON Schema or tool input definitions.\n- **JSON schema enforcement**: A schema is included in the request and the response is constrained to match it, reducing fragile parsing and type-coercion code.\n- **Tool definition conformance**: When tools are defined with structured inputs, Claude emits arguments that conform to those contracts, which is especially useful for agents and workflow systems.\n- **Production reliability**: Strict output shape reduces runtime failures when downstream systems require exact fields, types, or patterns.\n- **Agent communication contracts**: Multi-agent systems benefit from reliable machine-readable handoffs for plans, task state, and action parameters.\n- **Reduced defensive code**: Validation can shift away from formatting repair toward actual business rules and semantic checks.\n\n## How It Works\n\nThe core mechanism is simple: instead of asking the model to produce structured text and then trying to parse it afterward, you provide the expected structure in the API call itself. Claude then generates output that conforms to that declared structure.\n\nThere are two main modes:\n\n1. **JSON-structured response mode**\n   - You send a JSON Schema in the request.\n   - Claude returns a response that matches that schema.\n   - Best suited for extraction, classification, and converting unstructured input into typed records.\n\n2. **Tool-based structured mode**\n   - You define tools with structured input schemas.\n   - Claude emits tool calls with arguments matching those definitions.\n   - Best suited for assistants, agent systems, workflow engines, and API orchestration.\n\nThe practical engineering shift is important. In a non-structured setup, the application often has to:\n\n- Prompt for JSON\n- Parse raw text\n- Validate keys and types\n- Retry or repair malformed output\n- Handle downstream failures caused by bad arguments\n\nWith structured outputs, the flow becomes:\n\n- Define the schema or tool contract\n- Send request\n- Receive conformant structured data\n- Apply business validation\n- Pass output to downstream systems\n\nThis narrows the failure surface. Formatting problems become less central, while semantic correctness becomes the main concern: whether the extracted value is correct, whether selected filters make sense, or whether the chosen tool/action is appropriate.\n\nHigh-value scenarios called out in the notes include:\n\n- **Data extraction**: OCR, invoices, support tickets, and documents where exact fields and types matter.\n- **Multi-agent systems**: Reliable exchange of plans, observations, task states, and structured actions.\n- **Complex search and workflow tools**: Calls with typed parameters, optional filters, allowed values, and downstream constraints.\n\nA useful architectural takeaway is that structured outputs improve interface guarantees without requiring prompt-heavy formatting tricks. This can simplify integration design and reduce operational complexity in production systems.\n\n## Personal Notes\n\nStructured Outputs with Claude: Enforcing JSON Schemas and Tool Contracts\n\n\n\nSource: https://claude.com/blog/structured-outputs-on-the-claude-developer-platform/?utm_campaign=B2C_ADIR_US_CODE_SOC_CODR_BA_STATIC&utm_source=linkedin&utm_medium=paid&hsa_acc=515731155&hsa_cam=780502254&hsa_grp=454823704&hsa_ad=1228202364&hsa_net=linkedin&hsa_ver=3\n\nNotion page: https://www.notion.so/Structured-Outputs-with-Claude-Enforcing-JSON-Schemas-and-Tool-Contracts-36001bb0839a81fe9169f8c04fa2b272\n\n\n\nTags: claude, json-schema, api-design, tool-calling, agent-systems\n\n\n\nOverview\n\n\n\nStructured outputs on the Claude Developer Platform let you require model responses to conform exactly to either a JSON schema or a tool definition. Instead of treating structured data generation as a prompt-engineering problem, this feature moves schema adherence into the API contract, reducing parsing failures, malformed tool calls, and retry-heavy recovery logic.\n\n\n\nThis matters most for production systems where LLM output feeds downstream automation: extraction pipelines, agent-to-agent messaging, API orchestration, and search or workflow tools with strict parameter requirements. Engineers building reliable AI applications care because schema guarantees simplify application code, improve operational stability, and reduce the risk that one formatting error cascades into larger system failures.\n\n\n\nKey Concepts\n\n\n\n  *   Structured outputs: Structured outputs are API-level guarantees that Claude's response will match a developer-specified structure. The structure can be expressed either as a JSON schema for direct data output or as a tool definition for function-style invocation.\n\n  *   JSON schema enforcement: When using the JSON path, the developer includes a schema in the API request, and the model is constrained to return data that matches it. This reduces the need for fragile post-processing logic that attempts to coerce free-form text into typed objects.\n\n  *   Tool definition conformance: When using tools, the model's output is shaped to match declared tool inputs automatically. This is especially valuable in agentic systems where a malformed argument object can cause failed calls, retries, or inconsistent execution paths.\n\n  *   Production reliability: A key motivation for structured outputs is preventing schema-related failures in real systems. If downstream services expect exact fields, types, or patterns, guaranteed conformance reduces runtime errors and improves system predictability.\n\n  *   Agent communication contracts: Multi-agent architectures often pass structured state, plans, and task parameters between agents. Structured outputs make those handoffs more reliable by ensuring every message follows an agreed machine-readable contract.\n\n  *   Reduced defensive code: Without schema guarantees, application code often includes retries, validators, parsing heuristics, and fallback branches. Structured outputs let engineers remove much of that complexity and keep validation focused on business rules rather than formatting repair.\n\n\n\nHow It Works\n\n\n\nThe core idea is straightforward: instead of asking Claude to \"please return valid JSON\" and hoping the response is well-formed, you define the shape of the desired output in the API call. Claude then produces an output that matches that declared structure.\n\n\n\nThere are two main usage modes:\n\n\n\n1. **JSON-structured response mode** - You provide a JSON schema in the request. - Claude returns a response that conforms to that schema. - This is a good fit for extraction, classification, summarization into typed records, or any workflow where your application wants a data object rather than prose.\n\n\n\n2. **Tool-based structured mode** - You define one or more tools with structured input parameters. - Claude emits output that conforms to those tool definitions. - This is a good fit for assistants, agents, and workflow engines that need to call internal functions or external APIs.\n\n\n\nThe article's main engineering argument is that reliability improves when structure is enforced by the platform rather than reconstructed after generation. In a typical non-structured integration, the flow often looks like this:\n\n\n\n- Prompt model for JSON - Receive text that is usually, but not always, valid - Parse JSON - Validate fields and types - Retry or repair if parsing fails - Handle downstream tool/API errors caused by malformed arguments\n\n\n\nWith structured outputs, the flow becomes simpler:\n\n\n\n- Define the target schema or tool contract - Send request to Claude - Receive conformant structured output - Apply business validation if needed - Pass directly to downstream systems\n\n\n\nThis changes the failure surface. Instead of spending engineering effort on formatting recovery, teams can focus on semantic correctness: whether the extracted invoice total is right, whether the chosen search filters are sensible, or whether the selected tool is appropriate.\n\n\n\nThe article highlights several high-value scenarios:\n\n\n\n- **Data extraction**: For OCR or document/image extraction pipelines, downstream systems often require exact keys and consistent types. Structured outputs reduce ingestion failures. - **Multi-agent systems**: Agents frequently exchange plans, observations, task states, and action parameters. Strict output shape improves interoperability and stability. - **Complex search tools**: Search requests often have multiple fields with specific patterns or allowed values. Tool-definition conformance helps ensure every field is correctly populated.\n\n\n\nAn important practical point is that the feature is described as improving reliability **without impacting model performance**. From an application architecture perspective, this means engineers can strengthen interface guarantees without redesigning prompts around defensive output formatting.\n\n\n\nA minimal conceptual request for JSON-structured output might look like this:\n\n\n\n```json { \"model\": \"claude-sonnet-4.5\", \"messages\": [ { \"role\": \"user\", \"content\": \"Extract the customer name, invoice number, and total from this document.\" } ], \"response_format\": { \"type\": \"json_schema\", \"schema\": { \"type\": \"object\", \"properties\": { \"customer_name\": { \"type\": \"string\" }, \"invoice_number\": { \"type\": \"string\" }, \"total\": { \"type\": \"number\" } }, \"required\": [\"customer_name\", \"invoice_number\", \"total\"] } } } ```\n\n\n\nA conceptual tool-based setup might instead define a search tool like this:\n\n\n\n```json { \"name\": \"search_catalog\", \"description\": \"Search product catalog with structured filters\", \"input_schema\": { \"type\": \"object\", \"properties\": { \"query\": { \"type\": \"string\" }, \"category\": { \"type\": \"string\" }, \"max_price"

    "content": "## Overview\n\nThese notes explain how to use GitHub Copilot CLI's BYOK (Bring Your Own Key) support with custom models exposed through an OpenAI-compatible API. The main idea is that Copilot CLI does not have to be limited to the default models included in a Copilot subscription; instead, it can be pointed at third-party providers such as OpenRouter and used with alternative models like Qwen, Kimi, or MiniMax.\n\nThis matters because it gives engineers more flexibility over model selection, cost, and experimentation while preserving the familiar Copilot CLI workflow in the terminal. The notes also highlight a helper utility called `cpm` that simplifies switching between providers and models by managing the required environment variables interactively.\n\n## Key Concepts\n\n- **BYOK in Copilot CLI**: BYOK means Copilot CLI can authenticate against a model provider using your own API key rather than only using models included with your Copilot plan. In practice, this lets you route Copilot CLI requests to third-party model backends while keeping the same command-line workflow.\n- **OpenAI-compatible providers**: Copilot CLI expects providers that speak an OpenAI-compatible API. Many model gateways and hosting platforms expose this interface, which makes them usable without a provider-specific client implementation.\n- **Provider configuration**: A provider definition typically includes a base URL, provider type, API key reference, and one or more model definitions. For each model, you also need metadata such as the model ID and token limits so the CLI can correctly format and constrain requests.\n- **Model IDs and token limits**: The model ID is the exact string the backend expects when you request inference, such as a specific Qwen or MiniMax variant. Token limits matter because the client needs to know the maximum context window and output size it can safely request.\n- **OpenRouter as a model gateway**: OpenRouter provides a single API surface for many different models and vendors. That makes it a practical choice for BYOK because one account and key can give you access to multiple models while also offering straightforward spend control through prepaid credits.\n- **Model switching utility**: The `cpm` utility described in the source wraps the tedious parts of configuring environment variables and selecting providers/models. Instead of manually exporting settings each time, you can add providers once and switch interactively.\n\n## How It Works\n\nAt a high level, the process is straightforward: get an API key from an OpenAI-compatible provider, tell Copilot CLI where that provider lives, specify the model and its limits, and launch the CLI with that configuration active.\n\nThe notes use **OpenRouter** as the example because it exposes many models behind one OpenAI-compatible endpoint. This is useful operationally because you can try different models without changing tools. OpenRouter also acts as a billing and routing layer, which can help with cost control through prepaid usage.\n\nTo make this work, Copilot CLI needs a small set of configuration values:\n\n- a friendly **provider name**\n- the provider **base URL**\n- a **type**, typically `openai`\n- an **API key**\n- the exact **model ID**\n- the **prompt/context token limit**\n- the **output token limit**\n\nThese details matter more than they may first appear. The model ID must exactly match the provider’s expected identifier or requests will fail. Token limits are also important because the client needs to know how much input it can send and how much output it can request without exceeding the model’s constraints.\n\nThe `cpm` helper utility makes this less error-prone by wrapping configuration and switching in a dedicated workflow. Instead of manually exporting environment variables every time, you can register providers and models once, then select them interactively.\n\nTypical flow:\n\n```text\ncpm add\n```\n\nThen provide values such as:\n\n- provider name: `openrouter`\n- base URL: OpenRouter's OpenAI-compatible endpoint\n- provider type: `openai`\n- API key label: any friendly name\n- API key value: your OpenRouter key\n- model ID: for example, a Qwen model ID\n- prompt/context token limit\n- output token limit\n\nAfter that, you can list and activate configured entries with:\n\n```text\ncpm\n```\n\nSelecting one activates the relevant provider/model settings and opens Copilot CLI with the correct environment variables in place. In the demonstration described by the notes, the active model indicator in Copilot CLI updates to show the selected custom model, confirming that requests are being routed away from the default Copilot model.\n\nConceptually, the data flow is:\n\n- user enters a prompt in Copilot CLI\n- Copilot CLI reads the active provider/model configuration\n- the request is formatted as an OpenAI-compatible API call\n- the third-party backend runs inference\n- the response is returned to Copilot CLI and shown in the terminal\n\nA useful practical detail is that the experience still feels like Copilot CLI even when custom models are used. That means teams can keep the same terminal-first interface while gaining more control over where inference happens.\n\nThe main tradeoffs noted are:\n\n- **Flexibility**: access models outside the bundled Copilot catalog\n- **Cost control**: use gateways such as OpenRouter with prepaid credits\n- **Compatibility constraints**: only providers with OpenAI-compatible APIs work cleanly\n- **Manual metadata**: model IDs and token limits must be known and entered correctly\n- **Security**: API keys now live in local config or environment variables, so secret hygiene matters\n\nIf doing this without `cpm`, the real challenge is reproducible environment management. You need to ensure the correct base URL, auth token, model name, and token settings are exported in the shell session before launching Copilot CLI. A wrapper script or shell profile can help, but `cpm` turns that into a simpler, more repeatable workflow.\n\n## Personal Notes\n\nUsing GitHub Copilot CLI BYOK with Custom OpenAI-Compatible Models\n\n\n\nSource: https://www.linkedin.com/posts/burkeholland_the-github-copilot-cli-now-supports-byok-ugcPost-7454977496137072640-qEYz?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Using-GitHub-Copilot-CLI-BYOK-with-Custom-OpenAI-Compatible-Models-36001bb0839a817a834ff1e7aaace414\n\n\n\nTags: github-copilot, cli, llms, openrouter, byok, api\n\n\n\nOverview\n\n\n\nGitHub Copilot CLI's BYOK (Bring Your Own Key) capability lets you use models outside the default Copilot subscription catalog, as long as they are exposed through an OpenAI-compatible API. That opens the door to experimenting with alternative commercial and open-weight models through providers such as OpenRouter, while keeping Copilot CLI as the terminal interface engineers already use.\n\n\n\nThis matters to engineers who want more control over model choice, cost, and capability. Instead of being locked to bundled models, you can point Copilot CLI at providers like OpenRouter and select models such as Qwen, Kimi, or MiniMax. The source material also highlights a small helper utility, `cpm` (Copilot Models), which simplifies provider/model switching by managing the required environment variables interactively.\n\n\n\nKey Concepts\n\n\n\n  *   BYOK in Copilot CLI: BYOK means Copilot CLI can authenticate against a model provider using your own API key rather than only using models included with your Copilot plan. In practice, this lets you route Copilot CLI requests to third-party model backends while keeping the same command-line workflow.\n\n  *   OpenAI-compatible providers: Copilot CLI expects providers that speak an OpenAI-compatible API. Many model gateways and hosting platforms expose this interface, which makes them usable without a provider-specific client implementation.\n\n  *   Provider configuration: A provider definition typically includes a base URL, provider type, API key reference, and one or more model definitions. For each model, you also need metadata such as the model ID and token limits so the CLI can correctly format and constrain requests.\n\n  *   Model IDs and token limits: The model ID is the exact string the backend expects when you request inference, such as a specific Qwen or MiniMax variant. Token limits matter because the client needs to know the maximum context window and output size it can safely request.\n\n  *   OpenRouter as a model gateway: OpenRouter provides a single API surface for many different models and vendors. That makes it a practical choice for BYOK because one account and key can give you access to multiple models while also offering straightforward spend control through prepaid credits.\n\n  *   Model switching utility: The `cpm` utility described in the source wraps the tedious parts of configuring environment variables and selecting providers/models. Instead of manually exporting settings each time, you can add providers once and switch interactively.\n\n\n\nHow It Works\n\n\n\nAt a high level, the flow is:\n\n\n\n1. Obtain an API key from a provider that exposes an OpenAI-compatible endpoint. 2. Tell Copilot CLI how to reach that provider. 3. Specify which model to use, along with its token limits. 4. Start Copilot CLI with that configuration active.\n\n\n\nThe source uses **OpenRouter** as the example provider because it offers access to many models behind one API. The practical benefit is that you can experiment with non-default models without changing your terminal workflow. OpenRouter also acts as a billing and routing layer, so you can preload credits and stop usage when the balance is exhausted.\n\n\n\nThe configuration data you need is fairly standard"

    "content": "## Overview\n\nThese notes cover how GitHub Copilot CLI can be used as a terminal-native assistant for generating shell commands, explaining unfamiliar commands, and reducing context switching during command-line work. The source material points to a cheat sheet and official documentation, but the main practical takeaway is how to use Copilot CLI as a fast interface for common terminal tasks rather than as a replacement for shell knowledge.\n\nThis matters because terminal productivity often depends on recalling syntax, flags, and command composition under time pressure. Copilot CLI is most useful when treated as a draft generator and explainer: describe intent in plain language, inspect the result carefully, then refine or run it. The notes also emphasize safety, especially around destructive commands, privilege escalation, and commands that may behave differently across shells or operating systems.\n\n## Key Concepts\n\n- **Natural-language command generation**: Copilot CLI can translate plain-English requests into shell commands.\n- **Command explanation**: It can break down existing commands and clarify flags, pipelines, and intent.\n- **Terminal-native workflow**: Keeping assistance inside the shell reduces context switching to browsers or docs.\n- **Human review before execution**: Generated commands should always be inspected before running, especially if destructive.\n- **Cheat-sheet driven productivity**: Memorizing a handful of useful prompt patterns delivers most of the value.\n\n## How It Works\n\nGitHub Copilot CLI acts as a shell-oriented assistant that accepts natural-language input and returns either a proposed command or an explanation of an existing one. In practice, the workflow is simple:\n\n1. State your task in plain language.\n2. Review the generated command or explanation.\n3. Validate flags, paths, quoting, and safety.\n4. Run it or refine the request.\n\nThe notes suggest a helpful mental model: Copilot CLI is not “automatic shell execution,” but an interactive drafting tool for terminal tasks. It is especially useful for:\n\n- Recalling rarely used flags\n- Building first-draft commands\n- Explaining copied one-liners\n- Speeding up Git, filesystem, and process tasks\n- Assisting with Unix pipelines involving tools like `find`, `grep`, `sed`, `awk`, and `xargs`\n\nA practical split is:\n\n- **Generate mode**: ask how to do something\n- **Explain mode**: ask what an existing command does\n\nPrompt quality matters. Better results usually come from adding constraints such as:\n\n- Operating system or shell (`Linux`, `macOS`, `PowerShell`, `Git Bash`)\n- Safety requirements (`dry-run`, `preview only`, `ask before delete`)\n- Scope (`current directory only`, `recursive`)\n- Output preferences (`JSON`, `filenames only`, `sorted descending`)\n\nThe notes also stress good shell discipline alongside Copilot CLI use:\n\n- Prefer preview commands before destructive ones\n- Confirm edge cases with `man` pages or official docs\n- Test on a small sample first\n- Be extra cautious with `sudo`, `rm`, `chmod`, networking, installs, or credentials\n\nA useful training approach is to practice both generation and explanation in a safe sandbox directory. The included exercise reinforces three habits: generate commands from intent, verify explanations by decomposing pipelines manually, and refine prompts for safer behavior before running anything destructive.\n\n## Personal Notes\n\nUsing GitHub Copilot CLI Effectively from the Terminal\n\n\n\nSource: https://www.linkedin.com/posts/github-copilot-cli-cheat-sheet-ugcPost-7460479811807911936-8hcU?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Using-GitHub-Copilot-CLI-Effectively-from-the-Terminal-36001bb0839a8176aa18d6d924e58e2f\n\n\n\nTags: github-copilot, cli, terminal, developer-productivity, shell\n\n\n\nOverview\n\n\n\nGitHub Copilot CLI brings Copilot-style assistance directly into the terminal, letting engineers ask for shell commands, explanations, and workflow help without leaving their command-line environment. The source material is a short social post pointing to a cheat sheet and the official command reference, so the key practical value is understanding how Copilot CLI fits into day-to-day terminal usage and which command patterns are worth memorizing.\n\n\n\nThis matters to engineers who spend significant time in shells such as Bash, Zsh, or PowerShell and want to reduce context switching when writing commands, troubleshooting errors, or learning unfamiliar tools. Rather than replacing shell knowledge, Copilot CLI acts as a fast natural-language layer on top of existing command-line workflows.\n\n\n\nKey Concepts\n\n\n\n  *   Natural-language command generation: A core use of Copilot CLI is turning an English request into a shell command. Instead of manually recalling flags or syntax, you describe the goal and let the tool propose a command you can inspect before running.\n\n  *   Command explanation: Copilot CLI can explain existing commands, which is useful when reading unfamiliar scripts or debugging complex one-liners. This reduces the need to jump between `man` pages, search engines, and documentation tabs.\n\n  *   Terminal-native workflow: Because the assistant is available in the terminal, it supports a lower-friction workflow than switching to a browser or editor extension. The value is speed: ask, inspect, refine, and execute within the same shell session.\n\n  *   Human review before execution: AI-generated shell commands can be powerful but also risky, especially when they involve deletion, remote access, package installation, or privilege escalation. Effective use of Copilot CLI requires reviewing commands carefully before running them.\n\n  *   Cheat-sheet driven productivity: A cheat sheet is useful because most productivity gains come from remembering a small number of high-value commands and invocation patterns. Engineers typically benefit from memorizing request styles for generation, explanation, and iterative refinement.\n\n\n\nHow It Works\n\n\n\nGitHub Copilot CLI is designed as a command-line interface that accepts natural-language input and returns shell-oriented help. While the source provided is only a social post plus a link to the official command reference, the practical model is straightforward: you ask for help in the terminal, Copilot interprets the request, and it produces either a candidate command or an explanation.\n\n\n\nAt a high level, the workflow usually looks like this:\n\n\n\n1. **State your intent in plain language** - Example: find large files, compress a directory, inspect open ports, or rewrite a Git command. 2. **Receive a proposed shell command or explanation** - Copilot CLI translates the intent into a command suited to your environment. 3. **Inspect and validate** - Check flags, paths, quoting, substitutions, and whether the command is destructive. 4. **Run or refine** - If the result is close but not correct, restate constraints and ask again.\n\n\n\nThe most important mental model is that Copilot CLI is not magic shell execution; it is an assistant for shell interaction. That means it is especially strong in these scenarios:\n\n\n\n- Recalling infrequently used flags - Translating intent into a first draft command - Explaining a command copied from docs or a teammate - Speeding up Git, file-system, and process-management tasks - Helping with Unix tool composition (`find`, `xargs`, `grep`, `sed`, `awk`, etc.)\n\n\n\nA practical way to think about the feature set is in two buckets:\n\n\n\n- **Generate mode**: “I want to do X; what command should I use?” - **Explain mode**: “What does this command do, and what do these flags mean?”\n\n\n\nFor example, a command-generation interaction might conceptually look like this:\n\n\n\n```bash # Pseudocode-style examples; consult the official CLI reference for exact syntax copilot suggest \"find all .log files larger than 100MB under /var\" ```\n\n\n\nAnd an explanation interaction might look like:\n\n\n\n```bash copilot explain \"find /var -name '*.log' -size +100M\" ```\n\n\n\nEven if the exact subcommands differ by version, the operational pattern is the same: provide intent or a command string, then use the output as a reviewed draft. The social post's emphasis on a cheat sheet is a clue that effectiveness comes less from knowing every feature and more from mastering these repeatable prompt patterns:\n\n\n\n- Be explicit about the environment: Linux, macOS, PowerShell, Git Bash - Add constraints: recursive, safe, dry-run, current directory only - Specify output format: JSON, filenames only, sorted descending - Request safer variants when relevant: preview first, exclude hidden files, ask before delete\n\n\n\nIn real use, Copilot CLI works best when combined with existing shell discipline:\n\n\n\n- Prefer non-destructive previews before destructive commands - Use built-in help and `man` pages to confirm edge cases - Test on a sample directory or branch before applying broadly - Treat generated commands involving `sudo`, `rm`, `chmod`, networking, or credentials with extra caution\n\n\n\nThe official command reference linked from the source is the canonical place to confirm exact installation, authentication, supported shells, and the precise command names/options for your current version of Copilot CLI.\n\n\n\nTraining Exercise\n\n\n\nBuild a small \"Copilot CLI terminal drill\" that practices the two core skills: generating commands and explaining them.\n\n\n\n### Goal Use Copilot CLI to solve three realistic terminal tasks, then validate the results manually.\n\n\n\n### Prerequisites 1. Install and authenticate GitHub Copilot CLI according to the official documentation. 2. Open a test directory in your terminal. 3. Create a safe sandbox:\n\n\n\n```bash mkdir -p copilot-cli-lab/subdir cd copilot-cli-lab printf 'hello\\n' > app.log printf 'error\\n' > subdir/error"

    "content": "## Overview\nThese notes cover the concept of **computer use** in Codex-style AI systems: agents that interact with a live graphical environment, especially a browser, by observing state, choosing actions, and executing UI operations like clicking, typing, scrolling, and navigating. The focus is less on traditional API integrations and more on multimodal, environment-aware workflows that let an agent operate software through the same interface a human would use.\n\nThis matters because browser-controlled agents unlock automation for systems that lack clean APIs, including legacy enterprise software, web apps, QA flows, and repetitive operational tasks. The main value is flexibility, but the tradeoff is fragility and risk: UI automation can break on layout changes, timing issues, or unexpected dialogs, so practical implementations need verification, retries, safety gates, and human approval for sensitive steps.\n\n## Key Concepts\n- **Computer use**: the ability of an AI model to control software through its user interface instead of relying only on text prompts or structured APIs.\n- **Perception-action loop**: the agent repeatedly observes the environment, decides what to do next, executes an action, and checks the result.\n- **Browser as execution surface**: browsers are a common and sandboxable environment for demonstrating agent behavior across search, forms, dashboards, and web apps.\n- **Tool grounding**: the model’s reasoning must map to concrete environment actions such as DOM selection, coordinate clicks, keyboard input, or hybrid control.\n- **Human-in-the-loop approval**: risky or irreversible actions should pause for explicit user confirmation.\n- **Reliability and brittleness**: robust browser agents need state checks, retries, timeouts, and fallback behavior because UI-driven workflows are inherently fragile.\n\n## How It Works\nA browser-controlled agent is best understood as a layered workflow rather than a single model invocation. The user provides a goal, such as exporting a report or comparing documentation pages, and the system decomposes that goal into smaller actions tied to the current browser state.\n\nA practical implementation often includes:\n- a **planner** to break a goal into steps\n- a **perception layer** to read browser state from screenshots, DOM snapshots, accessibility trees, or metadata\n- an **action layer** to click, type, scroll, navigate, and switch tabs\n- a **verifier** to confirm whether an action had the intended effect\n- a **safety layer** to block or escalate dangerous actions\n\nThe core loop is:\n\n1. Observe current browser state.\n2. Ask the model to choose the next action given the goal and current state.\n3. Execute the action.\n4. Re-observe and verify progress.\n5. Continue until the task completes, fails, or requires escalation.\n\nA simplified pseudocode version:\n\n```text\nstate = observe_browser()\nwhile not done:\n    action = model.plan(goal, state, history)\n    if requires_approval(action):\n        wait_for_user_confirmation()\n    result = execute(action)\n    state = observe_browser()\n    done = check_completion(goal, state, result)\n```\n\nThere are two main control styles:\n- **Visual control**: screenshot-based reasoning with coordinate interactions; highly general but brittle.\n- **Structured control**: DOM, accessibility labels, or browser automation hooks; more reliable when available.\n\nIn practice, the strongest systems combine both. For example, the model may use screenshots to understand layout while the runtime uses deterministic selectors to execute the click. This hybrid approach gives broader reasoning while improving reliability.\n\nThe notes also highlight an important design decision: **how much autonomy to allow**. Low-autonomy systems may require approval before every step. Higher-autonomy systems may run continuously but still gate actions like:\n- entering secrets\n- sending emails or messages\n- submitting forms\n- making purchases\n- changing production data\n\nFailure recovery is another core requirement. Real browser sessions involve redirects, stale pages, login expiry, modal dialogs, and missing elements. A production-ready agent should track state history, verify expected transitions, retry safe actions, and stop when it is likely stuck.\n\nCompared with API-based automation:\n- **API automation** is faster, cleaner, and more deterministic.\n- **Computer use** is more flexible when no suitable API exists or when reproducing exact end-user behavior matters.\n\nThe included exercise outlines a minimal prototype using Playwright in Node.js. The aim is to build the agent skeleton: observe page state, choose one action, execute it, verify the result, and optionally insert a manual approval gate. This is a useful practical starting point for understanding browser-agent mechanics.\n\n## Personal Notes\nEmail subject: [Lesson] Computer Use in Codex: Browser-Controlled Agent Workflows\nDate: 2026-05-13\n\n--- NOTES ---\nComputer Use in Codex: Browser-Controlled Agent Workflows\n\n\n\nSource: https://youtu.be/D_FCYsshMI4?si=3gj1Lyj8DPCpRYRz\n\nNotion page: https://www.notion.so/Computer-Use-in-Codex-Browser-Controlled-Agent-Workflows-35f01bb0839a8124a0c0c623b9685ae7\n\n\n\nTags: ai-agents, browser-automation, codex, tool-use, human-in-the-loop\n\n\n\nOverview\n\n\n\nThis lesson explains the idea of \"computer use\" in Codex-style AI systems: allowing a model to interact with a graphical computer environment, typically a browser, by observing the screen, deciding on actions, and executing UI operations such as clicking, typing, and navigating. Even though the provided source content contains only the video title, the topic strongly suggests a practical demonstration of multimodal agent behavior rather than a traditional code API walkthrough.\n\n\n\nWorking engineers should care because computer-use agents represent a different integration model from normal LLM chat or function calling. Instead of relying on carefully designed APIs, the agent can operate existing software through the same interface a human uses, which is useful for testing, repetitive workflows, enterprise systems with poor APIs, and rapid prototyping. The tradeoff is that UI-driven automation is fragile, safety-sensitive, and requires strong supervision and guardrails.\n\n\n\nKey Concepts\n\n\n\n  *   Computer use: Computer use is the ability of an AI model to control a software environment through its user interface rather than only through text prompts or structured APIs. The model interprets screen state, plans actions, and performs operations like clicking buttons, entering text, scrolling, and switching tabs.\n\n  *   Perception-action loop: A computer-use agent typically runs in a loop: observe the current screen, infer the next best action, execute it, then observe again. This loop continues until the task is complete, blocked, or escalated to a human.\n\n  *   Browser as execution surface: Many demonstrations focus on the browser because it is a common workplace interface and exposes rich workflows such as searching, form filling, navigation, and web app usage. A browser is also easier to sandbox than a full desktop and is a practical first environment for agentic control.\n\n  *   Tool grounding: Tool grounding means connecting the model's reasoning to concrete actions in the environment. In a browser setting, this may involve DOM-aware interactions, coordinate-based clicks, keyboard input, screenshots, or a hybrid of structured and visual control.\n\n  *   Human-in-the-loop approval: Because UI automation can trigger irreversible actions, production systems often pause before risky steps such as purchases, submissions, credential entry, or deletion. Human approval adds a safety layer and helps maintain accountability.\n\n  *   Reliability and brittleness: UI-driven agents can fail when page layouts change, content loads slowly, dialogs appear unexpectedly, or visual interpretation is ambiguous. Robust systems need retries, state checks, timeouts, fallbacks, and clear error handling.\n\n\n\nHow It Works\n\n\n\nA Codex-style computer-use workflow can be understood as a layered agent system rather than a single model call.\n\n\n\nAt the top level, the user provides a goal such as \"log into the staging dashboard and export the latest CSV report\" or \"open the docs, compare two pricing pages, and summarize changes.\" The system then turns that goal into a sequence of environment-aware actions. Unlike normal code generation, the agent is not only producing text; it is interacting with a live interface whose state changes over time.\n\n\n\nA practical architecture usually has these components:\n\n\n\n- **Planner**: converts the user goal into smaller steps. - **Perception layer**: gathers the current state from screenshots, accessibility trees, DOM snapshots, or browser metadata. - **Action layer**: performs clicks, text entry, keypresses, scrolling, tab management, and navigation. - **Verifier**: checks whether the previous action had the intended effect. - **Safety layer**: filters dangerous actions and may require user approval.\n\n\n\nThe core loop looks like this:\n\n\n\n1. Capture current browser state. 2. Ask the model what to do next given the goal and current state. 3. Execute the chosen action. 4. Re-read state and verify progress. 5. Continue until completion or failure.\n\n\n\nIn pseudocode:\n\n\n\n```text state = observe_browser() while not done: action = model.plan(goal, state, history) if requires_approval(action): wait_for_user_confirmation() result = execute(action) state = observe_browser() done = check_completion(goal, state, result) ```\n\n\n\nThere are two common ways to represent the UI:\n\n\n\n- **Visual control**: the agent sees screenshots and interacts by screen coordinates. This is general and works even when the underlying application is opaque, but it can be brittle. - **Structured control**: the agent uses DOM elements, accessibility labels, or browser automation hooks. This is more reliable when available, but depends on page structure and browser instrumentation.\n\n\n\nIn systems described as \"computer use,\" the most effective implementations often combine both. For example, the model"

    "content": "## Overview\nThese notes describe a new GitHub Copilot CLI capability: forking conversations into separate branches and navigating them with session commands. The core idea is to treat AI-assisted work more like version control for reasoning, where one shared context can split into multiple paths for experimentation without losing the original thread.\n\nThis matters because engineering work is rarely linear. Tasks like refactoring, debugging, architecture evaluation, and implementation planning often benefit from comparing several approaches in parallel. Conversation branching supports that style directly by preserving context, reducing repetition, and making tradeoff analysis easier.\n\n## Key Concepts\n- **Conversation forking**: Forking creates a new conversation branch from the current state of a Copilot CLI session. The new branch inherits prior context, allowing you to explore an alternative path without overwriting or polluting the original discussion.\n- **Session switching**: The `/session` command lets you move between active conversation branches. This is useful when comparing outputs from multiple approaches, such as different implementation plans or debugging strategies.\n- **Named branches for human tracking**: The `/rename` command helps assign meaningful names to session branches. Clear naming is important because once you start branching heavily, identifiers alone are not enough to remember which session represents which idea.\n- **Exploratory AI workflows**: AI-assisted development is often non-linear. Engineers frequently want to test multiple plans, prompts, or constraints, and branching sessions supports this iterative style more naturally than restarting a chat from scratch.\n- **Context preservation**: A forked session retains the accumulated context of the original conversation up to the fork point. That means you can keep prior requirements, code snippets, and design constraints while asking the model to pursue a different strategy.\n- **Comparative decision-making**: Branching enables side-by-side evaluation of alternatives instead of relying on memory or manual copy-paste. This improves decision quality when choosing among plans for refactors, tests, tooling, or architecture.\n\n## How It Works\nThe feature behaves like branching in Git, but applied to AI conversation state instead of source code. You start with a base session, establish requirements and constraints, and then fork once there are multiple reasonable directions to explore. Each branch continues independently from the same checkpoint.\n\nA practical workflow is:\n\n1. Start a base Copilot CLI conversation for a concrete task.\n2. Clarify constraints, risks, and goals.\n3. Use `/fork` when you want to test different strategies.\n4. In each branch, prompt Copilot toward a specific tradeoff or hypothesis.\n5. Use `/session` to switch among branches.\n6. Use `/rename` to label branches clearly.\n7. Compare outputs and continue with the most promising path.\n\nThe main benefit is separating exploration from commitment. In a normal linear chat, changing direction can create confusion, introduce contradictory assumptions, or force you to restate context. Forking avoids that by keeping a clean shared starting point while letting each branch diverge intentionally.\n\nThis is especially useful for:\n- refactor planning with multiple strategies\n- debugging with competing root-cause hypotheses\n- testing alternate prompt styles\n- comparing implementation tradeoffs\n- drafting competing architecture proposals\n\nA simple example from the notes is a migration from REST to GraphQL:\n- Base session: plan the migration\n- Fork A: optimize for minimal risk and incremental rollout\n- Fork B: optimize for speed of implementation\n- Fork C: optimize for long-term schema clarity\n\nBecause all branches share the same starting context, comparisons are more reliable and require less repetition. Naming branches like `graphql-low-risk`, `graphql-fastest`, and `graphql-clean-schema` makes the workflow easier to manage once several branches exist.\n\nThe training exercise extends this into a repeatable decision workflow. For example, when adding caching to a slow Node.js endpoint, you can branch into plans optimized for speed, safety, and scalability, then compare architecture impact, rollout complexity, operational risk, and monitoring needs before selecting one branch to refine into an implementation checklist.\n\n## Personal Notes\nBranching Workflows with GitHub Copilot CLI Sessions\n\n\n\nSource: https://www.linkedin.com/posts/burkeholland_you-can-now-fork-conversations-in-the-github-ugcPost-7460074801844383746-VexF?utm_source=social_share_send&utm_medium=ios_app&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY&utm_campaign=share_via\n\nNotion page: https://www.notion.so/Branching-Workflows-with-GitHub-Copilot-CLI-Sessions-35e01bb0839a8102bf31c187c871df47\n\n\n\nTags: github-copilot, cli, ai-workflows, sessions, prompt-engineering\n\n\n\nOverview\n\n\n\nGitHub Copilot CLI now supports forking conversations, which gives engineers a branching workflow for AI-assisted work. Instead of forcing a single linear chat history, you can split a conversation into multiple alternative paths, explore different implementation ideas, and later switch among them using session management commands.\n\n\n\nThis matters for practical engineering work because many tasks are inherently exploratory: planning a refactor, comparing architectural options, debugging with different hypotheses, or drafting multiple automation approaches. Conversation forking makes Copilot CLI feel more like version control for reasoning, helping you preserve context while testing divergent directions without losing your original thread.\n\n\n\nKey Concepts\n\n\n\n  *   Conversation forking: Forking creates a new conversation branch from the current state of a Copilot CLI session. The new branch inherits prior context, allowing you to explore an alternative path without overwriting or polluting the original discussion.\n\n  *   Session switching: The /session command lets you move between active conversation branches. This is useful when comparing outputs from multiple approaches, such as different implementation plans or debugging strategies.\n\n  *   Named branches for human tracking: The /rename command helps assign meaningful names to session branches. Clear naming is important because once you start branching heavily, identifiers alone are not enough to remember which session represents which idea.\n\n  *   Exploratory AI workflows: AI-assisted development is often non-linear. Engineers frequently want to test multiple plans, prompts, or constraints, and branching sessions supports this iterative style more naturally than restarting a chat from scratch.\n\n  *   Context preservation: A forked session retains the accumulated context of the original conversation up to the fork point. That means you can keep prior requirements, code snippets, and design constraints while asking the model to pursue a different strategy.\n\n  *   Comparative decision-making: Branching enables side-by-side evaluation of alternatives instead of relying on memory or manual copy-paste. This improves decision quality when choosing among plans for refactors, tests, tooling, or architecture.\n\n\n\nHow It Works\n\n\n\nThe source describes a new workflow feature in GitHub Copilot CLI: the ability to **fork conversations** and later move among them with **/session**. Conceptually, this works like branching in Git, but for the state of an AI conversation rather than for source code. You begin with a base interaction, establish context, constraints, and goals, and then split that thread when you want to pursue multiple possible directions.\n\n\n\nA typical flow looks like this:\n\n\n\n1. Start a conversation in Copilot CLI around a concrete engineering task. 2. Reach a point where there are multiple valid next steps. 3. Use `/fork` to create an alternate branch of the conversation. 4. In each branch, ask Copilot to pursue a different strategy. 5. Use `/session` to switch between branches. 6. Use `/rename` to give each branch a meaningful label. 7. Compare results and continue with the best path.\n\n\n\nThis is especially useful when the model's usefulness depends on accumulated context. In a normal single-thread chat, changing direction can contaminate the session with contradictory assumptions or force you to restate earlier requirements. Forking avoids that by preserving the shared context up to a checkpoint, then letting each branch diverge independently.\n\n\n\nHere is a practical example:\n\n\n\n- Base session: \"Help me plan a migration from REST endpoints to GraphQL in this service.\" - Fork A: \"Optimize for minimal delivery risk and incremental rollout.\" - Fork B: \"Optimize for fastest implementation.\" - Fork C: \"Optimize for long-term schema clarity and client ergonomics.\"\n\n\n\nAll three branches start with the same project context, but each evolves toward a different engineering tradeoff. Later, `/session` lets you hop among them and inspect the outputs before choosing one to refine.\n\n\n\nThe recommendation to use `/rename` is operationally important. Once you have several forks, branch management becomes a usability problem. Renaming sessions to something like `graphql-low-risk`, `graphql-fastest`, or `graphql-clean-schema` makes the workflow much easier to navigate and turns session history into a durable working set rather than a pile of anonymous branches.\n\n\n\nFrom a reasoning standpoint, the main value is that it separates **exploration** from **commitment**. You can explore multiple hypotheses without losing the original line of thought. That is valuable in tasks such as:\n\n\n\n- planning a refactor in several ways - debugging with different root-cause theories - trying alternate prompts for code generation - evaluating multiple test strategies - drafting competing architectural proposals\n\n\n\nAlthough the source is a short product announcement rather than a full technical spec, the underlying interaction model is clear: Copilot CLI is adding stateful conversation management primitives that make iterative engineering work more structured. The commands mentioned imply a lightweight session graph where one prompt history can branch into several descendants, and users can navigate those branches intentionally instead of relying on one long chat log.\n\n\n\nTraining Exercise\n\n\n\nCreate a small decision-making workflow using forked Copilot CLI sessions.\n\n\n\n### Goal Use conversation branching to compare three different implementation plans for the same task.\n\n\n\n### Scenario You need to add caching to a"
