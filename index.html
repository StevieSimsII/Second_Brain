    "content": "## Overview\n\nThese notes explain how to configure GitHub Copilot CLI to use Ollama as the model backend through Ollama’s OpenAI-compatible API. The key idea is that Copilot CLI can send requests to a provider exposing an OpenAI-style interface, and Ollama serves that interface locally at `http://localhost:11434/v1`. This makes it possible to keep the Copilot CLI workflow while choosing local or Ollama-hosted models.\n\nThis setup is useful for developers who want more control over model selection, prefer local-first workflows, or need repeatable terminal-based AI behavior in scripts, Docker, or CI/CD. It is especially relevant for repository-level reasoning tasks, where larger context windows and coding-capable models matter.\n\n## Key Concepts\n\n- **Copilot CLI**: GitHub Copilot CLI is a terminal coding agent that can inspect repositories, answer codebase questions, suggest edits, and run commands. It supports both interactive shell use and non-interactive automation.\n- **Ollama as a provider**: Ollama acts as the backend model server, exposing local and some cloud models through a single interface that Copilot CLI can call.\n- **OpenAI-compatible API**: The integration depends on Ollama exposing an OpenAI-style endpoint at `http://localhost:11434/v1`, which matches the request format Copilot CLI expects.\n- **Wire API selection**: `COPILOT_PROVIDER_WIRE_API=responses` tells Copilot CLI which API semantics to use when talking to Ollama.\n- **Headless mode**: Headless execution lets Copilot CLI run without interactive prompts, which is helpful for scripts and CI. In this mode, `--yes` skips selection prompts and `--model` must be set explicitly.\n- **Context window requirements**: Copilot CLI often needs to read large portions of a repository and prior conversation history, so models with at least a 64k token context window are recommended.\n\n## How It Works\n\nAt a high level, Copilot CLI remains the terminal interface while Ollama becomes the LLM serving layer. Instead of talking to a default hosted provider, Copilot CLI is redirected to Ollama’s local OpenAI-compatible API.\n\nThere are two main ways to launch it:\n\n1. **Quick launcher via Ollama**\n   ```bash\n   ollama launch copilot\n   ```\n\n   Or with an explicit model:\n\n   ```bash\n   ollama launch copilot --model kimi-k2.5:cloud\n   ```\n\n   This is the simplest approach because Ollama handles the provider configuration automatically.\n\n2. **Manual configuration via environment variables**\n   ```bash\n   export COPILOT_PROVIDER_BASE_URL=http://localhost:11434/v1\n   export COPILOT_PROVIDER_API_KEY=\n   export COPILOT_PROVIDER_WIRE_API=responses\n   export COPILOT_MODEL=qwen3.5\n   copilot\n   ```\n\n   You can also run this inline for one-off commands:\n\n   ```bash\n   COPILOT_PROVIDER_BASE_URL=http://localhost:11434/v1 \\\n   COPILOT_PROVIDER_API_KEY= \\\n   COPILOT_PROVIDER_WIRE_API=responses \\\n   COPILOT_MODEL=glm-5:cloud \\\n   copilot\n   ```\n\nThe environment variables do the following:\n\n- `COPILOT_PROVIDER_BASE_URL`: points Copilot CLI to the Ollama API endpoint.\n- `COPILOT_PROVIDER_API_KEY`: typically left empty for a local Ollama instance.\n- `COPILOT_PROVIDER_WIRE_API=responses`: ensures compatible request/response behavior.\n- `COPILOT_MODEL`: selects the model, such as `qwen3.5` or `glm-5:cloud`.\n\nFor automation, headless mode is the important pattern:\n\n```bash\nollama launch copilot --model kimi-k2.5:cloud --yes -- -p \"how does this repository work?\"\n```\n\nHow that command is interpreted:\n\n1. `ollama launch copilot` starts the Copilot CLI integration.\n2. `--model kimi-k2.5:cloud` selects the backend model.\n3. `--yes` disables interactive confirmation and allows model pull behavior.\n4. `--` separates Ollama launcher arguments from native Copilot CLI arguments.\n5. `-p \"...\"` passes a prompt directly to Copilot CLI.\n\nThis makes the integration practical for repository summaries, diff explanations, scripted architecture questions, and CI-based documentation tasks.\n\nModel choice matters because Copilot CLI is usually operating on more than a short prompt. It may need to reason across multiple files and previous turns, so larger-context models generally perform better. Recommended examples from the notes include:\n\n- `kimi-k2.5:cloud`\n- `glm-5:cloud`\n- `minimax-m2.7:cloud`\n- `qwen3.5:cloud`\n- `glm-4.7-flash`\n- `qwen3.5`\n\nA practical workflow is:\n\n- Use **interactive mode** during local development to explore a repository and ask architecture questions.\n- Use **headless mode** in scripts or CI to generate summaries, notes, or implementation guidance.\n\nThe integration is lightweight: there is no custom plugin layer involved. Copilot CLI simply talks to a compatible API, and Ollama provides that API.\n\n## Personal Notes\n\nUsing GitHub Copilot CLI with Ollama via the OpenAI-Compatible API\n\n\n\nSource: https://docs.ollama.com/integrations/copilot-cli\n\nNotion page: https://www.notion.so/Using-GitHub-Copilot-CLI-with-Ollama-via-the-OpenAI-Compatible-API-34701bb0839a8198b825ffe9a4af6f15\n\n\n\nTags: ollama, copilot-cli, openai-api, terminal-ai, llm, developer-tools\n\n\n\nOverview\n\n\n\nThis lesson explains how to run GitHub Copilot CLI against models served by Ollama instead of a default hosted provider. The integration works because Copilot CLI can talk to an OpenAI-compatible API, and Ollama exposes one locally at `/v1`, letting you use local or Ollama cloud-hosted open models from the terminal.\n\n\n\nThis matters for engineers who want more control over model choice, local-first workflows, CI automation, or access to models like `qwen3.5`, `glm-5:cloud`, or `kimi-k2.5:cloud` while keeping the Copilot CLI terminal experience. If you build, review, or automate code from the shell, this setup gives you a flexible path to AI-assisted development without changing tools.\n\n\n\nKey Concepts\n\n\n\n  *   Copilot CLI: GitHub Copilot CLI is a terminal-based coding agent that can inspect a repository, answer questions about the codebase, propose edits, and run commands. It is designed for interactive shell workflows, but it can also run in non-interactive automation scenarios.\n\n  *   Ollama as a model provider: Ollama can serve both local models and certain cloud models through a unified interface. In this integration, Ollama acts as the backend model provider that Copilot CLI sends requests to.\n\n  *   OpenAI-compatible API: Copilot CLI connects to Ollama through environment variables that point it at an OpenAI-style API endpoint. The important base URL is `http://localhost:11434/v1`, which matches the API shape Copilot expects.\n\n  *   Wire API selection: The `COPILOT_PROVIDER_WIRE_API=responses` setting tells Copilot CLI which request/response format to use when speaking to the provider. This ensures that the client and Ollama agree on the API semantics.\n\n  *   Headless mode: Headless mode lets you run Copilot CLI without interactive prompts, which is useful in scripts, Docker containers, and CI/CD jobs. In this mode, `--yes` skips selectors and auto-pulls the model, but you must explicitly provide `--model`.\n\n  *   Context window requirements: Copilot CLI works best with large-context models because it may need to ingest significant portions of a codebase and conversation history. Ollama recommends at least a 64k token context window for this integration.\n\n\n\nHow It Works\n\n\n\nAt a high level, the integration is straightforward: Copilot CLI remains the user-facing terminal agent, while Ollama becomes the LLM serving layer. Instead of Copilot CLI calling a default remote provider, it is configured to send requests to Ollama's OpenAI-compatible endpoint.\n\n\n\nThe simplest path is the Ollama-managed launcher:\n\n\n\n```bash ollama launch copilot ```\n\n\n\nThis command starts Copilot CLI preconfigured to use Ollama. You can also select a model directly:\n\n\n\n```bash ollama launch copilot --model kimi-k2.5:cloud ```\n\n\n\nIn this flow, Ollama handles the provider wiring for you, so you do not need to manually set environment variables first.\n\n\n\nFor more explicit control, you can configure Copilot CLI manually with environment variables:\n\n\n\n```bash export COPILOT_PROVIDER_BASE_URL=http://localhost:11434/v1 export COPILOT_PROVIDER_API_KEY= export COPILOT_PROVIDER_WIRE_API=responses export COPILOT_MODEL=qwen3.5 copilot ```\n\n\n\nThe mechanics of each variable are:\n\n\n\n- `COPILOT_PROVIDER_BASE_URL`: points Copilot CLI at the Ollama API. - `COPILOT_PROVIDER_API_KEY`: left empty here because a local Ollama server typically does not require an API key. - `COPILOT_PROVIDER_WIRE_API=responses`: selects the API style expected by this integration. - `COPILOT_MODEL`: names the model to use, such as `qwen3.5` or `glm-5:cloud`.\n\n\n\nYou can also provide these inline for"

    "content": "## Overview\nThese notes explain how hooks work in AI-assisted developer tools like GitHub Copilot CLI and VS Code integrations. Hooks act as programmable interception points before or after AI-driven actions, giving you a way to inspect, modify, allow, or deny operations such as file writes, shell commands, and other tool calls.\n\nThe main value of hooks is control. Rather than relying on prompts alone, hooks provide an enforceable policy layer for safety, code quality, and workflow consistency. This makes them especially useful for blocking risky commands, enforcing lint or formatting rules, and adding observability to AI-assisted coding workflows.\n\n## Key Concepts\n- **Hooks**: Programmable interception points around events in a tool workflow. In AI-assisted development, they let you run custom logic before or after a tool call so the AI's actions can be governed instead of blindly trusted.\n- **PreToolUse**: A hook that runs before an AI agent invokes a tool or command. It is especially useful for enforcing policy before execution happens.\n- **Tool call denial**: Hooks can reject tool invocations that violate rules. This creates fail-closed behavior rather than depending on the model to follow warnings.\n- **Workflow guardrails**: Hooks are a practical mechanism for implementing guardrails around AI behavior, helping align tool use with security, quality, and team standards.\n- **Lint and quality enforcement**: Hooks can require formatting, lint, or test conditions before a write or execution step is allowed.\n- **Debugging and observability**: Since hooks sit in the decision path, they are a good place to log requested actions, policy checks, and allow/deny outcomes.\n\n## How It Works\nAt a high level, hooks wrap AI-initiated actions. When the model decides it wants to do something—edit a file, run a shell command, or call a tool—the platform emits a hook event. A hook such as `PreToolUse` can inspect the request and return a decision to allow, modify, or deny the action.\n\nA typical flow looks like this:\n\n1. The model plans an action.\n2. The platform emits a hook event.\n3. Hook logic evaluates the request against policy.\n4. The action is executed or blocked.\n5. Optional post-action hooks record results or trigger follow-up steps.\n\nThis matters because LLMs are not reliable policy engines. Prompt instructions like “always lint before writing code” are soft constraints. Hooks move those rules into code, where they become enforceable. That makes them more like middleware, admission control, or policy enforcement than simple customization.\n\nA common `PreToolUse` pattern is protecting file writes and shell commands. Policies can require that:\n- paths stay within an approved workspace\n- commands come from an allowlist\n- code passes lint or formatting checks\n- dangerous operations require manual approval\n\nExample pseudocode from the notes shows the pattern clearly:\n\n```js\nfunction preToolUse(event) {\n  const { toolName, args, targetFiles } = event;\n\n  if (toolName === 'writeFile' && targetFiles.some(f => f.endsWith('.js'))) {\n    const lintOk = runLintCheck(targetFiles);\n    if (!lintOk) {\n      return { allow: false, reason: 'Refusing file write because lint rules fail.' };\n    }\n  }\n\n  if (toolName === 'runCommand' && args.command.includes('rm -rf')) {\n    return { allow: false, reason: 'Dangerous command blocked by policy.' };\n  }\n\n  return { allow: true };\n}\n```\n\nThis approach shifts AI tooling from “best effort” compliance to hard constraints. Instead of asking the model to behave, you define conditions that must be true before the system proceeds.\n\nObservability is also important. Good hook debugging usually logs:\n- event type\n- requested tool\n- relevant arguments or file paths\n- checks performed\n- final decision\n- any error output\n\nThat visibility helps separate different classes of problems: unsafe model requests, overly strict policy logic, or downstream tool failures. In practice, hooks are best treated as a governance layer for AI-assisted development, not just a convenience feature.\n\n## Personal Notes\nUnderstanding AI Tool Hooks in Copilot CLI and VS Code\n\n\n\nSource: https://www.linkedin.com/posts/burkeholland_completely-understand-hooks-in-less-than-share-7451064088069210112-80hr?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY\n\nNotion page: https://www.notion.so/Understanding-AI-Tool-Hooks-in-Copilot-CLI-and-VS-Code-34601bb0839a818ca925d551b7f35c8e\n\n\n\nTags: ai-agents, hooks, copilot, vscode, developer-tools\n\n\n\nOverview\n\n\n\nThis lesson explains the idea of hooks in AI-assisted developer tools such as GitHub Copilot CLI and Visual Studio Code integrations. Hooks are interception points that run before or after an AI tool action, letting you inspect, modify, allow, or block behavior. For engineers using AI in coding workflows, they provide a practical control layer between a model's intent and actual execution.\n\n\n\nThe main reason hooks matter is reliability and governance. AI coding tools can generate code that compiles poorly, ignores lint rules, or invokes commands you would rather restrict. A hook like PreToolUse can enforce guardrails before the tool runs, making hooks one of the most valuable mechanisms for improving safety, code quality, and workflow consistency in day-to-day engineering.\n\n\n\nKey Concepts\n\n\n\n  *   Hooks: Hooks are programmable interception points around an event in a tool workflow. In AI-assisted development, they let you run custom logic when the assistant is about to call a tool, has finished a call, or is transitioning between stages. This turns the AI toolchain into something you can govern rather than passively accept.\n\n  *   PreToolUse: PreToolUse is a hook that executes before an AI agent invokes a tool or command. Its most important capability is policy enforcement: you can deny execution unless certain conditions are met, such as lint compliance, path restrictions, or command allowlists. This is especially useful for preventing bad automation from touching your codebase.\n\n  *   Tool call denial: A hook can reject a requested tool invocation when the request violates a rule. Denial is more powerful than warning because it makes the workflow fail closed instead of relying on the model to behave well after being told not to. In practice, this is how you enforce standards consistently.\n\n  *   Workflow guardrails: Guardrails are rules and checks added around an AI system to reduce unsafe or low-quality actions. Hooks are an implementation mechanism for these guardrails because they can inspect context, apply policies, and block execution. This helps align AI output with engineering standards, security constraints, and team practices.\n\n  *   Lint and quality enforcement: One concrete use case for hooks is requiring code quality checks before a write or execution step is allowed. Instead of trusting the model to remember formatting, linting, or test expectations, the hook enforces them automatically. This reduces churn from broken code and keeps AI-generated changes closer to production-ready.\n\n  *   Debugging and observability: Because hooks sit in the control path, they are also a natural place to log requests, decisions, and failures. Good hook debugging means capturing the requested action, relevant metadata, and the reason for allowing or denying it. Without observability, hooks become difficult to trust and maintain.\n\n\n\nHow It Works\n\n\n\nAt a high level, hooks wrap the execution of AI-driven actions. An AI agent decides it wants to perform some operation—such as editing a file, running a shell command, or calling an internal tool. Before that action happens, a hook like `PreToolUse` gets a chance to inspect the request. The hook can then return a decision: allow, modify, or deny.\n\n\n\nThis creates a simple but powerful control flow:\n\n\n\n1. The model plans an action. 2. The platform emits a hook event. 3. Your hook code evaluates the event against policy. 4. The tool action is either executed or blocked. 5. Optional post-action hooks can log results or trigger follow-up behavior.\n\n\n\nThe reason this matters is that LLMs are probabilistic systems, not policy engines. Even when prompted to follow rules like \"always lint before writing code,\" they may skip steps or proceed with partial compliance. Hooks move those rules out of the prompt and into enforceable automation.\n\n\n\nA common pattern is using `PreToolUse` to protect file writes or command execution. For example, if the AI attempts to modify source files, the hook could require that:\n\n\n\n- the target path is inside an approved workspace - the command is from an allowlist - generated code passes formatting or lint checks - certain high-risk operations, like deleting files or changing CI config, require manual approval\n\n\n\nIn practice, the decision logic often looks like a policy function over the requested tool call. Pseudocode:\n\n\n\n```js function preToolUse(event) { const { toolName, args, targetFiles } = event;\n\n\n\nif (toolName === 'writeFile' && targetFiles.some(f => f.endsWith('.js'))) { const lintOk = runLintCheck(targetFiles); if (!lintOk) { return { allow: false, reason: 'Refusing file write because lint rules fail.' }; } }\n\n\n\nif (toolName === 'runCommand' && args.command.includes('rm -rf')) { return { allow: false, reason: 'Dangerous command blocked by policy.' }; }\n\n\n\nreturn { allow: true }; } ```\n\n\n\nThis example captures the core idea from the source: deny the tool call unless the AI meets your"

    "content": "## Overview\nThese notes describe a GitHub repository that acts as a plugin marketplace for coding agents working on Power BI and Microsoft Fabric tasks. Rather than being a standalone application, the repository packages reusable instructions, validation logic, review agents, helper scripts, and operational tooling into installable plugins for domains like PBIP, semantic models, report assets, Tabular Editor, Power BI Desktop, and Fabric administration.\n\nThis matters because it turns loosely guided AI assistance into a more structured workflow: skills provide domain knowledge, agents perform specialized review, and hooks/scripts enforce deterministic validation. For BI engineering teams treating reports and semantic models as code, this creates a safer and more repeatable pattern for automation, source control, and governance.\n\n## Key Concepts\n- **Plugin marketplace**: The repository is organized as a set of installable plugins rather than one monolithic tool. Each plugin targets a Power BI or Fabric area such as PBIP, reports, Tabular Editor, Desktop interaction, or Fabric operations.\n- **Skills**: Markdown-based instruction packs that teach the agent domain knowledge and repeatable workflows. They live under plugin-specific `skills/.../SKILL.md` paths and may be auto-invoked or called explicitly.\n- **Agents**: Specialized helpers for review, debugging, or audit tasks. In this repository they are generally markdown-defined reviewers or validators for assets like Deneb specs, SVG DAX, BPA expressions, and semantic models.\n- **Hooks**: Deterministic validations triggered by tool actions rather than model judgment. They are implemented with shell/PowerShell scripts and config files to validate PBIR, TMDL, bindings, metadata, and referential integrity.\n- **PBIP and semantic model as code**: A major theme is working directly with source-controlled Power BI artifacts such as PBIP, TMDL, and PBIR files, allowing validation before opening changes in the UI.\n- **Operational automation**: The repository also supports remote and admin workflows through Fabric CLI and admin-oriented plugins, including scripts for workspace download, DAX execution, lineage analysis, and tenant auditing.\n\n## How It Works\nAt the top level, the repository is structured like a Claude-style plugin marketplace. Marketplace metadata is defined in `.claude-plugin/marketplace.json` and `.claude-plugin/plugin.json`, while each plugin under `plugins/` has its own `.claude-plugin/plugin.json`. This allows selective installation of only the relevant domains, such as `pbip`, `pbi-desktop`, or `tabular-editor`.\n\nCore plugin areas include:\n\n- `plugins/tabular-editor/`\n- `plugins/pbi-desktop/`\n- `plugins/pbip/`\n- `plugins/reports/`\n- `plugins/semantic-models/`\n- `plugins/fabric-cli/`\n- `plugins/fabric-admin/`\n\nWithin a plugin, the folder structure tends to follow a consistent pattern:\n\n- `skills/`: instruction packs and workflows in `SKILL.md`\n- `agents/`: specialized review or validation assistants\n- `commands/`: explicit user-invoked workflows such as `/suggest-rule`\n- `hooks/`: executable validation logic and hook registration/configuration\n- `scripts/` or `references/`: helper utilities and supporting documentation\n\nA useful workflow model is:\n\n`user request -> skill selection -> agent/tool execution -> hook validation -> feedback loop`\n\nFor PBIP development, the `pbip` plugin provides skills that explain PBIP, TMDL, and PBIR structure. After an engineer edits files, hooks like `validate-pbir.sh`, `validate-tmdl.sh`, and `validate-report-binding.sh` can run automatically using settings from `plugins/pbip/hooks/config.yaml` and registrations in `plugins/pbip/hooks/hooks.json`. This makes the plugin executable and enforceable, not just descriptive.\n\nThe `pbi-desktop` plugin focuses on live interaction with a running Power BI Desktop model. Its `connect-pbid` skill and helper scripts support model-aware workflows, while PowerShell hooks such as `snapshot-model.ps1` and `check-referential-integrity.ps1` perform runtime checks. This distinguishes static project validation from validation against an actively loaded model.\n\nThe `tabular-editor` plugin combines instructional content with automation. It includes skills for BPA rule authoring, CLI usage, C# scripting, and docs lookup, plus script-based auditing through `plugins/tabular-editor/scripts/bpa_rules_audit.py`. On top of that, agents like `bpa-expression-helper` and commands like `/suggest-rule` help generate or review quality rules.\n\nThe `reports` plugin covers report-level artifacts including Deneb, SVG-in-DAX, R visuals, Python visuals, theme JSON, and PBIR automation. Reviewer agents such as `deneb-reviewer.md`, `svg-reviewer.md`, `r-reviewer.md`, and `python-reviewer.md` act as specialized quality gates tailored to each visual technology.\n\nThe `semantic-models` plugin packages authoring and audit knowledge for DAX, Power Query, naming conventions, refresh troubleshooting, lineage, and model audits. Its `semantic-model-auditor.md` complements the `pbip` and `pbi-desktop` plugins by focusing on model quality rather than file format or live session state.\n\nThe `fabric-cli` and `fabric-admin` plugins extend the system into remote operations and governance. The `fabric-cli` plugin includes scripts such as:\n\n- `create_direct_lake_model.py`\n- `download_workspace.py`\n- `execute_dax.py`\n- `export_semantic_model_as_pbip.py`\n- `get-downstream-reports.py`\n- `query_lakehouse_duckdb.py`\n- `query_sql_endpoint.py`\n\nThese support remote Fabric and Power BI workflows. The `fabric-admin` plugin goes further into governance with scripts like `audit-tenant-settings.py` and `generate_audit_pdf.py`, along with references for delegated overrides and security groups.\n\nThe repository also includes a `useful-stuff/` area with safety-oriented hooks to block destructive commands, package manager misuse, or secrets exposure. That shows the architecture is concerned not only with BI semantics but also with safe agent execution.\n\nFrom a maintenance perspective, the repository treats agent instructions and plugin packaging as versioned, validated assets. Release notes track frequent iteration, and CI assets such as `.github/workflows/validate-plugins.yml` and `scripts/validate-plugins.sh` help enforce packaging quality.\n\nA concise mental model is:\n\n```text\nMarketplace -> Plugin -> Skills teach the agent what to do -> Agents review or handle specialized tasks -> Commands expose common workflows directly -> Hooks enforce deterministic checks -> Scripts/references provide executable and factual support\n```\n\nTraining exercise summary from the notes:\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/data-goblin/power-bi-agentic-development.git\n   cd power-bi-agentic-development\n   ```\n\n2. Inspect the plugin layout and identify:\n   - content layer: `skills/`\n   - review layer: `agents/`\n   - enforcement layer: `hooks/` or `scripts/`\n\n3. Trace PBIP validation through:\n   - `plugins/pbip/skills/pbip/SKILL.md`\n   - `plugins/pbip/agents/pbip-validator.md`\n   - `plugins/pbip/hooks/hooks.json`\n   - `plugins/pbip/hooks/config.yaml`\n   - `validate-pbir.sh`\n   - `validate-report-binding.sh`\n   - `validate-tmdl.sh`\n\n4. Compare that with the live-model path in `pbi-desktop`:\n   - `plugins/pbi-desktop/skills/connect-pbid/SKILL.md`\n   - `plugins/pbi-desktop/hooks/config.yaml`\n   - `snapshot-model.ps1`\n   - `check-referential-integrity.ps1`\n\n5. Inspect operational automation in `fabric-cli`:\n   - `plugins/fabric-cli/skills/fabric-cli/SKILL.md`\n   - pick two scripts and summarize the remote operations they enable\n\n6. Create a personal architecture note template:\n   ```text\n   Plugin:\n   Primary use case:\n   Main skills:\n   Main agent(s):\n   Validation/enforcement assets:\n   External tools or APIs involved:\n   Typical engineer workflow:\n   ```\n\n7. Optional Claude Code installation:\n   ```bash\n   claude plugin marketplace add data-goblin/power-bi-agentic-development\n   claude plugin install pbip@power-bi-agentic-development\n   ```\n\nSuccess criteria captured in the notes:\n- Explain the difference between a skill, an agent, and a hook\n- Identify the files implementing PBIP validation\n- Describe at least one Fabric automation workflow from the codebase\n\n## Personal Notes\nAgentic Power BI Development with Skills, Hooks, and Validation Plugins\n\n\n\nSource: https://github.com/data-goblin/power-bi-agentic-development/\n\nNotion page: https://www.notion.so/Agentic-Power-BI-Development-with-Skills-Hooks-and-Validation-Plugins-34501bb0839a81399eebcb4b030b9ebe\n\n\n\nTags: power-bi, microsoft-fabric, agentic, pbip, tabular-editor, automation\n\n\n\nOverview\n\n\n\nThis repository is a plugin marketplace for coding agents such as Claude Code and GitHub Copilot, focused specifically on Power BI and Microsoft Fabric workflows. Instead of being a traditional application, it packages domain knowledge, validation logic, agent instructions, and helper scripts into installable plugins that teach agents how to work with semantic models, reports, PBIP projects, Tabular Editor, and Fabric operations.\n\n\n\nFor engineers building BI assets as code, the repo matters because it turns fragile prompt-based assistance into structured, reusable automation."

    "source": "personal notes",
    "content": "## Overview\n\nThese notes cover an emerging workflow for using AI coding tools to create and edit **Power Apps canvas apps** through a source-driven process instead of relying only on the visual designer. The core idea is that tools such as GitHub Copilot CLI or Claude Code can connect to an existing canvas app, inspect its source representation, generate changes, and sync validated updates back into Power Apps Studio.\n\nThis matters because it could significantly speed up routine app changes like adding screens, updating controls, or modifying Power Fx formulas. At the same time, the workflow introduces important concerns around **validation, governance, security, and enterprise readiness**, especially since the capability is described as preview and depends on supported coauthoring and platform-side validation.\n\n## Key Concepts\n\n- **Canvas app coauthoring**: Coauthoring allows multiple participants and services to edit a canvas app through a supported collaborative model. In this workflow, it is required so the AI-assisted toolchain can push validated changes back into the app live.\n- **MCP-based tool integration**: The `/configure-canvas-mcp` command suggests a Model Context Protocol-style bridge between the AI tool and the Power Apps environment. This gives the assistant access to app context and a way to submit changes through a validated channel.\n- **`.pa.yaml` as source representation**: The workflow references generating or editing `.pa.yaml` files, which appear to be the structured source form of a canvas app. This makes AI-assisted editing more like code generation against serialized app definitions.\n- **Power Platform Skills and Canvas Apps extensions**: These extensions provide the domain-specific capabilities needed for the AI tool to understand Power Platform artifacts, inspect app structure, validate changes, and sync correctly.\n- **Validation before sync**: Proposed changes are checked by a Canvas App MCP server before being applied back into Power Apps Studio. This is a critical safeguard because generated edits still need structural and semantic validation.\n- **Governance and compliance responsibility**: Even if the platform validates changes, teams remain responsible for review, approval, policy compliance, and safe operational controls, especially in regulated environments.\n\n## How It Works\n\nThe workflow starts with an **existing Power Apps canvas app** in a Power Apps environment. That app must have **coauthoring enabled** in Power Apps Studio. Rather than behaving like a simple export/import mechanism, the AI tool participates in a collaborative editing flow where changes can be reflected directly in the studio session.\n\nThe required toolchain includes:\n\n- **.NET SDK 10.0 or later**\n- An AI coding client such as **GitHub Copilot CLI** or **Claude Code**\n- The **Power Platform Skills** extension\n- The **Canvas Apps** extension\n\nTogether, these components connect a general-purpose coding assistant to a Power Apps-aware source model. The implied architecture is:\n\n1. **Power Apps Studio** hosts the live app.\n2. **Coauthoring** provides the supported editing channel.\n3. The **AI coding tool** receives user prompts.\n4. **Power Platform Skills / Canvas Apps extensions** translate prompts into app-aware operations.\n5. A **Canvas App MCP server** validates the proposed edits.\n6. Valid changes are synchronized back into **Power Apps Studio**.\n\nTypical setup sequence:\n\n1. Open the app in **Power Apps Studio**.\n2. Enable **coauthoring** in app settings.\n3. Install the **Power Platform Skills** plugin/extension.\n4. Install the **Canvas Apps** plugin/extension.\n5. Run:\n\n```bash\n/configure-canvas-mcp\n```\n\n6. Paste the **app URL** when prompted.\n\nOnce connected, the AI tool can inspect the app and operate on its source representation. The notes indicate this happens through `.pa.yaml`, meaning the assistant edits a serialized app definition instead of manipulating the UI directly. The practical loop looks like this:\n\n- The AI reads the current app structure.\n- It generates new elements or updates existing ones.\n- It writes or modifies `.pa.yaml`.\n- The MCP validation layer checks the change.\n- If valid, the update syncs back into Power Apps Studio.\n\nThis is significant because it shifts canvas app development toward a **source-driven workflow**. Instead of only dragging controls in the designer, makers can describe desired changes in natural language and let the AI produce app-definition updates. Likely use cases include:\n\n- Adding a new screen\n- Updating control properties\n- Changing formulas\n- Rearranging layout or navigation\n- Refactoring repeated patterns\n\nBecause the capability is still described as **preview**, it should be treated cautiously. Validation helps, but it does not replace enterprise controls such as:\n\n- Code or maker review\n- Environment separation\n- Connector and DLP policy checks\n- Audit logging\n- Prompt and artifact retention rules\n- Approval workflows for production changes\n\nA useful mental model is that the AI acts like a **fast junior collaborator with privileged access to app source**. It can accelerate development, but humans still need to verify correctness, protect data boundaries, and define safe operating procedures.\n\nThe notes also include a practical training exercise for evaluating the workflow safely in a non-production environment:\n\n- Start with a copied or sandbox app, not production.\n- Enable coauthoring.\n- Connect the AI tool with `/configure-canvas-mcp`.\n- Ask the assistant to summarize the app structure.\n- Request one minimal change, such as adding a label or changing a button caption.\n- Observe whether `.pa.yaml` changes are generated and whether validation occurs before sync.\n- Test manually in app preview.\n- Document permissions required, automated changes made, validation observed, and what human review is still needed.\n\nA useful stretch test is a **formula-level change**, such as disabling a submit button when an input is blank. This helps assess whether the AI produces the expected **Power Fx** formula and whether the output is inspectable enough for real governance requirements.\n\n## Personal Notes\n\nUsing AI Code Generation to Create and Edit Power Apps Canvas Apps\n\n\n\nSource: https://www.linkedin.com/posts/wariowario_i-tried-the-new-create-and-edit-canvas-apps-activity-7450805322119757824-adNF?utm_source=share&utm_medium=member_ios&rcm=ACoAADqTv_wBXXGPo353jX-XXfFlsn3ZQBpJzsY\n\nNotion page: https://www.notion.so/Using-AI-Code-Generation-to-Create-and-Edit-Power-Apps-Canvas-Apps-34501bb0839a817eaa12c1025f487669\n\n\n\nTags: powerapps, canvas-apps, ai-coding, mcp, copilot, governance\n\n\n\nOverview\n\n\n\nThis matters to engineers and Power Platform makers who want to speed up app changes using tools like GitHub Copilot CLI or Claude Code without manually editing every screen and control in the visual designer. It is especially relevant for teams evaluating AI-assisted low-code development, because the workflow is powerful but raises important concerns around validation, governance, security, and enterprise operating models.\n\n\n\nKey Concepts\n\n\n\n  *   Canvas app coauthoring: Coauthoring is the feature that allows multiple editing participants and services to work against a canvas app in Power Apps Studio. In this workflow, it is a prerequisite because the AI-driven toolchain needs a supported way to push validated changes back into the app live.\n\n  *   MCP-based tool integration: The post references running `/configure-canvas-mcp`, which suggests a Model Context Protocol-style connection between the AI tool and the canvas app environment. This connection gives the coding assistant access to app context, lets it read and write supported source representations, and enables validation through a server-side bridge.\n\n  *   pa.yaml as app source representation: The workflow mentions generating or updating `.pa.yaml` files. These files are part of the source-oriented representation of a canvas app, allowing an AI coding tool to operate on structured app definitions rather than only through the visual designer.\n\n  *   Power Platform Skills and Canvas Apps extensions: These extensions act as the domain-specific layer that teaches the AI tool how to interact with Power Platform artifacts. Without them, a general coding assistant would not know how to inspect a canvas app, validate app-specific changes, or synchronize edits correctly.\n\n  *   Validation before sync: The post highlights that generated changes are validated through the Canvas App MCP server before being synced into Power Apps Studio. This validation step is critical because low-code artifacts still need structural and semantic checks, especially when produced by an LLM.\n\n  *   Governance and compliance responsibility: Even if the tooling can generate working app changes, organizations remain responsible for reviewing outputs and ensuring they satisfy policy, security, and regulatory requirements. In regulated environments, AI-assisted app editing needs clear guardrails, auditability, and approval processes.\n\n\n\nHow It Works\n\n\n\nThe workflow starts with an **existing Power Apps canvas app** in a Power Apps environment. The app must have **coauthoring enabled** in Power Apps Studio. This matters because the AI tool is not acting as a standalone export/import utility; it is participating in a collaborative editing model where changes can be reflected back into the studio session.\n\n\n\nNext, the local machine or development environment needs the supporting toolchain:\n\n\n\n- **.NET SDK 10.0 or later** - An AI coding tool such as **GitHub Copilot CLI**, **Claude Code**, or another compatible code-generation client - The **Power Platform Skills** extension - The **Canvas Apps** extension\n\n\n\nThese components together provide the bridge between a general-purpose coding assistant and the Power Apps-specific source model. The post does not describe internal implementation details, but the implied architecture looks like this:\n\n\n\n1. **Power Apps Studio** hosts the live canvas app. 2. **Coauthoring** exposes a supported collaborative editing path. 3. **AI coding tool** receives instructions from"

    "content": "## Overview\n\nThese notes cover **cb365**, a Go-based CLI that wraps Microsoft Graph to provide a consistent, scriptable interface to Microsoft 365 services such as To Do, Mail, Calendar, Contacts, Planner, Teams, SharePoint, OneDrive, and Loop. The project is notable not only for its workload coverage, but for its practical engineering choices: Cobra-based command structure, a shared Graph client layer, secure credential storage, and explicit safety guardrails for high-impact actions.\n\nThis matters because Microsoft 365 automation often becomes fragmented across one-off scripts, custom OAuth handling, and inconsistent API calls. cb365 presents a reusable pattern for building operational tooling that is secure, automation-friendly, and predictable for both humans and AI agents.\n\n## Key Concepts\n\n- **Workload-oriented CLI design**: The CLI is grouped by Microsoft 365 workload, with command families like `todo`, `mail`, `calendar`, `teams`, and `sharepoint`. This keeps commands discoverable and aligns the surface area with Microsoft Graph domains.\n- **Profile-based authentication**: cb365 supports delegated device-code auth and app-only auth via client secrets or certificates. Profiles allow multiple tenants or auth modes to coexist and be selected globally or per command.\n- **Shared Graph client layer**: Graph access is centralized under `internal/graph` rather than being implemented ad hoc in each command. This keeps authentication, transport behavior, and HTTP customization consistent.\n- **Secure token and secret handling**: The tool prefers OS-native keychains and falls back to AES-256-GCM encrypted file storage on headless systems. This is especially useful for unattended automation.\n- **Machine-readable output contracts**: Commands support `--json` and `--plain`, with structured output sent to stdout and human-readable status sent to stderr. This follows a strong Unix-style scripting pattern.\n- **Hardcoded safety enforcement**: Safety is built into write and destructive operations with flags like `--dry-run`, `--confirm`, and `--force`, creating explicit intent boundaries for operators and automation.\n\n## How It Works\n\nThe repository appears to follow a layered CLI architecture.\n\nAt the top, `cmd/cb365` contains the Cobra entrypoints. Files such as `main.go` and `root.go` define the executable, global flags, and base command wiring. Workload-specific files like `todo.go`, `mail.go`, `calendar.go`, `teams.go`, `sharepoint.go`, and `loop.go` register subcommands and bind flags. This makes the command tree easy to inspect in code and keeps workload behavior localized.\n\nAuthentication is encapsulated in `internal/auth`. Based on the repo structure, files such as `auth.go` and `credential.go` likely handle profile resolution and login flows, while `keyring.go` manages native secret storage and `store_file.go` supports encrypted fallback storage. This separation prevents command handlers from needing to know whether credentials came from device code, client secret, or certificate auth.\n\nGraph access is centralized in `internal/graph`. A file like `client.go` likely constructs the Microsoft Graph SDK client using Kiota and Azure Identity components, while `transport.go` may define shared HTTP behavior or request policies. Centralizing this logic reduces duplication and helps ensure all workloads behave consistently.\n\nOutput handling is isolated in `internal/output/output.go`. That is a practical choice for a CLI intended for scripting: commands can return normalized data and let a shared renderer decide whether to emit JSON, plain text, or human-readable output. The documented stdout/stderr split is especially important for composing cb365 in shell pipelines.\n\nA likely execution path is:\n\n1. User runs a command such as `cb365 todo tasks list --list \"My Tasks\" --json`\n2. Cobra routes the request to the handler in `cmd/cb365/todo.go`\n3. The handler resolves the active or explicitly selected auth profile\n4. `internal/auth` loads or refreshes credentials\n5. `internal/graph` constructs an authenticated Graph client\n6. The command performs the workload-specific Graph operation\n7. Results are normalized and passed to `internal/output`\n8. Structured data is written to stdout; status and informational text go to stderr\n\nThe project also reflects strong operational concerns: zero runtime dependencies, signed releases, CI scanning, and reliance on Microsoft-supported libraries such as `azidentity` and `msgraph-sdk-go`. That suggests the repo intentionally minimizes custom security-sensitive code while still providing custom CLI, storage, and safety logic.\n\nTesting seems to be a first-class concern as well. The presence of matching `*_test.go` files for commands and an integration suite under `test/integration/integration_test.go` suggests both command-layer behavior and end-to-end flows are validated. For a CLI wrapper around external APIs, this is especially valuable because many failures occur at integration boundaries.\n\nFinally, cb365 surfaces Microsoft Graph product constraints directly in the CLI:\n\n- To Do is delegated-only because Graph does not support app permissions for it\n- Loop uses app-only auth and depends on SharePoint Embedded setup\n- OneDrive uploads are currently limited to small files in documented behavior\n\nThat is a useful design trait: constraints are made visible early so automation fails predictably instead of hiding API limits until runtime.\n\n## Personal Notes\n\ncb365: Building and Using a Safe Microsoft 365 CLI on Microsoft Graph\n\n\n\nSource: https://github.com/nz365guy/cb365\n\nNotion page: https://www.notion.so/cb365-Building-and-Using-a-Safe-Microsoft-365-CLI-on-Microsoft-Graph-34501bb0839a810c90d4fcd71ba07906\n\n\n\nTags: golang, cli, microsoft-graph, microsoft-365, entra-id, automation\n\n\n\nOverview\n\n\n\ncb365 is a Go-based command-line tool that wraps Microsoft Graph to provide scriptable access to Microsoft 365 workloads such as To Do, Mail, Calendar, Contacts, Planner, Teams, SharePoint, OneDrive, and Loop. Instead of writing custom Graph API code for each workflow, engineers can use a single binary with consistent commands, structured JSON output, and profile-based authentication.\n\n\n\nWhat makes this repo interesting is not just the feature list, but the architecture choices behind it: Cobra-based command organization, a shared Graph client layer, secure credential storage using OS keychains or encrypted file fallback, and hardcoded safety rules around destructive or high-impact operations. It is especially relevant for platform engineers, automation developers, and AI-agent builders who need reliable M365 automation without embedding OAuth and Graph plumbing into every script.\n\n\n\nKey Concepts\n\n\n\n  *   Workload-oriented CLI design: The CLI is organized by Microsoft 365 workload, with command groups like `todo`, `mail`, `calendar`, `teams`, and `sharepoint`. This maps cleanly to Graph domains and makes commands discoverable while keeping flag semantics consistent across features.\n\n  *   Profile-based authentication: cb365 supports delegated device-code auth and app-only auth using client secrets or certificates. Profiles let users keep multiple tenants or auth modes side by side, then switch globally or per-command using `--profile`.\n\n  *   Shared Graph client layer: Rather than having each command build its own HTTP requests, the repo centralizes Graph access under `internal/graph`. This makes transport behavior, authentication, and HTTP customization consistent across all workloads.\n\n  *   Secure token and secret handling: The project avoids plaintext credential storage by using OS-native keychains where possible and an AES-256-GCM encrypted file fallback for headless Linux. This is important because the tool is intended for automation and agent use, where unattended credentials are common.\n\n  *   Machine-readable output contracts: Every command supports human output and machine-oriented output via `--json` or `--plain`. The design sends readable status to stderr and structured data to stdout, which is a practical Unix pattern for scripting and pipeline composition.\n\n  *   Hardcoded safety enforcement: cb365 bakes in safety rules for writes, deletes, mail sends, and calendar changes rather than treating them as optional UI hints. Flags like `--dry-run`, `--confirm`, and `--force` create explicit intent boundaries that are useful for both humans and AI-driven automation.\n\n\n\nHow It Works\n\n\n\nThe repository follows a fairly clean layered structure.\n\n\n\nAt the top level, `cmd/cb365` contains the Cobra CLI entrypoints. Files like `main.go` and `root.go` set up the executable and global flags, while workload-specific files such as `todo.go`, `mail.go`, `calendar.go`, `teams.go`, `sharepoint.go`, and `loop.go` register subcommands and bind flags. This means the command tree is assembled in code rather than generated, and each workload file becomes the main place to inspect how user input is translated into an operation.\n\n\n\nUnder `internal/auth`, the repo encapsulates all credential behavior. Based on the README and file names, `auth.go` and `credential.go` manage login flows and profile resolution, while `keyring.go` handles native keychain integration and `store_file.go` provides the encrypted-file fallback for environments without a desktop secret store. This separation is important: command handlers should not need to know whether a token came from device-code auth, a client secret, or a certificate-backed app-only flow. They request a usable credential, and the auth layer provides it.\n\n\n\nThe `internal/graph` package is the next key piece. `client.go` likely constructs the Microsoft Graph SDK client using Kiota and Azure auth adapters, and `transport.go` likely customizes HTTP behavior such as IPv4-only networking or request policies. Because Graph access is centralized here, every command benefits from the same auth pipeline, HTTP stack, and safety around token handling.\n\n\n\nOutput formatting is isolated in `internal/output/output.go`. This is a strong"

    "content": "## Overview\n\nThese notes cover Claude Code routines, a hosted automation feature that turns prompts, repository access, and connectors into repeatable workflows. Instead of depending on a developer’s local machine, routines run in Claude Code’s managed environment and can be triggered on a schedule, via API calls, or from GitHub events.\n\nThis matters because it shifts AI-assisted engineering work from ad hoc chat sessions into operational workflows. Teams can use routines for recurring tasks like issue triage, PR review, deploy verification, incident response, and cross-repo maintenance, with clearer triggers, shared context, and more reliable execution.\n\n## Key Concepts\n\n- **Routine**: A reusable Claude Code automation configuration that bundles prompt, repository access, and connectors into a repeatable workflow.\n- **Hosted execution**: Runs on Claude Code infrastructure instead of a laptop or self-managed cron host, making workflows always-on and easier to operate.\n- **Scheduled routines**: Time-based automations for recurring tasks such as nightly triage, maintenance, or docs checks.\n- **API-triggered routines**: Routines expose an endpoint and auth token so external systems can start a run with an HTTP POST payload.\n- **GitHub webhook routines**: Event-driven automations tied to repository activity, especially useful for PR review and lifecycle-aware updates.\n- **Connectors and repository context**: Routines rely on repo access plus external systems like Slack, logs, issue trackers, or deployment metadata to take meaningful actions.\n- **Usage and daily limits**: Runs consume Claude Code usage and are subject to plan-based routine limits, so teams should focus on high-value workflows.\n\n## How It Works\n\nClaude Code routines package three things into a managed workflow: instructions, execution context, and a trigger. The instructions define what Claude should do, the context includes repositories and connectors, and the trigger decides when the workflow starts. Once configured, Claude Code creates a hosted session whenever that trigger fires.\n\nThe notes describe three trigger models:\n\n1. **Scheduled routines**  \n   These run on a fixed cadence such as hourly, nightly, or weekly. They are best for periodic jobs where timing matters more than an external event. An example is a nightly routine that pulls the highest-priority bug from Linear, attempts a fix, and opens a draft PR.\n\n2. **API routines**  \n   Each routine gets a dedicated endpoint and authentication token. An external system sends a POST request with a message or structured payload, and Claude Code starts a session in response. This is a good fit for deployment hooks, observability alerts, or internal tooling.\n\n3. **GitHub webhook routines**  \n   These subscribe to repository events and create sessions when matching events occur. For pull requests, Claude can keep a session tied to the PR and continue processing updates like comments, code pushes, or CI failures over time.\n\nA simple mental model is:\n\n- **Input context**: prompt, repo, connectors, payload\n- **Trigger**: schedule, API call, or webhook\n- **Execution**: Claude Code creates a hosted session\n- **Output/actions**: comments, summaries, Slack posts, issues, draft PRs, or recommendations\n\nThis model is useful because it turns manual AI usage into event-driven automation. A team no longer has to remember to ask Claude to review a PR or investigate an alert. Instead, they define the workflow once and let the system invoke it consistently when the right conditions occur.\n\nThe article’s examples span much of the software lifecycle:\n\n- Backlog triage and issue labeling\n- Documentation drift detection\n- Deploy verification and release recommendations\n- Alert triage before on-call intervention\n- Feedback-to-code workflows\n- Cross-SDK or cross-repo change porting\n- Team-specific PR review checks for security or performance\n\nThe notes also connect routines to prior Claude Code CLI behavior: users who previously used `/schedule` are effectively moving into a more centralized, hosted automation model. That indicates routines are not just a convenience feature, but a step toward managed agent orchestration for engineering work.\n\nOperationally, routines come with some constraints: the feature is in research preview, requires Claude Code on the web, and depends on supported plan tiers. There are also daily limits and usage implications, which means teams should be selective and measure whether a routine genuinely saves time or improves reliability.\n\n## Personal Notes\n\nClaude Code Routines: Scheduled, API, and GitHub-Triggered Automation\n\n\n\nSource: https://claude.com/blog/introducing-routines-in-claude-code\n\nNotion page: https://www.notion.so/Claude-Code-Routines-Scheduled-API-and-GitHub-Triggered-Automation-34501bb0839a819fa74fd4920b5d8aa6\n\n\n\nTags: claude-code, automation, webhooks, api, github, devops\n\n\n\nOverview\n\n\n\nClaude Code routines are hosted automations that let you package a prompt, repository access, and connectors into a repeatable workflow that runs without relying on a developer laptop. Instead of wiring together cron jobs, glue code, and infrastructure yourself, you define the automation once and let Claude Code execute it on a schedule, from an API call, or in response to repository events.\n\n\n\nThis matters for engineering teams that want to operationalize AI-assisted development work: backlog triage, PR review, deploy verification, incident response, or cross-repo maintenance. The feature is especially relevant to platform engineers, developer productivity teams, and tech leads who want reproducible, always-on agent workflows integrated with source control and internal systems.\n\n\n\nKey Concepts\n\n\n\n  *   Routine: A routine is a reusable Claude Code automation configuration. It bundles the execution context—prompt, repository, and connectors—so the same workflow can be triggered repeatedly without manually starting a session each time.\n\n  *   Hosted execution: Routines run on Claude Code's web infrastructure rather than on a local machine. This removes the need to keep a laptop online or manage separate cron hosts, and makes the automation available as an always-on service.\n\n  *   Scheduled routines: Scheduled routines execute on a time-based cadence such as hourly, nightly, or weekly. They are suitable for periodic maintenance tasks like issue triage, docs drift detection, or automated bug-fix attempts.\n\n  *   API-triggered routines: Each API routine gets its own endpoint and authentication token. External systems can POST payloads to that endpoint to create a new Claude Code session, making routines easy to integrate with alerting systems, deploy pipelines, and internal tools.\n\n  *   Webhook routines for GitHub: Webhook routines subscribe to GitHub repository events and automatically start sessions when matching events occur. For pull requests, Claude can maintain one session per PR and continue receiving updates like comments or CI failures as the PR evolves.\n\n  *   Connectors and repository context: Routines ship with access to the configured repositories and connectors, which provide the operational context needed to act on real systems. That context is what lets a routine move beyond chat responses into tasks like reading issues, posting to Slack, or opening draft PRs.\n\n  *   Usage and daily limits: Routine runs consume subscription usage in the same way as interactive Claude Code sessions, and there are plan-based daily routine limits. This introduces an operational consideration: teams should reserve routines for high-value, repeatable workflows and monitor usage as they scale adoption.\n\n\n\nHow It Works\n\n\n\nClaude positions routines as the next step beyond manually invoking Claude Code from a terminal. The core idea is simple: define an automation once, including the instructions you want Claude to follow, the repository it should work against, and any external connectors it may need. After that, Claude Code can instantiate that automation repeatedly whenever a configured trigger fires.\n\n\n\nThe article describes three trigger models:\n\n\n\n1. **Scheduled routines** - You provide a prompt plus a cadence. - Claude Code runs the routine automatically at the specified time. - Example from the article: nightly at 2am, fetch the top bug from Linear, attempt a fix, and open a draft PR.\n\n\n\n2. **API routines** - Claude Code creates a dedicated endpoint and auth token per routine. - An external system sends an HTTP POST with a message or payload. - Claude Code starts a session and returns a session URL, allowing downstream systems or humans to inspect the run.\n\n\n\n3. **GitHub webhook routines** - A routine subscribes to repository events, initially focused on GitHub. - Matching pull requests trigger a new session automatically. - Claude keeps the session attached to the PR lifecycle, feeding in later updates such as comments and CI failures.\n\n\n\nThe mechanics are important because they shift AI automation from ad hoc prompting to event-driven workflow design. Instead of saying \"review this PR\" manually, a team can define a review routine once and let it execute whenever a PR with certain characteristics appears. Instead of waiting for an engineer to open Claude Code after an alert fires, an observability system can call the routine endpoint immediately.\n\n\n\nA useful way to think about the runtime model is:\n\n\n\n- **Input context**: prompt, repo, connectors, trigger payload - **Trigger**: schedule, API call, or webhook event - **Execution**: Claude Code creates a hosted session - **Output/actions**: comments, Slack messages, triage summaries, draft fixes, or PRs\n\n\n\nThe examples in the article illustrate how this model applies across the software lifecycle:\n\n\n\n- **Backlog management**: nightly issue triage and labeling - **Docs drift detection**: periodic scanning of merged PRs against documentation references - **Deploy verification**: post-deploy smoke checks and release-channel recommendations - **Alert triage**: correlating traces and deployments before on-call responds - **Feedback resolution**: turning user or internal feedback into in-context code changes - **Library porting**: mirroring merged changes from one SDK to another - **Custom code review**: applying team-specific security or performance"

    "id": "2026-04-17-flask-internals-routing-contexts-blueprints-and-wsgi-lifecycle",
    "title": "Flask Internals: Routing, Contexts, Blueprints, and WSGI Lifecycle",
    "date": "2026-04-17",
    "tags": [
      "python",
      "flask",
      "wsgi",
      "routing",
      "blueprints"
    ],
    "source": "personal notes",
    "content": "## Overview\n\nThese notes explain how Flask works beneath its simple public API by tracing the framework’s internal architecture and request lifecycle. They focus on how Flask composes Werkzeug, Jinja, Click, ItsDangerous, and related pieces into a lightweight but capable web framework, with special attention to routing, request and application contexts, blueprint registration, sessions, JSON handling, templating, CLI support, and testing.\n\nThis matters because understanding Flask internals makes it easier to debug tricky behavior, design cleaner extensions and app structure, reason about request-scoped state, and confidently trace how a request moves from the WSGI server to a final response. The notes also include a hands-on exercise for mapping common Flask features directly to the underlying source code.\n\n## Key Concepts\n\n- **WSGI application object**: The `Flask` class is itself a WSGI app and acts as the main entry point for every request.\n- **Context locals**: `request`, `session`, `g`, and `current_app` are proxies backed by request/app context machinery, not true globals.\n- **Routing and dispatch**: Flask uses Werkzeug’s URL routing to match incoming paths to endpoints and invoke the correct view function.\n- **Blueprint deferred registration**: Blueprints collect setup operations first, then replay them onto an app during registration.\n- **Response conversion**: Flask accepts many view return types and normalizes them into a proper response object.\n- **Signed-cookie sessions**: Default sessions are stored client-side with signing for integrity, but not encryption for secrecy.\n\n## How It Works\n\nFlask’s runtime is centered around a few core modules:\n\n- `src/flask/app.py` for the main application object and request lifecycle\n- `src/flask/ctx.py` and `src/flask/globals.py` for app/request context handling and proxy globals\n- `src/flask/blueprints.py` and `src/flask/sansio/blueprints.py` for modular registration\n- `src/flask/wrappers.py` for Flask-specific request and response wrappers\n- `src/flask/templating.py` for Jinja environment setup and rendering\n- `src/flask/sessions.py` for session loading and saving\n- `src/flask/cli.py` for app discovery and CLI command support\n- `src/flask/views.py` for class-based views such as `MethodView`\n\nA notable design choice is the `src/flask/sansio/` package, which separates declarative registration and configuration behavior from actual WSGI I/O. That split helps Flask keep parts of the framework easier to test and evolve independently from live request handling.\n\nAt request time, the WSGI server calls the Flask application object, which routes execution through `Flask.wsgi_app(...)`. That method builds a request context from the WSGI environment, pushes the relevant contexts, runs hooks, dispatches the matched view, converts the return value to a response, saves session state if needed, runs teardown logic, and finally pops the contexts. In practical terms, the request lifecycle can be read as:\n\n`WSGI server -> Flask.wsgi_app -> request context push -> before_request hooks -> route match -> view call -> response conversion -> session save / after_request hooks -> teardown -> context pop`\n\nThe context system is what makes Flask feel ergonomic. Imports like `from flask import request, current_app, g, session` resolve through proxy objects tied to the active context, so each request sees its own state without explicitly threading those objects through every function call. This is a key reason Flask code stays compact while still being safe for concurrent request handling.\n\nRouting is delegated to Werkzeug’s URL map. Decorators such as `@app.route('/users/<int:id>')` register a rule and associate it with an endpoint name. During request dispatch, Flask matches the request path, extracts path variables, resolves the endpoint to a callable from the app’s view function registry, and invokes it. Errors like 404 and 405 naturally arise from this stage and can be customized with error handlers.\n\nBlueprints are often misunderstood as sub-applications, but internally they act more like recorders of future setup work. When routes, hooks, or handlers are attached to a blueprint, Flask stores deferred operations. Later, `register_blueprint` replays those operations against a concrete app using app-specific URL prefixes, endpoint namespaces, and registration options. That design enables modular composition, repeated registration, and namespaced endpoints such as `api.ping`.\n\nFlask’s response handling is similarly flexible. A view can return a string, bytes, dict, tuple, generator, or an actual response object. Flask then normalizes that value into a proper response instance. This conversion logic is one of the reasons Flask’s API remains concise without forcing developers to manually instantiate response objects for every route.\n\nTemplate rendering uses Jinja through `src/flask/templating.py`. Flask constructs a Jinja environment for the app, merges template loaders from the app and any registered blueprints, and injects globals plus context processor output into the template context. This lets `render_template()` access request-aware values in a predictable way while keeping rendering logic centralized.\n\nSession handling is pluggable, but Flask’s default implementation stores session data in a signed cookie using ItsDangerous. On each request, Flask loads and verifies the cookie, exposes the decoded data through the `session` proxy, tracks whether the session changed, and writes back a newly signed cookie before the response is sent if necessary. This provides integrity, but clients can still read the data unless another encryption layer is added.\n\nThe JSON subsystem is more abstract than many users expect. The JSON provider interface in `src/flask/json/provider.py` allows custom serialization behavior to be configured at the app level, while helper code such as `jsonify` uses the active provider rather than hard-coding one serializer path. Tagged JSON support is also used for some internal serialization cases.\n\nFlask CLI support comes from `src/flask/cli.py` and is built on Click. The `flask` command handles application discovery, optional environment loading through `python-dotenv`, development server startup, shell access, and app-defined custom commands. This is part of Flask’s overall philosophy: keep the public interface small, but make the extension points practical and discoverable.\n\nTesting support in `src/flask/testing.py` wraps Werkzeug’s test client and works closely with Flask’s explicit context model. That makes it straightforward to test routes without a live server and to manually push app or request contexts when you want to exercise code that depends on `current_app`, `request`, or `g`.\n\nThe included training exercise is a strong way to internalize these ideas. By building a small app with an application factory, blueprint, request hooks, session use, and a `MethodView`, then inspecting endpoint registration and writing a test with `test_client()`, you can directly observe the behavior implemented in `Flask.wsgi_app`, `full_dispatch_request`, blueprint registration, view dispatch, and session save/load logic.\n\n## Personal Notes\n\nFlask Internals: Routing, Contexts, Blueprints, and the WSGI Request Lifecycle\n\n\n\nSource: https://github.com/pallets/flask\n\nNotion page: https://www.notion.so/Flask-Internals-Routing-Contexts-Blueprints-and-the-WSGI-Request-Lifecycle-34501bb0839a8110b6f2df327c129b12\n\n\n\nTags: python, flask, wsgi, jinja, werkzeug, web-framework\n\n\n\nOverview\n\n\n\nFlask is a lightweight Python web framework, but its implementation is more than a thin convenience layer. The repository shows how Flask composes Werkzeug for HTTP and routing, Jinja for templating, Click for CLI support, ItsDangerous for session signing, and Blinker for signals into a framework with a very small public surface area and a flexible internal architecture.\n\n\n\nThis lesson is for engineers who already know how to use Flask at a basic level and want to understand how it actually works. By reading the repository structure and core modules, you can see how a request becomes a response, how application and request contexts power `current_app`, `request`, and `g`, how blueprints defer registration, and how Flask keeps its extension and testing story simple without enforcing a project layout.\n\n\n\nKey Concepts\n\n\n\n  *   WSGI application object: The `Flask` class in `src/flask/app.py` is a WSGI application: it is callable and receives the WSGI environment and `start_response`. Flask builds a request context from the environment, dispatches to a view function, turns the return value into a response, and handles teardown and error processing around that flow.\n\n  *   Context locals: Flask exposes globals like `request`, `session`, `g`, and `current_app`, but they are not process-global variables. They are context-local proxies backed by app and request context stacks defined in `src/flask/ctx.py` and surfaced in `src/flask/globals.py`, which lets code access per-request state without explicitly passing objects everywhere.\n\n  *   Routing and view dispatch: Route decorators register URL rules and endpoints on the application or blueprint. During a request, Flask binds Werkzeug's routing map to the incoming request, matches a rule, resolves the endpoint to a view function, and invokes it with any path variables.\n\n  *   Blueprint deferred registration: Blueprints in `src/flask/blueprints.py` and `src/flask/sansio/blueprints.py` are not mini-apps that handle requests by themselves. They collect routes, error handlers, template hooks, and other setup operations as deferred functions, then replay those operations onto a concrete app when `register_blueprint` is called"
  },

    "content": "## Overview\n\nThese notes cover **MarkItDown**, a Python framework for converting many file and media formats into structured Markdown for downstream use in LLM pipelines, search, retrieval, and text analysis. The key idea is that Markdown is a practical intermediate format: it preserves useful structure like headings, lists, tables, and links without aiming for pixel-perfect rendering.\n\nThe repository is especially relevant for engineers building document ingestion systems. Beyond basic conversion, it demonstrates a solid architecture for stream-based processing, converter dispatch, optional dependency loading, plugin-based extension, and selective AI-assisted enrichment such as OCR, image captioning, and audio transcription.\n\n## Key Concepts\n\n- **Markdown-first ingestion**: MarkItDown uses Markdown as the canonical output because it keeps structural information while remaining lightweight and easy to process in chunking, indexing, and prompt pipelines.\n- **Stream-based converter architecture**: Converters operate on binary file-like streams instead of file paths, which avoids temp files and makes the system easier to embed in services and in-memory workflows.\n- **Converter dispatch by format**: The core library selects specialized converters based on stream metadata, content type, URI handling, and installed capabilities.\n- **Optional feature groups**: Support for formats like PDF, DOCX, PPTX, XLSX, and audio transcription is gated by extras, keeping default installs smaller and more modular.\n- **LLM-assisted enrichment**: Some workflows can use OpenAI-compatible models or Azure Document Intelligence for image descriptions, OCR, or transcription when conventional parsing is not enough.\n- **Plugin extensibility**: Plugins are packaged separately and explicitly enabled, allowing third parties to add or override converters without modifying the core library.\n\n## How It Works\n\nMarkItDown is organized like a small monorepo with several packages:\n\n- `packages/markitdown`: core library and CLI\n- `packages/markitdown-ocr`: OCR-oriented plugin\n- `packages/markitdown-sample-plugin`: reference plugin implementation\n- `packages/markitdown-mcp`: MCP server wrapper\n\nThe central API is the `MarkItDown` class in `src/markitdown/_markitdown.py`, which powers both the CLI and Python usage. Supporting modules handle shared converter abstractions, stream metadata detection, URI normalization, and conversion-specific exceptions. Actual format logic lives in `src/markitdown/converters/`, with dedicated modules for PDFs, Office formats, HTML, images, audio, notebooks, archives, and more.\n\nThe processing flow is straightforward:\n\n1. Input is provided as a path, URL, stdin, or stream.\n2. The orchestration layer opens it as a binary stream and inspects metadata.\n3. A matching converter is selected.\n4. The converter extracts text and structure using format-specific tooling.\n5. Output is normalized into Markdown and returned as a result object, typically accessed via `text_content`.\n\nA few implementation choices are particularly useful for production systems. The library avoids temp files by default, expects binary streams for stream conversion, and activates some capabilities only when corresponding extras are installed. This keeps the base system lean while still supporting richer conversion stacks where needed.\n\nThe repository structure also reveals design intent. Office formats have dedicated handlers rather than generic fallback parsing, suggesting attention to preserving semantics like equations and formatting. PDF support appears mature, with tests aimed at tables, numbering, scanned reports, and memory-sensitive processing. ZIP archives are recursively unpacked and converted, which is helpful for bulk ingestion workflows. Media support relies on external tools such as `ffmpeg` and `exiftool`, reflecting a practical approach instead of forcing everything through pure Python.\n\nLLM integration is optional and layered on top of deterministic conversion. In the core package, image captioning can be enabled with an OpenAI-compatible client. The OCR plugin extends this pattern by wrapping built-in converters and inserting OCR extraction for embedded or scanned content. This is an important architectural decision: the base package stays dependency-light and predictable, while plugins add heavier or AI-dependent behavior only when explicitly enabled.\n\nThe sample plugin is also worth studying because it shows the intended extension model for external developers. Combined with broad fixture-based tests across many real document types, the project serves not just as a useful tool but as a reference architecture for building heterogeneous document ingestion pipelines.\n\nOperationally, the Dockerfile shows how the maintainers expect the system to run in containers: install core package extras, add plugin packages, include tools like `ffmpeg` and `exiftool`, and expose the CLI as the entrypoint. That makes it well suited for batch conversion jobs or service-side ingestion stages.\n\n## Personal Notes\n\nMarkItDown: Extensible File-to-Markdown Conversion for LLM Pipelines\n\n\n\nSource: https://github.com/microsoft/markitdown\n\nNotion page: https://www.notion.so/MarkItDown-Extensible-File-to-Markdown-Conversion-for-LLM-Pipelines-34501bb0839a81df8a09ee7716522c00\n\n\n\nTags: python, markdown, document-conversion, llm, plugins, pdf\n\n\n\nOverview\n\n\n\nMarkItDown is a Python-based conversion framework that turns many common document and media formats into structured Markdown. Its purpose is not pixel-perfect reproduction, but extraction of text and document structure in a form that is efficient for downstream use by LLMs, search, retrieval, and other text-analysis systems.\n\n\n\nThis repository is useful to engineers building ingestion pipelines for PDFs, Office files, HTML, notebooks, archives, images, and audio. Beyond the CLI, the codebase shows a practical architecture for stream-oriented conversion, optional dependency loading, plugin-based extension, and selective use of external AI services such as Azure Document Intelligence and OpenAI-compatible vision/transcription models.\n\n\n\nKey Concepts\n\n\n\n  *   Markdown-first ingestion: MarkItDown treats Markdown as the canonical output format because it preserves useful structure like headings, lists, tables, and links while remaining close to plain text. That makes it a good intermediate representation for LLM prompts, chunking pipelines, and indexing systems.\n\n  *   Stream-based converter architecture: A notable design change in the project is that converters operate on binary file-like streams rather than file paths. This avoids temporary files, simplifies integration into services and pipelines, and makes conversion easier to compose with in-memory processing.\n\n  *   Converter dispatch by format: The main package contains many specialized converters under `markitdown/converters`, each targeting a specific type such as PDF, DOCX, PPTX, XLSX, HTML, ZIP, audio, or images. The top-level orchestration layer determines which converter to use based on stream metadata, URI handling, and available dependencies.\n\n  *   Optional feature groups: Support for some formats depends on optional dependencies declared in extras like `pdf`, `docx`, `pptx`, `xlsx`, or `audio-transcription`. This keeps the default install lighter while allowing production users to enable only the capabilities they need.\n\n  *   LLM-assisted enrichment: Some converters can call an OpenAI-compatible client to generate image descriptions or perform OCR through plugins. This extends beyond pure parsing and enables extraction from image-heavy or scanned content when traditional text extraction is insufficient.\n\n  *   Plugin extensibility: Plugins are packaged separately and disabled by default, then discovered and enabled explicitly. The repository includes both a sample plugin and a real OCR plugin, showing how third parties can override or augment built-in conversion behavior without modifying the core package.\n\n\n\nHow It Works\n\n\n\nThe repository is organized as a small monorepo with multiple Python packages:\n\n\n\n- `packages/markitdown`: the core library and CLI - `packages/markitdown-ocr`: a plugin that adds OCR-aware converters - `packages/markitdown-sample-plugin`: a reference implementation for plugin authors - `packages/markitdown-mcp`: an MCP server wrapper for LLM application integration\n\n\n\nAt the center of the core package is `src/markitdown/_markitdown.py`, which exposes the main `MarkItDown` class used by both the Python API and CLI. The CLI entrypoint lives in `src/markitdown/__main__.py`. Supporting infrastructure includes:\n\n\n\n- `_base_converter.py`: shared converter abstractions and result handling - `_stream_info.py`: stream metadata detection and normalization - `_uri_utils.py`: handling paths and URL-like inputs - `_exceptions.py`: conversion-specific errors\n\n\n\nThe actual format implementations are in `src/markitdown/converters/`. The file tree shows a deliberately modular design, with one converter per major type:\n\n\n\n- `_pdf_converter.py` - `_docx_converter.py` - `_pptx_converter.py` - `_xlsx_converter.py` - `_html_converter.py` - `_image_converter.py` - `_audio_converter.py` - `_youtube_converter.py` - `_zip_converter.py` - `_ipynb_converter.py` - `_outlook_msg_converter.py` - `_epub_converter.py` - plus helpers like `_markdownify.py`, `_llm_caption.py`, and `_transcribe_audio.py`\n\n\n\nThe high-level data flow is:\n\n\n\n1. A caller provides a file path, URL, stdin stream, or other input to the CLI or `MarkItDown.convert()`. 2. The orchestration layer opens the input as a binary stream and gathers enough metadata to infer content type and extension. 3. It selects a matching converter implementation. 4. The converter extracts text and structure, often using a format-specific library. 5. The output is normalized into Markdown and returned as a result object whose `text_content` can be printed, saved, or fed into another system.\n\n\n\nA few implementation details matter for engineers integrating this library:\n\n\n\n- **No temp files by default:** converters now consume file-like objects directly. - **Binary streams only:** `convert_stream()` expects bytes, not text streams. -"
